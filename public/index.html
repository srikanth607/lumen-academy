const CH5={t:"Chapter 5: Chemical Energetics (Cambridge 0620)",notes:`
<span class="tag">Topic 5.1</span><h3>Exothermic and endothermic reactions</h3>
<p class="lg"><b>Key:</b> <span class="xt">EXT</span> = Extended (Supplement) only. No tag = Core (Extended students need it too).</p>
<p>Every chemical reaction involves a transfer of energy, usually as <b>heat</b>, between the reacting chemicals and the surroundings.</p>
<div class="wrap"><table><tr><th></th><th>🔥 Exothermic</th><th>❄️ Endothermic</th></tr>
<tr><td>Energy</td><td>Given out to the surroundings</td><td>Taken in from the surroundings</td></tr>
<tr><td>Temperature of surroundings</td><td>Rises</td><td>Falls</td></tr>
<tr><td>ΔH</td><td>Negative</td><td>Positive</td></tr>
<tr><td>Examples</td><td>Combustion, neutralisation, respiration, most oxidations</td><td>Thermal decomposition, photosynthesis, dissolving ammonium nitrate</td></tr></table></div>
<svg viewBox="0 0 520 190" style="width:100%;max-width:560px;display:block;margin:12px auto" role="img" aria-label="Energy profile diagrams for exothermic and endothermic reactions">
<g stroke="currentColor" fill="none" stroke-width="2"><path d="M30 10V165H240"/><path d="M290 10V165H500"/>
<path d="M40 60H90Q130 60 140 25Q150 60 190 100H230" stroke="#10b981"/><path d="M300 110H350Q390 110 400 40Q410 110 450 60H490" stroke="#ef4444"/></g>
<g font-size="12" fill="currentColor"><text x="40" y="52">reactants</text><text x="170" y="118">products</text><text x="85" y="182">Exothermic: ΔH negative</text>
<text x="300" y="128">reactants</text><text x="425" y="54">products</text><text x="335" y="182">Endothermic: ΔH positive</text><text x="150" y="30">Ea</text><text x="205" y="85">ΔH ↓</text><text x="378" y="28">Ea</text><text x="455" y="92">ΔH ↑</text></g></svg>
<ul><li><span class="xt">EXT</span> <b>Activation energy (Ea)</b> is the minimum energy colliding particles need for a reaction to happen.</li>
<li><span class="xt">EXT</span> <b>Bond breaking is endothermic</b> (energy taken in). <b>Bond forming is exothermic</b> (energy given out).</li>
<li><span class="xt">EXT</span> If more energy is released making bonds than is needed to break bonds, the reaction is exothermic.</li></ul>
<p><span class="xt">EXT</span> <b>Bond energy calculation (Supplement):</b> H₂ + Cl₂ → 2HCl. Broken: H–H 436 + Cl–Cl 243 = 679 kJ. Formed: 2 × H–Cl (432) = 864 kJ. ΔH = 679 − 864 = <b>−185 kJ/mol</b>, so exothermic.</p>
<p><b>Use of energy changes:</b> hand warmers (exothermic) and instant cold packs (endothermic) use these reactions.</p>
<h3>🔍 Going deeper: energy changes</h3>
<div class="wrap"><table><tr><th>🔥 Exothermic examples</th><th>❄️ Endothermic examples</th></tr><tr><td>Burning fuels (combustion)</td><td>Thermal decomposition of calcium carbonate</td></tr><tr><td>Neutralisation of acid with alkali</td><td>Photosynthesis (energy from light)</td></tr><tr><td>Respiration</td><td>Dissolving ammonium nitrate in water</td></tr><tr><td>Adding water to anhydrous copper(II) sulfate</td><td>Electrolysis (electrical energy is needed)</td></tr></table></div>
<p><b>Measuring temperature change:</b> put a known volume of each solution in an insulated polystyrene cup, record the starting temperature, mix, stir and record the highest (or lowest) temperature. A lid reduces heat loss to the air, which is the main source of error.</p>
<p><span class="xt">EXT</span> <b>Drawing a reaction pathway diagram (Supplement):</b> (1) label the vertical axis energy and the horizontal axis progress of reaction; (2) draw the reactants as a level line; (3) draw the products lower for exothermic and higher for endothermic; (4) draw a curve over a hump between them; (5) label Ea as the arrow from the reactants up to the top of the hump; (6) label ΔH as the arrow between the reactant and product levels.</p>
<p><span class="xt">EXT</span> <b>Second bond-energy example:</b> CH₄ + 2O₂ → CO₂ + 2H₂O, using C–H 413, O=O 498, C=O 805, O–H 464 kJ/mol. Broken: 4 × 413 + 2 × 498 = 1652 + 996 = 2648 kJ. Formed: 2 × 805 + 4 × 464 = 1610 + 1856 = 3466 kJ. ΔH = 2648 − 3466 = <b>−818 kJ/mol</b>, exothermic.</p>
<div class="card" style="margin:12px 0"><b>🎛️ Try it: bond-energy calculator</b><input id="eb" type="number" min="0" step="any" placeholder="energy to break bonds (kJ)" oninput="var b=+document.getElementById('eb').value,f=+document.getElementById('ef').value,d=b-f;document.getElementById('eo').textContent=(b>0&&f>0)?'ΔH = '+b+' − '+f+' = '+d+' kJ/mol ('+(d<0?'exothermic':d>0?'endothermic':'no net change')+')':'Enter both values'"><input id="ef" type="number" min="0" step="any" placeholder="energy released making bonds (kJ)" oninput="var b=+document.getElementById('eb').value,f=+document.getElementById('ef').value,d=b-f;document.getElementById('eo').textContent=(b>0&&f>0)?'ΔH = '+b+' − '+f+' = '+d+' kJ/mol ('+(d<0?'exothermic':d>0?'endothermic':'no net change')+')':'Enter both values'"><small id="eo">Enter both values</small></div>
<p><b>Exam tips:</b> ΔH is in kJ/mol and its sign matters. Activation energy is the height of the hump, not ΔH. Say energy is “transferred to” the surroundings, not “made” or “used up”.</p>
<div class="ext"><h4><span class="xt">EXT</span>Extended (Supplement) checklist: Chapter 5</h4><ul><li><b>Enthalpy change, ΔH:</b> the transfer of thermal energy in a reaction (kJ/mol). ΔH is negative for exothermic and positive for endothermic reactions.</li>
<li><b>Activation energy, Eₐ:</b> the minimum energy colliding particles must have to react.</li>
<li><b>Reaction pathway diagrams:</b> label energy (vertical) and progress of reaction (horizontal); show reactants, products, a hump for Eₐ and an arrow for ΔH. Exothermic: products lower than reactants. Endothermic: products higher.</li>
<li><b>Bond energies:</b> bond breaking is endothermic and bond making is exothermic. ΔH = Σ(bonds broken) − Σ(bonds formed). If more energy is released making bonds than is taken in breaking them, ΔH is negative.</li>
<li><b>Example:</b> H₂ + Cl₂ → 2HCl: ΔH = (436 + 243) − (2 × 432) = −185 kJ/mol.</li></ul></div>

const CH6={t:"Chapter 6: Chemical Reactions (Cambridge 0620)",notes:`
<span class="tag">Topic 6.1</span><h3>Physical and chemical changes</h3>
<p class="lg"><b>Key:</b> <span class="xt">EXT</span> = Extended (Supplement) only. No tag = Core (Extended students need it too).</p>
<svg class="v" viewBox="0 0 400 100" role="img" aria-label="Physical vs chemical"><rect x="5" y="8" width="390" height="38" rx="8" fill="#3b82f6" fill-opacity=".18"/><rect x="5" y="54" width="390" height="38" rx="8" fill="#ef4444" fill-opacity=".18"/><text x="14" y="32">Physical: ice ⇌ water. No new substance, easily reversed.</text><text x="14" y="78">Chemical: Mg + O₂ → MgO. New substance, hard to reverse.</text></svg>
<p>A <b>physical change</b> (melting, dissolving) makes no new substance and is usually easy to reverse. A <b>chemical change</b> makes one or more new substances, often with a colour change, gas, precipitate, or temperature change, and is hard to reverse.</p>
<div class="wrap"><table><tr><th>Physical changes</th><th>Chemical changes</th></tr><tr><td>Melting ice, boiling water, freezing</td><td>Burning a fuel</td></tr><tr><td>Dissolving sugar or salt in water</td><td>Rusting of iron</td></tr><tr><td>Filtering, crystallising, distilling</td><td>Cooking an egg</td></tr><tr><td>Magnetising an iron nail</td><td>Thermal decomposition of copper(II) carbonate (green → black)</td></tr></table></div>
<p><b>Signs of a chemical change:</b> a new substance forms; gas bubbles; a colour change; a precipitate; heat or light given out or taken in. <b>Exam tip:</b> the deciding question is always “is a new substance formed?” A change of state or dissolving can be reversed by cooling or evaporating, and the substance itself is unchanged.</p>
<span class="tag">Topic 6.2</span><h3>Rate of reaction</h3>
<p>Rate is how fast reactants are used up or products formed. Five factors change it:</p>
<div class="wrap"><table><tr><th>Factor</th><th>Effect on rate</th><th>Why (collision theory)</th></tr>
<tr><td>Concentration / pressure</td><td>Increases</td><td>More particles per volume, so more frequent collisions</td></tr>
<tr><td>Temperature</td><td>Increases</td><td>Particles move faster: more frequent collisions and more have energy ≥ Ea</td></tr>
<tr><td>Surface area (smaller pieces)</td><td>Increases</td><td>More particles exposed, so more frequent collisions</td></tr>
<tr><td>Catalyst (including enzymes)</td><td>Increases</td><td>Provides an alternative pathway with lower Ea; is not used up</td></tr></table></div>
<div class="card" style="margin:12px 0"><b>🎛️ Try it: temperature and rate</b> (illustration only)<br><input type="range" min="10" max="80" value="20" oninput="var t=+this.value;document.getElementById('rt').style.width=Math.min(100,Math.round(100*Math.pow(2,(t-10)/10)/128))+'%';document.getElementById('rl').textContent=t+' °C: '+(t<30?'slow, few effective collisions':t<55?'faster, more collisions have energy ≥ Ea':'very fast, most collisions succeed')"><div style="height:14px;border-radius:9px;background:var(--bd)"><div id="rt" style="height:14px;border-radius:9px;background:var(--ac);width:2%"></div></div><small id="rl">20 °C: slow, few effective collisions</small></div>
<p><span class="xt">EXT</span> <b>Collision theory:</b> reactions occur only when particles collide <b>with enough energy (≥ Ea)</b>. Photochemical reactions use light: photosynthesis, and silver bromide darkening in photography (2AgBr → 2Ag + Br₂).</p>
<p><b>Measuring rate:</b> collect gas in a gas syringe, measure loss of mass on a balance, or time a cloudy mixture to hide a cross. The steepest part of a graph is the fastest rate; the curve flattens when a reactant is used up.</p><p><span class="xt">EXT</span> <b>Evaluating methods (Supplement):</b> a gas syringe is accurate but gas can escape or the plunger can stick; mass loss on a balance is simple but gives only a small change for light gases such as hydrogen; timing a cross to disappear is easy but subjective.</p><p><b>Enzymes</b> are biological catalysts that speed up reactions in living things. Any catalyst is chemically unchanged at the end.</p>
<h3>🔍 Going deeper: collision theory and rate graphs</h3>
<svg viewBox="0 0 420 210" style="width:100%;max-width:520px;display:block;margin:10px auto" role="img" aria-label="Graph of gas volume against time for a faster and a slower reaction"><g fill="none" stroke="currentColor" stroke-width="2"><path d="M40 10V180H400"/><path d="M40 180Q70 45 160 40H390" stroke="#ef4444" stroke-width="3"/><path d="M40 180Q130 55 300 42H390" stroke="#3b4fd8" stroke-width="3"/></g><g font-size="12" fill="currentColor"><text x="170" y="200">Time</text><text x="2" y="100" transform="rotate(-90 12 100)">Volume of gas</text><text x="170" y="34" fill="#ef4444">faster (hotter, more concentrated, powder, catalyst)</text><text x="250" y="68" fill="#3b4fd8">slower</text></g></svg>
<ul><li>The <b>gradient</b> of the curve is the rate. It is steepest at the start, when the reactant concentration is highest, and flattens to zero when a reactant is used up.</li>
<li>Two experiments with the same amount of limiting reactant reach the <b>same final volume</b>; the faster one gets there sooner.</li>
<li><b>Mean rate</b> = amount of product ÷ time. Example: 48 cm³ of gas in 60 s is 0.80 cm³/s.</li></ul>
<div class="wrap"><table><tr><th>Change</th><th>Particles per unit volume</th><th>Collision frequency</th><th>Energy of collisions</th></tr><tr><td>Higher concentration or pressure</td><td>More</td><td>Higher</td><td>Unchanged</td></tr><tr><td>Larger surface area</td><td>More exposed</td><td>Higher</td><td>Unchanged</td></tr><tr><td>Higher temperature</td><td>Unchanged</td><td>Higher</td><td>More particles have energy ≥ Ea</td></tr><tr><td>Catalyst</td><td>Unchanged</td><td>Unchanged</td><td>Lower Ea, so more collisions succeed</td></tr></table></div>
<p><b>Fair test:</b> change only the <b>independent variable</b> (e.g. temperature), measure the <b>dependent variable</b> (e.g. time or gas volume), and keep everything else the same (mass of solid, volume and concentration of acid). Most enzymes work best at a particular temperature and stop working if they get too hot.</p>
<p><b>Exam tips:</b> do not say a reaction goes faster “because particles collide more” only; say <b>more frequent collisions</b>, and for temperature also say <b>more particles have energy greater than Ea</b>. A catalyst does not change the amount of product, only the rate.</p>
<span class="tag">Topic 6.3</span><h3>Reversible reactions and equilibrium</h3>
<p>In a <b>reversible reaction</b> the products can react to re-form the reactants (⇌). Examples (limited to these two): hydrated copper(II) sulfate (blue) ⇌ anhydrous copper(II) sulfate (white) + water, and hydrated cobalt(II) chloride (pink) ⇌ anhydrous cobalt(II) chloride (blue) + water. Heating drives water off (forward); adding water reverses the change. These colour changes are the tests for water.</p>
<p><span class="xt">EXT</span> In a closed system, <b>equilibrium</b> is reached when the forward and reverse rates are equal and concentrations stay constant. (Supplement) Shifting equilibrium: raising temperature favours the endothermic direction; raising pressure favours the side with fewer gas molecules; adding more reactant (higher concentration) favours the products; a catalyst speeds up both directions equally, so the position of equilibrium is unchanged.</p><div class="wrap"><table><tr><th></th><th>Haber process</th><th>Contact process</th></tr><tr><td>Makes</td><td>Ammonia</td><td>Sulfur trioxide (for sulfuric acid)</td></tr><tr><td>Equation</td><td>N₂ + 3H₂ ⇌ 2NH₃</td><td>2SO₂ + O₂ ⇌ 2SO₃</td></tr><tr><td>Sources</td><td>N₂ from air, H₂ from methane</td><td>SO₂ from burning sulfur or roasting sulfide ores; O₂ from air</td></tr><tr><td>Conditions</td><td>450 °C, 20000 kPa (200 atm), iron catalyst</td><td>450 °C, 200 kPa (2 atm), vanadium(V) oxide catalyst</td></tr></table></div><p><span class="xt">EXT</span> <b>Why these conditions:</b> both forward reactions are exothermic, so a low temperature gives a higher yield but is too slow; 450 °C is a compromise between yield and rate. In the Haber process high pressure favours the side with fewer molecules (4 → 2) and speeds up the reaction, but very high pressure costs more and needs stronger, safer equipment. In the Contact process the yield is already high at low pressure (3 → 2), so a high pressure is not worth the cost and safety risk.</p>
<h3>🔍 Going deeper: equilibrium</h3>
<p><b>Hydrated copper(II) sulfate experiment:</b> heat blue crystals gently in a test-tube. They turn white and steam condenses near the top. Let the tube cool and add a few drops of water: the white solid turns blue again and the tube warms up. The change can go either way, so it is reversible. Anhydrous cobalt(II) chloride paper (blue) turns pink with water.</p>
<p><span class="xt">EXT</span> <b>Dynamic equilibrium:</b> at equilibrium nothing seems to change, but both reactions are still happening at the same rate, so the amounts of reactants and products stay constant. It does not mean the amounts are equal. It only happens in a closed system, where nothing can escape.</p>
<div class="wrap"><table><tr><th>Change</th><th>Equilibrium shifts towards…</th></tr><tr><td>Raise temperature</td><td>The endothermic direction</td></tr><tr><td>Lower temperature</td><td>The exothermic direction</td></tr><tr><td>Raise pressure</td><td>The side with fewer gas molecules</td></tr><tr><td>Lower pressure</td><td>The side with more gas molecules</td></tr><tr><td>Add reactant or remove product</td><td>The products</td></tr><tr><td>Add a catalyst</td><td>No shift; equilibrium is reached faster</td></tr></table></div>
<div class="card" style="margin:12px 0"><b>🎛️ Try it: Haber process N₂ + 3H₂ ⇌ 2NH₃ (forward reaction exothermic)</b><br><select onchange="var r=['Shifts left: less ammonia at equilibrium (the reverse reaction is endothermic), but it is reached faster.','Shifts right: more ammonia, but the reaction is slower.','Shifts right: 4 gas molecules become 2, so more ammonia and a faster rate.','Shifts left: less ammonia, and a slower rate.','No shift: the same equilibrium is reached faster.','Shifts right: more nitrogen and hydrogen react to replace the ammonia.'];document.getElementById('hq').textContent=r[this.selectedIndex]"><option>Raise the temperature</option><option>Lower the temperature</option><option>Raise the pressure</option><option>Lower the pressure</option><option>Add an iron catalyst</option><option>Remove ammonia as it forms</option></select><p id="hq" style="margin:8px 0 0">Shifts left: less ammonia at equilibrium (the reverse reaction is endothermic), but it is reached faster.</p></div>
<p><span class="xt">EXT</span> <b>Exam tip:</b> explain conditions in two parts, the effect on the <b>rate</b> and the effect on the <b>position of equilibrium</b> (yield), then give the compromise, cost and safety.</p>
<span class="tag">Topic 6.4</span><h3>Redox</h3>
<svg class="v" viewBox="0 0 400 110" role="img" aria-label="Redox"><rect x="5" y="8" width="390" height="30" rx="8" fill="#ef4444" fill-opacity=".18"/><rect x="5" y="44" width="390" height="30" rx="8" fill="#3b82f6" fill-opacity=".18"/><text x="14" y="28">Zn → Zn²⁺ + 2e⁻   OXIDATION (loss of electrons)</text><text x="14" y="64">Cu²⁺ + 2e⁻ → Cu   REDUCTION (gain of electrons)</text><text x="14" y="98">OIL RIG: Oxidation Is Loss, Reduction Is Gain</text></svg>
<ul><li><b>Redox</b> means oxidation and reduction happening together. <b>Core:</b> oxidation is <b>gain of oxygen</b>; reduction is <b>loss of oxygen</b>.</li><li><span class="xt">EXT</span> <b>Supplement:</b> oxidation is <b>loss of electrons</b> or an <b>increase</b> in oxidation number; reduction is <b>gain of electrons</b> or a <b>decrease</b> in oxidation number. Remember <b>OIL RIG</b>.</li><li><b>Oxidation numbers:</b> a Roman numeral in a name shows it, e.g. iron(III) oxide has Fe at +3. Rules: uncombined element = 0; monatomic ion = its charge; a compound adds up to 0; an ion adds up to its charge. Example: in Fe₂O₃ + 3CO → 2Fe + 3CO₂, Fe goes +3 → 0 (reduced) and C goes +2 → +4 (oxidised).</li>
<li><span class="xt">EXT</span> An <b>oxidising agent</b> gets reduced; a <b>reducing agent</b> gets oxidised.</li>
<li><span class="xt">EXT</span> Tests: acidified potassium manganate(VII) turns from purple to colourless with a reducing agent; potassium iodide turns from colourless to brown with an oxidising agent.</li></ul>
<h3>🔍 Going deeper: redox</h3>
<div class="wrap"><table><tr><th></th><th>Oxidation</th><th>Reduction</th></tr><tr><td>Oxygen</td><td>Gain</td><td>Loss</td></tr><tr><td>Electrons</td><td>Loss</td><td>Gain</td></tr><tr><td>Oxidation number</td><td>Increases</td><td>Decreases</td></tr></table></div>
<ul><li><b>CuO + H₂ → Cu + H₂O:</b> copper oxide loses oxygen (reduced, it is the oxidising agent); hydrogen gains oxygen (oxidised, it is the reducing agent).</li>
<li><span class="xt">EXT</span> <b>Zn + CuSO₄ → ZnSO₄ + Cu:</b> ionic form Zn + Cu²⁺ → Zn²⁺ + Cu. Zinc loses electrons (oxidised, reducing agent); Cu²⁺ gains electrons (reduced, oxidising agent).</li>
<li><span class="xt">EXT</span> <b>Cl₂ + 2KBr → 2KCl + Br₂:</b> chlorine is reduced (0 → −1) so it is the oxidising agent; bromide is oxidised (−1 → 0).</li>
<li><span class="xt">EXT</span> <b>Oxidation numbers:</b> in SO₂, S is +4; in MnO₄⁻, Mn is +7 (4 × −2 = −8, so Mn = −1 + 8 = +7); Fe²⁺ → Fe³⁺ is +2 → +3, so it is oxidation.</li>
<li><span class="xt">EXT</span> <b>Colour tests:</b> acidified manganate(VII) goes purple → colourless as Mn is reduced (+7 → +2) by a reducing agent. Iodide goes colourless → brown as I⁻ is oxidised to I₂ by an oxidising agent.</li></ul>
<p><b>Exam tips:</b> in a redox equation always say which species is oxidised and which is reduced, and give the reason (gain or loss of oxygen or electrons, or the change in oxidation number). The oxidising agent is the substance that gets reduced.</p>
<div class="ext"><h4><span class="xt">EXT</span>Extended (Supplement) checklist: Chapter 6</h4><ul><li><b>Collision theory:</b> rate depends on the number of particles per unit volume, the frequency of collisions, the kinetic energy of the particles and the activation energy. Only collisions with energy ≥ Eₐ are successful.</li>
<li><b>Explaining rate factors:</b> higher concentration or pressure, more particles per unit volume, so more frequent collisions; larger surface area, more particles exposed, so more frequent collisions; higher temperature, faster particles, so more frequent collisions and a greater proportion with energy ≥ Eₐ; catalyst or enzyme, an alternative pathway with lower Eₐ, so more collisions succeed (the catalyst is unchanged at the end).</li>
<li><b>Evaluating methods:</b> gas syringe is accurate but gas can escape or the plunger stick; mass loss on a balance is simple but poor for light gases such as hydrogen; timing a cross disappearing is subjective.</li>
<li><b>Equilibrium:</b> in a closed system the forward and reverse rates are equal and concentrations stop changing. Raising temperature favours the endothermic direction; raising pressure favours the side with fewer gas molecules; adding reactant shifts the position towards products; a catalyst does not change the position, it only gets there faster.</li>
<li><b>Haber process:</b> N₂(g) + 3H₂(g) ⇌ 2NH₃(g). N₂ from air, H₂ from methane. 450 °C, 200 atm (20 000 kPa), iron catalyst. Low temperature would give more NH₃ (forward is exothermic) but too slowly, so 450 °C is a compromise; high pressure favours NH₃ (4 → 2 molecules) but is costly and hazardous; unreacted gases are recycled.</li>
<li><b>Contact process:</b> 2SO₂(g) + O₂(g) ⇌ 2SO₃(g). SO₂ from burning sulfur or roasting sulfide ores, O₂ from air. 450 °C, 2 atm (200 kPa), vanadium(V) oxide. The yield is already high, so high pressure is not worth the cost.</li>
<li><b>Redox (Supplement):</b> oxidation = loss of electrons or increase in oxidation number; reduction = gain of electrons or decrease. Rules: uncombined element 0; monatomic ion = its charge; compound sums to 0; ion sums to its charge. An oxidising agent is reduced; a reducing agent is oxidised.</li>
<li><b>Colour tests:</b> acidified KMnO₄ goes purple → colourless with a reducing agent; aqueous KI goes colourless → brown with an oxidising agent (iodine forms).</li></ul></div>

const CH7={t:"Chapter 7: Acids, Bases and Salts (Cambridge 0620)",notes:`
<span class="tag">Topic 7.1</span><h3>Characteristic properties of acids and bases</h3>
<p class="lg"><b>Key:</b> <span class="xt">EXT</span> = Extended (Supplement) only. No tag = Core (Extended students need it too).</p>
<div class="card" style="margin:12px 0"><b>🎛️ Try it: pH and universal indicator</b><br><input type="range" min="0" max="14" value="7" oninput="var p=+this.value,c=['#e11d48','#e11d48','#ef4444','#f97316','#f59e0b','#eab308','#a3b310','#22c55e','#10b981','#3b82f6','#4f46e5','#6366f1','#7c3aed','#8b5cf6','#7e22ce'][p],b=document.getElementById('ph');b.style.background=c;b.textContent='pH '+p+': '+(p<7?'acidic (more H⁺ ions)':p==7?'neutral':'alkaline (more OH⁻ ions)')"><div id="ph" style="background:#22c55e;color:#fff;font-weight:700;padding:10px 14px;border-radius:12px;margin-top:8px">pH 7: neutral</div></div>
<ul><li><b>Acids</b> react with: <b>metals</b> (salt + hydrogen); <b>bases</b> (salt + water); <b>carbonates</b> (salt + water + carbon dioxide).</li>
<li><b>Bases</b> are oxides or hydroxides of metals. <b>Alkalis</b> are bases that dissolve in water. Bases react with <b>acids</b> (salt + water) and with <b>ammonium salts</b>, which gives off ammonia gas on warming.</li>
<li>Aqueous acids contain <b>H⁺</b> ions; aqueous alkalis contain <b>OH⁻</b> ions.</li></ul>
<div class="wrap"><table><tr><th>Indicator</th><th>In acid</th><th>In alkali</th></tr><tr><td>Litmus</td><td>Red</td><td>Blue</td></tr><tr><td>Methyl orange</td><td>Red</td><td>Yellow</td></tr><tr><td>Thymolphthalein</td><td>Colourless</td><td>Blue</td></tr></table></div>
<p><b>Universal indicator paper</b> compares hydrogen ion concentration, neutrality and relative acidity or alkalinity by colour and pH:</p>
<div style="height:16px;border-radius:9px;background:linear-gradient(90deg,#e53935,#fb8c00,#fdd835,#43a047,#1e88e5,#5e35b1)"></div><div style="display:flex;justify-content:space-between;font-size:12px;color:var(--mu)"><span>0 strong acid</span><span>7 neutral</span><span>14 strong alkali</span></div>
<p><b>Neutralisation:</b> acid + alkali → salt + water. Ionic equation: <b>H⁺(aq) + OH⁻(aq) → H₂O(l)</b>.</p>
<p><span class="xt">EXT</span> <b>Supplement:</b> an acid is a <b>proton donor</b>; a base is a <b>proton acceptor</b>. A <b>strong acid</b> is completely dissociated in water: HCl(aq) → H⁺(aq) + Cl⁻(aq). A <b>weak acid</b> is only partially dissociated: CH₃COOH(aq) ⇌ H⁺(aq) + CH₃COO⁻(aq).</p>
<span class="tag">Topic 7.2</span><h3>Oxides</h3>
<svg class="v" viewBox="0 0 400 90" role="img" aria-label="Oxide types"><rect x="10" y="15" width="140" height="30" fill="#3b82f6"/><rect x="150" y="15" width="100" height="30" fill="#a855f7"/><rect x="250" y="15" width="140" height="30" fill="#ef4444"/><g style="fill:#fff"><text x="16" y="35" style="fill:#fff">basic: CuO, CaO</text><text x="160" y="35" style="fill:#fff">amphoteric</text><text x="256" y="35" style="fill:#fff">acidic: SO₂, CO₂</text></g><text x="10" y="68">metal oxides                 Al₂O₃, ZnO                 non-metal oxides</text></svg>
<ul><li><b>Acidic oxides</b> are non-metal oxides, e.g. SO₂ and CO₂. <b>Basic oxides</b> are metal oxides, e.g. CuO and CaO.</li>
<li><span class="xt">EXT</span> <b>Amphoteric oxides</b> (Supplement) react with both acids and bases to give a salt and water. Al₂O₃ and ZnO are amphoteric.</li></ul>
<span class="tag">Topic 7.3</span><h3>Preparation of salts</h3>
<p><b>Soluble salts</b>, from an acid with: (a) an alkali by titration; (b) excess metal; (c) excess insoluble base; (d) excess insoluble carbonate.</p>
<ol><li><b>Titration (alkali):</b> measure the alkali with a volumetric pipette, add acid from a burette with a suitable indicator until the end-point, note the volume, then repeat <b>without</b> indicator.</li>
<li><b>Excess solid (metal, base or carbonate):</b> add the solid to warm acid until no more reacts, then <b>filter</b> off the excess.</li>
<li>Heat the solution to evaporate some water until saturated, leave to <b>crystallise</b>, filter, then dry the crystals between filter paper.</li></ol>
<div class="wrap"><table><tr><th>Salt type</th><th>Solubility</th></tr><tr><td>Sodium, potassium, ammonium salts</td><td>All soluble</td></tr><tr><td>Nitrates</td><td>All soluble</td></tr><tr><td>Chlorides</td><td>Soluble, except lead and silver</td></tr><tr><td>Sulfates</td><td>Soluble, except barium, calcium and lead</td></tr><tr><td>Carbonates</td><td>Insoluble, except sodium, potassium, ammonium</td></tr><tr><td>Hydroxides</td><td>Insoluble, except sodium, potassium, ammonium; calcium partially</td></tr></table></div>
<p><b>Hydrated</b> = chemically combined with water. <b>Anhydrous</b> = no water.</p>
<p><span class="xt">EXT</span> <b>Supplement, insoluble salts by precipitation:</b> mix two soluble solutions, filter off the solid, wash it with distilled water, dry it. Example: BaCl₂(aq) + Na₂SO₄(aq) → BaSO₄(s) + 2NaCl(aq). <b>Water of crystallisation</b> is the water in hydrated crystals, e.g. CuSO₄·5H₂O and CoCl₂·6H₂O.</p>
<h3>🧪 Salt preparation: the full methods</h3>
<svg viewBox="0 0 520 170" style="width:100%;max-width:580px;display:block;margin:10px auto" role="img" aria-label="Flowchart for choosing a salt preparation method"><g fill="none" stroke="currentColor" stroke-width="2"><rect x="160" y="6" width="200" height="32" rx="10"/><rect x="10" y="68" width="250" height="96" rx="10" stroke="#10b981"/><rect x="280" y="68" width="230" height="96" rx="10" stroke="#ef4444"/><path d="M200 38L135 68M320 38L395 68"/></g><g font-size="12" fill="currentColor"><text x="182" y="27">Is the salt soluble in water?</text><text x="20" y="88" font-weight="bold">YES: react an acid with…</text><text x="20" y="108">alkali → titration</text><text x="20" y="126">metal → excess metal</text><text x="20" y="144">insoluble base → excess base</text><text x="20" y="160">carbonate → excess carbonate</text><text x="290" y="88" font-weight="bold">NO: precipitation</text><text x="290" y="108">mix two soluble salts that</text><text x="290" y="126">contain the two ions needed,</text><text x="290" y="144">then filter, wash with distilled</text><text x="290" y="160">water and dry</text></g></svg>
<div class="wrap"><table><tr><th>Method</th><th>Example</th><th>How you know it is finished</th></tr>
<tr><td>Acid + alkali (titration)</td><td>NaOH + HCl → NaCl + H₂O</td><td>Indicator changes colour at the end-point</td></tr>
<tr><td>Acid + excess metal</td><td>Zn + H₂SO₄ → ZnSO₄ + H₂</td><td>Bubbling stops and some metal is left</td></tr>
<tr><td>Acid + excess insoluble base</td><td>CuO + H₂SO₄ → CuSO₄ + H₂O</td><td>Black solid stops dissolving; solution is blue</td></tr>
<tr><td>Acid + excess insoluble carbonate</td><td>ZnCO₃ + H₂SO₄ → ZnSO₄ + H₂O + CO₂</td><td>Fizzing stops and some solid is left</td></tr></table></div>
<p><b>Which metals?</b> Use a metal of middle reactivity such as magnesium, zinc or iron. Potassium, sodium and calcium are too violent, and copper, silver and gold do not react with dilute acids.</p>
<h3>A. Excess solid methods (metal, base or carbonate)</h3>
<ol><li>Measure some dilute acid into a beaker and warm it gently.</li>
<li>Add the solid a little at a time, stirring, until no more reacts and some is left over. The <b>excess</b> makes sure all the acid is used up.</li>
<li><b>Filter</b> into an evaporating basin. The <b>residue</b> is the excess solid; the <b>filtrate</b> is the salt solution.</li>
<li>Heat to evaporate about half the water until it is <b>saturated</b> (crystals form on a cold glass rod dipped in the solution).</li>
<li>Leave to cool slowly so crystals grow, then filter them off, wash with a little cold distilled water and dry between filter paper.</li></ol>
<p><b>Do not evaporate to dryness:</b> hydrated crystals would lose their water of crystallisation and you would only get a powder.</p>
<h3>B. Acid + alkali by titration</h3>
<ol><li>Use a <b>volumetric pipette</b> to put 25.0 cm³ of alkali in a conical flask, and add a few drops of <b>indicator</b> (e.g. methyl orange, yellow in alkali).</li>
<li>Fill a <b>burette</b> with the acid and note the start reading. Add acid, swirling, until the indicator just changes colour (the <b>end-point</b>). Note the volume used.</li>
<li>Repeat with <b>no indicator</b>, adding exactly that volume of acid, so the salt is not contaminated.</li>
<li>Evaporate part of the water, crystallise, filter and dry as in A.</li></ol>
<p>A titration is needed because the alkali and the soluble salt are both colourless solutions, so there is no other sign of when the acid has exactly neutralised the alkali.</p>
<h3>C. Insoluble salts by precipitation (Supplement)</h3>
<ol><li><span class="xt">EXT</span> Use the solubility rules to choose <b>two soluble salts</b>, one with each ion needed.</li>
<li><span class="xt">EXT</span> Mix the two solutions in a beaker and stir. A solid <b>precipitate</b> forms.</li>
<li><span class="xt">EXT</span> Filter, <b>wash the residue with distilled water</b> to remove soluble impurities, then dry it in a warm oven or between filter paper.</li></ol>
<div class="f">BaCl₂(aq) + Na₂SO₄(aq) → BaSO₄(s) + 2NaCl(aq)</div><div class="f">Ionic: Ba²⁺(aq) + SO₄²⁻(aq) → BaSO₄(s)</div><div class="f">Pb(NO₃)₂(aq) + 2KI(aq) → PbI₂(s) + 2KNO₃(aq)  (yellow precipitate)</div>
<h3>Hydrated and anhydrous salts</h3>
<ul><li><span class="xt">EXT</span> Hydrated copper(II) sulfate, CuSO₄·5H₂O, is <b>blue</b>. Heating drives off the water to leave <b>white</b> anhydrous CuSO₄. Adding water turns it blue again and heat is released.</li>
<li><span class="xt">EXT</span> Hydrated cobalt(II) chloride, CoCl₂·6H₂O, is <b>pink</b>; the anhydrous salt is <b>blue</b>. Both are used as tests for water.</li></ul>
<div class="ext"><h4><span class="xt">EXT</span>Extended (Supplement) checklist: Chapter 7</h4><ul><li><b>Brønsted–Lowry:</b> an acid is a proton (H⁺) donor; a base is a proton acceptor.</li>
<li><b>Strong and weak acids:</b> a strong acid is completely dissociated in water (HCl → H⁺ + Cl⁻); a weak acid is only partially dissociated (CH₃COOH ⇌ H⁺ + CH₃COO⁻). At the same concentration a strong acid has a lower pH, conducts better and reacts faster with metals and carbonates.</li>
<li><b>Amphoteric oxides:</b> react with both acids and bases to give a salt and water. Al₂O₃ and ZnO are amphoteric (e.g. ZnO + 2HCl → ZnCl₂ + H₂O).</li>
<li><b>Precipitation:</b> mix two soluble salt solutions, filter the insoluble salt, wash with distilled water and dry. Example: Pb(NO₃)₂(aq) + 2KI(aq) → PbI₂(s) + 2KNO₃(aq).</li>
<li><b>Water of crystallisation:</b> water molecules in hydrated crystals. CuSO₄·5H₂O (blue) ⇌ CuSO₄ (white) + 5H₂O; CoCl₂·6H₂O (pink) ⇌ CoCl₂ (blue) + 6H₂O.</li></ul></div>

const CH8={t:"Chapter 8: The Periodic Table (Cambridge 0620)",notes:`
<span class="tag">Topic 8.1</span><h3>Arrangement of elements</h3>
<p class="lg"><b>Key:</b> <span class="xt">EXT</span> = Extended (Supplement) only. No tag = Core (Extended students need it too).</p>
<svg viewBox="0 0 440 150" style="width:100%;max-width:560px;display:block;margin:10px auto" role="img" aria-label="Block map of the Periodic Table"><g fill-opacity=".8"><rect x="10" y="10" width="36" height="110" rx="6" fill="#ef4444"/><rect x="50" y="10" width="36" height="110" rx="6" fill="#f97316"/><rect x="90" y="45" width="140" height="75" rx="6" fill="#eab308"/><rect x="234" y="10" width="30" height="110" rx="6" fill="#10b981"/><rect x="266" y="10" width="30" height="110" rx="6" fill="#10b981"/><rect x="298" y="10" width="30" height="110" rx="6" fill="#10b981"/><rect x="330" y="10" width="30" height="110" rx="6" fill="#10b981"/><rect x="362" y="10" width="30" height="110" rx="6" fill="#3b82f6"/><rect x="394" y="10" width="30" height="110" rx="6" fill="#a855f7"/></g><g font-size="11" fill="currentColor" text-anchor="middle"><text x="28" y="138">I</text><text x="68" y="138">II</text><text x="160" y="138">Transition elements</text><text x="249" y="138">III</text><text x="281" y="138">IV</text><text x="313" y="138">V</text><text x="345" y="138">VI</text><text x="377" y="138">VII</text><text x="409" y="138">VIII</text></g></svg>
<ul><li>Elements are arranged in order of increasing <b>proton number</b>, in rows called <b>periods</b> and columns called <b>groups</b>.</li>
<li>Across a period the character changes from <b>metallic to non-metallic</b>.</li>
<li><b>Group number and ion charge:</b> Group I forms +1, Group II +2, Group III +3, Group VI −2, Group VII −1.</li>
<li>Elements in the same group have <b>similar chemical properties</b> because they have the <b>same number of outer-shell electrons</b>.</li>
<li><span class="xt">EXT</span> The position of an element lets you predict its properties (metal or non-metal, charge of ion, similarity to its group). <b>Supplement:</b> identify trends in a group from information given, e.g. melting points rising or falling down the group.</li></ul>
<h4>📌 More detail</h4>
<ul><li><b>Periods:</b> period 1 has 2 elements, periods 2 and 3 have 8, and the transition block makes period 4 onwards longer. The <b>period number equals the number of occupied electron shells</b>. Sodium (2,8,1) is in period 3, group I.</li>
<li><b>Metals and non-metals:</b> metals (left and centre) form positive ions and have basic oxides. Non-metals (right) form negative ions or share electrons, and have acidic oxides. A <b>zig-zag line</b> divides them; the elements next to it, such as silicon, have properties of both.</li>
<li><b>Why the group matters:</b> Group I atoms have 1 outer electron so lose it easily (+1 ion). Group VII atoms have 7 outer electrons so gain 1 (−1 ion). Group VIII is full, so no ion is formed.</li>
<li><span class="xt">EXT</span> <b>Trends down a group:</b> atoms gain a shell each time, so the outer electrons are further from the nucleus. In metals, the outer electron is lost more easily (more reactive). In non-metals, an electron is gained less easily (less reactive).</li>
<li><b>Mendeleev</b> arranged elements by atomic mass and left gaps for undiscovered elements, predicting their properties. Modern tables use proton number.</li></ul>
<span class="tag">Topic 8.2</span><h3>Group I properties</h3>
<svg class="v" viewBox="0 0 400 150" role="img" aria-label="Melting points down Group I"><text x="12" y="24">Li</text><rect x="40" y="12" width="289" height="16" fill="#f97316"/><text x="335" y="24">181 °C</text><text x="12" y="52">Na</text><rect x="40" y="40" width="156" height="16" fill="#f97316"/><text x="202" y="52">98 °C</text><text x="12" y="80">K</text><rect x="40" y="68" width="100" height="16" fill="#f97316"/><text x="146" y="80">63 °C</text><text x="12" y="108">Rb</text><rect x="40" y="96" width="62" height="16" fill="#f97316"/><text x="108" y="108">39 °C</text><text x="12" y="136">Cs</text><rect x="40" y="124" width="44" height="16" fill="#f97316"/><text x="90" y="136">28 °C</text></svg>
<p>Lithium, sodium and potassium are the <b>alkali metals</b>: relatively soft metals. Trends <b>down</b> the group: <b>melting point decreases</b>, <b>density increases</b> (the general trend; potassium is a small exception), <b>reactivity increases</b>.</p>
<p>With water they make a metal hydroxide and hydrogen: Li fizzes steadily, Na melts into a ball and darts about, K burns with a lilac flame. <b>Predict:</b> rubidium and caesium have lower melting points and react even more violently.</p>
<h4>📌 More detail</h4>
<ul><li><b>Why reactivity increases down the group:</b> the outer electron is further from the nucleus and more shielded by inner shells, so the attraction is weaker and it is lost more easily.</li>
<li><b>Storage and safety:</b> they are kept under oil because they react with air and moisture. They tarnish quickly in air. Always use small pieces, goggles and a safety screen.</li>
<li><b>Observations with water:</b> Li floats, fizzes steadily and slowly disappears; Na melts into a ball and moves; K melts, moves quickly and burns with a lilac flame. The solution becomes alkaline, so <b>universal indicator turns purple</b>.</li>
<li><b>Equations:</b> 2Li + 2H₂O → 2LiOH + H₂; 2K + 2H₂O → 2KOH + H₂.</li>
<li><b>Common properties:</b> low melting points and densities for metals (Li, Na and K float on water), soft enough to cut with a knife, and shiny when freshly cut. Their compounds are white and dissolve in water.</li></ul>
<span class="tag">Topic 8.3</span><h3>Group VII properties</h3>
<p>Chlorine, bromine and iodine are <b>diatomic non-metals</b> (Cl₂, Br₂, I₂). Down the group <b>density increases</b> and <b>reactivity decreases</b>.</p>
<div class="wrap"><table><tr><th>Halogen</th><th>Appearance at r.t.p.</th></tr><tr><td>Chlorine</td><td>Pale yellow-green gas</td></tr><tr><td>Bromine</td><td>Red-brown liquid</td></tr><tr><td>Iodine</td><td>Grey-black solid</td></tr></table></div>
<p><b>Displacement:</b> a more reactive halogen displaces a less reactive one from its halide solution. Cl₂ + 2KBr → 2KCl + Br₂ (solution turns orange). Br₂ + 2KI → 2KBr + I₂ (solution turns brown). The reverse does not happen.</p>
<div class="card" style="margin:12px 0"><b>🎛️ Try it: halogen displacement</b><br><select id="hx"><option>Chlorine</option><option>Bromine</option><option>Iodine</option></select> added to <select id="hy"><option>potassium chloride</option><option>potassium bromide</option><option>potassium iodide</option></select> <button onclick="var a=document.getElementById('hx').selectedIndex,b=document.getElementById('hy').selectedIndex,c=['','orange','brown'],h=['chlorine','bromine','iodine'];document.getElementById('hr').textContent=a<b?'Reaction! '+h[a]+' is more reactive, so it displaces '+h[b]+' and the solution turns '+c[b]+'.':'No reaction: '+h[a]+' is not more reactive than '+h[b]+'.'">Mix</button><p id="hr" style="margin:8px 0 0"></p></div>
<p><b>Predict:</b> astatine would be a dark solid and less reactive than iodine.</p>
<h4>📌 More detail</h4>
<ul><li><b>Colour darkens down the group:</b> chlorine is a pale yellow-green gas, bromine a red-brown liquid (giving off orange-brown vapour), iodine a grey-black solid that gives a purple vapour on warming. Melting and boiling points increase because the larger molecules have stronger forces between them.</li>
<li><b>Why reactivity decreases down the group:</b> the atom is larger, so the incoming electron is further from the nucleus and attracted less strongly. Chlorine gains an electron more easily than iodine does.</li>
<li><b>Ionic equations:</b> Cl₂ + 2Br⁻ → 2Cl⁻ + Br₂ (chlorine is reduced, bromide is oxidised).</li>
<li><b>Uses:</b> chlorine disinfects water and makes bleach and plastics (PVC); iodine is an antiseptic; bromine compounds were used in flame retardants.</li>
<li><b>Reaction with metals and hydrogen:</b> halogens form <b>halide salts</b> (NaCl) with metals and hydrogen halides (HCl, an acid gas) with hydrogen.</li></ul>
<span class="tag">Topic 8.4</span><h3>Transition elements</h3>
<svg class="v" viewBox="0 0 400 100" role="img" aria-label="Coloured transition ions"><circle cx="55" cy="35" r="24" fill="#3b82f6"/><text x="55" y="82" text-anchor="middle">Cu²⁺ blue</text><circle cx="155" cy="35" r="24" fill="#22c55e"/><text x="155" y="82" text-anchor="middle">Fe²⁺ green</text><circle cx="255" cy="35" r="24" fill="#b45309"/><text x="255" y="82" text-anchor="middle">Fe³⁺ red-brown</text><circle cx="350" cy="35" r="24" fill="#7e22ce"/><text x="350" y="82" text-anchor="middle">MnO₄⁻ purple</text></svg>
<p><span class="xt">EXT</span> Transition elements are metals that: have <b>high densities</b>; have <b>high melting points</b>; form <b>coloured compounds</b>; often act as <b>catalysts</b>, as elements and in compounds (e.g. iron in the Haber process). <b>Supplement:</b> their ions have <b>variable oxidation numbers</b>, e.g. iron(II) and iron(III).</p>
<h4>📌 More detail</h4>
<ul><li>Transition elements are in the central block between Group II and Group III. Unlike Group I metals they are <b>hard, strong and dense</b>, and they react <b>only slowly</b> with water and oxygen.</li>
<li><b>Colours:</b> Cu²⁺ is blue, Fe²⁺ green, Fe³⁺ red-brown, MnO₄⁻ purple, Cr³⁺ green. Group I and II compounds are mostly white.</li>
<li><b>Catalysts:</b> iron in the Haber process (N₂ + 3H₂ ⇌ 2NH₃); vanadium(V) oxide in the Contact process; nickel in the hydrogenation of alkenes; platinum and rhodium in catalytic converters.</li>
<li><b>Uses:</b> iron (steel), copper (wiring), titanium (aircraft, light and strong), chromium (plating).</li>
<li><b>Compare with Group I:</b> transition metals have higher melting points and densities, are far less reactive and form coloured compounds.</li></ul>
<span class="tag">Topic 8.5</span><h3>Noble gases</h3>
<svg class="v" viewBox="0 0 400 150" role="img" aria-label="Full shells"><g class="l"><circle cx="70" cy="60" r="14"/><circle cx="200" cy="60" r="14"/><circle cx="200" cy="60" r="32"/><circle cx="330" cy="60" r="14"/><circle cx="330" cy="60" r="32"/><circle cx="330" cy="60" r="50"/></g><text x="40" y="135">He: 2</text><text x="170" y="135">Ne: 2,8</text><text x="300" y="135">Ar: 2,8,8</text><text x="130" y="15" style="font-size:11px">all outer shells full = unreactive</text></svg>
<p>The Group VIII noble gases are <b>unreactive, monatomic gases</b>. This is because they have a <b>full outer shell</b> of electrons (2 for helium, 8 for the others), so they do not need to gain, lose or share electrons.</p>
<h4>📌 More detail</h4>
<ul><li><b>Monatomic</b> means the particles exist as single atoms (He, Ne, Ar), not molecules. They have very low boiling points and are colourless; boiling point and density increase down the group.</li>
<li><b>Uses of helium:</b> airships and balloons (low density and non-flammable). <b>Neon:</b> advertising signs. <b>Argon:</b> filament lamps and welding, where it gives an unreactive atmosphere that stops metal from oxidising.</li>
<li>Argon makes up about 1% of the air, and the noble gases are obtained by fractional distillation of liquid air.</li></ul>
<div class="ext"><h4><span class="xt">EXT</span>Extended (Supplement) checklist: Chapter 8</h4><ul><li><b>Trends from data:</b> in Group I melting point falls and reactivity rises down the group; in Group VII melting point and density rise and reactivity falls. Use the pattern to predict values for an element not given (e.g. Rb, Cs, At).</li>
<li><b>Why similar:</b> elements in a group have the same number of outer-shell electrons, so they react in similar ways.</li>
<li><b>Transition elements:</b> ions with variable oxidation numbers, e.g. iron(II), Fe²⁺ (green precipitate with NaOH) and iron(III), Fe³⁺ (red-brown precipitate).</li>
<li><b>Halogen displacement:</b> a more reactive halogen displaces a less reactive halide: Cl₂ + 2KBr → 2KCl + Br₂ (colourless → orange).</li>
<li><b>Noble gases:</b> unreactive monatomic gases because their outer shell is already full, so they do not gain, lose or share electrons.</li></ul></div>

const CH9={t:"Chapter 9: Metals (Cambridge 0620)",notes:`
<span class="tag">Topic 9.1</span><h3>Properties of metals</h3>
<p class="lg"><b>Key:</b> <span class="xt">EXT</span> = Extended (Supplement) only. No tag = Core (Extended students need it too).</p>
<p>Metals sit to the left of the Periodic Table. Their <b>metallic bonding</b> (positive ions in a sea of delocalised electrons) explains their properties.</p>
<ul><li><b>Physical:</b> good conductors of heat and electricity (free electrons carry charge and energy), high melting points (strong bonding), malleable and ductile (layers of ions slide without breaking the bond), shiny, usually dense.</li>
<li><b>Chemical:</b> metals form <b>positive ions</b> by losing electrons, and their oxides are <b>basic</b>. Reaction with oxygen gives a metal oxide: 2Mg + O₂ → 2MgO.</li>
<li><span class="xt">EXT</span> <b>Alloys</b> are mixtures of a metal with other elements. The different-sized atoms disrupt the layers, so layers cannot slide easily and the alloy is <b>harder and stronger</b> than the pure metal. Brass = copper + zinc; stainless steel = iron + chromium + nickel.</li></ul>
<h4>📌 More detail</h4>
<ul><li><b>Why metals conduct:</b> the delocalised electrons are free to move through the lattice and carry charge. They also pass on kinetic energy, so metals conduct heat well.</li>
<li><b>Why they are malleable:</b> when force is applied, layers of ions slide, but the electron sea keeps them bonded so the metal bends instead of shattering.</li>
<li><b>Other examples of alloys:</b> bronze (copper + tin) for statues and bells; solder (tin + lead) for joining wires. Alloys are designed for hardness, strength, or resistance to corrosion.</li>
<li><b>Reaction with oxygen:</b> metals burn to form oxides: 4Al + 3O₂ → 2Al₂O₃; 2Cu + O₂ → 2CuO (the copper turns black when heated).</li></ul>
<ul><li><b>Metals vs non-metals:</b> metals conduct heat and electricity well, are malleable and ductile, and have high melting and boiling points. Non-metals are poor conductors, brittle when solid, and mostly have low melting and boiling points.</li>
<li><span class="xt">EXT</span> <b>Alloy structure:</b> in a pure metal the identical atoms sit in neat layers that slide. In an alloy the different-sized atoms (shown larger) block the sliding (supplement).</li></ul>
<svg viewBox="0 0 360 110" style="width:100%;max-width:420px;display:block;margin:10px auto" role="img" aria-label="Pure metal versus alloy"><g fill="#3b4fd8" fill-opacity=".7"><circle cx="30" cy="30" r="13"/><circle cx="58" cy="30" r="13"/><circle cx="86" cy="30" r="13"/><circle cx="114" cy="30" r="13"/><circle cx="30" cy="58" r="13"/><circle cx="58" cy="58" r="13"/><circle cx="86" cy="58" r="13"/><circle cx="114" cy="58" r="13"/><circle cx="30" cy="86" r="13"/><circle cx="58" cy="86" r="13"/><circle cx="86" cy="86" r="13"/><circle cx="114" cy="86" r="13"/><circle cx="230" cy="30" r="13"/><circle cx="258" cy="30" r="13"/><circle cx="314" cy="30" r="13"/><circle cx="230" cy="58" r="13"/><circle cx="286" cy="58" r="13"/><circle cx="314" cy="58" r="13"/><circle cx="230" cy="86" r="13"/><circle cx="258" cy="86" r="13"/><circle cx="286" cy="86" r="13"/></g><g fill="#ff9f1c"><circle cx="286" cy="30" r="19"/><circle cx="258" cy="58" r="7"/><circle cx="314" cy="86" r="17"/></g><g font-size="12" fill="currentColor" text-anchor="middle"><text x="72" y="107">pure metal</text><text x="272" y="107">alloy</text></g></svg>
<span class="tag">Topic 9.2</span><h3>Reactivity series</h3>
<p>The <b>reactivity series</b> ranks metals by how easily they lose electrons to form ions: <b>K, Na, Ca, Mg, Al, (C), Zn, Fe, (H), Cu, Ag, Au</b>. The more reactive the metal, the more vigorous its reactions.</p>
<ul><li><b>With water/steam:</b> K, Na, Ca react with cold water giving hydroxide + hydrogen. Mg reacts with steam to give oxide + hydrogen. Cu, Ag, Au do not react.</li>
<li><b>With dilute acid:</b> metal + acid → salt + hydrogen. Metals above hydrogen react (Zn, Fe, Mg); copper does not. Very reactive metals are dangerous with acid.</li>
<li><span class="xt">EXT</span> <b>Displacement:</b> a more reactive metal displaces a less reactive one from its salt solution: Zn + CuSO₄ → ZnSO₄ + Cu (blue solution fades, brown copper forms).</li>
<li><b>Thermal decomposition:</b> hydroxides and carbonates of less reactive metals break down easily on heating, e.g. CuCO₃ → CuO + CO₂ (green to black). Carbonates of K and Na are very stable.</li>
<li><span class="xt">EXT</span> <b>Aluminium</b> seems unreactive because of a thin, tough layer of <b>aluminium oxide</b> that protects it.</li></ul>
<h4>📌 More detail</h4>
<ul><li><b>Equations:</b> Mg + 2HCl → MgCl₂ + H₂; Zn + H₂SO₄ → ZnSO₄ + H₂; 2Na + 2H₂O → 2NaOH + H₂; Mg + H₂O(g) → MgO + H₂.</li>
<li><span class="xt">EXT</span> <b>Ionic equation for displacement:</b> Zn + Cu²⁺ → Zn²⁺ + Cu. Zinc loses electrons (oxidised) and copper ions gain them (reduced).</li>
<li><b>Observing reactivity:</b> compare bubbling rate with dilute acid. Mg fizzes quickly, Zn steadily, Fe slowly, Cu not at all.</li>
<li><b>Link with electrochemistry:</b> in a simple cell, the more reactive metal forms the negative terminal, and a larger gap in reactivity gives a larger voltage.</li>
<li><b>Hydrogen test:</b> a lit splint gives a squeaky pop.</li></ul>
<svg viewBox="0 0 440 90" style="width:100%;max-width:560px;display:block;margin:10px auto" role="img" aria-label="Reactivity series bar"><defs><linearGradient id="rg"><stop offset="0" stop-color="#ef4444"/><stop offset="1" stop-color="#9ca3af"/></linearGradient></defs><rect x="10" y="20" width="420" height="26" rx="13" fill="url(#rg)"/><g font-size="12" fill="currentColor" text-anchor="middle"><text x="30" y="66">K</text><text x="70" y="66">Na</text><text x="110" y="66">Ca</text><text x="150" y="66">Mg</text><text x="190" y="66">Al</text><text x="230" y="66">Zn</text><text x="270" y="66">Fe</text><text x="310" y="66">H</text><text x="350" y="66">Cu</text><text x="390" y="66">Ag</text><text x="30" y="14">most reactive</text><text x="390" y="14">least</text></g></svg>
<div class="card" style="margin:12px 0"><b>🎛️ Try it: metal displacement</b><br><select id="m1"><option>Magnesium</option><option>Zinc</option><option>Iron</option><option>Copper</option></select> placed in <select id="m2"><option>magnesium sulfate</option><option>zinc sulfate</option><option>iron(II) sulfate</option><option>copper(II) sulfate</option></select> <button onclick="var a=document.getElementById('m1').selectedIndex,b=document.getElementById('m2').selectedIndex;document.getElementById('mr').textContent=a<b?'Reaction! The metal is more reactive so it displaces the other metal from solution.':'No reaction: the metal is not more reactive than the one in solution.'">React</button><p id="mr" style="margin:8px 0 0"></p></div>
<span class="tag">Topic 9.3</span><h3>Extraction of metals</h3>
<p>A metal is found as an <b>ore</b> (a rock containing enough metal compound to extract profitably). Unreactive metals (gold) occur native. The method depends on position in the reactivity series.</p>
<ul><li><b>Below carbon (Zn, Fe, Cu):</b> reduce the oxide with <b>carbon</b> or carbon monoxide.</li>
<li><b>Bauxite</b> is the main ore of aluminium (mainly aluminium oxide); aluminium is extracted by electrolysis. <b>Above carbon (K to Al):</b> carbon cannot reduce them, so use <b>electrolysis</b> of the molten compound. Aluminium: molten <b>aluminium oxide dissolved in cryolite</b> (lowers the melting point and saves energy); aluminium forms at the cathode, oxygen at carbon anodes, which burn away and need replacing.</li>
<li><b>Blast furnace (iron):</b> haematite (Fe₂O₃), coke, limestone and hot air. C + O₂ → CO₂; CO₂ + C → 2CO; Fe₂O₃ + 3CO → 2Fe + 3CO₂. Limestone decomposes to CaO, which removes silica impurity as <b>slag</b> (CaSiO₃): CaO + SiO₂ → CaSiO₃.</li></ul>
<svg viewBox="0 0 300 190" style="width:100%;max-width:300px;display:block;margin:10px auto" role="img" aria-label="Blast furnace"><path d="M110 10H190L215 120L195 175H105L85 120Z" fill="#9ca3af" fill-opacity=".5" stroke="currentColor" stroke-width="2"/><g font-size="11" fill="currentColor"><text x="215" y="22">ore, coke, limestone in</text><text x="5" y="130">hot air in</text><text x="205" y="150">slag out</text><text x="205" y="172">molten iron out</text><text x="120" y="95">Fe₂O₃ + 3CO → 2Fe + 3CO₂</text></g></svg>
<span class="tag">Topic 9.4</span><h3>Uses of metals and rusting</h3>
<svg class="v" viewBox="0 0 400 150" role="img" aria-label="Rusting experiment"><rect x="40" y="15" width="60" height="90" rx="10" class="l"/><rect x="42" y="45" width="56" height="58" rx="8" fill="#38bdf8"/><rect x="67" y="30" width="6" height="60" fill="#78716c"/><text x="70" y="124" text-anchor="middle">air + water</text><text x="70" y="140" text-anchor="middle">RUSTS</text><rect x="170" y="15" width="60" height="90" rx="10" class="l"/><rect x="172" y="45" width="56" height="58" rx="8" fill="#38bdf8"/><rect x="172" y="45" width="56" height="12" fill="#eab308"/><rect x="197" y="30" width="6" height="60" fill="#78716c"/><text x="200" y="124" text-anchor="middle">boiled water + oil</text><text x="200" y="140" text-anchor="middle">no rust</text><rect x="300" y="15" width="60" height="90" rx="10" class="l"/><rect x="302" y="45" width="56" height="58" rx="8" fill="#e5e7eb"/><rect x="327" y="30" width="6" height="60" fill="#78716c"/><text x="330" y="124" text-anchor="middle">dry air (CaCl₂)</text><text x="330" y="140" text-anchor="middle">no rust</text></svg>
<ul><li><b>Aluminium:</b> low density and corrosion resistant, so used in aircraft (low density), food containers (resists corrosion) and, with low density and good conductivity, also overhead cables (with a steel core for strength).</li>
<li><b>Copper:</b> excellent electrical conductor, so used in wiring and cooking pans.</li>
<li><b>Mild steel</b> (iron + small carbon) is strong and cheap: car bodies, machinery, bridges. <b>Stainless steel</b> resists rusting: cutlery, chemical plant.</li>
<li><b>Rusting</b> needs both <b>oxygen and water</b>. Prevent with paint, oil, plastic coating or <b>galvanising</b> (zinc coating). <b>Sacrificial protection:</b> the more reactive zinc or magnesium corrodes instead of the iron, even if the coating is scratched.</li></ul>
<h4>📌 More detail</h4>
<ul><li><span class="xt">EXT</span> <b>Blast furnace in detail:</b> hot air burns coke: C + O₂ → CO₂, which gives heat. CO₂ + C → 2CO. Carbon monoxide reduces iron(III) oxide: Fe₂O₃ + 3CO → 2Fe + 3CO₂. Limestone gives CaO, which reacts with silica to make slag (CaSiO₃); the slag floats on the denser molten iron and is tapped off separately.</li>
<li><span class="xt">EXT</span> <b>Why aluminium anodes burn away:</b> oxygen made at the anode reacts with the hot carbon (C + O₂ → CO₂), so the anodes must be replaced regularly. Electrolysis uses much electricity, so smelters are often near cheap power.</li>
<li><b>Ease of extraction:</b> the lower the metal in the series, the easier: gold occurs native, copper and iron need carbon, aluminium needs electrolysis.</li>
<li><b>Rusting equation:</b> iron + oxygen + water → hydrated iron(III) oxide. Rust is flaky, so it falls off and exposes fresh iron, unlike aluminium oxide which sticks and protects.</li>
<li><b>Experiment:</b> three tubes with nails: (1) air and water, (2) boiled water with oil, (3) dry air with calcium chloride. Only tube 1 rusts, showing both oxygen and water are needed.</li>
<li><span class="xt">EXT</span> <b>Barrier vs sacrificial:</b> paint, grease and plastic only work while undamaged. Zinc and magnesium work even when scratched. Tin plating is a barrier only.</li>
<li><b>Recycling metals</b> saves ore, saves energy and reduces landfill and mining damage.</li>
<li><span class="xt">EXT</span> <b>Aluminium electrolysis equations:</b> cathode Al³⁺ + 3e⁻ → Al; anode 2O²⁻ → O₂ + 4e⁻.</li></ul>
<div class="ext"><h4><span class="xt">EXT</span>Extended (Supplement) checklist: Chapter 9</h4><ul><li><b>Alloys:</b> harder than pure metals because atoms of different sizes distort the regular layers, so the layers cannot slide over each other easily.</li>
<li><b>Reactivity and displacement:</b> a more reactive metal loses electrons more readily to form positive ions and displaces a less reactive metal from its aqueous ions. Zn + CuSO₄ → ZnSO₄ + Cu (ionic: Zn + Cu²⁺ → Zn²⁺ + Cu). No reaction if the metal is less reactive. Order: K, Na, Ca, Mg, Al, C, Zn, Fe, H, Cu, Ag, Au.</li>
<li><b>Aluminium:</b> high in the series but seems unreactive because of a thin, tough layer of aluminium oxide that stops water, acid and air reaching the metal.</li>
<li><b>Galvanising and sacrificial protection:</b> a zinc coat is a barrier, and zinc is more reactive than iron so it loses electrons in preference (Zn → Zn²⁺ + 2e⁻), protecting the iron even when scratched. Magnesium blocks on ship hulls work the same way.</li>
<li><b>Blast furnace equations:</b> C + O₂ → CO₂; C + CO₂ → 2CO; Fe₂O₃ + 3CO → 2Fe + 3CO₂; CaCO₃ → CaO + CO₂; CaO + SiO₂ → CaSiO₃ (slag).</li>
<li><b>Aluminium extraction:</b> purified Al₂O₃ dissolved in molten cryolite, which lowers the operating temperature and saves energy. Cathode: Al³⁺ + 3e⁻ → Al. Anode: 2O²⁻ → O₂ + 4e⁻. The carbon anodes burn away in the oxygen (C + O₂ → CO₂), so they are replaced regularly.</li></ul></div>

const CH10={t:"Chapter 10: Chemistry of the Environment (Cambridge 0620)",notes:`
<span class="tag">Topic 10.1</span><h3>Water</h3>
<p class="lg"><b>Key:</b> <span class="xt">EXT</span> = Extended (Supplement) only. No tag = Core (Extended students need it too).</p>
<svg class="v" viewBox="0 0 400 80" role="img" aria-label="Water treatment"><rect x="6" y="15" width="72" height="34" rx="8" fill="#3b82f6" fill-opacity=".25" stroke="#3b82f6"/><text x="42" y="37" text-anchor="middle" style="font-size:11px">screening</text><rect x="86" y="15" width="72" height="34" rx="8" fill="#3b82f6" fill-opacity=".25" stroke="#3b82f6"/><text x="122" y="37" text-anchor="middle" style="font-size:11px">sedimentation</text><rect x="166" y="15" width="72" height="34" rx="8" fill="#3b82f6" fill-opacity=".25" stroke="#3b82f6"/><text x="202" y="37" text-anchor="middle" style="font-size:11px">filtration</text><rect x="246" y="15" width="72" height="34" rx="8" fill="#3b82f6" fill-opacity=".25" stroke="#3b82f6"/><text x="282" y="37" text-anchor="middle" style="font-size:11px">carbon</text><rect x="326" y="15" width="72" height="34" rx="8" fill="#3b82f6" fill-opacity=".25" stroke="#3b82f6"/><text x="362" y="37" text-anchor="middle" style="font-size:11px">chlorine</text><text x="8" y="72" style="font-size:11px">→ read left to right →</text></svg>
<ul><li><b>Test for water:</b> turns anhydrous copper(II) sulfate from white to blue, or blue cobalt(II) chloride paper to pink. These show presence, not purity. Pure water boils at exactly 100 °C and freezes at 0 °C.</li>
<li><b>Treating tap water:</b> screening removes large objects, sedimentation and filtration remove solids, <b>carbon</b> removes tastes and odours, and <b>chlorine</b> kills microbes.</li>
<li>Water is used in homes and industry (as a solvent and coolant), and clean supplies are essential for health.</li></ul>
<h4>📌 More detail</h4>
<ul><li><b>Test for water in detail:</b> anhydrous copper(II) sulfate is white and turns blue with water (CuSO₄ + 5H₂O → CuSO₄·5H₂O); anhydrous cobalt(II) chloride is blue and turns pink. Both show water is present, not that it is pure.</li>
<li><b>Testing purity:</b> pure water boils at exactly 100 °C and melts at 0 °C. Salt water boils above 100 °C and over a range of temperatures.</li>
<li><b>Sedimentation</b> lets heavy particles settle; <b>filtration</b> through sand and gravel removes smaller solids. Neither removes dissolved substances, which is why distilled water is purer.</li>
<li>Water treatment never makes water completely pure. Distilled water is purer and is used in laboratories.</li>
<li><b>Chlorine</b> kills bacteria, preventing diseases like cholera. <b>Fluoride</b> may be added in some places to protect teeth.</li>
<li>Water in lakes and rivers contains dissolved oxygen that aquatic life needs; this decreases when temperature rises or when waste enters.</li></ul>
<ul><li><b>Substances in natural water:</b> dissolved oxygen (beneficial for fish), metal compounds (some give essential minerals, some are toxic), plastics (harm aquatic life), sewage (harmful microbes cause disease), and nitrates and phosphates from fertilisers and detergents (cause deoxygenation and damage aquatic life).</li>
<li><b>Purity and distilled water:</b> pure water melts at exactly 0 °C and boils at 100 °C; impurities change these. Distilled water is used in practicals because tap water has more dissolved impurities that could affect results.</li>
<li>Water treatment: sedimentation and filtration remove solids, carbon removes tastes and odours, chlorination kills microbes.</li></ul>
<span class="tag">Topic 10.2</span><h3>Fertilisers</h3>
<svg class="v" viewBox="0 0 400 80" role="img" aria-label="Eutrophication"><rect x="6" y="15" width="72" height="34" rx="8" fill="#ef4444" fill-opacity=".25" stroke="#ef4444"/><text x="42" y="37" text-anchor="middle" style="font-size:11px">run-off</text><rect x="86" y="15" width="72" height="34" rx="8" fill="#ef4444" fill-opacity=".25" stroke="#ef4444"/><text x="122" y="37" text-anchor="middle" style="font-size:11px">algae bloom</text><rect x="166" y="15" width="72" height="34" rx="8" fill="#ef4444" fill-opacity=".25" stroke="#ef4444"/><text x="202" y="37" text-anchor="middle" style="font-size:11px">no light</text><rect x="246" y="15" width="72" height="34" rx="8" fill="#ef4444" fill-opacity=".25" stroke="#ef4444"/><text x="282" y="37" text-anchor="middle" style="font-size:11px">O₂ used up</text><rect x="326" y="15" width="72" height="34" rx="8" fill="#ef4444" fill-opacity=".25" stroke="#ef4444"/><text x="362" y="37" text-anchor="middle" style="font-size:11px">fish die</text><text x="8" y="72" style="font-size:11px">→ read left to right →</text></svg>
<p>Crops need <b>nitrogen (N), phosphorus (P) and potassium (K)</b>. NPK fertilisers replace nutrients removed by harvesting. Common ones are ammonium nitrate NH₄NO₃, ammonium phosphate and potassium nitrate. Excess fertiliser runs into rivers causing <b>eutrophication</b>: algae bloom, block light, die, and bacteria use up oxygen so fish die.</p>
<ul><li><b>Why fertilisers are used:</b> nitrogen helps leaf growth, phosphorus helps roots, potassium helps flowers and fruit.</li>
<li><b>Ammonium nitrate</b> is made by reacting ammonia with nitric acid: NH₃ + HNO₃ → NH₄NO₃. It has a high nitrogen content.</li>
<li>Other effects of too much fertiliser include contaminated drinking water. Ways to reduce harm: use the correct amount and avoid spreading before rain.</li></ul>
<ul><li><b>Why each element:</b> nitrogen makes proteins and chlorophyll, phosphorus helps roots and energy transfer, potassium helps enzymes and fruit growth. Too little nitrogen gives yellow leaves and stunted growth.</li>
<li><b>Why fertilisers are needed:</b> harvesting removes nutrients from the soil, so they must be replaced to keep yields high.</li>
<li><b>Ammonium salts and nitrates</b> (e.g. ammonium sulfate, potassium nitrate) are soluble, so roots absorb them from soil water. The same solubility lets them wash into streams.</li></ul>
<span class="tag">Topic 10.3</span><h3>Air, pollutants and climate</h3>
<svg viewBox="0 0 440 100" style="width:100%;max-width:560px;display:block;margin:10px auto" role="img" aria-label="Composition of air"><rect x="20" y="25" width="312" height="34" fill="#3b82f6" rx="6"/><rect x="332" y="25" width="84" height="34" fill="#ef4444"/><rect x="416" y="25" width="4" height="34" fill="#a855f7"/><g font-size="12" fill="currentColor"><text x="120" y="46" fill="#fff">nitrogen 78%</text><text x="338" y="46" fill="#fff">O₂ 21%</text><text x="20" y="86">1% = noble gases (mostly argon) + 0.04% CO₂</text></g></svg>
<p>Clean dry air is about <b>78% nitrogen, 21% oxygen</b>, 1% argon, plus 0.04% carbon dioxide and traces of other noble gases.</p>
<div class="wrap"><table><tr><th>Pollutant</th><th>Source</th><th>Effect</th></tr><tr><td>Carbon monoxide</td><td>Incomplete combustion</td><td>Toxic, binds haemoglobin</td></tr><tr><td>Sulfur dioxide</td><td>Burning fossil fuels with sulfur</td><td>Acid rain, breathing problems</td></tr><tr><td>Oxides of nitrogen</td><td>Car engines (high temperature)</td><td>Acid rain, photochemical smog</td></tr><tr><td>Unburnt hydrocarbons</td><td>Engines</td><td>Smog</td></tr></table></div>
<ul><li><span class="xt">EXT</span> <b>Catalytic converters</b> convert CO and NOₓ into CO₂ and N₂: 2CO + 2NO → 2CO₂ + N₂.</li>
<li><span class="xt">EXT</span> <b>Greenhouse effect:</b> CO₂ and methane absorb infrared radiation from Earth and re-emit it, warming the atmosphere. More burning of fossil fuels and deforestation raises CO₂, causing <b>climate change</b>. Methane comes from cattle and rice fields.</li></ul>
<ul><li><b>Sources:</b> CO₂ from complete combustion of fuels; CO and <b>particulates</b> (soot) from incomplete combustion; methane from decomposing vegetation and waste and animal digestion; oxides of nitrogen from car engines; SO₂ from burning fossil fuels containing sulfur.</li>
<li><b>Effects:</b> particulates raise the risk of breathing problems and cancer; CO is toxic; NOₓ and SO₂ cause acid rain; NOₓ also causes photochemical smog.</li>
<li><span class="xt">EXT</span> <b>How the greenhouse effect works (supplement):</b> CO₂ and CH₄ absorb thermal energy from the Earth, then reflect and emit some back, which reduces energy loss to space and warms the atmosphere.</li>
<li><span class="xt">EXT</span> <b>NOₓ in engines (supplement):</b> the high temperature makes nitrogen and oxygen from air react. A catalytic converter then removes it: 2CO + 2NO → 2CO₂ + N₂.</li>
<li><b>Strategies for climate change:</b> plant trees, reduce livestock farming, use less fossil fuel, and use more hydrogen and renewable energy (wind, solar). <b>For acid rain:</b> catalytic converters, low-sulfur fuels, and flue gas desulfurisation using calcium oxide.</li>
<li><b>Complete vs incomplete combustion:</b> with plenty of oxygen carbon fuels make CO₂ and water. In limited oxygen they make CO, soot (carbon particles) and water. Faulty heaters can release odourless CO, so alarms are used.</li>
<li><b>Acid rain effects:</b> it damages trees, kills fish in lakes, and corrodes limestone buildings, statues and metals.</li>
<li><b>Photochemical smog:</b> nitrogen oxides and unburnt hydrocarbons react in sunlight to form a brown haze that irritates eyes and lungs.</li>
<li><span class="xt">EXT</span> <b>Photosynthesis:</b> carbon dioxide + water → glucose + oxygen, in the presence of <b>chlorophyll</b> using light energy. Symbol equation (supplement): 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂.</li></ul>
<div class="card" style="margin:12px 0"><b>🎛️ Try it: CO₂ in the air</b><br><input type="range" min="280" max="600" value="420" oninput="document.getElementById('cs').textContent=this.value+' ppm: '+(this.value<300?'pre-industrial level':this.value<430?'around today\'s level, greenhouse effect is strengthening':'above today: stronger warming, melting ice and sea level rise')"><small id="cs">420 ppm: around today's level, greenhouse effect is strengthening</small></div>
<span class="tag">Topic 10.4</span><h3>Carbonates and the carbon cycle</h3>
<svg class="v" viewBox="0 0 400 140" role="img" aria-label="Carbon cycle"><g class="l"><path d="M200 34L60 98M200 34L340 98M200 34V105"/></g><rect x="150" y="8" width="100" height="26" rx="8" fill="#a855f7" fill-opacity=".3"/><text x="200" y="26" text-anchor="middle">CO₂ in air</text><text x="60" y="115" text-anchor="middle">plants</text><text x="340" y="115" text-anchor="middle">animals</text><text x="200" y="120" text-anchor="middle">fossil fuels</text><text x="80" y="60">photosynthesis</text><text x="270" y="60">respiration</text><text x="206" y="75">burning</text></svg>
<p>Limestone (CaCO₃) is heated to make quicklime: CaCO₃ → CaO + CO₂. Quicklime is used to neutralise acidic soil and in making cement. <b>Photosynthesis</b> removes CO₂ while <b>respiration, combustion</b> and decay add it; this balance is the carbon cycle.</p>
<ul><li><b>Sources of CO₂:</b> respiration, combustion of fuels and wood, volcanoes, decomposition. <b>Sinks:</b> photosynthesis, oceans (dissolving CO₂) and carbonate rocks.</li>
<li><b>Greenhouse gases and sources:</b> carbon dioxide (fossil fuels), methane (cattle, rice paddies, landfill).</li>
<li><b>Consequences of climate change:</b> rising temperatures, melting ice caps, sea level rise, extreme weather and loss of habitats.</li>
<li><b>Limestone and quicklime:</b> CaCO₃ → CaO + CO₂. Quicklime reacts with water to give slaked lime Ca(OH)₂, used to neutralise acidic soil and lakes. CaO also removes SO₂ in flue gas desulfurisation: CaO + SO₂ → CaSO₃.</li>
<li><b>Carbon cycle in steps:</b> plants take in CO₂ (photosynthesis), animals eat plants, respiration and decay return CO₂ to the air, and burning fossil fuels adds extra CO₂ that was locked underground for millions of years.</li>
<li><b>Reducing pollution:</b> renewable energy, public transport, catalytic converters, planting trees and flue gas desulfurisation to remove SO₂.</li></ul>
<div class="ext"><h4><span class="xt">EXT</span>Extended (Supplement) checklist: Chapter 10</h4><ul><li><b>Greenhouse effect:</b> CO₂ and CH₄ absorb thermal energy radiated from Earth and re-emit or reflect some back, reducing thermal energy loss to space, which causes global warming.</li>
<li><b>Oxides of nitrogen:</b> form in car engines because the high temperature makes N₂ and O₂ from the air react (N₂ + O₂ → 2NO). Catalytic converters remove them: 2CO + 2NO → 2CO₂ + N₂ (CO oxidised, NO reduced).</li>
<li><b>Photosynthesis:</b> 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂ (chlorophyll, light energy).</li>
<li><b>Core reminder:</b> pure water melts at 0 °C and boils at 100 °C; impurities lower the melting point and raise the boiling point. Distilled water is used in practical work because tap water contains dissolved impurities.</li></ul></div>
