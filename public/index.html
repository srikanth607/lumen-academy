<div class="wrap"><table><tr><th>Vessel</th><th>Wall</th><th>Lumen</th><th>Valves</th><th>Function</th></tr><tr><td>Artery</td><td>Thick, muscular, elastic</td><td>Narrow</td><td>No</td><td>Carries blood away from the heart at high pressure</td></tr><tr><td>Vein</td><td>Thin</td><td>Wide</td><td>Yes</td><td>Carries blood back to the heart at low pressure</td></tr><tr><td>Capillary</td><td>One cell thick</td><td>Very narrow</td><td>No</td><td>Exchange of materials between blood and tissues</td></tr></table></div><ul><li><b>Capillaries</b> link arteries to veins; materials (oxygen, glucose) pass out to cells and carbon dioxide and urea pass in.</li><li><b>Main vessels:</b> to and from the heart: vena cava, aorta, pulmonary artery and pulmonary vein; to and from the lungs: pulmonary artery and pulmonary vein; to and from the kidney: <b>renal artery</b> and <b>renal vein</b>.</li><li><span class="xt">EXT</span><b>Arteries:</b> blood leaves the heart at high pressure; the thick muscular wall withstands the pressure and the elastic fibres stretch and recoil to smooth the pulse. The narrow lumen helps keep pressure high.</li><li><span class="xt">EXT</span><b>Veins:</b> blood is at low pressure, so the wall is thinner; the wide lumen gives little resistance and <b>valves</b> prevent backflow; contraction of nearby muscles squeezes blood towards the heart.</li><li><span class="xt">EXT</span><b>Capillaries:</b> the wall is one cell thick for a short diffusion distance; permeable to dissolved substances; the narrow lumen slows the blood, giving time for exchange, and brings the blood close to every cell; large total surface area.</li><li><span class="xt">EXT</span><b>Liver vessels:</b> <b>hepatic artery</b> (oxygenated blood to liver), <b>hepatic vein</b> (blood away from liver) and <b>hepatic portal vein</b> (carries blood rich in absorbed nutrients from the small intestine to the liver).</li></ul>
<h3>Why different structure?</h3><ul><li>Pressure decreases as blood moves from arteries to capillaries to veins. The structure of each vessel suits the pressure and the job.</li></ul><h3>Arteries</h3><ul><li>Pulses of blood at high pressure. Thick muscle and elastic fibres in the wall stretch with each pulse and recoil, keeping blood flowing smoothly. The narrow lumen maintains high pressure. Walls are thick to avoid bursting.</li></ul><h3>Capillaries</h3><ul><li>Walls are <b>one cell thick</b>; they are leaky enough for plasma to seep out (becoming tissue fluid) and carry oxygen, glucose and other nutrients to cells, and take away carbon dioxide and urea. The networks are very dense, so every cell is near a capillary.</li></ul><h3>Veins</h3><ul><li>Blood is at low pressure. Thin walls with less muscle; large lumen decreases resistance; <b>valves</b> stop backflow. Skeletal muscle movements squeeze veins to push blood towards the heart (that is why movement helps blood return from legs).</li></ul><h3>Identifying vessels</h3><ul><li>Cross-section: artery has a thick wall and small round lumen; vein has a thin wall and a larger, often collapsed lumen; capillaries are tiny.</li><li><b>Main vessels recap:</b> aorta (from left ventricle); vena cava (into right atrium); pulmonary artery (right ventricle to lungs); pulmonary vein (lungs to left atrium); renal artery and vein (kidney); hepatic artery, hepatic vein, hepatic portal vein (liver).</li><li><span class="xt">EXT</span><b>Hepatic portal vein:</b> takes blood rich in absorbed food directly from the small intestine to the liver, where the liver can store, process or remove substances before the blood enters the general circulation.</li><li><span class="xt">EXT</span><b>Blood pressure idea:</b> pressure is highest in the aorta and lowest in the vena cava. High blood pressure damages vessels.</li></ul><h3>Common exam mistakes</h3><ul><li>Saying veins have thin walls “because they carry deoxygenated blood”. It is because blood pressure is low.</li><li>Saying capillaries have valves.</li></ul><span class="tag">Topic 9.4</span><h3>Blood</h3>
<ul><li><b>Components of blood:</b> <b>red blood cells</b>, <b>white blood cells</b>, <b>platelets</b> and <b>plasma</b>. Identify red cells (small, no nucleus, biconcave) and white cells (larger, with a nucleus) in photomicrographs.</li></ul><div class="wrap"><table><tr><th>Component</th><th>Function</th></tr><tr><td>Red blood cells</td><td>Transport oxygen; contain <b>haemoglobin</b> which combines with oxygen in the lungs to form oxyhaemoglobin and releases it in the tissues</td></tr><tr><td>White blood cells</td><td>Defence: <b>phagocytosis</b> and <b>antibody production</b></td></tr><tr><td>Platelets</td><td>Fragments of cells that help blood to clot</td></tr><tr><td>Plasma</td><td>Liquid that transports blood cells, ions, nutrients (glucose, amino acids), urea, hormones and carbon dioxide (as hydrogencarbonate)</td></tr></table></div><ul><li><b>Blood clotting</b> forms a scab that prevents <b>blood loss</b> and the <b>entry of pathogens</b> at a wound.</li><li><span class="xt">EXT</span><b>Lymphocytes</b> (large round nucleus) make <b>antibodies</b>. <b>Phagocytes</b> (lobed or bean-shaped nucleus) <b>engulf pathogens</b> by phagocytosis and digest them (see Topic 10).</li><li><span class="xt">EXT</span><b>Clotting process:</b> platelets release substances that cause the soluble plasma protein <b>fibrinogen</b> to be converted to insoluble <b>fibrin</b> threads, forming a <b>mesh</b> that traps red cells and dries to form a clot (scab).</li></ul><h3>Common exam mistakes</h3><ul><li>Saying arteries carry oxygenated blood. The pulmonary artery carries deoxygenated blood; arteries carry blood <i>away</i> from the heart.</li><li>Saying red blood cells have a nucleus. They do not (mammals).</li><li>Writing “the left side is thicker because it is bigger”. It is thicker to give high pressure to the whole body.</li></ul><h3>Red blood cells</h3><ul><li>Biconcave disc increases surface area for gas exchange; no nucleus makes room for more haemoglobin; flexible to pass through the narrowest capillaries. Haemoglobin + oxygen ⇌ oxyhaemoglobin (bright red) in the lungs; oxyhaemoglobin releases oxygen in tissues.</li></ul><h3>White blood cells</h3><ul><li><b>Phagocytes</b> engulf and digest pathogens (non-specific). <b>Lymphocytes</b> recognise specific antigens and make <b>antibodies</b> (see Topic 10). White cells are larger than red cells, have a nucleus and are far fewer in number.</li></ul><h3>Platelets</h3><ul><li>Small fragments of cells with no nucleus, formed in bone marrow, that help the blood to clot at a cut.</li></ul><h3>Plasma</h3><ul><li>About 55% of blood; a straw-coloured liquid with 90% water. It carries dissolved glucose, amino acids, mineral ions, hormones, urea, CO₂ (as hydrogencarbonate) and heat.</li></ul><h3>Blood in numbers</h3><ul><li>A human has about 5 dm³ of blood. There are about 5 million red cells per mm³ but only about 7000 white cells per mm³.</li></ul><h3>Why clotting is important</h3><ul><li>It stops loss of blood (so blood pressure can be maintained) and seals the wound against pathogens until the skin heals. Haemophilia (an inherited disease) prevents proper clotting.</li></ul><h3>How to identify blood cells in a photomicrograph</h3><ul><li>Red cells: many, small, pink, circular with a pale centre. White cells: fewer, larger, purple nucleus. Platelets: tiny fragments.</li><li><span class="xt">EXT</span><b>The clotting cascade (outline):</b> damaged tissue and platelets release a substance that converts soluble <b>fibrinogen</b> into insoluble <b>fibrin</b> fibres, which form a mesh across the wound; red cells are trapped in the mesh and the clot dries as a scab.</li><li><span class="xt">EXT</span><b>Lymphocytes versus phagocytes:</b> a lymphocyte has a large round nucleus filling most of the cell and little cytoplasm; a phagocyte has a lobed (or kidney-shaped) nucleus and granular cytoplasm.</li></ul><h3>Common exam mistakes</h3><ul><li>Saying haemoglobin is in plasma. It is inside red blood cells.</li><li>Saying platelets are cells. They are cell fragments.</li></ul><h3>Summary</h3><p>p Blood = transport (red cells, plasma) + defence (white cells) + repair (platelets).</p><div style="border:1.5px dashed var(--pr);border-radius:14px;padding:12px;margin:12px 0"><b>🧪 Simulation: exercise, heart rate and breathing</b><br>Exercise intensity <input id="hx" type="range" min="0" max="10" value="0" style="width:100%" oninput="bioHr()"><div id="ho">Rest: pulse 70 beats/min, breathing 14 breaths/min.</div></div>`,kw:[["Circulatory system", "Blood vessels, a pump and valves ensuring one-way flow of blood."], ["Double circulation", "Blood passes through the heart twice in each full circuit."], ["Atrium", "Upper chamber of the heart that receives blood."], ["Ventricle", "Lower chamber of the heart that pumps blood out."], ["Septum", "Muscular wall separating the left and right sides of the heart."], ["Coronary artery", "Artery that supplies the heart muscle with blood."], ["Coronary heart disease", "Blockage of coronary arteries by fatty deposits."], ["Artery", "Vessel carrying blood away from the heart."], ["Vein", "Vessel carrying blood towards the heart; has valves."], ["Capillary", "Tiny vessel one cell thick where exchange occurs."], ["Haemoglobin", "Red pigment in red blood cells that carries oxygen."], ["Phagocytosis", "Engulfing and digesting pathogens."], ["Platelets", "Cell fragments that help blood clot."], ["Plasma", "Liquid part of blood."], ["Fibrin", "Insoluble protein forming the mesh of a blood clot."]],f:["Blood: red cells + white cells + platelets + plasma", "Fibrinogen → fibrin (clot)"],qa:[["Name the vessels entering and leaving the left side of the heart.", "Pulmonary vein enters the left atrium; aorta leaves the left ventricle."], ["Give two risk factors for coronary heart disease.", "Smoking, poor diet, lack of exercise, stress, age, sex or genetics."], ["State the function of platelets.", "Help the blood to clot."], ["(Extended) Why is the left ventricle wall thicker than the right?", "It pumps blood at high pressure around the whole body."], ["(Extended) Describe how a blood clot forms.", "Fibrinogen is converted to insoluble fibrin forming a mesh."]],mcq:[["Which vessel has valves?", ["Artery", "Vein", "Capillary"], 1, "Veins."], ["Haemoglobin transports…", ["glucose", "oxygen", "urea"], 1, "Oxygen."], ["The pulmonary vein carries blood from the…", ["lungs to heart", "heart to lungs", "body to heart"], 0, "Oxygenated blood."]]},
{t:"Topic 10: Diseases and immunity (Cambridge 0610)",notes:`
<span class="tag">Topic 10.1</span><h3>Pathogens and defence</h3>
<p class="lg"><b>Key:</b> <span class="xt">EXT</span> = Extended (Supplement) only. No tag = Core.</p>
<ul><li>Pathogen: disease-causing organism; transmission by contact, air, water, vectors, blood.</li><li>Barriers: skin, mucus, stomach acid. White cells ingest pathogens and make antibodies.</li><li><span class="xt">EXT</span>Antibodies are specific to antigens; memory cells give faster second response. Vaccination gives active immunity.</li><li><span class="xt">EXT</span>Passive immunity: antibodies given (breast milk, placenta). Cholera toxin drives water loss; treat by oral rehydration.</li></ul>`,kw:[["Pathogen", "An organism that causes disease."], ["Antibody", "Protein made by lymphocytes that binds a specific antigen."]],f:["See notes"],qa:[["How do vaccines work?", "They contain antigens, so lymphocytes make memory cells."]],mcq:[["Which gives active immunity?", ["Vaccination", "Colostrum", "Antibiotics"], 0, "Body makes own antibodies."]]},
{t:"Topic 11: Gas exchange in humans (Cambridge 0610)",notes:`
<span class="tag">Topic 11.1</span><h3>Breathing</h3>
<p class="lg"><b>Key:</b> <span class="xt">EXT</span> = Extended (Supplement) only. No tag = Core.</p>
<ul><li>Air: nasal cavity, trachea, bronchi, bronchioles, alveoli. Alveoli: thin, moist, rich blood supply.</li><li>Inhaled air has more O₂, exhaled more CO₂ and water. Limewater tests for CO₂.</li><li><span class="xt">EXT</span>Inhale: intercostal muscles contract, ribs up, diaphragm flattens, volume ↑, pressure ↓.</li><li><span class="xt">EXT</span>Cilia and mucus protect lungs; smoking damages them.</li></ul>`,kw:[["Alveoli", "Tiny air sacs where gas exchange occurs."], ["Ventilation", "Movement of air in and out of the lungs."]],f:["See notes"],qa:[["Name the site of gas exchange.", "Alveoli."]],mcq:[["When we inhale the diaphragm…", ["relaxes", "flattens", "stays the same"], 1, "Volume increases."]]},
BIO12,
{t:"Topic 13: Excretion in humans (Cambridge 0610)",notes:`
<span class="tag">Topic 13.1</span><h3>Kidneys and liver</h3>
<p class="lg"><b>Key:</b> <span class="xt">EXT</span> = Extended (Supplement) only. No tag = Core.</p>
<ul><li>Excretion removes metabolic waste: CO₂ (lungs), urea (kidneys). Kidneys filter blood, forming urine.</li><li><span class="xt">EXT</span>Liver deaminates excess amino acids to urea. Kidney: ultrafiltration then selective reabsorption. Dialysis for kidney failure.</li></ul>`,kw:[["Excretion", "Removal of metabolic waste products."], ["Urea", "Nitrogenous waste made in the liver and excreted by kidneys."]],f:["See notes"],qa:[["Which organ makes urea?", "The liver."]],mcq:[["Urea is formed in the…", ["kidney", "liver", "bladder"], 1, "Deamination."]]},
{t:"Topic 14: Coordination and response (Cambridge 0610)",notes:`
<span class="tag">Topic 14.1</span><h3>Nervous system</h3>
<p class="lg"><b>Key:</b> <span class="xt">EXT</span> = Extended (Supplement) only. No tag = Core.</p>
<ul><li>Central nervous system: brain and spinal cord. Reflex arc: receptor → sensory neurone → relay neurone → motor neurone → effector.</li><li>Hormones are chemicals from glands in blood. Adrenaline prepares for ‘fight or flight’.</li><li>Eye: cornea, iris, lens, retina; pupil reflex adjusts to light.</li><li><span class="xt">EXT</span>Synapse: neurotransmitter diffuses across gap. Accommodation focuses by changing lens shape.</li><li><span class="xt">EXT</span>Homeostasis: negative feedback; insulin/glucagon control blood glucose; skin controls temperature. Tropisms: auxin.</li></ul>`,kw:[["Reflex action", "Fast automatic response to a stimulus."], ["Homeostasis", "Maintaining a constant internal environment."]],f:["See notes"],qa:[["Order a reflex arc.", "Receptor → sensory → relay → motor neurone → effector."]],mcq:[["The effector in a reflex is a…", ["muscle or gland", "neurone", "brain"], 0, "It responds."]]},
{t:"Topic 15: Drugs (Cambridge 0610)",notes:`
<span class="tag">Topic 15.1</span><h3>Medicinal and misused</h3>
<p class="lg"><b>Key:</b> <span class="xt">EXT</span> = Extended (Supplement) only. No tag = Core.</p>
<ul><li>Drug alters body chemistry. Antibiotics kill bacteria, not viruses; heroin is a depressant; alcohol; nicotine and tar from tobacco.</li><li><span class="xt">EXT</span>Antibiotic resistance via natural selection. Alcohol harms liver and reaction time; addiction involves tolerance and withdrawal.</li></ul>`,kw:[["Drug", "A substance that alters chemical reactions in the body."], ["Antibiotic", "Drug that kills bacteria."]],f:["See notes"],qa:[["Do antibiotics work on viruses?", "No."]],mcq:[["Alcohol is a…", ["depressant", "stimulant", "antibiotic"], 0, "It slows reactions."]]},
{t:"Topic 16: Reproduction (Cambridge 0610)",notes:`
<span class="tag">Topic 16.1</span><h3>Plants and humans</h3>
<p class="lg"><b>Key:</b> <span class="xt">EXT</span> = Extended (Supplement) only. No tag = Core.</p>
<ul><li>Asexual: one parent, identical offspring. Sexual: fusion of gametes, variation.</li><li>Flower: sepal, petal, anther, stigma, ovary. Pollination (insect or wind) then fertilisation.</li><li>Human: testes, ovaries, fertilisation in oviduct; implantation in uterus; menstrual cycle.</li><li><span class="xt">EXT</span>Seed germination needs water, oxygen, warmth. Placenta exchanges materials. HIV spread; amnion protects.</li><li><span class="xt">EXT</span>Hormones: oestrogen, progesterone control the menstrual cycle; FSH, LH.</li></ul>`,kw:[["Fertilisation", "Fusion of the nuclei of male and female gametes."], ["Pollination", "Transfer of pollen from anther to stigma."]],f:["See notes"],qa:[["Define pollination.", "Pollen transfers from anther to stigma."]],mcq:[["Fertilisation occurs in the…", ["uterus", "oviduct", "ovary"], 1, "Gametes fuse in the oviduct."]]},
{t:"Topic 17: Inheritance (Cambridge 0610)",notes:`
<span class="tag">Topic 17.1</span><h3>DNA, genes, crosses</h3>
<p class="lg"><b>Key:</b> <span class="xt">EXT</span> = Extended (Supplement) only. No tag = Core.</p>
<ul><li>Chromosomes carry genes. Humans have 46 (23 pairs). Mitosis gives identical cells; meiosis gives gametes with half the chromosomes.</li><li>Allele: version of a gene. Dominant vs recessive; genotype vs phenotype; homozygous vs heterozygous.</li><li>Sex: XX female, XY male (50:50).</li><li><span class="xt">EXT</span>Codominance and sex-linked inheritance. Genetic diagrams, ratios; test cross.</li><li><span class="xt">EXT</span>Mutations; ionising radiation raises rate. Protein synthesis: DNA code → amino acid sequence.</li></ul><div style="border:1.5px dashed var(--pr);border-radius:14px;padding:12px;margin:12px 0"><b>🧪 Simulation: monohybrid cross</b><br><select id="pa" onchange="bioPun()"><option>Tt</option><option>TT</option><option>tt</option></select> × <select id="pb" onchange="bioPun()"><option>Tt</option><option>TT</option><option>tt</option></select><div id="po">Offspring: TT 1/4, Tt 2/4, tt 1/4. Dominant : recessive = 3:1</div></div>`,kw:[["Allele", "A version of a gene."], ["Genotype", "The alleles an organism has."]],f:["Monohybrid cross: Tt × Tt → 3 dominant : 1 recessive"],qa:[["What is the sex chromosome pair of a male?", "XY."]],mcq:[["Heterozygous means…", ["Tt", "TT", "tt"], 0, "Two different alleles."]]},
{t:"Topic 18: Variation and selection (Cambridge 0610)",notes:`
<span class="tag">Topic 18.1</span><h3>Evolution</h3>
<p class="lg"><b>Key:</b> <span class="xt">EXT</span> = Extended (Supplement) only. No tag = Core.</p>
<ul><li>Variation: genetic (e.g. blood group) and environmental. Mutation produces new alleles.</li><li>Natural selection: variation → competition → survival of fittest → breeding → allele passed on. Selective breeding.</li><li><span class="xt">EXT</span>Adaptive features; evolution by natural selection; bacteria resistance. Continuous vs discontinuous variation.</li></ul>`,kw:[["Natural selection", "Better-adapted individuals survive, breed and pass on their alleles."], ["Mutation", "A random change in a gene or chromosome."]],f:["See notes"],qa:[["Define natural selection.", "Better-adapted survive, breed and pass on alleles."]],mcq:[["Natural selection needs…", ["variation", "no competition", "no mutation"], 0, "Variation is essential."]]},
{t:"Topic 19: Organisms and their environment (Cambridge 0610)",notes:`
