<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;700;800&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<title>Lumen Academy – IGCSE Grade 10</title>
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6fb;--card:#fff;--tx:#0f1a2e;--mu:#56627c;--pr:#3a3cf0;--on:#fff;--ac:#ffb81c;--bd:#e0e5f0;--hd:62px;--sh:0 1px 2px rgba(15,26,46,.06),0 10px 26px -14px rgba(15,26,46,.2)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1120;--card:#141c30;--tx:#e8ecf7;--mu:#92a0be;--pr:#97a2ff;--on:#0b1120;--ac:#ffc94d;--bd:#26304a;--sh:0 10px 26px -14px rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--bg:#0b1120;--card:#141c30;--tx:#e8ecf7;--mu:#92a0be;--pr:#97a2ff;--on:#0b1120;--ac:#ffc94d;--bd:#26304a;--sh:0 10px 26px -14px rgba(0,0,0,.6)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3,.logo,.big{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;font-weight:800}
h1{font-size:clamp(30px,5vw,46px);line-height:1.05;letter-spacing:-.03em;margin:0 0 .3em}
h2{font-size:1.6rem;line-height:1.15;letter-spacing:-.02em;margin:2em 0 .6em}
h3{font-size:1.2rem;line-height:1.25;letter-spacing:-.01em}
a{color:var(--pr)}
:focus-visible{outline:3px solid var(--pr);outline-offset:2px;border-radius:6px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;height:var(--hd);padding:0 24px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.logo{display:flex;align-items:center;gap:10px;font-size:21px;letter-spacing:-.02em;color:var(--tx);text-decoration:none;white-space:nowrap}
nav#nav{margin-left:auto;display:flex;gap:8px;align-items:center}
a.b,button{display:inline-block;background:var(--pr);color:var(--on);border:0;border-radius:10px;padding:9px 16px;font:700 14px Figtree,system-ui,sans-serif;cursor:pointer;text-decoration:none;transition:filter .15s,transform .15s}
a.b:hover,button:hover{filter:brightness(1.1);transform:translateY(-1px)}
a.b.o,button.o{background:transparent;color:var(--pr);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--pr) 55%,transparent)}
a.b.m{background:var(--ac);color:#1d1a33}
button:disabled{opacity:.7;cursor:default;transform:none}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);max-width:1320px;margin:0 auto;min-height:calc(100vh - var(--hd))}
main{width:100%;max-width:980px;padding:28px clamp(16px,4vw,44px) 72px}
#side{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hd));align-self:start;height:calc(100vh - var(--hd) - env(safe-area-inset-top,0px));overflow-y:auto;padding:18px 12px 18px 24px;display:flex;flex-direction:column;gap:12px}
.rail{display:flex;flex-direction:column;gap:2px}
#side .grp{font:600 13px Figtree,sans-serif;color:var(--mu);padding:16px 10px 6px}
#side a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--tx);text-decoration:none;font-weight:600;font-size:14.5px;line-height:1.3}
#side a:hover{background:color-mix(in srgb,var(--c,var(--pr)) 10%,transparent)}
#side a.on{background:color-mix(in srgb,var(--c,var(--pr)) 15%,transparent);box-shadow:inset 3px 0 0 var(--c,var(--pr))}
#side a i{margin-left:auto;font:600 12px Figtree,sans-serif;font-style:normal;color:var(--mu)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.pb{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--bd);color:var(--tx)}
.pb b{display:block;font:800 18px "Bricolage Grotesque",sans-serif;line-height:1.1}.pb small{color:var(--mu);font-size:12px;line-height:1.3;display:block}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px;align-items:center;padding:16px 0 8px}
.hero h1{font-size:clamp(38px,6vw,64px);letter-spacing:-.035em}
.hero p{max-width:44ch;color:var(--mu);font-size:1.08rem;margin:0 0 6px}
.hero .fine{font-size:.95rem;margin-top:18px}
.pill{display:inline-block;padding:4px 12px;border-radius:99px;background:color-mix(in srgb,var(--ac) 32%,transparent);font-weight:700;font-size:13px;margin-bottom:16px}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.prism{width:100%;justify-self:end;overflow:visible}
.prism text{font:600 15px Figtree,sans-serif;fill:var(--tx)}
.prism a{cursor:pointer}.prism a:hover .rd{r:10}
.pr-body{fill:color-mix(in srgb,var(--card) 75%,transparent);stroke:var(--tx);stroke-width:2.5;stroke-linejoin:round}
.beam{fill:none;stroke:var(--ac);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:300;stroke-dashoffset:300;animation:draw .9s .2s ease-out forwards}
.ray{fill:none;stroke-width:5;stroke-linecap:round;stroke-dasharray:260;stroke-dashoffset:260;animation:draw .7s calc(1s + var(--i)*.09s) ease-out forwards}
.rd,.prism text{opacity:0;animation:fadein .4s 1.7s forwards}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes fadein{to{opacity:1}}
@media(prefers-reduced-motion:reduce){.beam,.ray{animation:none;stroke-dashoffset:0}.rd,.prism text{animation:none;opacity:1}}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;gap:4px;padding:18px;border-radius:18px;color:var(--tx);text-decoration:none;background:color-mix(in srgb,var(--c) 11%,var(--card));border:1px solid color-mix(in srgb,var(--c) 32%,var(--bd));transition:transform .2s}
.tile:hover{transform:translateY(-3px)}
.tile h3{margin:10px 0 0}.tile p{margin:0;color:var(--mu);font-size:14px}
.ti{width:46px;height:46px;border-radius:14px;background:var(--c);display:grid;place-items:center;font-size:24px}
.bar{height:6px;border-radius:9px;background:color-mix(in srgb,var(--c) 24%,transparent);margin-top:12px;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:var(--c)}
.how{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border:1px solid var(--bd);border-radius:18px;overflow:hidden}
.how div{padding:22px}.how div+div{border-left:1px solid var(--bd)}.how h3{margin:.4em 0 .2em}.how p{margin:0;color:var(--mu)}.how .ic{font-size:26px}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.roles div{padding:14px 16px;border-radius:14px;border:1px solid var(--bd);background:var(--card)}.roles b{display:block}.roles span{color:var(--mu);font-size:14px;line-height:1.4;display:block}
.chs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:thin}
.chs a{flex:none;display:flex;align-items:center;gap:8px;max-width:250px;padding:7px 12px 7px 8px;border-radius:12px;background:var(--card);border:1px solid var(--bd);color:var(--tx);text-decoration:none;font-weight:600;font-size:14px}
.chs a b{display:grid;place-items:center;flex:none;width:24px;height:24px;border-radius:8px;background:color-mix(in srgb,var(--c) 24%,transparent);font-size:13px}
.chs a span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chs a.on{background:color-mix(in srgb,var(--c) 18%,var(--card));border-color:var(--c)}
.chh{display:flex;gap:16px;align-items:center;margin:14px 0 6px}
header.chh,main header,article header,.read header{position:static;top:auto;z-index:auto;height:auto;padding:0;background:none;backdrop-filter:none;border-bottom:0;display:flex;flex-wrap:wrap}
.chh h1{overflow-wrap:anywhere;line-height:1.12}
.chh>div{min-width:0}

.ico{width:60px;height:60px;border-radius:18px;background:var(--c);display:grid;place-items:center;font-size:30px;flex:none}
.chh small{display:block;color:var(--mu);font-weight:600}.chh h1{margin:.1em 0 0;font-size:clamp(26px,4.4vw,40px)}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--bd);margin:12px 0 24px}
.tabs a{flex:none;padding:10px 14px;margin-bottom:-1px;color:var(--mu);text-decoration:none;font-weight:600;font-size:14.5px;border-bottom:3px solid transparent}
.tabs a:hover{color:var(--tx)}.tabs a.on{color:var(--tx);border-bottom-color:var(--c)}
.read{max-width:760px;font-size:17px;line-height:1.75}
.read h3{font-size:1.5rem;line-height:1.2;letter-spacing:-.02em;margin:2em 0 .5em;padding-top:1.1em;border-top:1px solid var(--bd)}
.read .tag+h3,.read>h3:first-child{border-top:0;padding-top:0;margin-top:.3em}
.read h4{font:700 1rem Figtree,sans-serif;color:var(--pr);margin:1.6em 0 .3em}
.read ul,.read ol{padding-left:1.25em}.read li{margin:.4em 0}.read li::marker{color:var(--c,var(--pr))}
.tag{display:inline-block;background:color-mix(in srgb,var(--c,var(--pr)) 18%,transparent);color:var(--tx);border-radius:99px;padding:2px 12px;font:700 12.5px Figtree,sans-serif}
dt{font-weight:700;margin-top:14px}dd{margin:2px 0 0;padding-left:12px;border-left:3px solid var(--c,var(--ac));color:color-mix(in srgb,var(--tx) 82%,transparent)}
.f{background:color-mix(in srgb,var(--ac) 15%,var(--card));border-left:4px solid var(--ac);padding:10px 14px;margin:8px 0;border-radius:6px 12px 12px 6px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em;line-height:1.6}
.wrap{overflow-x:auto;border:1px solid var(--bd);border-radius:14px;margin:14px 0;background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:14.5px;line-height:1.5}td,th{padding:10px 12px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
th{background:color-mix(in srgb,var(--c,var(--pr)) 13%,transparent);font-weight:700}tr:last-child td{border-bottom:0}
details{border:1px solid var(--bd);border-radius:12px;padding:10px 16px;margin:8px 0;background:var(--card)}summary{cursor:pointer;font-weight:700}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;box-shadow:var(--sh)}.card h3{margin:.2em 0}
.read .card[style*="margin:12px 0"]{border-left:4px solid var(--ac);background:color-mix(in srgb,var(--ac) 8%,var(--card));box-shadow:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.big{font-size:40px;line-height:1.1;letter-spacing:-.03em;color:var(--pr)}
input,select,textarea{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;margin:6px 0}
input:focus,select:focus,textarea:focus{border-color:var(--pr);outline:none}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--pr);height:24px}
label{display:block;font-weight:600;font-size:14px}
.box{max-width:430px;margin:36px auto}.box h2{margin-top:0}
.lockc{text-align:center;padding:32px 20px}.lockc .lk{font-size:40px}.lockc h2{margin:.3em 0}.lockc .cta{justify-content:center}
.toc{padding-left:1.2em}.toc li{margin:.4em 0}
.err{color:#e5484d;font-size:14px}
.note{border:1px dashed var(--bd);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--mu);margin:32px 0 0}
svg.v{width:100%;max-width:440px;display:block;margin:10px auto}svg.v text{fill:currentColor;font-size:12px}
footer{text-align:center;color:var(--mu);font-size:14px;padding:26px 20px calc(26px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--bd)}
.fab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:25;display:flex;gap:8px}
.fab button{background:var(--card);color:var(--tx);box-shadow:var(--sh),inset 0 0 0 1px var(--bd)}
body.study header,body.study #side,body.study footer{display:none}
body.study .app{display:block}body.study main{margin:0 auto;max-width:800px}body.study .read{font-size:19px;line-height:1.9;max-width:none}body.study .chs,body.study .chh{display:none}
@media(max-width:900px){
.hero{grid-template-columns:minmax(0,1fr)}.prism{max-width:520px;justify-self:center}
.app{grid-template-columns:minmax(0,1fr)}
#side{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hd));z-index:15;height:auto;overflow:visible;padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--bd)}
.rail{flex-direction:row;overflow-x:auto;scrollbar-width:none}#side a{white-space:nowrap}#side .grp,#side .pb{display:none}
.how{grid-template-columns:1fr}.how div+div{border-left:0;border-top:1px solid var(--bd)}}
@media(max-width:520px){header{padding:0 12px;gap:8px}.logo{font-size:17px;gap:8px}.logo svg{width:30px;height:30px}a.b,button{padding:8px 12px;font-size:13px}nav#nav{gap:6px}.fab button{padding:8px 10px}}
.gcount{color:var(--mu);margin:0 0 12px}.gchips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 6px}.gchips button{padding:7px 13px;font-size:13px}
.gsub h2{display:flex;align-items:center;gap:10px;margin:1.8em 0 .2em;padding-bottom:10px;border-bottom:2px solid var(--c)}.gsub h2 small{margin-left:auto;font:600 13px Figtree,sans-serif;color:var(--mu);letter-spacing:0}
.gch{font:700 .95rem Figtree,sans-serif;color:var(--mu);margin:1.4em 0 .2em}
.gdl{display:grid;grid-template-columns:minmax(130px,230px) 1fr;gap:0 20px;margin:0}.gdl dt,.gdl dd{margin:0;padding:9px 0;border-top:1px solid var(--bd)}.gdl dt{color:var(--tx)}.gdl dd{border-left:0;padding-left:0}
@media(max-width:600px){.gdl{grid-template-columns:1fr}.gdl dt{padding-bottom:0}.gdl dd{border-top:0;padding-top:2px}}
.ext{border:1px solid var(--bd);border-left:5px solid var(--ac);border-radius:12px;background:var(--card);padding:4px 18px 10px;margin:28px 0 6px}.ext h4{margin:.7em 0 .3em;font:800 1.05rem "Bricolage Grotesque",Figtree,system-ui,sans-serif;letter-spacing:-.01em}.ext ul{margin:.2em 0;padding-left:1.2em}.ext li{margin:.45em 0}.xt{display:inline-block;background:var(--ac);color:#1d1a33;font:800 11px Figtree,system-ui,sans-serif;letter-spacing:.06em;padding:1px 8px;border-radius:999px;margin-right:7px;vertical-align:1px;white-space:nowrap}.lg{font-size:14px;color:var(--mu);margin:.4em 0 1em}
</style><style>.ct{display:inline-block;background:#1f9d57;color:#fff;font:800 11px Figtree,system-ui,sans-serif;letter-spacing:.06em;padding:1px 8px;border-radius:999px;margin-right:7px;vertical-align:1px;white-space:nowrap}svg.v.g text{font-size:9px}figure{margin:0}</style><style>.cv{display:inline-block;vertical-align:middle;text-align:center;line-height:1.15;border-left:1.5px solid currentColor;border-right:1.5px solid currentColor;border-radius:5px;padding:0 6px;margin:0 3px;font-size:.95em}</style><style id="v2">
:root{--bg:#f5f6fb;--card:#fff;--tx:#0c1432;--mu:#5a6483;--pr:#2f55ff;--on:#fff;--ac:#ffc233;--bd:#e2e6f1;--hd:68px;--ink:#0a1235;--sh:0 1px 2px rgba(10,18,53,.05),0 18px 40px -22px rgba(10,18,53,.35);--fd:"Schibsted Grotesk",system-ui,sans-serif;--fs:"Source Serif 4",Georgia,serif}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#080d22;--card:#111936;--tx:#e9edfb;--mu:#98a3c7;--pr:#8aa0ff;--on:#080d22;--bd:#222c52;--ink:#050918}}
:root[data-theme="dark"]{--bg:#080d22;--card:#111936;--tx:#e9edfb;--mu:#98a3c7;--pr:#8aa0ff;--on:#080d22;--bd:#222c52;--ink:#050918}
body{font:16px/1.65 var(--fd)}
h1,h2,h3,.logo,.big,.pb b,.ext h4{font-family:var(--fd);font-weight:800;letter-spacing:-.025em}
header{height:var(--hd);padding:0 max(20px,calc((100vw - 1240px)/2 + 20px));background:color-mix(in srgb,var(--card) 86%,transparent);border-bottom:1px solid var(--bd)}
.logo{font-size:20px}
nav#nav{gap:4px}
nav#nav a.b,nav#nav button{background:none;color:var(--tx);box-shadow:none;border-radius:99px;padding:9px 14px;font-weight:600}
nav#nav a.b:hover,nav#nav button:hover{background:color-mix(in srgb,var(--pr) 10%,transparent);filter:none;transform:none}
nav#nav a.b:not(.o):not(.m):not(.nl){background:var(--pr);color:var(--on);margin-left:6px}
nav#nav a.b.m{background:var(--ink);color:#fff;margin-left:2px}
a.b,button{border-radius:99px;padding:11px 22px;font:700 15px var(--fd)}
a.b.o,button.o{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--pr) 50%,transparent)}
.app{max-width:1280px;grid-template-columns:262px minmax(0,1fr)}
.app:has(.hband){grid-template-columns:minmax(0,1fr);max-width:none}
.app:has(.hband) #side{display:none}.app:has(.hband) main{max-width:none;padding:0}
main{max-width:940px;padding:32px clamp(16px,4vw,48px) 90px}
#side{padding:24px 14px 20px 20px}

.pb{border-radius:16px;box-shadow:var(--sh)}

<script>
const CH1={t:"Chapter 1: States of Matter (Cambridge 0620)",notes:`
<span class="tag">Topic 1.1</span><h3>Solids, liquids and gases</h3>
<p class="lg"><b>Key:</b> <span class="xt">EXT</span> = Extended (Supplement) only. No tag = Core (Extended students need it too).</p>
<p>All matter is made of tiny <b>particles</b> (atoms, molecules or ions). The <b>kinetic particle theory</b> says the particles are always moving, and that the state of a substance depends on how close the particles are, how they are arranged and how fast they move.</p>
<div class="wrap"><table><tr><th></th><th>Solid</th><th>Liquid</th><th>Gas</th></tr>
<tr><td>Arrangement</td><td>Regular pattern (lattice)</td><td>Random, touching</td><td>Random</td></tr>
<tr><td>Separation</td><td>Very close</td><td>Close</td><td>Very far apart</td></tr>
<tr><td>Movement</td><td>Vibrate about fixed positions</td><td>Slide past each other</td><td>Move quickly in all directions</td></tr>
<tr><td>Forces between particles</td><td>Strong</td><td>Weaker</td><td>Almost none</td></tr>
<tr><td>Energy</td><td>Lowest</td><td>Medium</td><td>Highest</td></tr>
<tr><td>Shape / volume</td><td>Fixed shape, fixed volume</td><td>Takes shape of container, fixed volume</td><td>Fills container, no fixed volume</td></tr>
<tr><td>Compressible?</td><td>No</td><td>Hardly</td><td>Yes, easily</td></tr>
<tr><td>Density</td><td>High</td><td>High</td><td>Low</td></tr></table></div>
<h3>Changes of state</h3>
<ul><li><b>Melting</b> (solid → liquid): heat is absorbed, particles vibrate more strongly until they break free of the lattice. It happens at the <b>melting point</b>.</li>
<li><b>Freezing</b> (liquid → solid): energy is given out as particles settle into a lattice. Same temperature as the melting point.</li>
<li><b>Boiling</b> (liquid → gas): happens throughout the liquid at the <b>boiling point</b>, so bubbles of vapour form inside it.</li>
<li><b>Evaporation</b> (liquid → gas): happens only at the surface and at any temperature below the boiling point. The fastest particles escape, so the liquid left behind cools.</li>
<li><b>Condensation</b> (gas → liquid): energy is given out as particles come closer together.</li>
<li><b>Sublimation</b> (solid → gas directly): e.g. iodine, solid carbon dioxide (dry ice). The reverse is <b>deposition</b> (gas → solid).</li></ul>
<p><b>Energy changes:</b> melting, boiling and evaporation need energy (endothermic). Freezing and condensation release energy (exothermic).</p>
<h3>Heating and cooling curves</h3>
<ul><li><span class="xt">EXT</span> Sloping parts: temperature changes because particles are speeding up (heating) or slowing down (cooling).</li>
<li><span class="xt">EXT</span> Flat parts: the substance is changing state. The energy supplied is used to overcome the forces between particles, not to raise the temperature.</li>
<li>A pure substance melts and boils at one sharp temperature. Impurities lower the melting point, raise the boiling point and make the change happen over a range.</li></ul>
<h3>Gases: temperature and pressure</h3>
<ul><li><b>Gas pressure</b> is caused by particles colliding with the walls of the container.</li>
<li><b>Heat a gas</b> (fixed volume): particles move faster, hit the walls more often and harder, so pressure increases. If the container can expand, the volume increases instead.</li>
<li><b>Increase pressure</b> on a gas (fixed temperature): particles are pushed closer together, so the volume decreases.</li><li><b>In short:</b> heating a gas at constant pressure makes its volume increase; increasing the pressure on a gas at constant temperature makes its volume decrease.</li></ul>
<h3>🔍 Going deeper: why each state behaves as it does</h3>
<ul><li><b>Solids</b> have a fixed shape and volume because the strong forces hold particles in fixed positions. They cannot flow, and they are hard to compress because there is almost no space between the particles.</li>
<li><b>Liquids</b> flow and take the shape of their container because particles can slide past each other, but they keep a fixed volume because the particles still touch and attract each other.</li>
<li><b>Gases</b> fill any container and are easy to compress because the particles are far apart and there are almost no forces between them. Gas particles move quickly in straight lines until they collide with something.</li>
<li>The <b>stronger the forces between particles</b>, the more energy is needed to separate them, so the higher the melting and boiling points.</li></ul>
<div class="wrap"><table><tr><th></th><th>Boiling</th><th>Evaporation</th></tr><tr><td>Where</td><td>Throughout the liquid (bubbles)</td><td>Only at the surface</td></tr><tr><td>Temperature</td><td>Only at the boiling point</td><td>Any temperature below the boiling point</td></tr><tr><td>Speed</td><td>Fast</td><td>Slow</td></tr><tr><td>Particles</td><td>All particles have enough energy</td><td>Only the fastest surface particles escape</td></tr></table></div>
<svg viewBox="0 0 420 210" style="width:100%;max-width:520px;display:block;margin:12px auto" role="img" aria-label="Heating curve of a pure substance"><g fill="none" stroke="currentColor" stroke-width="2"><path d="M40 10V180H400"/><path d="M40 170L90 125H150L210 80H290L350 35" stroke="#3b4fd8" stroke-width="3"/></g><g font-size="12" fill="currentColor"><text x="46" y="195">Time (energy added) →</text><text x="2" y="100" transform="rotate(-90 12 100)">Temperature</text><text x="46" y="158">solid</text><text x="96" y="117">melting</text><text x="168" y="110">liquid</text><text x="222" y="72">boiling</text><text x="320" y="56">gas</text></g></svg>
<p><span class="xt">EXT</span> <b>Reading a heating curve:</b> on the sloping parts, added energy makes the particles move faster, so the temperature rises. On the flat parts (melting and boiling), the energy goes into overcoming the forces between particles, so the temperature does not change. The cooling curve is the same shape in reverse: flat at the freezing and condensing points, because energy is released as the forces re-form.</p>
<div class="card" style="margin:12px 0"><b>🎛️ Try it: water at different temperatures</b><br><input type="range" min="-20" max="120" value="20" oninput="var t=+this.value;document.getElementById('ws').textContent=t+' °C: '+(t<0?'solid ice, particles vibrate in fixed positions':t==0?'melting point, solid and liquid together':t<100?'liquid water, particles slide past each other':t==100?'boiling point, liquid and gas together':'steam, particles far apart and moving fast')"><small id="ws">20 °C: liquid water, particles slide past each other</small></div>
<p><span class="xt">EXT</span> <b>Why pressure and temperature affect a gas (kinetic particle theory):</b> pressure comes from particles hitting the container walls. Heating makes particles faster, so they hit the walls harder and more often, and the volume expands if it can. Squeezing a gas into a smaller space makes the particles hit the walls more often, so the pressure rises; at constant temperature, doubling the pressure halves the volume.</p>
<p><b>Exam tips:</b> always mention particles (arrangement, movement, forces) in explanations. Do not say that particles themselves expand or melt; they only move further apart or faster. A pure substance has a sharp melting point; an impure one melts over a range at a lower temperature.</p>
<span class="tag">Topic 1.2</span><h3>Diffusion</h3>
<div class="card" style="margin:12px 0"><b>🎛️ Try it: diffusion and relative molecular mass</b><br><select onchange="var m={'Hydrogen':2,'Ammonia':17,'Nitrogen':28,'Oxygen':32,'Carbon dioxide':44,'Chlorine':71},g=this.value,r=Math.sqrt(32/m[g]);document.getElementById('df').textContent=g+' (Mr = '+m[g]+'): '+(m[g]<32?'lighter particles move faster, so it diffuses faster':m[g]>32?'heavier particles move slower, so it diffuses slower':'this is the reference gas')+' (about '+r.toFixed(2)+' × the rate of oxygen).'"><option>Hydrogen</option><option>Ammonia</option><option>Nitrogen</option><option selected>Oxygen</option><option>Carbon dioxide</option><option>Chlorine</option></select><p id="df" style="margin:8px 0 0">Pick a gas to compare its diffusion rate with oxygen.</p></div>
<p><b>Diffusion</b> is the net movement of particles from a region of higher concentration to a region of lower concentration, caused by their random movement. It happens in gases and liquids (particles in solids cannot move around).</p>
<ul><li>Higher temperature: particles move faster, so diffusion is faster.</li>
<li><span class="xt">EXT</span> Lower relative molecular mass (Mr): lighter particles move faster, so they diffuse faster.</li></ul>
<h3>Experiment: ammonia and hydrogen chloride</h3>
<p>Cotton wool soaked in ammonia solution is put at one end of a long glass tube and cotton wool soaked in hydrochloric acid at the other end. The gases diffuse towards each other and meet to form a white ring of ammonium chloride. The ring forms <b>closer to the hydrochloric acid end</b>, because ammonia (Mr = 17) is lighter than hydrogen chloride (Mr = 36.5) and diffuses faster.</p>
<h3>🔍 Going deeper: how diffusion works</h3>
<ul><li>Particles move randomly in all directions, but because more particles start in the high-concentration region, the <b>net movement</b> is down the concentration gradient. Diffusion stops being noticeable when the particles are spread out evenly, though they keep moving.</li>
<li>Examples in gases: the smell of perfume spreading across a room; brown bromine vapour spreading through a gas jar of air. Example in liquids: a purple potassium manganate(VII) crystal in water slowly colouring all the water.</li>
<li>Diffusion is <b>much faster in gases than in liquids</b>, because gas particles are far apart and move faster. It does not happen in solids because the particles cannot move from place to place.</li>
<li>It needs no stirring and no extra energy, only the random motion the particles already have.</li></ul>
<p><span class="xt">EXT</span> <b>Effect of relative molecular mass (Supplement):</b> at the same temperature, particles of lower Mr move faster on average. So hydrogen (Mr 2) diffuses much faster than oxygen (Mr 32), and ammonia (Mr 17) diffuses faster than hydrogen chloride (Mr 36.5). That is why the white ring of ammonium chloride forms nearer the hydrochloric acid end of the tube.</p>
<p><b>Exam tips:</b> use the phrase “net movement from a region of higher concentration to a region of lower concentration”. Say that lighter particles move faster, not that they “weigh less so they float”. When explaining the ammonia and hydrogen chloride experiment, name which gas travels further and give the reason.</p>
<div class="ext"><h4><span class="xt">EXT</span>Extended (Supplement) checklist: Chapter 1</h4><ul><li><b>Changes of state (kinetic particle theory):</b> melting – absorbed energy makes particles vibrate more until the lattice breaks; boiling – particles gain enough energy to overcome the forces between them completely; condensing and freezing – energy is released as forces re-form and particles slow down.</li>
<li><b>Heating and cooling curves:</b> a sloping line means particles are gaining (or losing) kinetic energy, so the temperature changes. A flat line is a change of state: the energy goes into breaking (or is released by forming) the forces between particles, so the average kinetic energy and the temperature stay constant.</li>
<li><b>Gas and temperature:</b> hotter gas, faster particles, more frequent and harder collisions with the walls, so pressure rises (or volume rises if the container can expand).</li>
<li><b>Gas and pressure:</b> at constant temperature a smaller volume makes particles hit the walls more often, so pressure rises. Doubling the pressure halves the volume.</li>
<li><b>Diffusion and Mr:</b> at the same temperature particles have the same average kinetic energy, so lighter particles move faster and diffuse faster. NH₃ (Mr 17) beats HCl (Mr 36.5), so the white NH₄Cl ring forms nearer the HCl end.</li></ul></div>

<span class="tag">Topic 2.1</span><h3>Elements, compounds and mixtures</h3>
<p class="lg"><b>Key:</b> <span class="xt">EXT</span> = Extended (Supplement) only. No tag = Core (Extended students need it too).</p>
<svg class="v" viewBox="0 0 400 110" role="img" aria-label="Element compound mixture"><g fill="#3b82f6"><circle cx="30" cy="30" r="12"/><circle cx="56" cy="30" r="12"/><circle cx="30" cy="56" r="12"/><circle cx="56" cy="56" r="12"/></g><g><circle cx="165" cy="30" r="12" fill="#3b82f6"/><circle cx="189" cy="30" r="9" fill="#f59e0b"/><circle cx="165" cy="62" r="12" fill="#3b82f6"/><circle cx="189" cy="62" r="9" fill="#f59e0b"/></g><g><circle cx="300" cy="30" r="12" fill="#3b82f6"/><circle cx="345" cy="42" r="9" fill="#f59e0b"/><circle cx="318" cy="64" r="12" fill="#3b82f6"/><circle cx="360" cy="76" r="9" fill="#f59e0b"/></g><text x="15" y="100">element: one type</text><text x="140" y="100">compound: bonded</text><text x="285" y="100">mixture: not bonded</text></svg>
<ul><li><b>Element:</b> a substance made of only one type of atom. It cannot be broken down into anything simpler by chemical reactions.</li>
<li><b>Compound:</b> two or more elements chemically joined in a fixed ratio. Its properties are different from the elements in it, and it can only be split up by a chemical reaction.</li>
<li><b>Mixture:</b> two or more substances that are not chemically joined. They can be separated by physical methods, the amounts can vary, and each substance keeps its own properties.</li></ul>
<p><b>Example:</b> iron and sulfur mixed together can be separated with a magnet and both still look like iron and sulfur. Heat them and they react to make iron sulfide, a compound that is not magnetic and cannot be separated with a magnet.</p>
<div class="wrap"><table><tr><th></th><th>Mixture</th><th>Compound</th></tr><tr><td>Bonding</td><td>No chemical bonds between the substances</td><td>Elements chemically bonded</td></tr><tr><td>Composition</td><td>Any proportions</td><td>Fixed ratio, with a fixed formula</td></tr><tr><td>Properties</td><td>Each substance keeps its own</td><td>Different from the elements in it</td></tr><tr><td>Separation</td><td>Physical methods (filtering, distillation, magnet)</td><td>Only by a chemical reaction</td></tr><tr><td>Energy change</td><td>Usually none</td><td>Often heat or light given out or taken in</td></tr></table></div>
<p><b>More examples:</b> air is a mixture (mainly nitrogen and oxygen); seawater is a mixture of water and salts; water is a compound of hydrogen and oxygen in a 2 : 1 ratio, nothing like the two gases it is made from. Elements are shown by symbols (one or two letters, the second in lower case, e.g. Co is cobalt but CO is a compound). <b>Exam tip:</b> never say a compound is “mixed”; say the elements are chemically combined.
<span class="tag">Topic 2.2</span><h3>Atoms and the Periodic Table</h3>
<div class="card" style="margin:12px 0"><b>🎛️ Try it: electron configuration</b><br>Proton number: <input type="range" min="1" max="20" value="11" oninput="var z=+this.value,e=['H','He','Li','Be','B','C','N','O','F','Ne','Na','Mg','Al','Si','P','S','Cl','Ar','K','Ca'][z-1],c=[2,8,8,2],s=[],r=z;for(var i=0;i<4&&r>0;i++){var n=Math.min(r,c[i]);s.push(n);r-=n}document.getElementById('ec').textContent=e+' (Z = '+z+'): '+s.join(',')+' | period '+s.length+', outer electrons: '+s[s.length-1]+(z==2||z==10||z==18?' (full shell, noble gas)':'')"><br><b id="ec">Na (Z = 11): 2,8,1 | period 3, outer electrons: 1</b></div><h3>Atomic structure</h3>
<p>An atom has a tiny, dense <b>nucleus</b> in the centre (protons and neutrons) with <b>electrons</b> moving around it in shells.</p>
<div class="wrap"><table><tr><th>Particle</th><th>Relative charge</th><th>Relative mass</th><th>Where</th></tr>
<tr><td>Proton</td><td>+1</td><td>1</td><td>Nucleus</td></tr>
<tr><td>Neutron</td><td>0</td><td>1</td><td>Nucleus</td></tr>
<tr><td>Electron</td><td>−1</td><td>about 1/1840 (almost zero)</td><td>Shells</td></tr></table></div>
<ul><li><b>Proton number (atomic number):</b> number of protons. In a neutral atom it equals the number of electrons.</li>
<li><b>Nucleon number (mass number):</b> protons + neutrons.</li>
<li>Written as ²³₁₁Na: nucleon number 23 on top, proton number 11 below. So sodium has 11 protons, 11 electrons and 23 − 11 = 12 neutrons.</li></ul>
<h3>Electronic configuration and the Periodic Table</h3>
<p>Electrons fill shells from the inside out: the first shell holds up to 2, the second up to 8 and the third up to 8 (for the first 20 elements). Sodium (11 electrons) is 2,8,1.</p>
<ul><li><b>Group number</b> = number of outer-shell electrons (Groups I to VII). Group VIII (0) has a full outer shell.</li>
<li><b>Period number</b> = number of occupied shells.</li>
<li>Noble gases are unreactive because their outer shell is already full.</li></ul>
<p>The electronic configuration of an ion is found by adding or removing electrons: Na⁺ is 2,8; Cl⁻ is 2,8,8; Al³⁺ is 2,8; O²⁻ is 2,8.</p>
<svg viewBox="0 0 200 200" style="width:100%;max-width:220px;display:block;margin:8px auto" role="img" aria-label="Sodium atom, electronic configuration 2,8,1"><g fill="none" stroke="currentColor" stroke-opacity=".5"><circle cx="100" cy="100" r="25"/><circle cx="100" cy="100" r="45"/><circle cx="100" cy="100" r="65"/></g><circle cx="100" cy="100" r="12" fill="#ef4444"/><g fill="#3b4fd8"><circle cx="125" cy="100" r="4"/><circle cx="75" cy="100" r="4"/><circle cx="145" cy="100" r="4"/><circle cx="132" cy="132" r="4"/><circle cx="100" cy="145" r="4"/><circle cx="68" cy="132" r="4"/><circle cx="55" cy="100" r="4"/><circle cx="68" cy="68" r="4"/><circle cx="100" cy="55" r="4"/><circle cx="132" cy="68" r="4"/><circle cx="165" cy="100" r="4"/></g><text x="100" y="190" font-size="12" fill="currentColor" text-anchor="middle">Sodium: 11p, 12n, electrons 2,8,1</text></svg>
<div class="wrap"><table><tr><th>Element</th><th>H</th><th>He</th><th>Li</th><th>Be</th><th>B</th><th>C</th><th>N</th><th>O</th><th>F</th><th>Ne</th></tr><tr><td>Electrons</td><td>1</td><td>2</td><td>2,1</td><td>2,2</td><td>2,3</td><td>2,4</td><td>2,5</td><td>2,6</td><td>2,7</td><td>2,8</td></tr></table><table><tr><th>Element</th><th>Na</th><th>Mg</th><th>Al</th><th>Si</th><th>P</th><th>S</th><th>Cl</th><th>Ar</th><th>K</th><th>Ca</th></tr><tr><td>Electrons</td><td>2,8,1</td><td>2,8,2</td><td>2,8,3</td><td>2,8,4</td><td>2,8,5</td><td>2,8,6</td><td>2,8,7</td><td>2,8,8</td><td>2,8,8,1</td><td>2,8,8,2</td></tr></table></div>
<p><b>Working it out:</b> ⁴⁰₂₀Ca has 20 protons, 20 electrons and 40 − 20 = 20 neutrons; its configuration is 2,8,8,2, so it is in Group II (2 outer electrons) and Period 4 (4 shells). <b>Exam tip:</b> an atom has equal protons and electrons; an ion does not, so always adjust the electron count by the charge.
<span class="tag">Topic 2.3</span><h3>Isotopes</h3>
<svg class="v" viewBox="0 0 400 120" role="img" aria-label="Carbon isotopes"><circle cx="100" cy="50" r="40" class="l"/><circle cx="100" cy="50" r="14" fill="#ef4444"/><circle cx="300" cy="50" r="40" class="l"/><circle cx="300" cy="50" r="18" fill="#ef4444"/><text x="45" y="110">¹²C: 6 p, 6 n, 6 e⁻</text><text x="245" y="110">¹⁴C: 6 p, 8 n, 6 e⁻</text></svg>
<p><b>Isotopes</b> are atoms of the same element (same proton number) with different numbers of neutrons, so different nucleon numbers. Examples: carbon-12 and carbon-14, chlorine-35 and chlorine-37.</p>
<ul><li>Symbols show the nucleon number (top) and proton number (bottom): ¹²₆C is carbon-12. Ions are written the same way: ³⁵₁₇Cl⁻ has 17 protons, 18 neutrons and 18 electrons.</li><li><span class="xt">EXT</span> Same number of electrons, so the <b>same chemical properties</b>.</li>
<li>Different masses, so slightly different physical properties such as density.</li>
<li><b>Relative atomic mass (Ar)</b> is the average mass of an element’s isotopes, taking their abundance into account, compared with 1/12 of the mass of a carbon-12 atom.</li>
<li><span class="xt">EXT</span> <b>Worked example:</b> chlorine is 75% ³⁵Cl and 25% ³⁷Cl, so Ar = (35 × 75 + 37 × 25) ÷ 100 = 35.5.</li>
<li><span class="xt">EXT</span> <b>Second example:</b> copper is 69% ⁶³Cu and 31% ⁶⁵Cu, so Ar = (63 × 69 + 65 × 31) ÷ 100 = 63.6. Ar is rarely a whole number because it is an average of isotopes.</li>
<li>Carbon-12 has 6 protons, 6 neutrons, 6 electrons; carbon-14 has 6 protons, 8 neutrons, 6 electrons. Chlorine-35 has 18 neutrons; chlorine-37 has 20.</li>
<li><span class="xt">EXT</span> <b>Exam tip:</b> isotopes differ only in neutrons. They have the same chemical properties because they have the same electrons, and slightly different physical properties because their masses differ.</li>
</ul>
<span class="tag">Topic 2.4</span><h3>Ions and ionic bonds</h3>
<p>An <b>ion</b> is a charged particle formed when an atom loses or gains electrons to get a full outer shell.</p>
<ul><li>Metals lose electrons and form positive ions (<b>cations</b>). Non-metals gain electrons and form negative ions (<b>anions</b>).</li>
<li>Typical charges: Group I +1, Group II +2, Group III +3, Group VI −2, Group VII −1.</li>
<li>Common compound ions: hydroxide OH⁻, nitrate NO₃⁻, carbonate CO₃²⁻, sulfate SO₄²⁻, ammonium NH₄⁺.</li></ul>
<p>An <b>ionic bond</b> is the strong electrostatic attraction between oppositely charged ions. <b>Sodium chloride:</b> sodium (2,8,1) gives one electron to chlorine (2,8,7). This makes Na⁺ (2,8) and Cl⁻ (2,8,8), which pack into a giant ionic lattice: a regular arrangement of alternating positive and negative ions. <b>Dot-and-cross diagram:</b> show the one outer electron of sodium (a dot) moving to the outer shell of chlorine (crosses), then draw each ion in square brackets with its charge, [Na]⁺ and [Cl]⁻, each with a full outer shell. In magnesium oxide, Mg²⁺ and O²⁻ form in the same way, with two electrons transferred.</p>
<p><b>Properties of ionic compounds:</b> high melting and boiling points (strong forces need lots of energy to overcome); do not conduct when solid (ions fixed in place) but conduct when molten or dissolved in water (ions free to move); usually dissolve in water; brittle.</p>
<svg viewBox="0 0 170 125" style="width:100%;max-width:200px;display:block;margin:8px auto" role="img" aria-label="Ionic lattice of alternating positive and negative ions"><g fill="#ef4444"><circle cx="30" cy="25" r="11"/><circle cx="102" cy="25" r="11"/><circle cx="66" cy="61" r="11"/><circle cx="138" cy="61" r="11"/><circle cx="30" cy="97" r="11"/><circle cx="102" cy="97" r="11"/></g><g fill="#3b4fd8"><circle cx="66" cy="25" r="14"/><circle cx="138" cy="25" r="14"/><circle cx="30" cy="61" r="14"/><circle cx="102" cy="61" r="14"/><circle cx="66" cy="97" r="14"/><circle cx="138" cy="97" r="14"/></g></svg>
<p style="text-align:center;font-size:13px">Giant ionic lattice: alternating positive (red) and negative (blue) ions.</p>
<ul><li><span class="xt">EXT</span> <b>Magnesium oxide:</b> Mg (2,8,2) loses 2 electrons to form Mg²⁺ (2,8); O (2,6) gains 2 to form O²⁻ (2,8). <b>Calcium chloride:</b> Ca (2,8,8,2) gives one electron to each of two Cl atoms, forming Ca²⁺ and 2Cl⁻, so the formula is CaCl₂.</li>
<li><span class="xt">EXT</span> <b>Formula from charges:</b> Na⁺ + Cl⁻ = NaCl; Mg²⁺ + 2Cl⁻ = MgCl₂; Al³⁺ + 3Cl⁻ = AlCl₃; 2Na⁺ + O²⁻ = Na₂O.</li>
<li><span class="xt">EXT</span> <b>Explaining the properties (Supplement):</b> each ion is held by strong attraction to many oppositely charged neighbours in all directions, so a lot of energy is needed to separate them (high melting point). When solid, the ions vibrate in fixed positions so no charge can flow; when molten or dissolved they are free to move and carry the current.</li>
<li><b>Exam tip:</b> in a dot-and-cross diagram for an ionic compound, draw electrons transferred, show square brackets and the charge on each ion, and show full outer shells.</li></ul>
<span class="tag">Topic 2.5</span><h3>Simple molecules and covalent bonds</h3>
<svg class="v" viewBox="0 0 400 120" role="img" aria-label="Water molecule"><circle cx="150" cy="40" r="26" fill="#ef4444" fill-opacity=".7"/><circle cx="105" cy="82" r="18" fill="#3b82f6" fill-opacity=".7"/><circle cx="195" cy="82" r="18" fill="#3b82f6" fill-opacity=".7"/><text x="144" y="45">O</text><text x="100" y="87">H</text><text x="190" y="87">H</text><text x="240" y="50">overlap = shared pair</text><text x="240" y="68">of electrons (covalent)</text></svg>
<p>A <b>covalent bond</b> is a shared pair of electrons between two non-metal atoms, giving each a full outer shell.</p>
<ul><li>Single bonds: H₂, Cl₂, HCl, H₂O, NH₃, CH₄. Double bonds: O₂, CO₂. Triple bond: N₂.</li>
<li>Simple molecular substances have <b>low melting and boiling points</b>, because only the weak <b>forces between molecules</b> are overcome, not the strong covalent bonds inside them.</li>
<li>They <b>do not conduct electricity</b>, because they have no ions or free electrons, and most do not dissolve in water.</li></ul>
<h3>Dot-and-cross diagrams: what to show</h3>
<p>Draw only the outer-shell electrons. Each shared pair sits in the overlap between two atoms, and every atom ends with a full outer shell (2 for hydrogen, 8 for the others).</p>
<div class="wrap"><table><tr><th>Molecule</th><th>Bonds (shared pairs)</th><th>Non-bonding pairs</th></tr>
<tr><td>H₂</td><td>1 single</td><td>None</td></tr><tr><td>Cl₂</td><td>1 single</td><td>3 on each Cl</td></tr><tr><td>HCl</td><td>1 single</td><td>3 on Cl</td></tr>
<tr><td>H₂O</td><td>2 single (O–H)</td><td>2 on O</td></tr><tr><td>NH₃</td><td>3 single (N–H)</td><td>1 on N</td></tr><tr><td>CH₄</td><td>4 single (C–H)</td><td>None</td></tr>
<tr><td><span class="xt">EXT</span> O₂</td><td>1 double</td><td>2 on each O</td></tr><tr><td><span class="xt">EXT</span> N₂</td><td>1 triple</td><td>1 on each N</td></tr><tr><td><span class="xt">EXT</span> CO₂</td><td>2 double (O=C=O)</td><td>2 on each O</td></tr>
<tr><td><span class="xt">EXT</span> C₂H₄</td><td>1 double C=C and 4 single C–H</td><td>None</td></tr><tr><td><span class="xt">EXT</span> CH₃OH</td><td>3 C–H, 1 C–O, 1 O–H</td><td>2 on O</td></tr></table></div>
<p><b>How to draw a dot-and-cross diagram (water):</b> oxygen has 6 outer electrons and needs 2 more; each hydrogen has 1 and needs 1 more. So oxygen shares one pair with each hydrogen. Draw the oxygen’s two shared pairs in the overlaps, then its two non-bonding pairs; check that oxygen has 8 and each hydrogen has 2. For methane, carbon (4 outer electrons) forms four single bonds with four hydrogens. For nitrogen, each N (5 outer electrons) shares three pairs, leaving one non-bonding pair on each.</p>
<ul><li><b>Examples of simple molecular substances:</b> water, methane, carbon dioxide, iodine, ammonia. Many are gases or liquids at room temperature because the intermolecular forces are weak.</li>
<li><span class="xt">EXT</span> <b>Explaining the properties (Supplement):</b> when a simple molecular substance melts or boils, the <b>weak intermolecular forces</b> between molecules are overcome, not the strong covalent bonds inside each molecule, so little energy is needed. It does not conduct because the molecules are neutral, with no ions and no free electrons.</li>
<li><b>Common mistake:</b> do not write that covalent bonds break when a simple molecular substance melts or boils.</li></ul>
<span class="tag">Topic 2.6</span><h3>Giant covalent structures</h3>
<svg class="v" viewBox="0 0 400 130" role="img" aria-label="Diamond and graphite"><g class="l"><path d="M80 60L35 25M80 60L125 25M80 60L35 100M80 60L125 100"/><polygon points="270,25 300,10 330,25 330,50 300,65 270,50"/><polygon points="270,85 300,70 330,85 330,110 300,125 270,110"/></g><path d="M300 65V70" stroke="#ef4444" stroke-dasharray="3"/><text x="40" y="125">diamond: 4 bonds each</text><text x="250" y="130" style="font-size:11px">graphite: layers slide</text></svg>
<ul><li><b>Diamond:</b> each carbon bonded to four others. Very hard, very high melting point, does not conduct. Used in cutting tools.</li>
<li><b>Graphite:</b> each carbon bonded to three others in flat layers. Weak forces between layers let them slide, so it is soft and slippery (a lubricant). It conducts electricity because each atom has a free (delocalised) electron, so it is used as an electrode. High melting point.</li>
<li><span class="xt">EXT</span> <b>Silicon(IV) oxide (SiO₂):</b> each silicon bonded to four oxygens. Hard, high melting point, does not conduct. It is the main part of sand. Its properties are similar to diamond because both are giant covalent structures: every atom is held in a 3D network by strong covalent bonds, so a lot of energy is needed to break it apart, and there are no free electrons or ions.</li>
<li>Diamond and graphite are <b>allotropes</b> of carbon: different structures of the same element.</li></ul>
<div class="wrap"><table><tr><th></th><th>Diamond</th><th>Graphite</th><th>Silicon(IV) oxide</th></tr><tr><td>Bonds per atom</td><td>C bonded to 4 C</td><td>C bonded to 3 C</td><td>Si bonded to 4 O, each O to 2 Si</td></tr><tr><td>Structure</td><td>3D network</td><td>Layers of hexagons</td><td>3D network</td></tr><tr><td>Hardness</td><td>Very hard</td><td>Soft, slippery</td><td>Hard</td></tr><tr><td>Conducts?</td><td>No (no free electrons)</td><td>Yes (delocalised electrons)</td><td>No</td></tr><tr><td>Use</td><td>Cutting tools</td><td>Lubricant, electrodes</td><td>Sand, glass-making</td></tr></table></div>
<p><b>Why:</b> in diamond every outer electron is in a strong covalent bond, so it is rigid and does not conduct. In graphite the layers are held together by weak forces so they slide, and the fourth electron on each carbon is free to move along the layer. <b>Exam tip:</b> explain graphite’s conduction with “delocalised electrons”, and its softness with “weak forces between layers”.
<span class="tag">Topic 2.7</span><h3>Metallic bonding</h3>
<p>A metal is a lattice of positive ions surrounded by a “sea” of <b>delocalised electrons</b>. The attraction between the ions and the electrons is the <b>metallic bond</b>.</p>
<ul><li><span class="xt">EXT</span> Conduct electricity and heat, because delocalised electrons can move.</li>
<li><span class="xt">EXT</span> Malleable and ductile, because layers of ions can slide over each other without breaking the bonding.</li>
<li>High melting and boiling points, because the metallic bonds are strong.</li></ul>
<svg viewBox="0 0 200 90" style="width:100%;max-width:260px;display:block;margin:8px auto" role="img" aria-label="Metal lattice with sea of delocalised electrons"><g fill="#ef4444"><circle cx="30" cy="25" r="12"/><circle cx="80" cy="25" r="12"/><circle cx="130" cy="25" r="12"/><circle cx="180" cy="25" r="12"/><circle cx="30" cy="65" r="12"/><circle cx="80" cy="65" r="12"/><circle cx="130" cy="65" r="12"/><circle cx="180" cy="65" r="12"/></g><g fill="#3b4fd8"><circle cx="55" cy="45" r="3"/><circle cx="105" cy="45" r="3"/><circle cx="155" cy="45" r="3"/><circle cx="55" cy="10" r="3"/><circle cx="105" cy="10" r="3"/><circle cx="155" cy="10" r="3"/><circle cx="55" cy="80" r="3"/><circle cx="105" cy="80" r="3"/><circle cx="155" cy="80" r="3"/></g></svg>
<p style="text-align:center;font-size:13px">Positive metal ions (red) in a sea of delocalised electrons (blue).</p>
<p><span class="xt">EXT</span> The delocalised electrons are free to move, so they carry electric charge and transfer thermal energy. When a force is applied, the layers of ions slide but the sea of electrons keeps holding them together, so metals bend (<b>malleable</b>) and can be drawn into wires (<b>ductile</b>) without breaking.</p>
<div class="wrap"><table><tr><th>Type</th><th>Example</th><th>Melting point</th><th>Conducts?</th></tr><tr><td>Giant ionic</td><td>NaCl</td><td>High</td><td>Only molten or dissolved</td></tr><tr><td>Simple molecular</td><td>H₂O, CO₂</td><td>Low</td><td>No</td></tr><tr><td>Giant covalent</td><td>Diamond, SiO₂</td><td>Very high</td><td>No (graphite is the exception)</td></tr><tr><td>Metallic</td><td>Cu, Fe</td><td>Usually high</td><td>Yes, solid and liquid</td></tr></table></div>
<div class="ext"><h4><span class="xt">EXT</span>Extended (Supplement) checklist: Chapter 2</h4><ul><li><b>Isotopes:</b> same chemical properties because the same number of electrons, so the same electronic configuration. Ar = Σ(mass × % abundance) ÷ 100, e.g. chlorine 35.5.</li>
<li><b>Ionic lattice:</b> a regular arrangement of alternating positive and negative ions. Draw dot-and-cross diagrams for metal + non-metal compounds such as MgO, CaCl₂ and Na₂O, with square brackets and charges.</li>
<li><b>Ionic properties explained:</b> high melting and boiling points because many strong attractions in all directions need a lot of energy to overcome; poor conductor when solid because the ions are fixed; good conductor when molten or aqueous because the ions are free to move.</li>
<li><b>Covalent molecules (Supplement set):</b> CH₃OH, C₂H₄, O₂ (double bond), CO₂ (two double bonds), N₂ (triple bond), drawn as dot-and-cross diagrams.</li>
<li><b>Simple molecular properties explained:</b> low melting and boiling points because only the weak intermolecular forces are overcome, not the covalent bonds; poor conductors because there are no ions or free electrons.</li>
<li><b>SiO₂:</b> giant covalent, each Si bonded to four O and each O to two Si. Like diamond it is very hard, has a very high melting point and does not conduct, because every atom is held in a 3D network of strong covalent bonds.</li>
<li><b>Metals explained:</b> conduct because delocalised electrons move and carry charge; malleable and ductile because layers of ions slide while the electron sea keeps holding them together.</li></ul></div>

<span class="tag">Topic 3.1</span><h3>Formulae</h3>
<p class="lg"><b>Key:</b> <span class="xt">EXT</span> = Extended (Supplement) only. No tag = Core (Extended students need it too).</p>
<div class="card" style="margin:12px 0"><b>🎛️ Try it: build an ionic formula</b><br><select id="ca"><option value="Na,1">Na⁺</option><option value="Mg,2">Mg²⁺</option><option value="Al,3">Al³⁺</option><option value="Ca,2">Ca²⁺</option></select> + <select id="an"><option value="Cl,1,0">Cl⁻</option><option value="O,2,0">O²⁻</option><option value="SO₄,2,1">SO₄²⁻</option><option value="NO₃,1,1">NO₃⁻</option><option value="OH,1,1">OH⁻</option></select> <button onclick="var a=document.getElementById('ca').value.split(','),b=document.getElementById('an').value.split(','),q=+a[1],r=+b[1],d=(function g(m,n){return n?g(n,m%n):m})(q,r),i=r/d,j=q/d,s=function(n){return n>1?String(n).split('').map(function(c){return '₀₁₂₃₄₅₆₇₈₉'[c]}).join(''):''};document.getElementById('fb').textContent=a[0]+s(i)+(b[2]=='1'&&j>1?'('+b[0]+')':b[0])+s(j)+': total + charge = total − charge'">Build</button><p id="fb" style="margin:8px 0 0"></p></div>
<ul><li>A <b>formula</b> shows which elements are in a substance and in what ratio. Elements: Na, Fe, O₂, Cl₂ (diatomic: H₂, N₂, O₂, F₂, Cl₂, Br₂, I₂).</li>
<li><span class="xt">EXT</span> <b>Ionic compounds:</b> swap the charges so the total + and − cancel. Ca²⁺ and OH⁻ give Ca(OH)₂. Al³⁺ and SO₄²⁻ give Al₂(SO₄)₃. Use brackets when more than one compound ion is needed.</li>
<li>Name endings: “-ide” for two elements (sodium chloride), “-ate” when oxygen is present (calcium carbonate).</li><li><b>From a model or diagram:</b> count the atoms of each element in one molecule and write the numbers as subscripts. One N atom joined to three H atoms is NH₃. The <b>molecular formula</b> is the number and type of different atoms in one molecule.</li></ul>
<h3>Equations</h3>
<ul><li><b>Word equation:</b> uses names only, e.g. magnesium + oxygen → magnesium oxide. <b>Symbol equation:</b> uses formulae, e.g. 2Mg + O₂ → 2MgO.</li>
<li>Atoms are never created or destroyed in a reaction (law of conservation of mass), so both sides must have the same number of each atom.</li>
<li><b>Balance</b> by changing the big numbers in front of formulae, never the small numbers inside them. Example: 4Al + 3O₂ → 2Al₂O₃.</li>
<li><b>State symbols:</b> (s) solid, (l) liquid, (g) gas, (aq) dissolved in water.</li>
<li><span class="xt">EXT</span> <b>Ionic equations</b> show only the ions that react. Silver nitrate + sodium chloride: Ag⁺(aq) + Cl⁻(aq) → AgCl(s). The other ions are <b>spectator ions</b>.</li><li><span class="xt">EXT</span> <b>Deducing an equation from information (Supplement):</b> write the correct formulae for the reactants and products named, balance it, then add state symbols. Example: sodium hydroxide solution + hydrochloric acid → NaOH(aq) + HCl(aq) → NaCl(aq) + H₂O(l).</li></ul>
<h3>🔍 Going deeper: formulae and equations</h3>
<div class="wrap"><table><tr><th>Substance</th><th>Formula</th><th>Substance</th><th>Formula</th></tr><tr><td>Water</td><td>H₂O</td><td>Sodium hydroxide</td><td>NaOH</td></tr><tr><td>Carbon dioxide</td><td>CO₂</td><td>Calcium carbonate</td><td>CaCO₃</td></tr><tr><td>Ammonia</td><td>NH₃</td><td>Calcium hydroxide</td><td>Ca(OH)₂</td></tr><tr><td>Methane</td><td>CH₄</td><td>Copper(II) sulfate</td><td>CuSO₄</td></tr><tr><td>Hydrochloric acid</td><td>HCl</td><td>Magnesium oxide</td><td>MgO</td></tr><tr><td>Sulfuric acid</td><td>H₂SO₄</td><td>Nitric acid</td><td>HNO₃</td></tr></table></div>
<p><b>Balancing method:</b> (1) write the correct formula for every substance; (2) count the atoms of each element on both sides; (3) balance one element at a time using numbers in front; (4) leave hydrogen and oxygen until last; (5) recount to check.</p>
<div class="f">Fe + O₂ → Fe₂O₃  becomes  4Fe + 3O₂ → 2Fe₂O₃</div><div class="f">CH₄ + O₂ → CO₂ + H₂O  becomes  CH₄ + 2O₂ → CO₂ + 2H₂O</div><div class="f">C₃H₈ + O₂ → CO₂ + H₂O  becomes  C₃H₈ + 5O₂ → 3CO₂ + 4H₂O</div>
<p><span class="xt">EXT</span> <b>Writing an ionic equation:</b> write the full equation with state symbols; split every aqueous ionic compound into its ions; cancel the ions that appear unchanged on both sides (spectator ions); write what is left. Example: CuSO₄(aq) + 2NaOH(aq) → Cu(OH)₂(s) + Na₂SO₄(aq) gives <b>Cu²⁺(aq) + 2OH⁻(aq) → Cu(OH)₂(s)</b>. Neutralisation gives H⁺(aq) + OH⁻(aq) → H₂O(l).</p>
<p><span class="xt">EXT</span> <b>Empirical formula (Supplement):</b> the simplest whole-number ratio of atoms or ions. Glucose has molecular formula C₆H₁₂O₆ and empirical formula CH₂O. For an ionic compound the formula is already the empirical formula, e.g. NaCl.</p>
<p><b>Exam tips:</b> never change the small numbers inside a formula when balancing; state symbols are part of the answer when asked for them; check the charges add up to zero when writing an ionic formula.</p>
<span class="tag">Topic 3.2</span><h3>Relative masses of atoms and molecules</h3>
<div class="card" style="margin:12px 0"><b>🎛️ Try it: work out M<sub>r</sub></b><br><select onchange="document.getElementById('mr').textContent=this.value"><option value="Pick a compound">Pick a compound</option><option>H₂O: (2 × 1) + 16 = 18</option><option>CO₂: 12 + (2 × 16) = 44</option><option>NH₃: 14 + (3 × 1) = 17</option><option>CaCO₃: 40 + 12 + (3 × 16) = 100</option><option>H₂SO₄: (2 × 1) + 32 + (4 × 16) = 98</option></select><p id="mr" style="margin:8px 0 0">Relative molecular mass = sum of the relative atomic masses.</p></div>
<ul><li><b>Ar</b> is the relative atomic mass of an element (see Chapter 2).</li>
<li><b>Mr</b> (relative molecular mass) is the sum of the Ar values of all the atoms in a molecule. For ionic compounds it is called the <b>relative formula mass</b> and is found in the same way.</li>
<li>H₂SO₄: 2×1 + 32 + 4×16 = <b>98</b>. Ca(OH)₂: 40 + 2×(16 + 1) = <b>74</b>. CuSO₄·5H₂O: 64 + 32 + 64 + 5×18 = <b>250</b>.</li></ul>
<p><b>Reacting masses in simple proportions</b> (no moles needed): 2Mg + O₂ → 2MgO. 2 × 24 = 48 g of Mg makes 2 × 40 = 80 g of MgO, so 12 g of Mg makes 12 ÷ 48 × 80 = 20 g of MgO.</p>
<h3>🔍 Going deeper: relative masses</h3>
<ul><li><b>Ar values</b> are given on the Periodic Table in the exam, so you never need to memorise them. Use 35.5 for chlorine as given.</li>
<li><b>Mr of a molecule:</b> add the Ar of every atom in the formula. Check the subscripts: H₂ has Mr 2, not 1; O₂ has Mr 32. Brackets multiply everything inside: Ca(OH)₂ has two O and two H.</li></ul>
<p><b>Reacting masses method:</b> (1) balance the equation; (2) work out the Mr of the two substances in the question; (3) multiply each Mr by the number in front of it; (4) scale the masses up or down in proportion.</p>
<p><b>Worked example:</b> CaCO₃ → CaO + CO₂. Mr: CaCO₃ = 100, CaO = 56, CO₂ = 44. So 100 g of calcium carbonate gives 56 g of calcium oxide and 44 g of carbon dioxide (56 + 44 = 100, so mass is conserved). 25 g of CaCO₃ gives 25 ÷ 100 × 56 = 14 g of CaO.</p>
<p><b>Common mistakes:</b> forgetting to multiply by the number in front of a formula; mixing up which substance is the known and which is the unknown; giving Mr a unit (it has none).</p>
<span class="tag">Topic 3.3</span><h3>The mole and the Avogadro constant</h3>
<p><span class="xt">EXT</span> One <b>mole</b> is the amount of substance containing 6.02 × 10²³ particles (the <b>Avogadro constant</b>). The mass of one mole in grams equals the Mr (or Ar). So 1 mol of water is 18 g.</p>
<div class="f">moles = mass (g) ÷ Mr</div>
<p><span class="xt">EXT</span> <b>Example:</b> 4.0 g of NaOH (Mr 40) is 4.0 ÷ 40 = 0.10 mol.</p>
<div class="f">mass = moles × Mr</div><div class="f">Mr (molar mass, g/mol) = mass ÷ moles</div><div class="f">number of particles = moles × 6.02 × 10²³</div>
<p><span class="xt">EXT</span> <b>Example:</b> 0.50 mol of water contains 0.50 × 6.02 × 10²³ = 3.01 × 10²³ molecules.</p>
<h3>Reacting masses</h3>
<p><span class="xt">EXT</span> Use the balanced equation: the numbers in front are the mole ratio. <b>Method:</b> (1) moles of the substance you know, (2) use the ratio to get moles of the one you want, (3) convert to mass.</p>
<p><span class="xt">EXT</span> <b>Example:</b> CaCO₃ → CaO + CO₂. From 50 g CaCO₃ (Mr 100): 50 ÷ 100 = 0.50 mol. Ratio 1:1, so 0.50 mol CaO. Mass = 0.50 × 56 = <b>28 g</b>.</p>
<h3>Gas volumes</h3>
<ul><li><span class="xt">EXT</span> <b>Avogadro’s law:</b> equal volumes of gases at the same temperature and pressure contain the same number of molecules.</li>
<li><span class="xt">EXT</span> At room temperature and pressure (rtp), <b>1 mole of any gas occupies 24 dm³</b>.</li>
<li><span class="xt">EXT</span> Volume ratios follow mole ratios: 2H₂ + O₂ → 2H₂O (steam) uses 2 volumes of hydrogen with 1 volume of oxygen.</li></ul>
<div class="f">volume (dm³) = moles × 24</div>
<p><span class="xt">EXT</span> <b>Example:</b> Mg + 2HCl → MgCl₂ + H₂. 2.4 g Mg (Ar 24) = 0.10 mol, which makes 0.10 mol H₂ = 0.10 × 24 = <b>2.4 dm³</b>.</p>
<h3>Concentration and titration</h3>
<div class="f">concentration (mol/dm³) = moles ÷ volume (dm³)</div><div class="f">concentration (g/dm³) = concentration (mol/dm³) × Mr</div>
<p><span class="xt">EXT</span> Convert cm³ to dm³ by dividing by 1000. <b>Example:</b> 0.5 mol in 250 cm³ = 0.5 ÷ 0.25 = 2.0 mol/dm³.</p>
<p><span class="xt">EXT</span> <b>Titration example:</b> 25.0 cm³ of 0.100 mol/dm³ NaOH is neutralised by 20.0 cm³ of HCl (NaOH + HCl → NaCl + H₂O, ratio 1:1). Moles NaOH = 0.0250 × 0.100 = 0.00250. Concentration of HCl = 0.00250 ÷ 0.0200 = <b>0.125 mol/dm³</b>.</p>
<h3>Empirical and molecular formulae</h3>
<ul><li><span class="xt">EXT</span> <b>Empirical formula:</b> the simplest whole-number ratio of atoms. <b>Molecular formula:</b> the actual number of atoms in a molecule.</li>
<li><span class="xt">EXT</span> <b>Method:</b> divide each % (or mass) by its Ar, then divide all by the smallest, then make whole numbers.</li>
<li><span class="xt">EXT</span> <b>Example:</b> 80% C, 20% H. C: 80 ÷ 12 = 6.67; H: 20 ÷ 1 = 20. Ratio 1 : 3, so the empirical formula is CH₃ (Mr 15). If the compound’s Mr is 30, then 30 ÷ 15 = 2, so the molecular formula is C₂H₆.</li></ul>
<h3>Yield, purity and limiting reactant</h3>
<div class="f">% yield = actual mass ÷ theoretical mass × 100</div><div class="f">% purity = mass of pure substance ÷ mass of sample × 100</div>
<ul><li><span class="xt">EXT</span> <b>Percentage composition by mass:</b> % of an element = (number of atoms × Ar) ÷ Mr × 100. For nitrogen in NH₃ (Mr 17): 14 ÷ 17 × 100 = 82.4%.</li><li><span class="xt">EXT</span> Example: theoretical 28 g, actual 21 g gives 21 ÷ 28 × 100 = <b>75%</b> yield.</li>
<li><span class="xt">EXT</span> The <b>limiting reactant</b> is the one that runs out first and decides how much product forms. Example: 0.20 mol Mg and 0.30 mol HCl; Mg + 2HCl needs 0.40 mol HCl, so HCl is limiting and gives 0.15 mol H₂.</li></ul>
<h3>🔍 Going deeper: the mole map and worked examples</h3>
<p><span class="xt">EXT</span> A mole is a counting unit, like a dozen, but for huge numbers of tiny particles: 1 mol contains 6.02 × 10²³ particles. Everything in this topic goes through moles.</p>
<svg viewBox="0 0 470 210" style="width:100%;max-width:560px;display:block;margin:10px auto" role="img" aria-label="Mole map linking moles to mass, gas volume, particles and solutions"><g fill="none" stroke="currentColor" stroke-width="2"><circle cx="235" cy="105" r="34" stroke="#3b4fd8"/><rect x="8" y="85" width="110" height="40" rx="8"/><rect x="352" y="85" width="110" height="40" rx="8"/><rect x="150" y="6" width="170" height="34" rx="8"/><rect x="135" y="168" width="200" height="34" rx="8"/><path d="M118 105H201M269 105H352M235 71V40M235 139V168"/></g><g font-size="11" fill="currentColor" text-anchor="middle"><text x="235" y="109" font-weight="bold">moles</text><text x="63" y="102">mass (g)</text><text x="63" y="117">mass = mol × Mr</text><text x="407" y="102">gas volume</text><text x="407" y="117">V = mol × 24 dm³</text><text x="235" y="27">particles = mol × 6.02×10²³</text><text x="235" y="189">mol = conc (mol/dm³) × volume (dm³)</text></g></svg>
<div class="card" style="margin:12px 0"><b>🎛️ Try it: moles from mass</b><input id="mm" type="number" min="0" step="any" placeholder="mass in g" oninput="var m=+document.getElementById('mm').value,r=+document.getElementById('mr').value;document.getElementById('mo').textContent=(m>0&&r>0)?'moles = '+m+' ÷ '+r+' = '+(m/r).toPrecision(3)+' mol':'Enter a mass and an Mr'"><input id="mr" type="number" min="0" step="any" placeholder="Mr (e.g. 40 for NaOH)" oninput="var m=+document.getElementById('mm').value,r=+document.getElementById('mr').value;document.getElementById('mo').textContent=(m>0&&r>0)?'moles = '+m+' ÷ '+r+' = '+(m/r).toPrecision(3)+' mol':'Enter a mass and an Mr'"><small id="mo">Enter a mass and an Mr</small></div>
<ul><li><span class="xt">EXT</span> <b>Particles:</b> 12 g of carbon (Ar 12) is 1.0 mol, which contains 6.02 × 10²³ atoms.</li>
<li><span class="xt">EXT</span> <b>Gas volume to mass:</b> 6.0 dm³ of CO₂ at r.t.p. = 6.0 ÷ 24 = 0.25 mol; mass = 0.25 × 44 = 11 g.</li>
<li><span class="xt">EXT</span> <b>Concentration in g/dm³:</b> 0.10 mol/dm³ NaOH × 40 = 4.0 g/dm³.</li>
<li><span class="xt">EXT</span> <b>Titration with a 1 : 2 ratio:</b> H₂SO₄ + 2NaOH → Na₂SO₄ + 2H₂O. 25.0 cm³ of 0.100 mol/dm³ NaOH needs 12.5 cm³ of acid. Moles NaOH = 0.0250 × 0.100 = 0.00250; moles H₂SO₄ = 0.00250 ÷ 2 = 0.00125; concentration = 0.00125 ÷ 0.0125 = <b>0.100 mol/dm³</b>.</li>
<li><span class="xt">EXT</span> <b>Empirical formula from masses:</b> 5.6 g Fe and 2.4 g O. Fe: 5.6 ÷ 56 = 0.10; O: 2.4 ÷ 16 = 0.15. Ratio 0.10 : 0.15 = 2 : 3, so the empirical formula is <b>Fe₂O₃</b>.</li>
<li><span class="xt">EXT</span> <b>Percentage yield:</b> 10 g CaCO₃ can give at most 10 ÷ 100 × 56 = 5.6 g CaO. If 4.2 g is obtained, yield = 4.2 ÷ 5.6 × 100 = <b>75%</b>.</li>
<li><span class="xt">EXT</span> <b>Percentage purity:</b> a 5.0 g sample contains 4.5 g of pure substance, so purity = 4.5 ÷ 5.0 × 100 = <b>90%</b>.</li></ul>
<p><b>Exam tips:</b> convert cm³ to dm³ early (÷ 1000); show every step and units; the number in front of a formula in the equation gives the mole ratio; round only the final answer. The limiting reactant decides the amount of product, so work from it.</p>
<div class="ext"><h4><span class="xt">EXT</span>Extended (Supplement) checklist: Chapter 3</h4><ul><li><b>Empirical formula:</b> the simplest whole-number ratio of atoms or ions (glucose C₆H₁₂O₆ → CH₂O). Molecular formula = empirical formula × (Mr ÷ empirical mass).</li>
<li><b>Ionic formulae and equations:</b> balance charges (Al³⁺ + SO₄²⁻ → Al₂(SO₄)₃). Ionic equations: split aqueous ionic compounds into ions and cancel spectator ions. Be ready to deduce a full symbol equation with state symbols from the information given.</li>
<li><b>The mole:</b> 1 mol = 6.02 × 10²³ particles. n = m ÷ Mr; m = n × Mr; Mr = m ÷ n; particles = n × 6.02 × 10²³.</li>
<li><b>Gases:</b> V (dm³) = n × 24 at r.t.p.; n = V ÷ 24.</li>
<li><b>Solutions:</b> c (mol/dm³) = n ÷ V (dm³); c (g/dm³) = c (mol/dm³) × Mr; cm³ ÷ 1000 = dm³.</li>
<li><b>Titration:</b> moles of the known solution → mole ratio from the equation → moles, then concentration or volume of the unknown.</li>
<li><b>Other calculations:</b> limiting reactant (the one that runs out first decides the product); % yield = actual ÷ theoretical × 100; % purity = pure mass ÷ sample mass × 100; % by mass of an element = (atoms × Ar) ÷ Mr × 100.</li></ul></div>

const CH4={t:"Chapter 4: Electrochemistry (Cambridge 0620)",notes:`
<span class="tag">Topic 4.1</span><h3>Electrolysis</h3>
<p class="lg"><b>Key:</b> <span class="xt">EXT</span> = Extended (Supplement) only. No tag = Core (Extended students need it too).</p>
<div class="card" style="margin:12px 0"><b>🎛️ Try it: electrolysis products</b><br><select onchange="var v=this.value.split('|');document.getElementById('er').textContent='Cathode (negative): '+v[0]+'. Anode (positive): '+v[1]+'.'"><option value="choose|choose">Choose an electrolyte</option><option value="lead metal|bromine (brown fumes)">Molten lead(II) bromide</option><option value="hydrogen gas|chlorine gas">Concentrated sodium chloride solution</option><option value="hydrogen gas|oxygen gas">Dilute sulfuric acid</option><option value="copper metal|oxygen gas">Copper(II) sulfate, carbon electrodes</option><option value="copper deposits (cathode gets bigger)|copper dissolves (anode gets smaller)">Copper(II) sulfate, copper electrodes</option></select><p id="er" style="margin:8px 0 0">Metals or hydrogen form at the cathode; non-metals form at the anode.</p></div>
<p><b>Electrolysis</b> is the breaking down of an ionic compound, when molten or in aqueous solution, by passing an electric current through it.</p>
<h3>Key terms and set-up</h3>
<ul><li><b>Electrolyte:</b> the molten or dissolved ionic compound. It conducts because its ions are free to move, and it is decomposed by the current.</li>
<li><b>Electrodes:</b> the rods that carry current into and out of the electrolyte. <b>Inert electrodes</b> (graphite or platinum) do not take part in the reaction.</li>
<li><b>Anode:</b> the positive electrode. <b>Cathode:</b> the negative electrode. (<b>PANIC:</b> Positive Anode, Negative Is Cathode.)</li>
<li>Metals and graphite conduct because of delocalised electrons. Electrolytes conduct because of moving ions. Solid ionic compounds do not conduct, because their ions are fixed in the lattice.</li></ul>
<h3>What happens at each electrode</h3>
<ul><li>Positive ions (<b>cations</b>) move to the <b>cathode</b> and <b>gain electrons</b>. This is <b>reduction</b>.</li>
<li>Negative ions (<b>anions</b>) move to the <b>anode</b> and <b>lose electrons</b>. This is <b>oxidation</b>.</li>
<li>Remember <b>OIL RIG</b>: Oxidation Is Loss, Reduction Is Gain (of electrons).</li></ul>
<h3>Transfer of charge</h3>
<ul><li><span class="xt">EXT</span> <b>External circuit</b> (wires and power supply): electrons flow from the anode to the cathode.</li><li><span class="xt">EXT</span> <b>Electrodes:</b> anions lose electrons at the anode; cations gain electrons at the cathode.</li><li><span class="xt">EXT</span> <b>Electrolyte:</b> ions carry the current. Cations move to the cathode and anions move to the anode.</li></ul>
<h3>Molten compounds</h3>
<p>In general, <b>metals or hydrogen form at the cathode</b> and <b>non-metals (other than hydrogen) form at the anode</b>. A molten binary ionic compound splits into its two elements: metal at the cathode, non-metal at the anode.</p>
<p><b>Molten lead(II) bromide:</b> cathode Pb²⁺ + 2e⁻ → Pb (grey liquid lead). Anode 2Br⁻ → Br₂ + 2e⁻ (brown bromine vapour). Done in a fume cupboard because bromine is toxic.</p>
<h3>Aqueous solutions</h3>
<p>Water adds H⁺ and OH⁻ ions, so there are two possible ions to discharge at each electrode.</p>
<ul><li><span class="xt">EXT</span> <b>At the cathode:</b> if the metal is <b>less reactive than hydrogen</b> (e.g. copper, silver) the metal forms. If the metal is <b>more reactive</b> (e.g. sodium, potassium, calcium) hydrogen forms instead: 2H⁺ + 2e⁻ → H₂.</li>
<li><span class="xt">EXT</span> <b>At the anode:</b> if a <b>halide ion</b> (Cl⁻, Br⁻, I⁻) is present in concentrated solution, the halogen forms. Otherwise (sulfate, nitrate, dilute halide) <b>oxygen</b> forms: 4OH⁻ → 2H₂O + O₂ + 4e⁻.</li></ul>
<div class="wrap"><table><tr><th>Electrolyte (inert electrodes)</th><th>Cathode</th><th>Anode</th></tr>
<tr><td>Concentrated sodium chloride</td><td>Hydrogen</td><td>Chlorine</td></tr>
<tr><td>Dilute sulfuric acid</td><td>Hydrogen</td><td>Oxygen</td></tr>
<tr><td>Copper(II) sulfate</td><td>Copper</td><td>Oxygen</td></tr></table></div>
<ul><li>Concentrated sodium chloride leaves <b>sodium hydroxide solution</b> behind, because Na⁺ and OH⁻ stay in solution.</li>
<li><b>Observations, concentrated sodium chloride:</b> bubbles of gas at both electrodes. Hydrogen “pops” with a lighted splint; chlorine is a pale yellow-green gas that bleaches damp litmus paper.</li><li><b>Observations, dilute sulfuric acid:</b> bubbles at both electrodes, with twice as much hydrogen (pops with a lighted splint) as oxygen (relights a glowing splint), a <b>2 : 1</b> volume ratio. Effectively the water is being split.</li>
<li><span class="xt">EXT</span> <b>Copper(II) sulfate with inert (carbon or platinum) electrodes:</b> pink-brown copper coats the cathode, bubbles of oxygen form at the anode, and the blue colour fades as Cu²⁺ ions are used up.</li></ul>
<h3>Active (copper) electrodes, purifying and plating</h3>
<ul><li><span class="xt">EXT</span> With copper electrodes in copper(II) sulfate, the <b>anode dissolves</b> (Cu → Cu²⁺ + 2e⁻) and copper is <b>deposited on the cathode</b> (Cu²⁺ + 2e⁻ → Cu). The anode gets smaller, the cathode gets bigger and the solution stays blue.</li>
<li><span class="xt">EXT</span> <b>Purifying copper:</b> impure copper is the anode and pure copper is the cathode.</li>
<li><b>Electroplating:</b> the object to be plated is the <b>cathode</b>, the plating metal is the <b>anode</b>, and the electrolyte contains ions of the plating metal. Used to protect from corrosion and to improve appearance (e.g. silver plating, chromium plating).</li></ul>
<h3>🔍 Going deeper: electrolysis step by step</h3>
<svg viewBox="0 0 400 235" style="width:100%;max-width:520px;display:block;margin:10px auto" role="img" aria-label="Electrolysis cell with battery, anode, cathode and electrolyte"><g fill="none" stroke="currentColor" stroke-width="2"><path d="M110 100V205H290V100"/><path d="M157 60V28H188M243 60V28H212"/><path d="M188 18V38M212 12V44" stroke-width="3"/></g><rect x="111" y="130" width="178" height="74" fill="#3b4fd8" fill-opacity=".14"/><rect x="150" y="60" width="14" height="125" fill="#64748b"/><rect x="236" y="60" width="14" height="125" fill="#64748b"/><g font-size="12" fill="currentColor"><text x="20" y="72" font-weight="bold">Cathode (−)</text><text x="300" y="72" font-weight="bold">Anode (+)</text><text x="176" y="16">−</text><text x="216" y="10">+</text><text x="128" y="150">electrolyte</text><text x="200" y="226" text-anchor="middle">Electrons: anode → battery → cathode. Ions carry charge in the liquid.</text></g></svg>
<p><b>Which ions are discharged? (aqueous solutions)</b></p>
<ol><li>List all ions present, including H⁺ and OH⁻ from the water.</li>
<li><span class="xt">EXT</span> <b>Cathode:</b> the metal ion is discharged if the metal is less reactive than hydrogen (copper, silver); otherwise H⁺ is discharged and hydrogen forms (sodium, potassium, calcium and similar).</li>
<li><span class="xt">EXT</span> <b>Anode:</b> a halide ion (Cl⁻, Br⁻, I⁻) is discharged if its solution is concentrated; otherwise OH⁻ is discharged and oxygen forms (sulfate, nitrate, or a dilute halide).</li></ol>
<div class="wrap"><table><tr><th>Electrolyte</th><th>Cathode</th><th>Anode</th><th>Left in solution</th></tr><tr><td>Concentrated NaCl</td><td>H₂</td><td>Cl₂</td><td>NaOH</td></tr><tr><td>Dilute NaCl</td><td>H₂</td><td>O₂</td><td>NaCl, a little NaOH</td></tr><tr><td>Concentrated KBr</td><td>H₂</td><td>Br₂</td><td>KOH</td></tr><tr><td>Concentrated CuCl₂</td><td>Cu</td><td>Cl₂</td><td>Not much</td></tr><tr><td>CuSO₄ (inert electrodes)</td><td>Cu</td><td>O₂</td><td>Dilute H₂SO₄</td></tr><tr><td>Dilute H₂SO₄</td><td>H₂</td><td>O₂</td><td>More concentrated acid</td></tr></table></div>
<p><span class="xt">EXT</span> <b>Half-equations (Supplement):</b> balance the atoms, then add electrons to balance the charge. Electrons on the <b>right</b> means oxidation (anode); electrons on the <b>left</b> means reduction (cathode).</p>
<div class="f">Cathode: Na⁺ + e⁻ → Na    Cu²⁺ + 2e⁻ → Cu    2H⁺ + 2e⁻ → H₂</div><div class="f">Anode: 2Cl⁻ → Cl₂ + 2e⁻    2Br⁻ → Br₂ + 2e⁻    2I⁻ → I₂ + 2e⁻    4OH⁻ → 2H₂O + O₂ + 4e⁻</div>
<p><span class="xt">EXT</span> <b>Worked predictions:</b> molten potassium iodide gives potassium at the cathode and iodine at the anode. Concentrated aqueous potassium bromide gives hydrogen (potassium is more reactive than hydrogen) and bromine. Concentrated copper(II) chloride gives copper and chlorine.</p>
<div class="wrap"><table><tr><th>Product</th><th>How to recognise it</th></tr><tr><td>Hydrogen</td><td>Pops with a lighted splint</td></tr><tr><td>Oxygen</td><td>Relights a glowing splint</td></tr><tr><td>Chlorine</td><td>Pale yellow-green; bleaches damp litmus paper</td></tr><tr><td>Bromine</td><td>Red-brown liquid or vapour</td></tr><tr><td>Copper</td><td>Pink-brown solid on the cathode</td></tr><tr><td>Lead</td><td>Grey liquid metal when molten</td></tr></table></div>
<p><span class="xt">EXT</span> <b>Inert and active electrodes:</b> inert graphite or platinum electrodes only carry current. Copper electrodes in copper(II) sulfate take part: the anode dissolves and the cathode grows, so the blue colour stays the same.</p>
<p><b>Exam tips:</b> the ions must be free to move, which is why molten or dissolved compounds conduct and solids do not. Electrons flow through the wires, never through the electrolyte. Give observations (gas bubbles, colour fades, solid coats the electrode), not only the product names.</p>
<span class="tag">Topic 4.2</span><h3>Hydrogen–oxygen fuel cells</h3>
<svg class="v" viewBox="0 0 400 140" role="img" aria-label="Fuel cell"><rect x="120" y="25" width="160" height="80" class="l"/><rect x="120" y="25" width="14" height="80" fill="#3b82f6"/><rect x="266" y="25" width="14" height="80" fill="#ef4444"/><text x="20" y="50">H₂ in →</text><text x="288" y="50">← O₂ in</text><text x="150" y="68">electrolyte</text><text x="140" y="16">e⁻ → external circuit →</text><text x="140" y="128">water: only product</text></svg>
<p>A <b>fuel cell</b> uses hydrogen and oxygen to produce electricity, and <b>water is the only chemical product</b>.</p>
<div class="f">2H₂ + O₂ → 2H₂O</div>
<h3>Fuel cells compared with petrol engines</h3>
<p><span class="xt">EXT</span> <b>Advantages:</b> the only product is water, with no carbon dioxide or other pollutants from the vehicle; efficient; quiet; no recharging, just refuelling.</p>
<p><span class="xt">EXT</span> <b>Disadvantages:</b> hydrogen is flammable and difficult to store (compressed gas or liquid); making hydrogen often uses fossil fuels or a lot of electricity; few refuelling stations; fuel cells are expensive.</p>
<h3>🔍 Going deeper: how a fuel cell compares</h3>
<p><span class="xt">EXT</span> Hydrogen and oxygen are fed continuously into the cell. They react to produce electricity, and the only chemical product is water: <b>2H₂ + O₂ → 2H₂O</b>. Because the fuel is supplied continuously, the cell does not run flat like a normal battery; it works as long as fuel is supplied.</p>
<div class="wrap"><table><tr><th></th><th>Hydrogen–oxygen fuel cell</th><th>Petrol engine</th></tr><tr><td>Fuel</td><td>Hydrogen (stored under pressure)</td><td>Petrol (hydrocarbons)</td></tr><tr><td>Products</td><td>Water only</td><td>CO₂, water, and CO, NOₓ and particulates from the engine</td></tr><tr><td>Effect on climate</td><td>No CO₂ from the vehicle</td><td>Adds CO₂ to the atmosphere</td></tr><tr><td>Noise</td><td>Quiet</td><td>Noisier</td></tr><tr><td>Refuelling</td><td>Few stations; hydrogen is hard to store</td><td>Widespread, easy to store</td></tr><tr><td>Cost</td><td>Expensive cell and fuel</td><td>Cheaper, well-established</td></tr></table></div>
<p><span class="xt">EXT</span> <b>Think about it:</b> a fuel cell car has no emissions itself, but producing the hydrogen can release CO₂ if it comes from fossil fuels or if the electricity used is not renewable. <b>Exam tip:</b> comparison answers must refer to both: for example “the fuel cell makes only water but a petrol engine makes carbon dioxide”, not just one half.</p>
<div class="ext"><h4><span class="xt">EXT</span>Extended (Supplement) checklist: Chapter 4</h4><ul><li><b>Transfer of charge:</b> electrons flow in the external circuit from anode to cathode (never through the electrolyte); anions lose electrons at the anode (oxidation); cations gain electrons at the cathode (reduction); ions moving through the electrolyte carry the current.</li>
<li><b>Aqueous copper(II) sulfate:</b> carbon electrodes give copper at the cathode (pink-brown), oxygen at the anode, and the blue colour fades. Copper electrodes: the anode dissolves (Cu → Cu²⁺ + 2e⁻), the cathode gains copper, and the blue colour stays the same.</li>
<li><b>Halide solutions:</b> concentrated aqueous halide gives the halogen at the anode (Cl₂, Br₂, I₂); dilute gives oxygen. The cathode gives hydrogen if the metal is more reactive than hydrogen.</li>
<li><b>Half-equations:</b> cathode (reduction): 2H⁺ + 2e⁻ → H₂, Cu²⁺ + 2e⁻ → Cu. Anode (oxidation): 2Cl⁻ → Cl₂ + 2e⁻, 4OH⁻ → 2H₂O + O₂ + 4e⁻.</li>
<li><b>Fuel cell vs petrol engine:</b> fuel cell makes only water, is quiet and efficient, but hydrogen is hard to store, often made using fossil fuels, there are few refuelling stations and the cells are costly. Petrol engines are cheap with a widespread fuel supply but emit CO₂, NOₓ, CO and particulates.</li></ul></div>
