h4><p><span class=\"tag\">Supplement</span> An object stays at a constant temperature when it transfers energy away at the same rate as it receives energy. If it receives energy faster than it transfers it away, its temperature rises; if more slowly, its temperature falls. The Earth's temperature depends on the balance between incoming radiation from the Sun and radiation emitted from the Earth's surface. Greenhouse gases absorb some outgoing infrared, so the Earth warms until the two rates balance again. Ice and clouds reflect more incoming radiation, which cools it.</p>","kw":[["Brownian motion","Random movement of visible particles caused by collisions with fast, invisible molecules."],["Absolute zero","−273 °C (0 K), the lowest possible temperature."],["Specific heat capacity","Energy needed to raise 1 kg of a substance by 1 °C."],["Conduction","Transfer of energy by particle vibrations and free electrons."],["Convection","Transfer of energy by movement of warmer, less dense fluid."],["Radiation","Transfer of energy by infrared waves, needing no medium."],["Latent heat","Energy absorbed or released during a change of state at constant temperature."],["Thermal expansion","Increase in size of a substance when heated."],["Insulator","Material that is a poor conductor of thermal energy."],["Latent heat","Energy needed to change state without changing temperature."],["Specific latent heat","Energy to change the state of 1 kg without temperature change."],["Bimetallic strip","Two metals joined that bend when heated because they expand differently."],["Vacuum flask","Container with a vacuum gap and silvered walls that reduces all heat transfer."],["Internal energy","The energy of the particles in an object; it rises when the temperature rises."],["Solidification","Change from liquid to solid; energy is given out."]],"f":["K = °C + 273","pV = constant (constant T)","p₁V₁ = p₂V₂","ΔQ = mcΔθ","Q = mL","p ∝ T (constant V, T in kelvin)","E = Pt","c = E / (mΔθ)"],"qa":[["Explain why a gas's pressure rises when it is heated in a sealed rigid container.","Particles move faster, hit the walls more often and with greater force."],["A gas at 100 kPa and 6 cm³ is squeezed to 2 cm³ at constant temperature. Find the new pressure.","100 × 6 = p × 2, so p = 300 kPa."],["Find the energy to heat 2 kg of water by 10 °C (c = 4200 J/kg °C).","2 × 4200 × 10 = 84 000 J."],["Why does evaporation cool a liquid?","The most energetic particles escape, so the average energy of the remaining particles falls."],["Why is a vacuum flask a good insulator?","The vacuum stops conduction and convection, and silvered surfaces reduce radiation."],["Why is a metal handle on a hot pan uncomfortable but a plastic one safe?","Metals conduct thermal energy well because of free electrons; plastic is an insulator."],["Explain how a bimetallic strip works in a thermostat.","Two metals expand by different amounts when heated, so the strip bends and breaks the circuit."],["A 0.5 kg block of ice at 0 °C melts completely. Find the energy needed (L = 334 000 J/kg).","Q = mL = 0.5 × 334 000 = 167 000 J."],["Why does the temperature stay the same while ice melts?","Energy is used to break bonds between particles, not to increase kinetic energy."],["Explain how convection currents form in a room heated by a radiator.","Air near the radiator warms, expands, becomes less dense and rises. Cooler, denser air sinks to replace it."],["A heater of 500 W warms 2 kg of water by 10 °C. How long (ignoring losses)?","Q = 2 × 4200 × 10 = 84 000 J; t = 84 000 ÷ 500 = 168 s."],["Why are cooking pans made of metal but handles of plastic?","Metals conduct heat well to cook food; plastic is an insulator so the handle stays cool."]],"mcq":[["Which cannot travel through a vacuum?",["Radiation","Conduction","Both"],1,"Conduction needs particles."],["Best surface for absorbing radiation?",["Shiny silver","Dull black","White"],1,"Dull black absorbs most."],["300 K in °C is…",["27","573","−27"],0,"300 − 273 = 27."],["Which expands most for the same temperature rise?",["Solid","Liquid","Gas"],2,"Gas particles are far apart and move freely."],["0 °C in kelvin is…",["0 K","273 K","373 K"],1,"K = °C + 273."],["Which process occurs only at the surface?",["Boiling","Evaporation","Melting"],1,"Evaporation happens at the surface at any temperature."],["Convection cannot happen in…",["liquids","gases","solids"],2,"Particles in a solid cannot flow."],["Thermal expansion makes a gap necessary in…",["bridges","glass windows only","magnets"],0,"Bridges expand in hot weather."],["Which has the highest specific heat capacity?",["Copper","Water","Aluminium"],1,"Water: 4200 J/kg °C."],["Heat from the Sun reaches Earth mainly by…",["conduction","convection","radiation"],2,"Radiation crosses the vacuum."],["At constant volume, doubling the kelvin temperature of a gas…",["doubles the pressure","halves the pressure","does not change it"],0,"p ∝ T."],["During boiling, the temperature of the liquid…",["rises steadily","stays constant","falls"],1,"Energy goes into changing state."]]};
const PH3={"t":"Chapter 3: Waves (Cambridge 0625)","notes":"\n<span class=\"tag\">Topic 3.1</span><h3>General properties of waves</h3>\n<ul><li>Waves transfer <b>energy</b> without transferring matter.</li>\n<li><b>Transverse</b> waves: vibrations perpendicular to the direction of travel (light, water, all EM waves). <b>Longitudinal</b> waves: vibrations parallel to travel, forming compressions and rarefactions (sound).</li>\n<li><b>Amplitude</b> = maximum displacement from rest. <b>Wavelength</b> λ = distance between matching points. <b>Frequency</b> f = waves per second (Hz). <b>Period</b> T = 1/f.</li>\n<li><b>Wave equation:</b> v = fλ.</li>\n<li><b>Reflection, refraction, diffraction:</b> refraction is a change of direction when speed changes at a boundary. Diffraction (spreading through a gap or round an edge) is greatest when the gap is about the same size as the wavelength.</li></ul>\n<ul><li>Use a <b>ripple tank</b> to show waves. <b>Wavefronts</b> are lines joining points in step (same phase). Plane waves reflect with angle in = angle out.</li><li>Refraction in a ripple tank: waves entering shallow water slow down, wavelength gets shorter, frequency stays the same, and wavefronts bend towards the normal.</li><li>Wave speed depends on the medium, not on the source. Example: f = 5 Hz, λ = 0.20 m gives v = 1.0 m/s.</li><li><span class=\"tag\" style=\"background:#ec4899;color:#fff\">Supplement</span> When a wave refracts, its frequency does not change; speed and wavelength change by the same factor.</li></ul>\n<h4>Going deeper: describing a wave</h4><ul><li><b>Crest</b> = highest point, <b>trough</b> = lowest point. Amplitude is measured from the rest line to a crest.</li><li>Examples: sound (longitudinal), water ripples (transverse), light (transverse). A slinky spring shows both types: shake sideways for transverse, push and pull for longitudinal.</li><li>Frequency is set by the source. Doubling the frequency halves the wavelength if the speed stays constant.</li></ul>\n<div class=\"card\" style=\"margin:12px 0\"><span class=\"tag\">🎮 Simulation</span><h4 style=\"margin:.4em 0\">Wave equation: v = fλ</h4><label>Frequency f (Hz): <b id=\"wfv\">2</b><input type=\"range\" id=\"wf\" min=\"1\" max=\"10\" value=\"2\" step=\"1\" oninput=\"sW()\" style=\"padding:0;border:0;margin:4px 0\"></label><label>Wavelength λ (m): <b id=\"wlv\">4</b><input type=\"range\" id=\"wl\" min=\"1\" max=\"10\" value=\"4\" step=\"1\" oninput=\"sW()\" style=\"padding:0;border:0;margin:4px 0\"></label><svg class=\"v\" id=\"wg\" viewBox=\"0 0 300 100\"></svg><p id=\"wo\"></p><img src=\"data:,\" alt=\"\" style=\"display:none\" onerror=\"sW()\"></div>\n<svg class=\"v\" viewBox=\"0 0 330 190\" role=\"img\" aria-label=\"Transverse and longitudinal waves\"><text x=\"6\" y=\"14\">Transverse wave</text><path class=\"l\" d=\"M20 50C45 10 65 10 90 50S135 90 160 50S205 10 230 50S275 90 300 50\" stroke=\"#3b4fd8\"/><path class=\"l\" d=\"M10 50H320\" stroke-dasharray=\"3\"/><path class=\"l\" d=\"M20 100H160M20 95V105M160 95V105\"/><text x=\"68\" y=\"116\">wavelength λ</text><text x=\"236\" y=\"28\">crest</text><text x=\"164\" y=\"92\">trough</text><text x=\"6\" y=\"140\">Longitudinal wave (sound)</text><path class=\"l\" d=\"M30 150V180M36 150V180M42 150V180M48 150V180M70 150V180M90 150V180M110 150V180M130 150V180M136 150V180M142 150V180M148 150V180M170 150V180M190 150V180M210 150V180M230 150V180M236 150V180M242 150V180M248 150V180M270 150V180M290 150V180\"/><text x=\"26\" y=\"148\" style=\"font-size:10px\">C</text><text x=\"126\" y=\"148\" style=\"font-size:10px\">C</text><text x=\"226\" y=\"148\" style=\"font-size:10px\">C</text><text x=\"85\" y=\"148\" style=\"font-size:10px\">R</text><text x=\"185\" y=\"148\" style=\"font-size:10px\">R</text><text x=\"268\" y=\"148\" style=\"font-size:10px\">R</text></svg><p style=\"font-size:12px;text-align:center\">C = compression, R = rarefaction. Vibrations are perpendicular (transverse) or parallel (longitudinal) to the travel direction.</p><h4>Going deeper: wave behaviour</h4><ul><li><b>Ripple tank:</b> a vibrating bar makes plane waves. Wavefronts are shown as bright and dark lines. A stroboscope or video makes the pattern look still so λ can be measured; speed = fλ.</li><li><b>Reflection:</b> waves bounce off a barrier with angle of incidence = angle of reflection. The wavelength, frequency and speed stay the same.</li><li><b>Refraction:</b> waves entering shallower water slow down; the wavelength shortens and the wavefronts bend towards the normal. Entering deeper water they speed up and bend away.</li><li><b>Diffraction:</b> waves spread out when passing through a gap or round an obstacle. It is most obvious when the gap is about the same size as λ. Wide gaps give very little spreading; narrow gaps give circular waves. Sound diffracts round doorways because its wavelength is around 1 m; light hardly diffracts because its wavelength is tiny.</li><li><b>Examples:</b> transverse: water ripples, light, all EM waves, waves on a rope; longitudinal: sound, a pushed spring.</li><li><span class=\"tag\" style=\"background:#ec4899;color:#fff\">Supplement</span> Speed, wavelength and frequency in refraction: f is fixed by the source, so v = fλ means a change in speed gives a proportional change in wavelength.</li></ul><h4>Seismic waves</h4><p>Seismic P-waves (primary) are longitudinal. Seismic S-waves (secondary) are transverse. Other transverse waves: electromagnetic radiation and water waves. Other longitudinal waves: sound.</p><p><span class=\"tag\">Supplement</span> Diffraction through a gap is most noticeable when the gap is about the same size as the wavelength; a wider gap gives less spreading. For the same gap, a longer wavelength spreads more. At an edge, a longer wavelength diffracts more around the edge.</p>\n<span class=\"tag\">Topic 3.2</span><h3>Light</h3>\n<ul><li><b>Reflection:</b> angle of incidence = angle of reflection (measured from the normal). A plane mirror image is virtual, same size, same distance behind the mirror.</li>\n<li><b>Refraction:</b> light bends towards the normal entering a denser medium. Refractive index n = sin i ÷ sin r = c ÷ v.</li>\n<li><b>Total internal reflection:</b> occurs when light in a dense medium hits the boundary at an angle greater than the <b>critical angle</b> c, where sin c = 1/n. Used in optical fibres and prisms.</li>\n<li><b>Thin lenses:</b> a converging lens focuses parallel rays at the focal point. Real image: rays actually meet (can be on a screen). Virtual image: rays only appear to meet (magnifying glass, object inside focal length).</li></ul>\n<h4>More detail</h4><ul><li><b>Image in a plane mirror:</b> virtual, upright, same size, laterally inverted, as far behind the mirror as the object is in front.</li><li><b>Refraction by a glass block:</b> light bends towards the normal entering glass, away from it leaving; the emergent ray is parallel to the incident ray but shifted sideways.</li><li><b>Dispersion:</b> white light splits into red, orange, yellow, green, blue, indigo, violet because each colour refracts by a different amount (violet most). Monochromatic light is a single frequency.</li><li><b>Lens terms:</b> principal axis, principal focus (F), focal length (distance from lens to F). For a converging lens: object beyond 2F gives a real, inverted, diminished image; between F and 2F gives a real, inverted, magnified image; inside F gives a virtual, upright, magnified image (magnifying glass).</li><li>Rays: one parallel to the axis passes through F; one through the lens centre goes straight on.</li></ul>\n<svg class=\"v\" viewBox=\"0 0 400 200\" role=\"img\" aria-label=\"Converging lens ray diagram\"><path class=\"l\" d=\"M10 100H390\"/><path class=\"l\" d=\"M200 30V170\"/><path class=\"l\" d=\"M193 40L200 30L207 40M193 160L200 170L207 160\"/><text x=\"136\" y=\"116\">F</text><text x=\"256\" y=\"116\">F</text><text x=\"76\" y=\"116\">2F</text><text x=\"316\" y=\"116\">2F</text><path class=\"l\" d=\"M80 100V50M74 58L80 50L86 58\" stroke=\"#3b4fd8\"/><path class=\"l\" d=\"M80 50H200L330 160\" stroke=\"#f59e0b\"/><path class=\"l\" d=\"M80 50L320 150\" stroke=\"#ec4899\"/><path class=\"l\" d=\"M320 100V150M314 142L320 150L326 142\" stroke=\"#10b981\"/><text x=\"40\" y=\"40\">object</text><text x=\"290\" y=\"180\">image: real, inverted</text></svg><div class=\"card\" style=\"margin:12px 0\"><span class=\"tag\">🎮 Simulation</span><h4 style=\"margin:.4em 0\">Refraction and total internal reflection</h4><label>Angle of incidence i (°): <b id=\"riv\">30</b><input type=\"range\" id=\"ri\" min=\"0\" max=\"89\" value=\"30\" step=\"1\" oninput=\"sR()\" style=\"padding:0;border:0;margin:4px 0\"></label><label>Refractive index n of glass: <b id=\"rnv\">1.5</b><input type=\"range\" id=\"rn\" min=\"1.1\" max=\"2.4\" value=\"1.5\" step=\"0.1\" oninput=\"sR()\" style=\"padding:0;border:0;margin:4px 0\"></label><label>Ray goes from <select id=\"rd\" onchange=\"sR()\"><option value=\"a\">air → glass</option><option value=\"g\">glass → air</option></select></label><svg class=\"v\" id=\"rg\" viewBox=\"0 0 220 150\"></svg><p id=\"ro\"></p><img src=\"data:,\" alt=\"\" style=\"display:none\" onerror=\"sR()\"></div>\n<svg class=\"v\" viewBox=\"0 0 360 180\" role=\"img\" aria-label=\"Dispersion by a prism\"><polygon points=\"160,30 230,150 90,150\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><path d=\"M20 110L122 95L198 100\" stroke=\"#94a3b8\" stroke-width=\"3\" fill=\"none\"/><path stroke-width=\"2.5\" fill=\"none\" d=\"M198 100L340 128\" stroke=\"#ef4444\"/><path stroke-width=\"2.5\" fill=\"none\" d=\"M198 100L340 136\" stroke=\"#f59e0b\"/><path stroke-width=\"2.5\" fill=\"none\" d=\"M198 100L340 144\" stroke=\"#facc15\"/><path stroke-width=\"2.5\" fill=\"none\" d=\"M198 100L340 152\" stroke=\"#22c55e\"/><path stroke-width=\"2.5\" fill=\"none\" d=\"M198 100L340 160\" stroke=\"#3b82f6\"/><path stroke-width=\"2.5\" fill=\"none\" d=\"M198 100L340 168\" stroke=\"#8b5cf6\"/><text x=\"20\" y=\"130\">white light</text><text x=\"264\" y=\"122\">red (bent least)</text><text x=\"256\" y=\"178\">violet (bent most)</text></svg><h4>Going deeper: reflection, refraction and lenses</h4><ul><li><b>Plane mirror ray diagram:</b> draw two rays from the object, reflect each with equal angles, then extend the reflected rays back (dashed) behind the mirror; they meet at the virtual image.</li><li><b>Investigating refraction (glass block):</b> 1) trace the block; 2) shine a ray at a marked point; 3) mark two points on the emergent ray; 4) join them, draw the normal, measure i and r; 5) repeat for several i and plot sin i against sin r (a straight line whose gradient is n).</li><li><b>Optical fibres</b> use total internal reflection to carry light around bends with little loss (endoscopes, broadband and telephone). Their cores are denser than the cladding.</li><li><b>Critical angle example:</b> glass with n = 1.5: sin c = 1/1.5 = 0.667, so c ≈ 42°. A ray in the glass hitting the surface at 50° is totally internally reflected; one at 30° partly refracts out.</li><li><b>Converging vs diverging lens:</b> a converging lens is thicker in the middle and brings parallel rays to a focus; a diverging lens is thinner in the middle and spreads rays out (virtual focus).</li></ul><div class=\"wrap\"><table><tr><th>Object position (converging)</th><th>Image</th><th>Use</th></tr><tr><td>Beyond 2F</td><td>Real, inverted, smaller</td><td>Camera</td></tr><tr><td>At 2F</td><td>Real, inverted, same size</td><td>Photocopier</td></tr><tr><td>Between F and 2F</td><td>Real, inverted, larger</td><td>Projector</td></tr><tr><td>Inside F</td><td>Virtual, upright, larger</td><td>Magnifying glass</td></tr></table></div><div class=\"card\" style=\"margin:12px 0\"><span class=\"tag\">🎮 Simulation</span><h4 style=\"margin:.4em 0\">Converging lens image maker (focal length 10 cm)</h4><label>Object distance u (cm): <b id=\"lUv\">25</b><input type=\"range\" id=\"lU\" min=\"5\" max=\"40\" value=\"25\" step=\"1\" oninput=\"sLn()\" style=\"padding:0;border:0;margin:4px 0\"></label><svg class=\"v\" id=\"lw\" viewBox=\"0 0 400 140\"></svg><p id=\"lo\"></p><img src=\"data:,\" alt=\"\" style=\"display:none\" onerror=\"sLn()\"></div><h4>Correcting vision</h4><p><span class=\"tag\">Supplement</span> A long-sighted eye sees distant objects clearly but near objects blurred; a converging lens corrects it. A short-sighted eye sees near objects clearly but distant objects blurred; a diverging lens corrects it.</p>\n<span class=\"tag\">Topic 3.3</span><h3>Electromagnetic spectrum</h3>\n<ul><li>Order (low to high frequency): <b>radio, microwave, infrared, visible, ultraviolet, X-ray, gamma</b>.</li>\n<li>All are transverse, travel at 3 × 10⁸ m/s in a vacuum and transfer energy.</li>\n<li>Uses: radio (communication), microwaves (cooking, satellites), infrared (remote controls, heaters), visible light (sight, fibres), UV (sterilising), X-rays (medical imaging), gamma (treating cancer).</li>\n<li>High-frequency waves (UV, X-ray, gamma) are ionising and can damage cells.</li></ul>\n<ul><li><b>Dangers:</b> microwaves heat body cells; infrared causes burns; UV causes skin cancer and eye damage; X-rays and gamma rays are ionising and can cause cancer and cell mutation.</li><li>Radio waves carry TV, radio and phone signals. Satellites use microwaves. Optical fibres use infrared or visible light.</li><li><b>Analogue vs digital:</b> an analogue signal varies continuously; a digital signal uses only on/off pulses (1 and 0). Digital signals are less affected by noise and can be regenerated, so quality is better over long distances.</li></ul>\n<svg class=\"v\" viewBox=\"0 0 420 100\" role=\"img\" aria-label=\"Electromagnetic spectrum\"><g style=\"font-size:10px\"><rect x=\"5\" y=\"20\" width=\"56\" height=\"30\" fill=\"#6366f1\"/><rect x=\"61\" y=\"20\" width=\"56\" height=\"30\" fill=\"#0ea5e9\"/><rect x=\"117\" y=\"20\" width=\"56\" height=\"30\" fill=\"#ef4444\"/><rect x=\"173\" y=\"20\" width=\"56\" height=\"30\" fill=\"#22c55e\"/><rect x=\"229\" y=\"20\" width=\"56\" height=\"30\" fill=\"#a855f7\"/><rect x=\"285\" y=\"20\" width=\"56\" height=\"30\" fill=\"#f59e0b\"/><rect x=\"341\" y=\"20\" width=\"56\" height=\"30\" fill=\"#ec4899\"/></g><text x=\"12\" y=\"40\" style=\"fill:#fff;font-size:10px\">Radio</text><text x=\"64\" y=\"40\" style=\"fill:#fff;font-size:9px\">Microwave</text><text x=\"124\" y=\"40\" style=\"fill:#fff;font-size:10px\">Infrared</text><text x=\"184\" y=\"40\" style=\"fill:#fff;font-size:10px\">Visible</text><text x=\"236\" y=\"40\" style=\"fill:#fff;font-size:10px\">UV</text><text x=\"298\" y=\"40\" style=\"fill:#fff;font-size:10px\">X-ray</text><text x=\"352\" y=\"40\" style=\"fill:#fff;font-size:10px\">Gamma</text><text x=\"5\" y=\"72\">long λ, low f, low energy</text><text x=\"240\" y=\"72\">short λ, high f, high energy</text></svg>\n<h4>Going deeper: uses and dangers of each wave</h4><div class=\"wrap\"><table><tr><th>Wave</th><th>Uses</th><th>Dangers</th></tr><tr><td>Radio</td><td>Broadcasting, communications, astronomy</td><td>Very low risk</td></tr><tr><td>Microwaves</td><td>Cooking, satellite and mobile phone signals</td><td>Heat internal body tissue</td></tr><tr><td>Infrared</td><td>Remote controls, grills, thermal imaging, security</td><td>Skin burns</td></tr><tr><td>Visible</td><td>Vision, photography, optical fibres</td><td>Bright lasers damage eyes</td></tr><tr><td>Ultraviolet</td><td>Sterilising water, security markings, fluorescent lamps</td><td>Skin cancer, eye damage</td></tr><tr><td>X-rays</td><td>Medical imaging, airport security</td><td>Ionising: cell damage, cancer</td></tr><tr><td>Gamma</td><td>Sterilising food and equipment, cancer treatment</td><td>Ionising: cell damage, cancer</td></tr></table></div><ul><li>All EM waves are transverse, transfer energy, and travel at the same speed in a vacuum. They differ in wavelength and frequency: v = fλ, so shorter wavelength means higher frequency.</li><li><b>Satellite communication:</b> microwaves pass through the atmosphere to satellites, which relay signals around the world. TV and phone signals use radio waves.</li><li><b>Fibre optics</b> carry digital pulses of infrared or visible light with less energy loss than copper cables.</li></ul><h4>Communication with radio waves and microwaves</h4><p>Radio waves are used for radio and television transmission, astronomy and RFID (radio frequency identification, as in shop tags and contactless cards). Communication with artificial satellites is mainly by microwaves. Some satellite phones use low-orbit satellites. Some satellite phones and direct broadcast satellite television use geostationary satellites, which orbit once in 24 hours and so stay above the same point on the Equator.</p><p><span class=\"tag\">Supplement</span> Mobile phones and wireless internet use microwaves, which penetrate some walls and need only a short aerial. Bluetooth uses radio waves, which pass through walls but are weakened by them. Optical fibres carry visible light or short-wavelength infrared, because glass is transparent to them and they carry high data rates, so they suit cable television and high-speed broadband.</p>\n<span class=\"tag\">Topic 3.4</span><h3>Sound</h3>\n<ul><li>Sound is a longitudinal wave from vibrating sources. It needs a medium (no sound in a vacuum). Speed: gas ≈ 330 m/s, liquid ≈ 1500 m/s, solid ≈ 5000 m/s.</li>\n<li><b>Pitch</b> depends on frequency; <b>loudness</b> depends on amplitude. Humans hear about 20 Hz to 20 000 Hz. <b>Ultrasound</b> is above 20 kHz.</li>\n<li><b>Echo:</b> reflected sound. Speed = 2 × distance ÷ time.</li></ul><ul><li>Sound is made by vibrations; the particles pass on compressions (high pressure) and rarefactions (low pressure). It travels faster in solids than in gases because the particles are closer together.</li><li>Echo example: a ship sends a pulse and receives the echo after 0.80 s in water (1500 m/s): d = ½ × 1500 × 0.80 = 600 m.</li><li>Ultrasound is used in medical scans (e.g. pregnancy), cleaning, and flaw detection in metals.</li></ul>\n<h4>Going deeper: sound in detail</h4><ul><li><b>Production:</b> a vibrating object pushes particles, creating compressions and rarefactions. The wave carries energy, not particles. A loudspeaker cone vibrates to produce sound.</li><li><b>Speed:</b> particles close together pass vibrations quickly: solids (about 5000 m/s) &gt; liquids (about 1500 m/s) &gt; gases (about 330 m/s in air).</li><li><b>Pitch</b> = frequency (high frequency = high pitch). <b>Loudness</b> = amplitude (larger amplitude = louder). Human hearing: about 20 Hz to 20 kHz.</li><li><b>Measuring the speed of sound:</b> (a) clap near a distant wall and time a series of echoes: v = 2d ÷ t; (b) start a timer at a starting gun's sound at one microphone and stop it at a second microphone a measured distance away.</li><li><b>Echo example:</b> a 0.60 s echo from a cliff in air: d = ½ × 330 × 0.60 ≈ 99 m. Ships use echo sounding: the sea depth is ½ × speed × time.</li><li><b>Ultrasound</b> is above 20 kHz. Uses: medical scans (partly reflected at boundaries), cleaning jewellery, finding cracks, sonar. It is not harmful like X-rays.</li><li><span class=\"tag\" style=\"background:#ec4899;color:#fff\">Supplement</span> Echo timing on an oscilloscope: the time between the outgoing pulse and echo is measured and used in d = ½vt. Frequency from a trace: f = 1/T, where T is the time for one complete wave.</li></ul><div class=\"card\" style=\"margin:12px 0\"><span class=\"tag\">🎮 Simulation</span><h4 style=\"margin:.4em 0\">Echo time calculator</h4><label>Distance to reflecting surface (m): <b id=\"cDv\">100</b><input type=\"range\" id=\"cD\" min=\"10\" max=\"300\" value=\"100\" step=\"10\" oninput=\"sEc()\" style=\"padding:0;border:0;margin:4px 0\"></label><label>Medium <select id=\"cV\" onchange=\"sEc()\"><option value=\"330\">Air (330 m/s)</option><option value=\"1500\">Water (1500 m/s)</option><option value=\"5000\">Steel (5000 m/s)</option></select></label><p id=\"co\"></p><img src=\"data:,\" alt=\"\" style=\"display:none\" onerror=\"sEc()\"></div><div class=\"card\" style=\"margin:12px 0\"><span class=\"tag\">🎮 Simulation</span><h4 style=\"margin:.4em 0\">Sound on an oscilloscope</h4><label>Frequency (Hz): <b id=\"sFv\">300</b><input type=\"range\" id=\"sF\" min=\"100\" max=\"1000\" value=\"300\" step=\"50\" oninput=\"sSn()\" style=\"padding:0;border:0;margin:4px 0\"></label><label>Amplitude (units): <b id=\"sAv\">3</b><input type=\"range\" id=\"sA\" min=\"1\" max=\"5\" value=\"3\" step=\"1\" oninput=\"sSn()\" style=\"padding:0;border:0;margin:4px 0\"></label><svg class=\"v\" id=\"sw\" viewBox=\"0 0 300 100\"></svg><p id=\"so\"></p><img src=\"data:,\" alt=\"\" style=\"display:none\" onerror=\"sSn()\"></div>\n<p style=\"margin-top:14px\"><b>Exam tips:</b> For ray diagrams use a ruler, draw arrows on rays and measure angles from the normal. For wave calculations, check units (kHz, cm). Quote ‘transverse’ or ‘longitudinal’ and describe the direction of vibration compared with the direction of travel.</p><p><span class=\"tag\">Supplement</span> Ultrasound is also used for non-destructive testing, such as finding cracks inside metal without damaging it.</p>","kw":[["Transverse wave","Vibrations are perpendicular to the direction of travel."],["Longitudinal wave","Vibrations are parallel to the direction of travel."],["Frequency","Number of waves per second, in hertz."],["Refraction","Change of direction of a wave when its speed changes."],["Critical angle","Smallest angle of incidence giving total internal reflection."],["Refractive index","n = sin i / sin r = c / v."],["Ultrasound","Sound with frequency above 20 000 Hz."],["Wavefront","A line joining points on a wave that are in step."],["Dispersion","Splitting of white light into colours by refraction."],["Principal focus","The point where rays parallel to the axis meet after a converging lens."],["Digital signal","A signal with only two states, 1 and 0."],["Compression","Region of a longitudinal wave where particles are close together."],["Rarefaction","Region of a longitudinal wave where particles are spread apart."],["Amplitude","Maximum displacement of a wave from its rest position."],["Pitch","How high or low a sound is; set by frequency."],["Optical fibre","Glass fibre that carries light by total internal reflection."],["Virtual image","An image formed where rays only appear to meet; cannot be put on a screen."],["Echo","Reflection of sound from a surface."],["P-wave","Seismic primary wave; longitudinal."],["S-wave","Seismic secondary wave; transverse."],["RFID","Radio frequency identification: tags read using radio waves."],["Geostationary satellite","A satellite that orbits once in 24 hours and stays above the same point on the Equator."],["Long-sightedness","Distant objects clear, near objects blurred; corrected by a converging lens."],["Short-sightedness","Near objects clear, distant objects blurred; corrected by a diverging lens."]],"f":["v = fλ","T = 1 / f","n = sin i / sin r","n = 1 / sin c","speed of sound = 2d / t (echo)","c = 3 × 10⁸ m/s","angle of incidence = angle of reflection","sin c = 1/n","echo: d = ½ v t","wavelength = speed ÷ frequency","magnification = image height ÷ object height"],"qa":[["A wave has f = 50 Hz and λ = 6.6 m. Find v.","v = 50 × 6.6 = 330 m/s."],["Light hits glass at i = 45° and r = 28°. Find n.","n = sin 45° / sin 28° = 0.707/0.469 ≈ 1.5."],["Why is no sound heard from an alarm in a vacuum jar?","Sound needs particles to pass on vibrations."],["State two uses of total internal reflection.","Optical fibres and prismatic reflectors (binoculars, periscopes)."],["What happens to f, λ and v when a wave enters shallower water?","f stays the same; v and λ decrease."],["Describe the image in a plane mirror.","Virtual, upright, same size, laterally inverted, same distance behind the mirror as the object is in front."],["A wave has period 0.02 s. Find the frequency.","f = 1/T = 50 Hz."],["Why does a straw look bent in water?","Light refracts as it speeds up when leaving water, so the straw appears at a different position."],["State two uses of infrared.","Remote controls and heaters or thermal cameras."],["A tuning fork of 440 Hz produces sound in air at 330 m/s. Find the wavelength.","λ = v/f = 330/440 = 0.75 m."],["Explain why you can hear someone round a corner but not see them.","Sound has a wavelength comparable to the doorway so it diffracts; light has a very small wavelength so it hardly diffracts."],["State how the image changes as an object moves from beyond 2F to inside F in front of a converging lens.","Real, inverted, smaller → same size → larger; inside F it becomes virtual, upright and magnified."],["Why does a prism split white light into colours?","Each colour is refracted by a different amount: violet most, red least."]],"mcq":[["Which is longitudinal?",["Light","Sound","Radio"],1,"Sound has compressions and rarefactions."],["Highest frequency EM wave?",["Gamma","X-ray","Microwave"],0,"Gamma is highest."],["Greater amplitude of sound means…",["higher pitch","louder sound","faster speed"],1,"Amplitude controls loudness."],["Which colour is refracted most by a prism?",["Red","Green","Violet"],2,"Violet has the shortest wavelength."],["Diffraction is greatest when the gap is…",["much bigger than λ","about equal to λ","much smaller than λ"],1,"Gap about the size of the wavelength."],["Which EM waves are used for sterilising?",["Ultraviolet","Infrared","Radio"],0,"UV kills microbes."],["The echo returns after 0.2 s in air (330 m/s). Distance to the wall?",["66 m","33 m","132 m"],1,"d = ½ × 330 × 0.2 = 33 m."],["A converging lens forms a virtual image when the object is…",["beyond 2F","between F and 2F","inside F"],2,"Inside F gives a magnified virtual image."],["A louder sound has a greater…",["frequency","amplitude","wavelength"],1,"Loudness depends on amplitude."],["Total internal reflection can only occur when light travels…",["from a less dense to a denser medium","from a denser to a less dense medium","in a vacuum"],1,"Only light in the denser medium can be totally reflected."],["Which statement about all EM waves is true?",["They travel at the same speed in a vacuum","They are all longitudinal","They are all visible"],0,"All travel at 3 × 10⁸ m/s in a vacuum."],["In a longitudinal wave, the vibrations are…",["parallel to travel","perpendicular to travel","absent"],0,"Compressions and rarefactions."]]};
const PH4={"t":"Chapter 4: Electricity and Magnetism (Cambridge 0625)","notes":"\n<span class=\"tag\">Topic 4.1</span><h3>Magnetism</h3>\n<ul><li>Like poles repel, unlike poles attract. A magnet attracts iron, steel, nickel, cobalt.</li>\n<li><b>Magnetic materials:</b> soft iron is easily magnetised and demagnetised (electromagnets, transformer cores); steel keeps its magnetism (permanent magnets).</li>\n<li>Field lines go from N to S and are closest together where the field is strongest.</li></ul>\n<ul><li>Magnets can be made by stroking or by placing steel in a solenoid with a direct current, and can be demagnetised by an alternating current or by hammering and heating.</li><li>Test for polarity: only repulsion proves a magnet; attraction could be a magnet or unmagnetised iron.</li><li>Use a plotting compass or iron filings to show field patterns.</li></ul>\n<svg class=\"v\" viewBox=\"0 0 400 170\" role=\"img\" aria-label=\"Magnetic field of a bar magnet\"><rect x=\"150\" y=\"70\" width=\"50\" height=\"30\" fill=\"#ef4444\"/><rect x=\"200\" y=\"70\" width=\"50\" height=\"30\" fill=\"#3b82f6\"/><text x=\"168\" y=\"90\" style=\"fill:#fff\">N</text><text x=\"218\" y=\"90\" style=\"fill:#fff\">S</text><path class=\"l\" d=\"M150 85C90 85 90 25 200 25S310 85 250 85\" stroke-dasharray=\"0\"/><path class=\"l\" d=\"M150 85C90 85 90 145 200 145S310 85 250 85\"/><path class=\"l\" d=\"M150 80C50 70 60 5 200 5S350 70 250 80\"/><path class=\"l\" d=\"M150 90C50 100 60 165 200 165S350 100 250 90\"/><path class=\"l\" d=\"M104 54l-4 9l8-1M104 118l-4-9l8 1\"/><text x=\"260\" y=\"162\" style=\"font-size:11px\">field lines: N → S, closest where field is strongest</text></svg><h4>Going deeper: magnetic materials and fields</h4><ul><li><b>Magnetic materials</b> are iron, steel, nickel and cobalt. Copper, aluminium, plastic, glass and wood are not.</li><li><b>Induced magnetism:</b> a magnet near unmagnetised iron turns it into a temporary magnet with the <i>opposite</i> pole nearest. This is why a magnet attracts both ends of an iron nail.</li><li><b>Soft vs hard:</b> soft iron magnetises and demagnetises easily (electromagnets, relays, transformer cores). Steel is hard to magnetise but keeps it (permanent magnets, compass needles).</li><li><b>Magnetic field:</b> the region where a magnet or magnetic material feels a force. The direction is the way a free N pole would move. A plotting compass or iron filings show the pattern. Between two close, opposite poles the field is uniform (parallel, equally spaced lines).</li><li><b>Screening:</b> a soft iron ring or box carries field lines round it, so the space inside is shielded.</li><li><b>Earth:</b> Earth has a magnetic field like a bar magnet. A compass N pole points to geographic north, which is the Earth's magnetic <i>south</i> pole.</li></ul><h4>Field strength and field lines</h4><p><span class=\"tag\">Supplement</span> The relative strength of a magnetic field is shown by the spacing of the field lines: lines close together mean a strong field, and lines far apart mean a weak field. Magnetic forces are due to interactions between magnetic fields.</p>\n<span class=\"tag\">Topic 4.2</span><h3>Electrical quantities</h3>\n<ul><li><b>Charge:</b> like charges repel, unlike attract. Insulators become charged by friction when electrons transfer. Earth a conductor to remove charge.</li>\n<li><b>Current</b> I = Q ÷ t (amperes). <b>Conventional current</b> flows from + to −; electrons flow the opposite way.</li>\n<li><b>Potential difference (voltage)</b> = work done per unit charge, V = W ÷ Q (volts). <b>EMF</b> is the electrical work done by a source per unit charge.</li>\n<li><b>Resistance</b> R = V ÷ I (ohms). Resistance of a wire increases with length and decreases with cross-sectional area.</li>\n<li><b>Electrical energy and power:</b> P = IV, E = IVt.</li></ul>\n<ul><li><b>Electric field:</b> the region where a charge feels a force. Field lines point away from + and towards −. Charge by friction: rubbing a polythene rod with a cloth transfers electrons, so the rod becomes negative.</li><li><span class=\"tag\" style=\"background:#ec4899;color:#fff\">Supplement</span> Charging by induction: a charged rod brought near an insulated metal sphere causes electrons to move; if the sphere is earthed and then disconnected, it keeps a charge opposite to the rod's.</li><li><b>Energy conversions:</b> a battery converts chemical to electrical energy; resistor/heater: electrical to thermal.</li><li>Example: 6 A for 2 minutes: Q = 6 × 120 = 720 C. Example: 3 C moves through 12 V: W = 3 × 12 = 36 J.</li></ul>\n<h4>Going deeper: I–V characteristics</h4><ul><li><b>Fixed resistor:</b> straight line through the origin; R is constant (ohmic).</li><li><b>Filament lamp:</b> curve that flattens, so resistance rises as the wire gets hotter.</li><li><b>Diode:</b> almost no current in reverse; current flows once the forward voltage is above about 0.6 V.</li><li><b>Thermistor:</b> resistance falls as temperature rises; <b>LDR:</b> resistance falls as light increases.</li><li>Current in a metal is a flow of free electrons; they move slowly but the effect travels almost instantly through the whole circuit.</li></ul>\n<h4>Going deeper: static electricity and electrical quantities</h4><ul><li><b>Conductors</b> have free electrons (metals, graphite). <b>Insulators</b> (plastic, glass, rubber) do not. Only electrons move; protons stay fixed.</li><li><b>Uses and dangers of static:</b> spray painting (droplets repel and spread evenly), photocopiers, smoke precipitators; dangers are lightning and sparks when refuelling, so aircraft and tankers are earthed.</li><li><b>Units:</b> charge in coulombs (C), current in amperes (A), p.d. and EMF in volts (V), resistance in ohms (Ω). 1 A = 1 C/s; 1 V = 1 J/C.</li><li><b>Resistance depends on:</b> length (longer, more resistance), cross-sectional area (thicker, less), material and temperature.</li><li><b>d.c. and a.c.:</b> direct current flows one way (cells); alternating current repeatedly reverses (mains, 50 Hz in many countries). Cells in series add EMFs.</li><li><b>Energy:</b> E = QV = IVt. Example: 2 A at 12 V for 30 s transfers 2 × 12 × 30 = 720 J.</li><li><span class=\"tag\" style=\"background:#ec4899;color:#fff\">Supplement</span> EMF is the energy a source transfers per coulomb to the whole circuit; p.d. is the energy transferred per coulomb in one component. With a current flowing, a battery's terminal p.d. is smaller than its EMF because some energy is used in its internal resistance.</li></ul><div class=\"card\" style=\"margin:12px 0\"><span class=\"tag\">🎮 Simulation</span><h4 style=\"margin:.4em 0\">I–V characteristics</h4><label>Component <select id=\"iC\" onchange=\"sIV()\"><option value=\"r\">Fixed resistor</option><option value=\"l\">Filament lamp</option><option value=\"d\">Diode</option></select></label><label>p.d. V (volts): <b id=\"iVv\">3</b><input type=\"range\" id=\"iV\" min=\"-6\" max=\"6\" value=\"3\" step=\"0.2\" oninput=\"sIV()\" style=\"padding:0;border:0;margin:4px 0\"></label><svg class=\"v\" id=\"iw\" viewBox=\"0 0 240 160\"></svg><p id=\"io\"></p><img src=\"data:,\" alt=\"\" style=\"display:none\" onerror=\"sIV()\"></div><h4>Electric field patterns</h4><p><span class=\"tag\">Supplement</span> The direction of an electric field is the direction of the force on a positive charge. Around a positive point charge the lines point radially outwards; around a negative point charge they point radially inwards. A charged conducting sphere has the same radial pattern. Between two oppositely charged parallel plates the lines are straight, parallel and equally spaced (a uniform field), pointing from the positive plate to the negative plate. End effects are not examined.</p><h4>The kilowatt-hour (kWh)</h4><p>The kilowatt-hour is the energy transferred by a 1 kW appliance in 1 hour. Example: a 2 kW heater used for 3 hours transfers 2 × 3 = 6 kWh; at 0.25 per kWh the cost is 6 × 0.25 = 1.50.</p><div class=\"f\">energy (kWh) = power (kW) × time (h)</div><div class=\"f\">cost = energy (kWh) × cost per kWh</div>\n<span class=\"tag\">Topic 4.3</span><h3>Electric circuits</h3>\n<ul><li><b>Series:</b> same current everywhere; V adds up; R = R₁ + R₂. <b>Parallel:</b> current splits; same V across each branch; total resistance is less than the smallest branch (1/R = 1/R₁ + 1/R₂).</li>\n<li>Ammeter in series; voltmeter in parallel.</li>\n<li><b>Components:</b> a filament lamp's resistance rises as it heats (curved I–V graph); a fixed resistor gives a straight line through the origin; a diode conducts one way only; an LDR's resistance falls in light; a thermistor's resistance falls when hot.</li>\n<li><b>Potential divider:</b> V<sub>out</sub> = V<sub>in</sub> × R₂ ÷ (R₁ + R₂).</li></ul>\n<h4>More detail</h4><ul><li><b>Circuit symbols:</b> cell, battery, switch, lamp, fixed and variable resistor, diode, LED, thermistor, LDR, fuse, ammeter, voltmeter, motor, transformer.</li><li><b>Parallel advantages:</b> each branch works independently, so one lamp failing does not stop the others, and each gets the full supply voltage.</li><li><b>Series:</b> the supply p.d. is shared. Current is the same at every point. <b>Parallel:</b> current into a junction = current out.</li><li>A variable resistor (rheostat) changes the current by changing the resistance in the circuit; a thermistor and an LDR can control switching circuits such as thermostats and automatic lights.</li><li>A relay lets a small current switch a large current in a separate circuit.</li><li><span class=\"tag\" style=\"background:#ec4899;color:#fff\">Supplement</span> Potential divider example: a 9 V supply across 3 kΩ and 6 kΩ in series: V across the 6 kΩ resistor = 9 × 6 ÷ 9 = 6 V.</li></ul>\n<div class=\"card\" style=\"margin:12px 0\"><span class=\"tag\">🎮 Simulation</span><h4 style=\"margin:.4em 0\">Circuit calculator: V = IR</h4><label>Supply V (volts): <b id=\"ovv\">12</b><input type=\"range\" id=\"ov\" min=\"1\" max=\"24\" value=\"12\" step=\"1\" oninput=\"sO()\" style=\"padding:0;border:0;margin:4px 0\"></label><label>R₁ (Ω): <b id=\"o1v\">4</b><input type=\"range\" id=\"o1\" min=\"1\" max=\"20\" value=\"4\" step=\"1\" oninput=\"sO()\" style=\"padding:0;border:0;margin:4px 0\"></label><label>R₂ (Ω): <b id=\"o2v\">6</b><input type=\"range\" id=\"o2\" min=\"1\" max=\"20\" value=\"6\" step=\"1\" oninput=\"sO()\" style=\"padding:0;border:0;margin:4px 0\"></label><label>Arrangement <select id=\"om\" onchange=\"sO()\"><option value=\"s\">Series</option><option value=\"p\">Parallel</option></select></label><p id=\"oo\"></p><img src=\"data:,\" alt=\"\" style=\"display:none\" onerror=\"sO()\"></div>\n<svg class=\"v\" viewBox=\"0 0 320 140\" role=\"img\" aria-label=\"Series and parallel circuits\"><path class=\"l\" d=\"M20 30H140V110H20ZM180 30H300V110H180ZM220 30V110M260 30V110\"/><rect x=\"12\" y=\"62\" width=\"16\" height=\"16\" fill=\"var(--card)\" stroke=\"none\"/><path class=\"l\" d=\"M12 66H28M16 74H24\"/><rect x=\"172\" y=\"62\" width=\"16\" height=\"16\" fill=\"var(--card)\" stroke=\"none\"/><path class=\"l\" d=\"M172 66H188M176 74H184\"/><g fill=\"var(--card)\" stroke=\"currentColor\" stroke-width=\"2\"><circle cx=\"60\" cy=\"30\" r=\"9\"/><circle cx=\"100\" cy=\"30\" r=\"9\"/><circle cx=\"220\" cy=\"70\" r=\"9\"/><circle cx=\"260\" cy=\"70\" r=\"9\"/></g><text x=\"30\" y=\"130\">Series: same I, V shared</text><text x=\"190\" y=\"130\">Parallel: same V, I splits</text></svg><h4>Going deeper: circuit analysis</h4><div class=\"wrap\"><table><tr><th>Component</th><th>Behaviour</th><th>Use</th></tr><tr><td>Fixed resistor</td><td>R constant</td><td>Limits current</td></tr><tr><td>Variable resistor</td><td>R adjusted by hand</td><td>Dimmers, volume</td></tr><tr><td>Thermistor</td><td>R falls as T rises</td><td>Fire alarms, thermostats</td></tr><tr><td>LDR</td><td>R falls as light rises</td><td>Automatic lights</td></tr><tr><td>Diode / LED</td><td>Current one way only</td><td>Rectification, indicators</td></tr><tr><td>Relay</td><td>Small current switches large one</td><td>Starter circuits</td></tr></table></div><ul><li><b>Series rules:</b> I same at all points; V<sub>supply</sub> = V₁ + V₂; R = R₁ + R₂. If one component fails, the whole circuit stops.</li><li><b>Parallel rules:</b> V same across each branch; I<sub>total</sub> = I₁ + I₂; total R is smaller than the smallest branch. Appliances are wired in parallel so each gets full voltage and works independently.</li><li><b>Worked example:</b> 12 V across 4 Ω and 8 Ω in series: R = 12 Ω, I = 1 A, V across 4 Ω = 4 V, across 8 Ω = 8 V. In parallel: I = 3 A and 1.5 A, total 4.5 A, R = 12 ÷ 4.5 = 2.67 Ω.</li><li><b>Light switch circuit:</b> an LDR in a potential divider: in darkness its resistance is high, so its share of the voltage is high, switching the lamp on through a transistor or relay.</li></ul><div class=\"card\" style=\"margin:12px 0\"><span class=\"tag\">🎮 Simulation</span><h4 style=\"margin:.4em 0\">Potential divider</h4><label>Input voltage (V): <b id=\"dVv\">12</b><input type=\"range\" id=\"dV\" min=\"1\" max=\"24\" value=\"12\" step=\"1\" oninput=\"sDv()\" style=\"padding:0;border:0;margin:4px 0\"></label><label>R₁ (Ω): <b id=\"d1v\">4</b><input type=\"range\" id=\"d1\" min=\"1\" max=\"20\" value=\"4\" step=\"1\" oninput=\"sDv()\" style=\"padding:0;border:0;margin:4px 0\"></label><label>R₂ (Ω): <b id=\"d2v\">8</b><input type=\"range\" id=\"d2\" min=\"1\" max=\"20\" value=\"8\" step=\"1\" oninput=\"sDv()\" style=\"padding:0;border:0;margin:4px 0\"></label><svg class=\"v\" id=\"dw\" viewBox=\"0 0 300 40\"></svg><p id=\"dO\"></p><img src=\"data:,\" alt=\"\" style=\"display:none\" onerror=\"sDv()\"></div><h4>Why lamps are connected in parallel</h4><p>In a lighting circuit each lamp is in its own branch. Each lamp gets the full supply voltage, so it shines at normal brightness; if one lamp breaks the others stay on; and each lamp can be switched on and off separately.</p>\n<span class=\"tag\">Topic 4.4</span><h3>Electrical safety</h3>\n<ul><li><b>Fuse</b> melts when the current is too high; it goes in the live wire and is rated just above the normal current. <b>Earth wire</b> connects the metal casing to ground. <b>Circuit breakers</b> switch off and can be reset.</li>\n<li>Dangers: damaged insulation, damp conditions, overheating cables, overloaded sockets.</li>\n<li>Mains UK wiring: live (brown), neutral (blue), earth (green/yellow).</li></ul>\n<ul><li>Fuses and circuit breakers both protect against excessive current; a fuse must be replaced, a breaker reset. Choose a fuse slightly above the normal current: a 2.3 kW heater on 230 V takes 10 A, so use a 13 A fuse (standard values 3 A, 5 A, 13 A).</li><li>Double-insulated appliances (plastic case) do not need an earth wire. Never use electrical devices with wet hands or near water.</li></ul>\n<h4>Going deeper: mains safety</h4><ul><li><b>Three-pin plug:</b> live (brown) to the fuse, neutral (blue), earth (green/yellow) to the metal case. The cable grip stops wires being pulled out.</li><li><b>How earthing works:</b> if the live wire touches the metal case, a large current flows through the earth wire to the ground. The fuse melts and disconnects the appliance, so the case never stays live.</li><li><b>Choosing a fuse:</b> I = P ÷ V. A 1.5 kW heater on 230 V draws 6.5 A, so use a 13 A fuse (not 3 A, which would blow, and not larger than needed).</li><li><b>Hazards:</b> frayed cables, bare wires, long extension leads wound up, overloaded multi-way adapters, water near sockets, damaged plugs. Switch off and unplug before repairs.</li><li><b>Double insulation</b> means a plastic case; no earth is needed. <b>Switches and fuses</b> always go in the live wire so a switched-off appliance is not live.</li><li>A residual current circuit breaker (RCCB) trips if the live and neutral currents differ, which happens if current leaks through a person.</li></ul>\n<span class=\"tag\">Topic 4.5</span><h3>Electromagnetic effects</h3>\n<ul><li><b>Electromagnetic induction:</b> a voltage is induced when a conductor cuts magnetic field lines or the field through a coil changes. Bigger with faster movement, stronger magnet, more turns.</li>\n<li><b>A.c. generator:</b> a coil rotates in a magnetic field, giving alternating voltage.</li>\n<li><b>Motor effect:</b> a current-carrying wire in a magnetic field feels a force. Use <b>Fleming's left-hand rule</b> (thumb = force, first finger = field, second finger = current). Reverse current or field to reverse force. Used in d.c. motors with a split-ring commutator.</li>\n<li><b>Transformer:</b> V<sub>p</sub>/V<sub>s</sub> = N<sub>p</sub>/N<sub>s</sub>. Step-up raises voltage; step-down lowers it. For 100% efficient transformers, V<sub>p</sub>I<sub>p</sub> = V<sub>s</sub>I<sub>s</sub>. High-voltage transmission reduces current and so energy lost as heat in cables.</li></ul><ul><li><b>Magnetic field of a current:</b> a straight wire has concentric circles; a solenoid has a field like a bar magnet. Strength increases with more current, more turns and an iron core. Direction: right-hand grip rule.</li><li><b>Applications:</b> relays, electric bells, loudspeakers, circuit breakers.</li><li><b>Motor:</b> to increase turning force use a stronger magnet, more turns on the coil or a larger current.</li><li><span class=\"tag\" style=\"background:#ec4899;color:#fff\">Supplement</span> Direction of induced current (Lenz): it opposes the change that causes it. Faraday: the induced voltage grows with the rate of change of flux (faster movement, stronger field, more turns).</li><li><span class=\"tag\" style=\"background:#ec4899;color:#fff\">Supplement</span> Transformer works only with a.c. because a changing current makes a changing magnetic field in the iron core. Example: 230 V supply, 1000 primary turns, 12 V output: Ns = 1000 × 12/230 ≈ 52 turns.</li></ul>\n<svg class=\"v\" viewBox=\"0 0 320 160\" role=\"img\" aria-label=\"Transformer\"><path d=\"M90 30H230V130H90ZM120 55H200V105H120Z\" fill=\"#94a3b8\" fill-rule=\"evenodd\"/><path class=\"l\" stroke-width=\"4\" d=\"M82 45H128M82 57H128M82 69H128M82 81H128M82 93H128M82 105H128M192 45H238M192 57H238M192 69H238M192 81H238\"/><text x=\"4\" y=\"20\">Primary: Np, Vp (a.c.)</text><text x=\"196\" y=\"20\">Secondary: Ns, Vs</text><text x=\"100\" y=\"150\">soft iron core</text></svg><h4>Going deeper: electromagnetism in action</h4><ul><li><b>Electromagnet strength</b> increases with larger current, more turns and a soft iron core. Switching off the current switches off the field.</li><li><b>Right-hand grip rule:</b> thumb along the current in a wire; fingers curl in the direction of the field. For a coil, curl fingers in the direction of the current and the thumb points to the N pole.</li><li><b>Motor details:</b> the forces on the two sides of the coil are opposite, so the coil turns. The commutator reverses current each half turn so that the turn continues. Brushes keep contact.</li><li><b>Generator:</b> the coil rotates in a field and its sides cut field lines, inducing an alternating voltage. Slip rings and brushes connect the coil to the outside circuit. Higher speed, more turns or a stronger field gives a higher peak voltage and (for speed) a higher frequency.</li><li><span class=\"tag\" style=\"background:#ec4899;color:#fff\">Supplement</span> Transformer losses: resistance of the coils (heating), eddy currents in the core (reduced by laminating it), and flux leakage. A 100% efficient transformer has VpIp = VsIs.</li><li><span class=\"tag\" style=\"background:#ec4899;color:#fff\">Supplement</span> Why transmit at high voltage: for P = 10 MW, at 25 kV I = 400 A; at 250 V the current would be 40 000 A. Power loss in cables is I²R, so reducing the current by 100 times cuts the loss by 10 000 times.</li><li>Step-up transformers at the power station raise the voltage; step-down transformers near homes lower it to a safe level.</li></ul><div class=\"card\" style=\"margin:12px 0\"><span class=\"tag\">🎮 Simulation</span><h4 style=\"margin:.4em 0\">Transformer calculator</h4><label>Primary voltage Vp (V): <b id=\"tPv\">230</b><input type=\"range\" id=\"tP\" min=\"10\" max=\"240\" value=\"230\" step=\"10\" oninput=\"sTr()\" style=\"padding:0;border:0;margin:4px 0\"></label><label>Primary turns Np: <b id=\"tNv\">1000</b><input type=\"range\" id=\"tN\" min=\"100\" max=\"2000\" value=\"1000\" step=\"100\" oninput=\"sTr()\" style=\"padding:0;border:0;margin:4px 0\"></label><label>Secondary turns Ns: <b id=\"tSv\">100</b><input type=\"range\" id=\"tS\" min=\"50\" max=\"2000\" value=\"100\" step=\"50\" oninput=\"sTr()\" style=\"padding:0;border:0;margin:4px 0\"></label><label>Primary current Ip (A): <b id=\"tIv\">0.5</b><input type=\"range\" id=\"tI\" min=\"0.1\" max=\"2\" value=\"0.5\" step=\"0.1\" oninput=\"sTr()\" style=\"padding:0;border:0;margin:4px 0\"></label><p id=\"tO\"></p><img src=\"data:,\" alt=\"\" style=\"display:none\" onerror=\"sTr()\"></div><div class=\"card\" style=\"margin:12px 0\"><span class=\"tag\">🎮 Simulation</span><h4 style=\"margin:.4em 0\">Generator output</h4><label>Rotation speed (rev/s): <b id=\"gSv\">2</b><input type=\"range\" id=\"gS\" min=\"1\" max=\"5\" value=\"2\" step=\"1\" oninput=\"sGn()\" style=\"padding:0;border:0;margin:4px 0\"></label><label>Turns on coil: <b id=\"gNv\">50</b><input type=\"range\" id=\"gN\" min=\"10\" max=\"100\" value=\"50\" step=\"10\" oninput=\"sGn()\" style=\"padding:0;border:0;margin:4px 0\"></label><label>Field strength (units): <b id=\"gBv\">3</b><input type=\"range\" id=\"gB\" min=\"1\" max=\"5\" value=\"3\" step=\"1\" oninput=\"sGn()\" style=\"padding:0;border:0;margin:4px 0\"></label><svg class=\"v\" id=\"ew\" viewBox=\"0 0 300 100\"></svg><p id=\"eo\"></p><img src=\"data:,\" alt=\"\" style=\"display:none\" onerror=\"sGn()\"></div>\n<p style=\"margin-top:14px\"><b>Exam tips:</b> Draw circuit symbols correctly and put ammeters in series and voltmeters in parallel. In ‘explain’ answers about fuses, mention the live wire and the current rising until the wire melts. For induction, state ‘a changing magnetic field’ and what increases the voltage.</p><h4>Force on moving charged particles</h4><p><span class=\"tag\">Supplement</span> A beam of charged particles in a magnetic field is like a current, so each particle feels a force at right angles to both the field and its direction of motion (use Fleming's left-hand rule, remembering that conventional current is the direction positive charges move, so for electrons it is opposite to their motion). The beam bends along a curved path, and oppositely charged particles bend in opposite directions.</p>","kw":[["Current","Rate of flow of charge, I = Q/t."],["Potential difference","Energy transferred per unit charge between two points."],["EMF","Electrical work done by a source per unit charge."],["Resistance","V/I; opposition to current."],["Electromagnetic induction","Voltage induced in a conductor by a changing magnetic field."],["Transformer","Device using induction to change an alternating voltage."],["Fuse","Safety device that melts if current is too large."],["Earth wire","Safety wire connecting a metal case to ground."],["Solenoid","A long coil of wire carrying a current."],["Alternating current","Current that repeatedly reverses direction."],["Thermistor","Resistor whose resistance falls as temperature rises."],["LDR","Light-dependent resistor: resistance falls in light."],["Conventional current","Direction positive charge would flow: from + to − terminal."],["Eddy current","Unwanted circulating current induced in a metal core."],["Commutator","Split ring that reverses current in a d.c. motor every half turn."],["Slip rings","Rings that keep the generator coil connected while it rotates."],["Potential divider","Two resistors in series that share the supply voltage."],["RCCB","Residual current circuit breaker; trips if live and neutral currents differ."],["Induced magnetism","Temporary magnetism in iron placed in a magnetic field."],["Kilowatt-hour","The energy transferred by a 1 kW appliance in 1 hour."]],"f":["Q = It","V = IR","P = IV","E = IVt","R = R₁ + R₂ (series)","1/R = 1/R₁ + 1/R₂ (parallel)","Vp / Vs = Np / Ns","V_out = V_in × R₂/(R₁ + R₂)","Q = It; V = W/Q","R = ρL/A (qualitative: longer wire, higher R; thicker wire, lower R)","E = QV","V_out = V_in × R₂ / (R₁ + R₂)","P_loss = I²R (cables)","I = P / V (fuse choice)","energy (kWh) = power (kW) × time (h); cost = energy (kWh) × cost per kWh"],"qa":[["A 12 V supply drives 3 A. Find R.","R = 12/3 = 4 Ω."],["Find the total resistance of 6 Ω and 3 Ω in parallel.","1/R = 1/6 + 1/3 = 1/2, so R = 2 Ω."],["A transformer has 200 primary turns, 50 secondary turns, input 240 V. Find output.","Vs = 240 × 50/200 = 60 V."],["Why is the fuse placed in the live wire?","If it blows, the appliance is disconnected from the live voltage and is safe to touch."],["Why is a heater not connected in series with a fuse in the neutral wire?","If the fuse is in the neutral wire the heater would stay live when the fuse blows. The fuse must be in the live wire."],["Why does the d.c. motor use a split-ring commutator?","It reverses the current every half turn so the force keeps the coil turning in the same direction."],["A kettle (230 V) draws 10 A. Find its power and resistance.","P = 230 × 10 = 2300 W; R = 230/10 = 23 Ω."],["State the difference between a fuse and a circuit breaker.","A fuse melts and must be replaced; a circuit breaker trips and can be reset."],["What is the left-hand rule used for?","To find the direction of the force on a current-carrying wire in a magnetic field."],["Why do overhead power lines use very high voltage?","For the same power, higher voltage means lower current, so energy lost as heat (I²R) in the cables is much smaller."],["Explain how a step-up transformer works.","An a.c. in the primary creates a changing magnetic field in the iron core. This induces a voltage in the secondary, which is larger because it has more turns."],["Why is a soft iron core used in an electromagnet?","It magnetises strongly when current flows and demagnetises when the current stops."],["Draw a conclusion: a 60 W lamp on a 240 V supply. What current and fuse?","I = 60/240 = 0.25 A; use a 3 A fuse."]],"mcq":[["The voltmeter is connected…",["in series","in parallel","either way"],1,"It measures p.d. across a component."],["A 2 kW kettle runs for 3 minutes. Energy?",["360 kJ","6 kJ","36 kJ"],0,"2000 × 180 = 360 000 J."],["Soft iron is used for…",["permanent magnets","electromagnet cores","fuses"],1,"It magnetises and demagnetises easily."],["A parallel circuit has…",["same current everywhere","same p.d. across each branch","same resistance in all branches"],1,"Each branch has the supply p.d."],["Resistance of a wire increases when it is…",["longer","thicker","cooler always"],0,"Longer wire, higher resistance."],["A thermistor in a hot room has…",["high resistance","low resistance","infinite resistance"],1,"Resistance falls as temperature rises."],["A step-down transformer has…",["more secondary turns","fewer secondary turns","equal turns"],1,"Ns < Np lowers the voltage."],["Which wire is the earth wire?",["Brown","Blue","Green/yellow"],2,"Earth is green and yellow."],["Which material is used for the core of a transformer?",["Copper","Soft iron","Steel"],1,"Soft iron magnetises and demagnetises quickly."],["Doubling the number of turns in the secondary (Vp, Np fixed) will…",["halve Vs","double Vs","not change Vs"],1,"Vs ∝ Ns."],["The unit of EMF is…",["ohm","volt","coulomb"],1,"EMF is measured in volts."],["Which statement about a parallel circuit is correct?",["Current is the same in every branch","p.d. is the same across each branch","Resistance is bigger than the biggest branch"],1,"Each branch connects directly across the supply."]]};
const PH5={"t":"Chapter 5: Nuclear Physics (Cambridge 0625)","notes":"\n<span class=\"tag\">Topic 5.1</span><h3>The nuclear model of the atom</h3>\n<ul><li>The atom has a tiny, dense, positively charged <b>nucleus</b> containing protons and neutrons, with electrons orbiting.</li>\n<li><b>Rutherford scattering:</b> most alpha particles went straight through (atom mostly empty space); a few were deflected by large angles and very few bounced back (small, dense, positive nucleus).</li>\n<li>Proton: mass 1, charge +1. Neutron: mass 1, charge 0. Electron: mass ≈ 1/1840, charge −1.</li>\n<li><b>Proton (atomic) number Z</b> = number of protons. <b>Nucleon (mass) number A</b> = protons + neutrons. <b>Isotopes</b> have the same Z but different A.</li></ul>\n<ul><li>Atoms are neutral because proton number = electron number. Ions form when atoms gain or lose electrons.</li><li><b>Nuclide notation:</b> ᴬ_ZX. Carbon-12 and carbon-14 have Z = 6 but A = 12 and 14, so 6 and 8 neutrons.</li><li>Isotopes of an element have the same chemical properties because they have the same electrons; some isotopes are unstable and radioactive.</li></ul>\n<h4>Going deeper: scattering evidence</h4><ul><li>Thin gold foil, alpha source, detector. <b>Most</b> alphas pass straight through, so atoms are mostly empty space. <b>A few</b> are deflected by large angles because they are repelled by a concentrated positive charge. <b>Very few</b> bounce straight back because they hit the tiny dense nucleus.</li><li>This replaced the plum-pudding model. The nucleus is about 10⁻¹⁵ m across, around 100 000 times smaller than the atom.</li></ul>\n<svg class=\"v\" viewBox=\"0 0 340 170\" role=\"img\" aria-label=\"Alpha scattering\"><circle cx=\"220\" cy=\"85\" r=\"5\" fill=\"#ef4444\"/><text x=\"212\" y=\"110\" style=\"font-size:10px\">nucleus</text><path class=\"l\" d=\"M10 40H330\" stroke=\"#3b4fd8\"/><path class=\"l\" d=\"M10 60H180Q215 60 230 30L260 10\" stroke=\"#3b4fd8\" fill=\"none\"/><path class=\"l\" d=\"M10 75H205Q220 75 220 40L225 10\" stroke=\"#f59e0b\" fill=\"none\"/><path class=\"l\" d=\"M10 84H212L100 84\" stroke=\"#ec4899\" fill=\"none\"/><path class=\"l\" d=\"M10 125H330\" stroke=\"#3b4fd8\"/><text x=\"10\" y=\"160\" style=\"font-size:10px\">most pass straight · few deflected · very few rebound</text></svg><h4>Going deeper: structure of the atom</h4><div class=\"wrap\"><table><tr><th>Particle</th><th>Relative mass</th><th>Relative charge</th><th>Location</th></tr><tr><td>Proton</td><td>1</td><td>+1</td><td>Nucleus</td></tr><tr><td>Neutron</td><td>1</td><td>0</td><td>Nucleus</td></tr><tr><td>Electron</td><td>about 1/1840</td><td>−1</td><td>Orbits nucleus</td></tr></table></div><ul><li><b>Nuclide notation:</b> ᴬ_ZX. Sodium-23 is ²³₁₁Na: 11 protons, 12 neutrons, and 11 electrons in a neutral atom.</li><li>Almost all the atom's mass is in the nucleus, which is very small compared to the atom.</li><li><b>Isotopes:</b> same Z, different neutron numbers. Chlorine-35 and chlorine-37 behave the same chemically.</li><li><b>Why scattering evidence matters:</b> it replaced the plum-pudding model (positive charge spread evenly, electrons embedded) because a spread-out charge could not deflect alpha particles through large angles.</li></ul><div class=\"card\" style=\"margin:12px 0\"><span class=\"tag\">🎮 Simulation</span><h4 style=\"margin:.4em 0\">Nuclide builder</h4><label>Protons Z: <b id=\"nZv\">6</b><input type=\"range\" id=\"nZ\" min=\"1\" max=\"20\" value=\"6\" step=\"1\" oninput=\"sNu()\" style=\"padding:0;border:0;margin:4px 0\"></label><label>Neutrons N: <b id=\"nNv\">6</b><input type=\"range\" id=\"nN\" min=\"0\" max=\"25\" value=\"6\" step=\"1\" oninput=\"sNu()\" style=\"padding:0;border:0;margin:4px 0\"></label><svg class=\"v\" id=\"ng\" viewBox=\"0 0 300 100\"></svg><p id=\"no\"></p><img src=\"data:,\" alt=\"\" style=\"display:none\" onerror=\"sNu()\"></div><h4>Nuclear fission and fusion</h4><p><span class=\"tag\">Supplement</span> Fission is the splitting of a large nucleus into smaller nuclei. Example: ²³⁵₉₂U + ¹₀n → ¹⁴¹₅₆Ba + ⁹²₃₆Kr + 3 ¹₀n, with energy released. Fusion is the joining of small nuclei to form a larger nucleus. Example: ²₁H + ³₁H → ⁴₂He + ¹₀n, with energy released. In both, the products have slightly less mass than the starting nuclei, and the lost mass is released as energy (no values needed). Fusion is the process that powers the Sun.</p>\n<span class=\"tag\">Topic 5.2</span><h3>Radioactivity</h3>\n<ul><li>Radioactive decay is <b>random</b> and <b>spontaneous</b>; it is not affected by temperature or chemical state.</li>\n<li><b>Background radiation</b> comes from rocks, radon gas, cosmic rays, food and medical sources. Always subtract it from a measured count rate.</li>\n<li><table><tr><th>Radiation</th><th>Nature</th><th>Stopped by</th><th>Ionising</th></tr><tr><td>Alpha (α)</td><td>2 protons + 2 neutrons (helium nucleus)</td><td>Paper, few cm of air</td><td>Strongest</td></tr><tr><td>Beta (β)</td><td>Fast electron</td><td>Few mm of aluminium</td><td>Medium</td></tr><tr><td>Gamma (γ)</td><td>EM wave</td><td>Thick lead / concrete</td><td>Weakest</td></tr></table></li>\n<li><b>Decay equations:</b> α decay: A falls by 4, Z falls by 2. β decay: A unchanged, Z rises by 1 (a neutron becomes a proton). γ: no change in A or Z.</li>\n<li><b>Half-life:</b> the time for half the nuclei in a sample to decay, or for the count rate to halve. Use a graph or repeated halving.</li>\n<li><b>Uses:</b> smoke detectors (α), thickness gauges (β), sterilising and medical tracers (γ), carbon dating. <b>Safety:</b> keep sources in lead-lined boxes, use tongs, limit exposure time, keep distance.</li></ul><h4>More detail</h4><ul><li><b>Detection:</b> a Geiger–Müller tube and counter, or a photographic film; count rate is measured in counts per second or minute.</li><li><b>Half-life measurement:</b> record the count rate at regular times, subtract the background and plot count rate against time; read off the time for the count rate to halve. The shape is an exponential decay curve.</li><li><b>Hazards:</b> radiation ionises atoms and can damage or mutate cells (cancer). Alpha is most dangerous inside the body, gamma is most dangerous outside.</li><li><span class=\"tag\" style=\"background:#ec4899;color:#fff\">Supplement</span> Beta decay equation example: ¹⁴₆C → ¹⁴₇N + ⁰₋₁e. Alpha: ²²⁶₈₈Ra → ²²²₈₆Rn + ⁴₂He. Choose the half-life to suit the use: medical tracers need a short half-life; storing waste needs very long timescales.</li></ul>\n<svg class=\"v\" viewBox=\"0 0 400 150\" role=\"img\" aria-label=\"Penetration of alpha, beta and gamma\"><rect x=\"150\" y=\"10\" width=\"8\" height=\"120\" fill=\"#a3a3a3\"/><rect x=\"230\" y=\"10\" width=\"14\" height=\"120\" fill=\"#94a3b8\"/><rect x=\"310\" y=\"10\" width=\"40\" height=\"120\" fill=\"#475569\"/><text x=\"132\" y=\"142\">paper</text><text x=\"214\" y=\"142\">aluminium</text><text x=\"318\" y=\"142\">lead</text><path class=\"l\" d=\"M10 35H148M10 75H228M10 115H300\" /><text x=\"10\" y=\"28\">α</text><text x=\"10\" y=\"68\">β</text><text x=\"10\" y=\"108\">γ</text><path class=\"l\" d=\"M10 115H305M350 115H395\" stroke=\"#ec4899\"/></svg><div class=\"card\" style=\"margin:12px 0\"><span class=\"tag\">🎮 Simulation</span><h4 style=\"margin:.4em 0\">Radioactive decay and half-life (100 nuclei)</h4><button onclick=\"sD(1)\">Next half-life</button> <button class=\"o\" onclick=\"sD(0)\">Reset</button><svg class=\"v\" id=\"dg\" viewBox=\"0 0 220 120\"></svg><p id=\"do\"></p><img src=\"data:,\" alt=\"\" style=\"display:none\" onerror=\"sD()\"></div>\n<svg class=\"v\" viewBox=\"0 0 340 150\" role=\"img\" aria-label=\"Deflection of radiation in a magnetic field\"><circle cx=\"40\" cy=\"95\" r=\"8\" fill=\"#a3a3a3\"/><text x=\"22\" y=\"122\" style=\"font-size:10px\">source</text><path class=\"l\" d=\"M48 95H320\" stroke=\"#10b981\"/><text x=\"292\" y=\"90\" style=\"font-size:10px\">γ</text><path class=\"l\" d=\"M48 95Q150 90 250 30\" stroke=\"#ec4899\" fill=\"none\"/><text x=\"256\" y=\"26\" style=\"font-size:10px\">β (large, one way)</text><path class=\"l\" d=\"M48 95Q220 108 270 128\" stroke=\"#f59e0b\" fill=\"none\"/><text x=\"200\" y=\"146\" style=\"font-size:10px\">α (small, other way)</text><text x=\"6\" y=\"14\" style=\"font-size:10px\">Magnetic field into the page</text></svg><h4>Going deeper: radioactive decay in detail</h4><ul><li><b>Detecting radiation:</b> a Geiger–Müller tube counts ionising events; photographic film darkens; a spark counter and cloud chamber also detect ionisation.</li><li><b>Deflection:</b> in electric and magnetic fields, alpha (positive) and beta (negative) are deflected in opposite directions, beta much more because it has a much smaller mass. Gamma is not deflected because it has no charge.</li><li><b>Ionising power:</b> alpha is strongest because it is large and carries charge; it loses its energy in a few centimetres of air. Gamma ionises least but penetrates furthest.</li><li><b>Choosing a source:</b> thickness gauges need beta (partly absorbed by the material); smoke detectors use alpha (ionises air, current drops when smoke enters); medical tracers need gamma (leaves the body) and a short half-life; sterilising uses gamma.</li><li><b>Half-life from a graph:</b> choose the activity at a time, find where it has halved, read the time difference; repeat to check it is constant.</li><li><b>Safety:</b> keep sources in lead-lined containers, hold with tongs, never point at people, keep exposure time short, keep distance large, wear dosimeter badges.</li><li><span class=\"tag\" style=\"background:#ec4899;color:#fff\">Supplement</span> Random decay: you cannot predict when one nucleus decays, only the probability. With a large number of nuclei the half-life is a reliable average. Nuclear changes: alpha and beta decay change the element; gamma does not.</li><li><span class=\"tag\" style=\"background:#ec4899;color:#fff\">Supplement</span> Worked example: activity 640 counts/min with background 40. Corrected = 600. After 3 half-lives: 600 ÷ 8 = 75 counts/min (plus background, so the measured value is 115).</li></ul><div class=\"card\" style=\"margin:12px 0\"><span class=\"tag\">🎮 Simulation</span><h4 style=\"margin:.4em 0\">Decay equation builder</h4><label>Decay type <select id=\"dT\" onchange=\"sDe()\"><option value=\"a\">Alpha</option><option value=\"b\">Beta</option><option value=\"g\">Gamma</option></select></label><label>Parent protons Z: <b id=\"dZv\">92</b><input type=\"range\" id=\"dZ\" min=\"80\" max=\"92\" value=\"92\" step=\"1\" oninput=\"sDe()\" style=\"padding:0;border:0;margin:4px 0\"></label><label>Parent nucleon number A: <b id=\"dAv\">238</b><input type=\"range\" id=\"dA\" min=\"200\" max=\"240\" value=\"238\" step=\"1\" oninput=\"sDe()\" style=\"padding:0;border:0;margin:4px 0\"></label><p id=\"dq\"></p><img src=\"data:,\" alt=\"\" style=\"display:none\" onerror=\"sDe()\"></div><div class=\"card\" style=\"margin:12px 0\"><span class=\"tag\">🎮 Simulation</span><h4 style=\"margin:.4em 0\">Half-life curve</h4><label>Half-life (days): <b id=\"jHv\">5</b><input type=\"range\" id=\"jH\" min=\"1\" max=\"30\" value=\"5\" step=\"1\" oninput=\"sHl()\" style=\"padding:0;border:0;margin:4px 0\"></label><label>Time elapsed (days): <b id=\"jTv\">10</b><input type=\"range\" id=\"jT\" min=\"0\" max=\"60\" value=\"10\" step=\"1\" oninput=\"sHl()\" style=\"padding:0;border:0;margin:4px 0\"></label><svg class=\"v\" id=\"jg\" viewBox=\"0 0 300 130\"></svg><p id=\"jo\"></p><img src=\"data:,\" alt=\"\" style=\"display:none\" onerror=\"sHl()\"></div>\n<p style=\"margin-top:14px\"><b>Exam tips:</b> Quote alpha, beta and gamma by nature, penetration and ionisation. In decay equations, check that nucleon and proton numbers balance on both sides. For half-life, subtract background first and show each halving step.</p><h4>Why some nuclei are unstable</h4><p><span class=\"tag\">Supplement</span> An isotope may be radioactive because its nucleus has an excess of neutrons and/or is too heavy. Decay makes the nucleus more stable and reduces the number of excess neutrons. In β⁻ emission a neutron changes into a proton and an electron.</p><div class=\"f\">neutron → proton + electron</div><h4>Choosing a radioactive source</h4><p><span class=\"tag\">Supplement</span> The type of radiation and the half-life decide which isotope is used. Gamma rays irradiate food to kill bacteria, sterilise equipment, and help diagnose and treat cancer. Medical tracers need a short half-life so the patient is not exposed for long. Smoke alarms use an alpha source with a long half-life; smoke absorbs alpha particles, which changes the current. Thickness control uses beta radiation for thin materials such as paper or foil, or gamma for thicker metal, chosen by how well the radiation is absorbed.</p><h4>Reducing exposure</h4><p><span class=\"tag\">Supplement</span> Reduce the risk by shortening the time of exposure, increasing the distance from the source (use tongs, never hold a source) and using shielding such as lead or concrete to absorb the radiation. Sources are kept in lead-lined containers.</p>","kw":[["Nucleon","A proton or neutron."],["Isotopes","Atoms with the same proton number but different nucleon numbers."],["Background radiation","Low-level radiation always present in the environment."],["Alpha particle","Helium nucleus: 2 protons and 2 neutrons."],["Beta particle","Fast-moving electron from the nucleus."],["Gamma ray","High-energy electromagnetic radiation from the nucleus."],["Half-life","Time for half the unstable nuclei to decay."],["Ionisation","Removing electrons from atoms to make ions."],["Nuclide","A particular type of nucleus, given by its proton and nucleon numbers."],["Count rate","Number of detected counts per unit time."],["Nuclide","A specific nucleus with a particular number of protons and neutrons."],["Plum-pudding model","Early model with positive charge spread through the atom and electrons embedded in it."],["Count rate","Number of detected decays per unit time."],["Penetration","How far radiation passes through a material."],["Nuclear fission","The splitting of a large nucleus into smaller nuclei, releasing energy."],["Nuclear fusion","The joining of small nuclei into a larger nucleus, releasing energy."]],"f":["A = Z + number of neutrons","α decay: A − 4, Z − 2","β decay: A same, Z + 1","Remaining = initial × (½)ⁿ (n half-lives)","Mass number A = Z + N","Activity after n half-lives = initial ÷ 2ⁿ","Corrected count = measured − background","β⁻ decay: neutron → proton + electron"],"qa":[["What does Rutherford's experiment show?","Atoms have a tiny, dense, positive nucleus, and are mostly empty space."],["A sample has half-life 6 h. Starting with 80 g of the isotope, how much remains after 18 h?","3 half-lives: 80 → 40 → 20 → 10 g."],["Write the result of α decay of ²³⁸₉₂U.","Thorium-234: ²³⁴₉₀Th plus an alpha particle."],["Why must background radiation be subtracted?","It is always present and would otherwise make the count rate too high."],["Which radiation is most dangerous outside the body, and why?","Gamma, because it is highly penetrating."],["Describe what happens to a nucleus in beta decay.","A neutron changes into a proton and an electron; the electron is emitted."],["A source has activity 800 counts/min, half-life 3 days. Activity after 9 days?","3 half-lives: 800 → 400 → 200 → 100 counts/min."],["Give one safety precaution when using a radioactive source.","Use tongs, store it in a lead-lined box, or keep it pointed away from people."],["Which radiation would you use to monitor paper thickness and why?","Beta; alpha is stopped by paper, gamma passes through almost unchanged, but beta changes noticeably with thickness."],["Why is alpha deflected less than beta in the same field?","Alpha particles are much more massive than beta particles."],["A source's corrected count falls from 800 to 100 in 15 days. Find the half-life.","800 → 400 → 200 → 100 is 3 half-lives, so half-life = 5 days."],["Why is gamma used to sterilise equipment?","It penetrates the packaging and kills microorganisms without making the objects radioactive."]],"mcq":[["Which radiation is stopped by paper?",["Alpha","Beta","Gamma"],0,"Alpha is the least penetrating."],["Isotopes differ in the number of…",["protons","neutrons","electrons"],1,"Same Z, different A."],["After 2 half-lives, the fraction left is…",["1/2","1/4","1/8"],1,"(½)² = ¼."],["In beta decay, the proton number…",["falls by 2","rises by 1","stays the same"],1,"A neutron becomes a proton."],["Alpha particles are…",["electrons","helium nuclei","EM waves"],1,"2 protons + 2 neutrons."],["The nucleon number is…",["number of protons","protons + neutrons","number of electrons"],1,"A = Z + N."],["Which radiation is deflected most by a magnetic field relative to its mass?",["Alpha","Beta","Gamma"],1,"Beta is light and charged; gamma is not deflected."],["Background radiation comes from…",["radon in rocks","only nuclear power","only X-rays"],0,"Rocks, cosmic rays, food and others."],["The nucleus of ²³⁵₉₂U contains…",["92 protons, 143 neutrons","143 protons, 92 neutrons","235 protons"],0,"N = 235 − 92 = 143."],["In alpha decay the nucleon number…",["increases by 4","decreases by 4","does not change"],1,"An alpha particle is ⁴₂He."],["Which radiation is not affected by electric fields?",["Alpha","Beta","Gamma"],2,"Gamma has no charge."],["After 2 half-lives 400 counts/min becomes…",["200","100","50"],1,"400 → 200 → 100."]]};
const PH6={"t":"Chapter 6: Space Physics (Cambridge 0625)","notes":"\n<span class=\"tag\">Topic 6.1</span><h3>Earth and the Solar System</h3>\n<ul><li><b>Earth's rotation</b> on its axis (24 h) gives day and night. <b>Tilt</b> of 23.5° and its orbit (365¼ days) give the seasons. The Moon orbits Earth in about 27.3 days.</li>\n<li>The Sun is a star at the centre; eight planets, dwarf planets, moons, asteroids and comets orbit it.</li>\n<li><b>Orbits:</b> planets move in near-circular orbits. Gravitational force towards the Sun provides the centripetal force. Closer planets have shorter orbital periods and faster orbital speeds.</li>\n<li><b>Orbital speed:</b> v = 2πr ÷ T. The strength of gravity depends on the mass of the object.</li></ul>\n<h4>More detail</h4><ul><li><b>Planets in order:</b> Mercury, Venus, Earth, Mars (rocky), Jupiter, Saturn (gas giants), Uranus, Neptune (ice giants). The asteroid belt lies between Mars and Jupiter. Comets follow elongated elliptical orbits and speed up near the Sun.</li><li>The Moon is a natural satellite; other satellites are man-made. The Sun's gravity keeps the planets in orbit; gravity gets weaker with distance.</li><li><b>Time facts:</b> Earth turns once in 24 h; Earth orbits in 365¼ days (leap years); the Moon takes about 27.3 days to orbit Earth. Light from the Sun takes about 8 minutes to reach Earth.</li><li><span class=\"tag\" style=\"background:#ec4899;color:#fff\">Supplement</span> Orbital speed example: Earth orbit 9.4 × 10¹¹ m circumference in 3.15 × 10⁷ s gives v ≈ 3.0 × 10⁴ m/s. For circular orbits, a planet's speed is constant but its velocity changes direction.</li></ul>\n<svg class=\"v\" viewBox=\"0 0 440 90\" role=\"img\" aria-label=\"Order of the planets\"><circle cx=\"30\" cy=\"40\" r=\"22\" fill=\"#f59e0b\"/><circle cx=\"75\" cy=\"40\" r=\"3\" fill=\"#94a3b8\"/><circle cx=\"95\" cy=\"40\" r=\"5\" fill=\"#fbbf24\"/><circle cx=\"118\" cy=\"40\" r=\"5.5\" fill=\"#3b82f6\"/><circle cx=\"140\" cy=\"40\" r=\"4\"
