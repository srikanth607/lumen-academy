const CH11={t:"Chapter 11: Organic Chemistry (Cambridge 0620)",notes:`
<span class="tag">Topic 11.1</span><h3>Formulae, functional groups and homologous series</h3>
<p class="lg"><b>Key:</b> <span class="xt">EXT</span> = Extended (Supplement) only. No tag = Core (Extended students need it too).</p>
<p>Organic compounds contain <b>carbon</b>. A <b>homologous series</b> is a family with the <b>same functional group</b> and general formula; members differ by CH₂, show gradual trends in physical properties (e.g. boiling point rises with chain length) and have similar chemical properties. A <b>functional group</b> is the atom or group that gives a family its reactions. <b>Isomers</b> have the same molecular formula but different structures.</p>
<ul><li><b>Naming:</b> the stem shows the number of carbons: meth- (1), eth- (2), prop- (3), but- (4), pent- (5), hex- (6). The ending shows the family: <b>-ane</b> (alkane), <b>-ene</b> (alkene), <b>-anol</b> (alcohol), <b>-anoic acid</b> (carboxylic acid).</li>
<li><span class="xt">EXT</span> <b>Isomers example:</b> C₄H₁₀ is either butane (a straight chain) or methylpropane (a branched chain). Alkenes can also change the position of the double bond (but-1-ene and but-2-ene).</li>
<li><span class="xt">EXT</span> <b>Displayed formula</b> shows all atoms and all bonds; <b>structural formula</b> groups atoms, e.g. CH₃CH₂OH.</li>
<li><b>Series to know:</b> alkanes methane CH₄, ethane C₂H₆, propane C₃H₈, butane C₄H₁₀; alkenes ethene C₂H₄, propene C₃H₆, butene C₄H₈; alcohols methanol CH₃OH, ethanol C₂H₅OH, propanol C₃H₇OH; acids methanoic HCOOH, ethanoic CH₃COOH, propanoic C₂H₅COOH.</li>
<li><b>Saturated and unsaturated:</b> saturated means all C–C bonds are single (alkanes); unsaturated means at least one C=C double bond (alkenes), so the molecule can take on more atoms.</li>
<li><b>Same series, same chemistry:</b> every alcohol burns and every carboxylic acid reacts with carbonates to give CO₂, because the functional group controls the reactions.</li>
<li><b>Drawing a displayed formula:</b> show every atom and every bond. Carbon forms 4 bonds, hydrogen 1, oxygen 2.</li>
<li><span class="xt">EXT</span> <b>Trends:</b> the longer the chain, the higher the boiling point and the thicker (more viscous) and less flammable the compound.</li></ul>
<div class="wrap"><table><tr><th>Family</th><th>Group</th><th>General formula</th><th>Example</th></tr><tr><td>Alkane</td><td>C–C</td><td>CₙH₂ₙ₊₂</td><td>CH₄ methane</td></tr><tr><td>Alkene</td><td>C=C</td><td>CₙH₂ₙ</td><td>C₂H₄ ethene</td></tr><tr><td>Alcohol</td><td>–OH</td><td>CₙH₂ₙ₊₁OH</td><td>C₂H₅OH ethanol</td></tr><tr><td>Carboxylic acid</td><td>–COOH</td><td>CₙH₂ₙ₊₁COOH</td><td>CH₃COOH ethanoic acid</td></tr></table></div>
<div class="card" style="margin:12px 0"><b>🎛️ Try it: alkane builder</b><br>Carbon atoms: <input type="range" min="1" max="8" value="1" oninput="var n=+this.value,nm=['meth','eth','prop','but','pent','hex','hept','oct'][n-1];document.getElementById('ak').textContent=nm+'ane: C'+n+'H'+(2*n+2)"><b id="ak">methane: C1H4</b></div>
<span class="tag">Topic 11.2</span><h3>Fuels and alkanes</h3>
<svg viewBox="0 0 360 200" style="width:100%;max-width:400px;display:block;margin:10px auto" role="img" aria-label="Fractionating column"><defs><linearGradient id="fc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs><rect x="120" y="10" width="90" height="180" rx="8" fill="url(#fc)" fill-opacity=".55" stroke="currentColor" stroke-width="2"/><g stroke="currentColor"><path d="M120 46H210M120 82H210M120 118H210M120 154H210"/></g><g font-size="11" fill="currentColor"><text x="218" y="32">refinery gas</text><text x="218" y="68">petrol</text><text x="218" y="104">kerosene</text><text x="218" y="140">diesel</text><text x="218" y="176">fuel oil, bitumen</text><text x="4" y="32">cooler: short</text><text x="4" y="176">hotter: long</text><text x="4" y="104">crude oil in →</text></g></svg>
<ul><li><b>Crude oil</b> is a mixture of hydrocarbons separated by <b>fractional distillation</b> in a column hot at the bottom, cool at the top. Small molecules (refinery gas, petrol) have low boiling points and come off at the top; large molecules (bitumen) come off at the bottom.</li>
<li><b>Alkanes</b> are saturated (only single bonds) and fairly unreactive. They burn completely: CH₄ + 2O₂ → CO₂ + 2H₂O. <b>Substitution</b> with chlorine needs UV light: CH₄ + Cl₂ → CH₃Cl + HCl.</li>
<li><b>Cracking</b> breaks large alkanes into smaller, more useful alkanes and alkenes using heat and a catalyst.</li></ul>
<ul><li><b>Fractional distillation steps:</b> crude oil is heated until it vaporises and enters the column, hot at the bottom and cooler at the top. Vapours rise and condense when they reach a level cooler than their boiling point. Short molecules reach the top; long, viscous ones condense near the bottom.</li>
<li><b>Alkane properties:</b> generally unreactive (no functional group) except in burning and substitution. They do not react with acids, alkalis or bromine water.</li>
<li><span class="xt">EXT</span> <b>Substitution with chlorine (supplement):</b> UV light provides the activation energy and a hydrogen atom is replaced by chlorine: CH₄ + Cl₂ → CH₃Cl + HCl (monosubstitution only).</li>
<li><b>Cracking example:</b> C₁₀H₂₂ → C₈H₁₈ + C₂H₄. It happens because there is more demand for small fuels such as petrol and for alkenes used to make polymers.</li>
<li><b>Fractions and uses:</b> refinery gas (heating), petrol (cars), naphtha (chemicals), kerosene (jets), diesel (lorries), fuel oil (ships), lubricating oil, bitumen (roads).</li>
<li><b>Incomplete combustion</b> in limited oxygen produces carbon monoxide and soot (carbon).</li></ul>
<ul><li><b>Fossil fuels:</b> coal, natural gas and petroleum. Methane is the main constituent of natural gas. Petroleum is a mixture of hydrocarbons.</li>
<li><b>Up the fractionating column:</b> chain length decreases, volatility increases, boiling point falls and viscosity falls.</li></ul>
<span class="tag">Topic 11.3</span><h3>Alkenes</h3>
<svg class="v" viewBox="0 0 400 100" role="img" aria-label="Ethene addition"><text x="10" y="30" class="t">H₂C=CH₂ + Br₂ → BrH₂C–CH₂Br</text><text x="10" y="58">C=C opens: addition, only one product</text><text x="10" y="80">orange bromine water → colourless = alkene</text></svg>
<p>Alkenes are <b>unsaturated</b> (contain C=C) and more reactive. <b>Bromine water test:</b> alkenes turn it from orange to colourless; alkanes do not. <b>Addition reactions:</b> C₂H₄ + Br₂ → C₂H₄Br₂; + H₂ (nickel catalyst) gives an alkane; + steam (catalyst, high pressure) gives ethanol.</p>
<ul><li><span class="xt">EXT</span> The <b>ethene + bromine</b> reaction has no catalyst: the C=C opens, one Br adds to each carbon, giving 1,2-dibromoethane.</li>
<li><b>Why crack?</b> Long-chain fractions are in low demand, but petrol-sized alkanes and alkenes are in high demand. Hot vapour is passed over a catalyst (e.g. aluminium oxide) at high temperature; hydrogen is also made.</li>
<li><span class="xt">EXT</span> <b>Addition</b> gives only one product, so there is no waste. Ethene + hydrogen → ethane (nickel catalyst); ethene + steam → ethanol (acid catalyst).</li>
<li><b>Bromine water test:</b> shake with orange aqueous bromine. Alkenes decolourise it at once; alkanes leave it orange-brown.</li>
<li>Alkenes are made by cracking and are the starting materials for polymers and alcohols.</li>
<li><span class="xt">EXT</span> <b>Steam conditions:</b> 300 °C, 60 atm, phosphoric acid catalyst (supplement).</li></ul>
<span class="tag">Topic 11.4</span><h3>Alcohols</h3>
<svg class="v" viewBox="0 0 400 130" role="img" aria-label="Fermentation flask"><polygon points="170,15 210,15 210,45 250,105 130,105 170,45" class="l"/><polygon points="145,80 235,80 250,105 130,105" fill="#eab308" fill-opacity=".5"/><circle cx="170" cy="92" r="3"/><circle cx="195" cy="86" r="3"/><circle cx="195" cy="60" r="3"/><text x="265" y="60">yeast, 25–35 °C</text><text x="265" y="78">no oxygen</text><text x="10" y="55">glucose</text><text x="10" y="73">→ ethanol + CO₂</text></svg>
<ul><li><b>Fermentation:</b> glucose → ethanol + CO₂ using yeast at about 30 °C, no oxygen: C₆H₁₂O₆ → 2C₂H₅OH + 2CO₂.</li>
<li><span class="xt">EXT</span> <b>Hydration of ethene</b> with steam is faster and gives pure ethanol, but uses non-renewable crude oil.</li>
<li>Ethanol burns, is a solvent and a fuel.</li></ul>
<ul><li><b>Uses of ethanol:</b> a solvent in perfumes, paints and medicines, and a fuel (alone or mixed with petrol). It burns with a clean blue flame.</li>
<li><b>Fermentation details:</b> yeast enzymes convert glucose to ethanol. Above about 40 °C the enzymes are denatured; below 25 °C the reaction is too slow. Oxygen must be kept out or ethanoic acid forms. The mixture holds only about 15% ethanol, so fractional distillation is used to concentrate it.</li>
<li><b>Combustion:</b> C₂H₅OH + 3O₂ → 2CO₂ + 3H₂O.</li>
<li><span class="xt">EXT</span> <b>Isomers of alcohols (supplement):</b> propan-1-ol CH₃CH₂CH₂OH and propan-2-ol CH₃CH(OH)CH₃; butan-1-ol CH₃CH₂CH₂CH₂OH and butan-2-ol CH₃CH(OH)CH₂CH₃.</li>
<li><span class="xt">EXT</span> <b>Fermentation:</b> 25 to 35 °C, yeast, no oxygen; renewable and low-tech but slow and gives impure ethanol in batches. <b>Steam addition:</b> 300 °C, 6000 kPa (60 atm), acid catalyst; fast, continuous and pure, but uses non-renewable ethene and much energy.</li></ul>
<span class="tag">Topic 11.5</span><h3>Carboxylic acids</h3>
<svg class="v" viewBox="0 0 400 90" role="img" aria-label="Ester formation"><text x="10" y="28" class="t">CH₃CH₂OH + CH₃COOH ⇌ CH₃COOCH₂CH₃ + H₂O</text><text x="10" y="55">ethanol + ethanoic acid ⇌ ethyl ethanoate + water</text><text x="10" y="76">(acid catalyst; esters smell fruity)</text></svg>
<p>Ethanoic acid is a <b>weak acid</b>: it reacts with metals, carbonates and bases like other acids, but is only partially ionised. It forms by <b>oxidising ethanol</b> (acidified potassium manganate(VII) or microbes in air). Ethanol + ethanoic acid → an <b>ester</b> (with acid catalyst), sweet-smelling, used in perfumes.</p>
<ul><li><b>Salts of ethanoic acid:</b> with magnesium it gives magnesium ethanoate + hydrogen; with sodium hydroxide, CH₃COOH + NaOH → CH₃COONa + H₂O; with sodium carbonate it fizzes, giving CO₂, water and sodium ethanoate.</li>
<li><span class="xt">EXT</span> <b>Oxidation of ethanol:</b> acidified potassium manganate(VII) turns from purple to colourless as ethanol is oxidised to ethanoic acid. In vinegar production, bacteria in air do the same job.</li>
<li><span class="xt">EXT</span> <b>Naming esters:</b> alcohol first, then acid: ethanol + ethanoic acid → ethyl ethanoate (CH₃COOCH₂CH₃) + water, with an acid catalyst. Methanol + propanoic acid gives methyl propanoate.</li>
<li><b>Ethanoic acid reactions:</b> with magnesium it gives magnesium ethanoate + hydrogen; with sodium carbonate it gives sodium ethanoate + water + carbon dioxide.</li>
<li><span class="xt">EXT</span> <b>Why weak?</b> it only partly ionises in water, so it has a higher pH than hydrochloric acid of the same concentration and reacts more slowly.</li>
<li><span class="xt">EXT</span> <b>Ester equation:</b> ethanol + ethanoic acid ⇌ ethyl ethanoate + water. Esters have a fruity smell and are used in food flavouring.</li></ul>
<span class="tag">Topic 11.6</span><h3>Polymers</h3>
<svg class="v" viewBox="0 0 400 100" role="img" aria-label="Addition polymer"><text x="10" y="25">monomers (C=C)</text><text x="10" y="45" class="t">CH₂=CH₂  CH₂=CH₂  CH₂=CH₂</text><text x="10" y="70" class="t">→ –CH₂–CH₂–CH₂–CH₂–CH₂–CH₂–</text><text x="10" y="92" style="font-size:11px">poly(ethene): the double bonds open and join</text></svg>
<ul><li><b>Addition polymers:</b> many alkene monomers join, opening the C=C, e.g. ethene → poly(ethene). Only one product is made.</li>
<li><span class="xt">EXT</span> <b>Condensation polymers:</b> two monomers join, losing small molecules like water. <b>Nylon</b> (polyamide) from diamine + dicarboxylic acid; <b>PET</b> (polyester) from diol + dicarboxylic acid. Proteins are natural polyamides.</li>
<li><b>Plastics</b> are non-biodegradable and cause pollution; options are recycling and burning (which releases toxic gases).</li></ul>
<ul><li><b>Addition polymerisation of ethene:</b> n CH₂=CH₂ → (–CH₂–CH₂–)ₙ at high pressure with a catalyst. The polymer is the only product, so no small molecule is lost.</li>
<li><b>Properties and disposal:</b> most plastics are unreactive and do not rot (non-biodegradable). In landfill they last hundreds of years, in oceans they harm sea life, and burning releases CO₂ and toxic gases (HCl from PVC, CO from incomplete burning).</li>
<li><b>Natural polymers:</b> proteins (amino acids), starch (glucose) and DNA.</li>
<li><b>Poly(ethene)</b> is used for bags and bottles, <b>poly(propene)</b> for ropes and crates, <b>PVC</b> for pipes and cable insulation, and <b>PTFE</b> for non-stick pans.</li>
<li><span class="xt">EXT</span> <b>Nylon</b> is used for clothes, ropes and carpets; <b>PET</b> for bottles and polyester fabric.</li>
<li><span class="xt">EXT</span> <b>Proteins</b> are condensation polymers of amino acids joined by amide links; <b>starch</b> is a natural polymer of glucose. Both are hydrolysed (broken down) by enzymes.</li>
<li><b>Environmental problems:</b> plastics last in landfill, harm wildlife in oceans and release toxic gases like HCl when burnt (PVC).</li></ul>
<ul><li><span class="xt">EXT</span> <b>Repeat unit (supplement):</b> for poly(ethene) it is –CH₂–CH₂–, from ethene CH₂=CH₂. To find the monomer of an addition polymer, put the double bond back. Condensation polymers show <b>amide links</b> (–CONH–, nylon) or <b>ester links</b> (–COO–, PET).</li>
<li><span class="xt">EXT</span> <b>Making them:</b> nylon from a dicarboxylic acid + a diamine; PET from a dicarboxylic acid + a diol. Water is lost at each link.</li>
<li><span class="xt">EXT</span> <b>PET recycling:</b> PET can be converted back into monomers and re-polymerised.</li>
<li><span class="xt">EXT</span> <b>Amino acids:</b> H₂N–CHR–COOH, where R varies. They join by amide links into proteins, which are natural polyamides.</li></ul>
<div class="ext"><h4><span class="xt">EXT</span>Extended (Supplement) checklist: Chapter 11</h4><ul><li><b>Structural formula and isomers:</b> a structural formula shows how atoms are arranged (CH₃CH₂OH, CH₃COOCH₃). Structural isomers have the same molecular formula but different structures: C₄H₁₀ as CH₃CH₂CH₂CH₃ and CH₃CH(CH₃)CH₃; C₄H₈ as but-1-ene and but-2-ene.</li>
<li><b>Homologous series:</b> same functional group, same general formula, each member differs by –CH₂–, trend in physical properties, similar chemical properties.</li>
<li><b>Naming (unbranched):</b> alkanes, alkenes (but-1-ene, but-2-ene), alcohols (propan-1-ol, propan-2-ol, butan-1-ol, butan-2-ol), carboxylic acids up to four carbons, and esters (alcohol name first, then acid: methanol + ethanoic acid → methyl ethanoate).</li>
<li><b>Alkane substitution:</b> one atom replaced by another. CH₄ + Cl₂ → CH₃Cl + HCl, a photochemical reaction where UV light supplies the activation energy (monosubstitution only).</li>
<li><b>Alkene addition:</b> only one product forms. With bromine: C₂H₄ + Br₂ → CH₂BrCH₂Br (orange → colourless); with H₂ and a nickel catalyst → alkane; with steam and an acid catalyst → alcohol.</li>
<li><b>Ethanol manufacture:</b> fermentation uses renewable sugar and low temperature but is slow, batch and impure; steam addition is fast, continuous and pure but uses non-renewable crude oil and high temperature and pressure.</li>
<li><b>Ethanol to ethanoic acid:</b> oxidation with acidified KMnO₄ (purple → colourless) or bacterial oxidation (vinegar).</li>
<li><b>Esterification:</b> carboxylic acid + alcohol ⇌ ester + water, with an acid catalyst (concentrated H₂SO₄).</li>
<li><b>Polymers:</b> addition polymers come from alkene monomers with one product and no small molecule lost. Condensation polymers join two different monomers and lose a small molecule (water): polyamides (nylon) from a dicarboxylic acid and a diamine (amide link –CONH–); polyesters (PET) from a dicarboxylic acid and a diol (ester link –COO–). PET can be broken back into monomers and re-polymerised. Proteins are natural polyamides made from amino acids, H₂N–CHR–COOH.</li></ul></div>

const CH12={t:"Chapter 12: Experimental Techniques and Chemical Analysis (Cambridge 0620)",notes:`
<span class="tag">Topic 12.1</span><h3>Apparatus and measurement</h3>
<p class="lg"><b>Key:</b> <span class="xt">EXT</span> = Extended (Supplement) only. No tag = Core (Extended students need it too).</p>
<svg class="v" viewBox="0 0 400 150" role="img" aria-label="Apparatus"><rect x="40" y="25" width="34" height="90" class="l"/><path d="M40 45H52M40 65H52M40 85H52" class="l"/><rect x="170" y="10" width="14" height="105" class="l"/><circle cx="177" cy="95" r="5" fill="#ef4444"/><polygon points="285,35 305,35 305,65 335,115 255,115 285,65" class="l"/><text x="20" y="135">cylinder</text><text x="150" y="135">burette</text><text x="250" y="135">conical flask</text></svg>
<ul><li><b>Time:</b> stop-watch. <b>Temperature:</b> thermometer. <b>Mass:</b> balance. <b>Volume:</b> measuring cylinder (approximate), <b>pipette</b> (fixed accurate volume), <b>burette</b> (variable accurate volume, titration), gas syringe (gas volume).</li>
<li>Gases can be collected by <b>downward delivery</b> (denser than air), <b>upward delivery</b> (less dense) or over water (if insoluble).</li>
<li><b>Titration:</b> add acid from a burette to alkali with an indicator until the colour changes (end-point); repeat for concordant results.</li></ul>
<ul><li><b>Titration steps:</b> rinse the pipette and burette; fill the burette; use a pipette to add 25.0 cm³ of alkali to the flask with indicator; add acid slowly while swirling; stop at the first permanent colour change; repeat until two results agree within 0.1 cm³.</li>
<li><span class="xt">EXT</span> <b>Calculation (supplement):</b> moles = concentration × volume (dm³). Example: 25.0 cm³ of NaOH needs 20.0 cm³ of 0.100 mol/dm³ HCl. Moles HCl = 0.100 × 0.0200 = 0.00200 mol. The ratio is 1:1, so NaOH conc = 0.00200 ÷ 0.0250 = 0.0800 mol/dm³.</li>
<li><b>Safety and accuracy:</b> use a white tile under the flask, read the meniscus at eye level, and wear goggles.</li></ul>
<ul><li><b>Measuring with care:</b> read a burette or cylinder at eye level at the bottom of the meniscus; read thermometers to half a division; use a balance precise to at least 0.1 g; time to the nearest second.</li>
<li><b>Accuracy:</b> repeat readings and take a mean, ignore anomalous results, and keep other variables constant. The variable you change is the <b>independent</b> variable; the one you measure is <b>dependent</b>.</li>
<li><b>Safety:</b> always wear eye protection, tie hair back, handle corrosive acids and alkalis carefully, heat gently and follow hazard labels.</li>
<li><b>Definitions:</b> a <b>solute</b> dissolves in a <b>solvent</b> to make a <b>solution</b>. A <b>saturated solution</b> holds the maximum solute at a given temperature. The <b>residue</b> is what stays on the filter paper (or after evaporation); the <b>filtrate</b> passes through.</li>
<li><b>Suggest advantages and disadvantages</b> of methods: a gas syringe measures gas volume accurately, but collecting over water loses soluble gases; a measuring cylinder is quick but less accurate than a pipette.</li></ul>
<span class="tag">Topic 12.2</span><h3>Purity and separation</h3>
<svg viewBox="0 0 320 190" style="width:100%;max-width:380px;display:block;margin:10px auto" role="img" aria-label="Paper chromatogram"><rect x="90" y="10" width="120" height="170" fill="none" stroke="currentColor" stroke-width="2"/><path d="M90 30H210" stroke="currentColor" stroke-dasharray="4"/><path d="M90 150H210" stroke="currentColor"/><circle cx="125" cy="96" r="7" fill="#3b82f6"/><circle cx="175" cy="96" r="7" fill="#3b82f6"/><circle cx="175" cy="62" r="7" fill="#ef4444"/><circle cx="175" cy="128" r="7" fill="#eab308"/><g font-size="11" fill="currentColor"><text x="215" y="34">solvent front</text><text x="215" y="154">start line (pencil)</text><text x="96" y="172">pure</text><text x="152" y="172">mixture</text><text x="215" y="100">Rf = spot ÷ front</text></g></svg>
<ul><li><b>Pure substances</b> have fixed melting and boiling points. Impurities lower the melting point and raise the boiling point.</li>
<li><b>Filtration</b>: insoluble solid from liquid. <b>Crystallisation</b>: dissolved solid from solution. <b>Simple distillation</b>: solvent from solution. <b>Fractional distillation</b>: liquids with different boiling points (e.g. ethanol and water).</li>
<li><b>Choosing a method:</b> insoluble solid from liquid: filtration. Soluble solid from solution: crystallisation (evaporate part of the solvent, then cool so crystals form). Solvent from solution: simple distillation. Miscible liquids: fractional distillation, e.g. ethanol (78 °C) and water (100 °C).</li>
<li><b>Fractionating column:</b> glass beads give a large surface where vapour repeatedly condenses and re-evaporates, so the lower-boiling liquid reaches the top first.</li>
<li><b>Chromatography:</b> separates dissolved substances by how far they travel on paper. Draw the start line in <b>pencil</b>, since ink would run. Substances with greater solubility travel farther.</li></ul>
<ul><li><b>Method:</b> draw a pencil line near the bottom of the paper, put a small spot of each substance on it, stand the paper in a little solvent (below the line) in a covered beaker, remove it when the solvent front nears the top, mark the front and dry.</li>
<li><span class="xt">EXT</span> <b>Example R<sub>f</sub>:</b> spot moved 3.0 cm, solvent front 6.0 cm: R<sub>f</sub> = 3.0 ÷ 6.0 = 0.50. R<sub>f</sub> has no units and lies between 0 and 1.</li>
<li><b>Interpreting chromatograms:</b> a pure substance gives one spot; an impure one gives several. Matching spot heights with known substances identifies the unknown.</li>
<li><span class="xt">EXT</span> <b>Colourless substances (supplement):</b> after the run, spray with a <b>locating agent</b> that reacts to make the spots coloured, then measure R<sub>f</sub>.</li></ul>
<div class="card" style="margin:12px 0"><b>🎛️ Try it: R<sub>f</sub> calculator</b><br>Spot moved (mm): <input id="sp" type="number" value="30"> Solvent moved (mm): <input id="sv" type="number" value="60"> <button onclick="var a=+document.getElementById('sp').value,b=+document.getElementById('sv').value;document.getElementById('rf').textContent=b>0&&a<=b?'Rf = '+(a/b).toFixed(2):'Check values: solvent front must travel farther than the spot'">Calculate</button><p id="rf" style="margin:8px 0 0"></p></div>
<span class="tag">Topic 12.3</span><h3>Identification of ions and gases</h3>
<div class="wrap"><table><tr><th>Ion</th><th>Test</th><th>Result</th></tr><tr><td>Cu²⁺</td><td>NaOH(aq)</td><td>Light blue precipitate</td></tr><tr><td>Fe²⁺</td><td>NaOH(aq)</td><td>Green precipitate</td></tr><tr><td>Fe³⁺</td><td>NaOH(aq)</td><td>Red-brown precipitate</td></tr><tr><td>Cl⁻</td><td>HNO₃, then AgNO₃</td><td>White precipitate</td></tr><tr><td>Br⁻</td><td>HNO₃, then AgNO₃</td><td>Cream precipitate</td></tr><tr><td>I⁻</td><td>HNO₃, then AgNO₃</td><td>Yellow precipitate</td></tr><tr><td>SO₄²⁻</td><td>Dilute HNO₃, then Ba(NO₃)₂(aq)</td><td>White precipitate</td></tr><tr><td>CO₃²⁻</td><td>Dilute acid</td><td>Fizzing; CO₂ turns limewater milky</td></tr><tr><td>NH₄⁺</td><td>NaOH, warm</td><td>Ammonia, turns damp red litmus blue</td></tr></table></div>
<div class="card" style="margin:12px 0"><b>🎛️ Try it: gas test</b><br><select id="gt"><option value="Pops with a lit splint">Hydrogen</option><option value="Relights a glowing splint">Oxygen</option><option value="Turns limewater milky">Carbon dioxide</option><option value="Bleaches damp litmus paper">Chlorine</option><option value="Turns damp red litmus blue">Ammonia</option></select> <button onclick="var s=document.getElementById('gt');document.getElementById('gr').textContent=s.options[s.selectedIndex].text+': '+s.value">Show test result</button><p id="gr" style="margin:8px 0 0"></p></div>
<ul><li><b>Flame tests:</b> Li⁺ red, Na⁺ yellow, K⁺ lilac, Ca²⁺ orange-red, Cu²⁺ blue-green.</li></ul>
<div class="wrap"><table><tr><th>Ion</th><th>Test</th><th>Result</th></tr><tr><td>Al³⁺</td><td>NaOH(aq), then excess</td><td>White precipitate that dissolves in excess</td></tr><tr><td>Zn²⁺</td><td>NaOH(aq), then excess</td><td>White precipitate that dissolves in excess</td></tr><tr><td>Ca²⁺</td><td>NaOH(aq)</td><td>White precipitate that stays in excess</td></tr><tr><td>NO₃⁻</td><td>NaOH, aluminium foil, warm</td><td>Ammonia given off</td></tr><tr><td>Cu²⁺, Fe²⁺, Fe³⁺</td><td>Ammonia(aq)</td><td>Same precipitates as NaOH; Cu²⁺ gives a deep blue solution in excess</td></tr></table></div>
<ul><li><b>More gas tests:</b> sulfur dioxide turns acidified potassium manganate(VII) from purple to colourless; chlorine bleaches damp litmus paper; ammonia turns damp red litmus blue.</li>
<li><b>Method:</b> add the reagent, record the exact colour, then confirm with a second test. Use dilute nitric acid first in halide tests to remove carbonate ions that would also form a precipitate.</li></ul>
<div class="wrap"><table><tr><th>Ion</th><th>Test</th><th>Result</th></tr><tr><td>Sulfite SO₃²⁻</td><td>Add acidified KMnO₄(aq)</td><td>Purple to colourless</td></tr><tr><td>Chromium(III) Cr³⁺</td><td>NaOH(aq) or NH₃(aq)</td><td>Green precipitate, insoluble in excess of either</td></tr><tr><td>Sulfate SO₄²⁻</td><td>Acidify with dilute HNO₃, then Ba(NO₃)₂(aq)</td><td>White precipitate</td></tr></table></div>
<ul><li><b>Carbonate test in detail:</b> add dilute acid, then bubble the gas into limewater, which turns milky because insoluble calcium carbonate forms: CO₂ + Ca(OH)₂ → CaCO₃ + H₂O.</li>
<li><b>Nitrate test in detail:</b> add aqueous sodium hydroxide and aluminium foil and warm gently. Nitrate is reduced to ammonia, which turns damp red litmus blue.</li>
<li><b>Flame test method:</b> dip a clean wire in the sample and hold it in a roaring Bunsen flame; note the colour.</li>
<li><b>Flame test:</b> barium Ba²⁺ is light green (also Li⁺ red, Na⁺ yellow, K⁺ lilac, Ca²⁺ orange-red, Cu²⁺ blue-green). Sulfur dioxide turns acidified KMnO₄ from purple to colourless.</li>
<li><b>Ammonia test for cations:</b> Al³⁺ and Zn²⁺ give white precipitates; Zn²⁺ dissolves in excess ammonia, Al³⁺ does not. Ca²⁺ gives no or very slight precipitate.</li></ul>
<div class="ext"><h4><span class="xt">EXT</span>Extended (Supplement) checklist: Chapter 12</h4><ul><li><b>Rf value:</b> Rf = distance moved by the substance ÷ distance moved by the solvent. It has no units and lies between 0 and 1. Draw the baseline in pencil and keep it above the solvent level.</li>
<li><b>Colourless substances:</b> spray the dried chromatogram with a locating agent (e.g. ninhydrin for amino acids) so the spots become coloured, then compare Rf values with known substances.</li>
<li><b>Gas tests (Core reminder):</b> O₂ relights a glowing splint; H₂ “pops” with a lighted splint; CO₂ turns limewater milky; Cl₂ bleaches damp litmus; NH₃ turns damp red litmus blue; SO₂ turns acidified KMnO₄ from purple to colourless.</li>
<li><b>Flame tests (Core reminder):</b> Li⁺ red, Na⁺ yellow, K⁺ lilac, Ca²⁺ orange-red, Ba²⁺ light green, Cu²⁺ blue-green.</li>
<li><b>Sulfite test:</b> SO₃²⁻ turns acidified aqueous KMnO₄ from purple to colourless.</li></ul></div>

const PH1={"t":"Chapter 1: Motion, Forces and Energy (Cambridge 0625)","notes":"\n<span class=\"tag\">Topic 1.1</span><h3>Physical quantities and measurement</h3>\n<ul><li><b>SI base units:</b> length (m), mass (kg), time (s), temperature (K), current (A).</li>\n<li><b>Scalar</b> quantities have size only (distance, speed, mass, energy). <b>Vectors</b> have size and direction (displacement, velocity, force, acceleration, momentum).</li>\n<li><b>Instruments:</b> a ruler reads to 1 mm, a vernier caliper to 0.1 mm and a micrometer screw gauge to 0.01 mm. Read the scale at eye level and check for zero error.</li>\n<li><b>Timing a pendulum:</b> time 20 oscillations and divide by 20. This reduces the effect of reaction-time error.</li></ul>\n<h4>More detail</h4><ul><li><b>Prefixes:</b> kilo (k) 10³, mega (M) 10⁶, giga (G) 10⁹, centi (c) 10⁻², milli (m) 10⁻³, micro (µ) 10⁻⁶, nano (n) 10⁻⁹. Example: 2.5 km = 2500 m; 450 mm = 0.45 m.</li><li><b>Measuring volume:</b> measuring cylinder (read the bottom of the meniscus at eye level). <b>Short times:</b> use a stopwatch for several repeats and take an average; digital timers are more precise than a hand-held stopwatch.</li><li><span class=\"tag\" style=\"background:#ec4899;color:#fff\">Supplement</span> Two perpendicular vectors combine by Pythagoras: R² = a² + b². Draw a scale vector triangle for forces not at right angles.</li></ul>\n<h4>Going deeper: measuring accurately</h4><ul><li><b>Measuring a small thickness:</b> measure a stack of 50 sheets and divide; measure a wire wound 20 times round a pencil and divide the length by 20.</li><li><b>Micrometer example:</b> sleeve reads 5.5 mm and the thimble reads 0.23 mm: diameter = 5.73 mm. Check for zero error and subtract if present.</li><li><b>Accuracy and reliability:</b> repeat readings and take a mean; remove anomalies; use instruments with finer divisions for more precise results. Parallax error: read scales with the eye level with the mark.</li><li><b>Standard form:</b> 0.000 45 m = 4.5 × 10⁻⁴ m; 3 × 10⁸ m/s = 300 000 000 m/s. Convert units before substituting: 36 km/h = 10 m/s (÷ 3.6).</li><li>Mass is measured in kg, force in newtons (N), energy in joules (J), power in watts (W), pressure in pascals (Pa).</li></ul>\n<span class=\"tag\">Topic 1.2</span><h3>Motion</h3>\n<ul><li><b>Speed</b> = distance ÷ time. <b>Velocity</b> is speed in a stated direction. <b>Acceleration</b> = change in velocity ÷ time.</li>\n<li><b>Distance–time graph:</b> gradient = speed; flat line = stationary; straight slope = constant speed; curve getting steeper = accelerating.</li>\n<li><b>Speed–time graph:</b> gradient = acceleration; flat line = constant speed; <b>area under graph = distance travelled</b>.</li>\n<li><b>Free fall:</b> near Earth all objects accelerate at g = 10 m/s² when air resistance is negligible. With air resistance, a falling object reaches <b>terminal velocity</b> when air resistance equals weight.</li></ul>\n<h4>More detail</h4><ul><li><b>Average speed</b> = total distance ÷ total time. Slowing down is negative acceleration (deceleration).</li><li><b>Reading graphs:</b> on a speed–time graph a straight upward line is constant acceleration; a downward line is deceleration; a horizontal line is constant speed. Area of a trapezium = ½(a + b)h.</li><li><span class=\"tag\" style=\"background:#ec4899;color:#fff\">Supplement</span> On a curved distance–time graph the speed at a point = gradient of the tangent. A curved speed–time graph means changing acceleration; the gradient of the tangent gives the acceleration at that point.</li><li><b>Free-fall experiment:</b> in a vacuum a feather and a coin fall together, because there is no air resistance.</li></ul>\n<svg class=\"v\" viewBox=\"0 0 320 170\" role=\"img\" aria-label=\"Speed-time graph shapes\"><path class=\"l\" d=\"M40 20V140H300\"/><text x=\"8\" y=\"16\">speed</text><text x=\"262\" y=\"160\">time</text><path class=\"l\" d=\"M40 130L140 50\" stroke=\"#10b981\"/><text x=\"60\" y=\"68\">constant acceleration</text><path class=\"l\" d=\"M140 50H210\" stroke=\"#f59e0b\"/><text x=\"148\" y=\"42\">constant speed</text><path class=\"l\" d=\"M210 50L290 130\" stroke=\"#ec4899\"/><text x=\"228\" y=\"108\">deceleration</text><text x=\"60\" y=\"158\" style=\"font-size:11px\">area under line = distance</text></svg><div class=\"card\" style=\"margin:12px 0\"><span class=\"tag\">🎮 Simulation</span><h4 style=\"margin:.4em 0\">Speed–time graph explorer</h4><label>Initial speed u (m/s): <b id=\"muv\">2</b><input type=\"range\" id=\"mu\" min=\"0\" max=\"20\" value=\"2\" step=\"1\" oninput=\"sM()\" style=\"padding:0;border:0;margin:4px 0\"></label><label>Acceleration a (m/s²): <b id=\"mav\">2</b><input type=\"range\" id=\"ma\" min=\"-4\" max=\"6\" value=\"2\" step=\"1\" oninput=\"sM()\" style=\"padding:0;border:0;margin:4px 0\"></label><label>Time t (s): <b id=\"mtv\">5</b><input type=\"range\" id=\"mt\" min=\"1\" max=\"10\" value=\"5\" step=\"1\" oninput=\"sM()\" style=\"padding:0;border:0;margin:4px 0\"></label><svg class=\"v\" id=\"mg\" viewBox=\"0 0 300 130\"></svg><p id=\"mo\"></p><img src=\"data:,\" alt=\"\" style=\"display:none\" onerror=\"sM()\"></div>\n<svg class=\"v\" viewBox=\"0 0 320 170\" role=\"img\" aria-label=\"Distance-time graph shapes\"><path class=\"l\" d=\"M40 20V140H300\"/><text x=\"6\" y=\"16\">distance</text><text x=\"262\" y=\"160\">time</text><path class=\"l\" d=\"M40 120H290\" stroke=\"#94a3b8\"/><text x=\"200\" y=\"114\">stationary</text><path class=\"l\" d=\"M40 135L200 45\" stroke=\"#10b981\"/><text x=\"60\" y=\"88\">constant speed</text><path class=\"l\" d=\"M120 138Q220 130 290 30\" stroke=\"#ec4899\"/><text x=\"224\" y=\"62\">accelerating</text><text x=\"40\" y=\"164\" style=\"font-size:11px\">gradient = speed</text></svg><h4>Going deeper: worked motion problems</h4><ul><li><b>Average speed</b> of a journey = total distance ÷ total time, including stops. 120 km in 2 h with a 30 min break: 120 ÷ 2.5 = 48 km/h.</li><li><b>Reading a speed–time graph:</b> a car goes from 0 to 12 m/s in 6 s, then 12 m/s for 10 s, then stops in 4 s. Acceleration = 2 m/s²; distance = ½ × 6 × 12 + 10 × 12 + ½ × 4 × 12 = 36 + 120 + 24 = 180 m.</li><li><b>Velocity and speed:</b> running round a track returns to the start, so displacement = 0 and average velocity = 0, but speed is not zero.</li><li><b>Measuring g:</b> drop an object from a measured height through light gates, g = 2s ÷ t² (≈ 10 m/s²).</li><li><span class=\"tag\" style=\"background:#ec4899;color:#fff\">Supplement</span> Equations of motion (constant acceleration): v = u + at; s = ut + ½at²; v² = u² + 2as. Example: car at 20 m/s brakes at 5 m/s²: s = u² ÷ 2a = 400 ÷ 10 = 40 m.</li><li><span class=\"tag\" style=\"background:#ec4899;color:#fff\">Supplement</span> Terminal velocity graph: speed rises, the gradient decreases as air resistance grows, then the graph flattens at terminal velocity.</li></ul><h4>Free fall and g</h4><p>The acceleration of free fall, g, is approximately constant near the Earth's surface at about 9.8 m/s². Exam questions often give g = 10 m/s² (or 10 N/kg): always use the value given in the question.</p>\n<span class=\"tag\">Topic 1.3</span><h3>Mass and weight</h3>\n<ul><li><b>Mass</b> (kg) is the amount of matter and does not change. <b>Weight</b> (N) is the gravitational force on a mass: W = mg. g = 10 N/kg on Earth.</li>\n</ul><ul><li><b>Gravitational field strength</b> g = weight ÷ mass (N/kg); it is about 10 N/kg on Earth and about 1.6 N/kg on the Moon, so weight changes but mass does not.</li><li>Mass is measured on a balance (compares masses); weight on a newton-meter (force meter).</li></ul>\n<h4>Going deeper: mass and weight</h4><ul><li><b>Weight on other bodies:</b> Moon g = 1.6 N/kg, so a 60 kg student weighs 96 N on the Moon and 600 N on Earth. Mass stays 60 kg.</li><li><b>Gravitational field:</b> region where a mass feels a force; g is the force per kilogram. Weight acts through the centre of mass.</li><li>A balance compares gravitational forces on two masses, so it gives the same reading on the Moon; a newton meter would not.</li><li>Falling objects: with air resistance, a heavy ball and a feather fall differently; in a vacuum they fall together because all objects have the same acceleration g.</li></ul><h4>Mass</h4><p>Mass is a measure of the quantity of matter in an object at rest relative to the observer. It is measured in kg and does not change with place. Weight is a gravitational force on an object that has mass, and weights (and masses) can be compared using a balance.</p><p><span class=\"tag\">Supplement</span> Weight is the effect of a gravitational field on a mass. The same mass weighs less on the Moon because the Moon's gravitational field strength is smaller.</p>\n<span class=\"tag\">Topic 1.4</span><h3>Density</h3><ul><li><b>Density</b> = mass ÷ volume. Regular solid: measure sides for volume. Irregular solid: use displacement of water in a measuring cylinder. Liquid: weigh a measured volume.</li>\n<li>An object floats in a liquid if its density is less than the density of the liquid.</li></ul>\n<ul><li>Typical values: water 1000 kg/m³ (1 g/cm³), air ≈ 1.2 kg/m³. 1 g/cm³ = 1000 kg/m³.</li><li><b>Floating:</b> an object floats if its density is less than the liquid's. A steel ship floats because its average density (including the air inside) is below that of water.</li><li><b>Worked example:</b> a 0.40 kg block is 5 cm × 4 cm × 10 cm. V = 200 cm³ = 2.0 × 10⁻⁴ m³, so ρ = 0.40 ÷ 2.0×10⁻⁴ = 2000 kg/m³.</li></ul>\n<h4>Going deeper: density in use</h4><ul><li>Typical values: water 1000 kg/m³, oil about 900, ice 920, aluminium 2700, iron 7900, mercury 13 600, air 1.2.</li><li><b>Layers:</b> less dense liquids float on denser ones (oil on water). Hot air rises because it is less dense.</li><li><b>Worked example:</b> a rock of mass 120 g displaces water from 50 cm³ to 90 cm³. V = 40 cm³; ρ = 120 ÷ 40 = 3.0 g/cm³ = 3000 kg/m³.</li><li><b>Mass from density:</b> m = ρV. 0.5 m³ of concrete (2400 kg/m³) has mass 1200 kg.</li><li>Ships and submarines float or sink by changing their average density using air-filled ballast tanks.</li></ul>\n<span class=\"tag\">Topic 1.5</span><h3>Forces and Newton's laws</h3>\n<ul><li><b>Resultant force</b> is the single force that has the same effect as all the forces together. Balanced forces: resultant = 0, so constant velocity (Newton's first law).</li>\n<li><b>Newton's second law:</b> F = ma. A bigger resultant force gives a bigger acceleration; a bigger mass gives a smaller one.</li>\n<li><b>Newton's third law:</b> if A pushes on B, B pushes back on A with an equal and opposite force (acting on a different object).</li>\n<li><b>Friction</b> opposes motion; <b>air resistance</b> increases with speed.</li>\n<li><b>Hooke's law:</b> extension is proportional to load up to the <b>limit of proportionality</b>. Spring constant k = F ÷ x.</li>\n<li><b>Moments:</b> moment = force × perpendicular distance from the pivot. In equilibrium, <b>sum of clockwise moments = sum of anticlockwise moments</b> and the resultant force is zero.</li>\n<li><b>Circular motion (Supplement):</b> a resultant force towards the centre (centripetal force) changes the direction of the velocity. Speed stays the same, velocity changes.</li></ul>\n<h4>More detail</h4><ul><li><b>Effects of a force:</b> it can change shape, size, speed or direction.</li><li><b>Stopping distance</b> = thinking distance + braking distance. Thinking distance rises with speed and with tiredness, drugs or distraction. Braking distance rises with speed, wet or icy roads, worn tyres and heavy loads.</li><li><b>Centre of mass and stability:</b> an object is more stable with a low centre of mass and a wide base. It topples when the vertical line through the centre of mass falls outside the base.</li><li><b>Newton's first law:</b> an object stays at rest or at constant velocity unless a resultant force acts (inertia is the resistance to change in motion).</li><li><span class=\"tag\" style=\"background:#ec4899;color:#fff\">Supplement</span> For a spring, the force–extension graph is a straight line through the origin up to the limit of proportionality; the gradient is k. A larger k means a stiffer spring.</li><li><span class=\"tag\" style=\"background:#ec4899;color:#fff\">Supplement</span> Balancing a pivoted beam: weight × distance on one side = weight × distance on the other. Example: 20 N at 0.30 m balances F at 0.50 m, so F = 12 N.</li></ul>\n<h4>Going deeper: Newton's laws in everyday life</h4><ul><li><b>First law:</b> passengers lurch forward when a car brakes because their bodies keep moving at the old velocity.</li><li><b>Second law:</b> a 1000 kg car with 3000 N driving force and 500 N resistance: resultant 2500 N, so a = 2.5 m/s². Doubling the mass halves the acceleration for the same force.</li><li><b>Third law pairs</b> are the same type of force, equal size, opposite direction, on different objects (rocket pushes gas down, gas pushes rocket up). A book on a table: its weight and the table's push are <b>not</b> a third-law pair; they are two forces on the same object.</li><li><b>Terminal velocity:</b> 1) weight &gt; air resistance, accelerates; 2) air resistance rises with speed; 3) forces balance, constant speed; 4) parachute opens, resistance jumps, decelerates to a lower terminal velocity.</li></ul>\n<svg class=\"v\" viewBox=\"0 0 320 170\" role=\"img\" aria-label=\"Forces on a car\"><path d=\"M80 90H240L225 65H110Z\" fill=\"#cbd5e1\" stroke=\"currentColor\" stroke-width=\"2\"/><circle cx=\"115\" cy=\"95\" r=\"12\" fill=\"#475569\"/><circle cx=\"205\" cy=\"95\" r=\"12\" fill=\"#475569\"/><path class=\"l\" d=\"M240 80H300M292 74L300 80L292 86\" stroke=\"#10b981\"/><text x=\"244\" y=\"72\">thrust</text><path class=\"l\" d=\"M80 80H20M28 74L20 80L28 86\" stroke=\"#ef4444\"/><text x=\"22\" y=\"72\">drag</text><path class=\"l\" d=\"M160 100V152M154 144L160 152L166 144\" stroke=\"#f59e0b\"/><text x=\"170\" y=\"150\">weight</text><path class=\"l\" d=\"M160 60V10M154 18L160 10L166 18\" stroke=\"#3b4fd8\"/><text x=\"170\" y=\"22\">normal reaction</text></svg><p style=\"font-size:12px;text-align:center\">Thrust &gt; drag: the car speeds up. Thrust = drag: constant velocity.</p><h4>Going deeper: forces in detail</h4><ul><li><b>Combining forces:</b> forces in a straight line add (same direction) or subtract (opposite). A 500 N push right and 200 N friction left: resultant 300 N right.</li><li><b>Friction types:</b> static (before sliding), sliding, and air or fluid resistance (drag). Lubrication, streamlining and smooth surfaces reduce it.</li><li><b>Hooke's law practical:</b> hang loads on a spring, measure extension (length − original length), plot a force–extension graph, find k = gradient. Beyond the limit of proportionality the spring does not return to its original length (permanent deformation).</li><li><b>Finding centre of mass of a lamina:</b> hang it from a pin at different holes with a plumb line; the lines cross at the centre of mass.</li><li><b>Moments experiments:</b> a metre ruler balanced on a pivot with masses either side: weight × distance (left) = weight × distance (right).</li><li><span class=\"tag\" style=\"background:#ec4899;color:#fff\">Supplement</span> Circular motion: the centripetal force required increases with mass and speed and decreases with larger radius. Examples: gravity (planets), tension (conker on a string), friction (car on a bend).</li><li><span class=\"tag\" style=\"background:#ec4899;color:#fff\">Supplement</span> Free-body diagram: draw all forces on one object only; ignore forces it exerts. For a lift accelerating up, tension T − weight = ma.</li></ul><div class=\"card\" style=\"margin:12px 0\"><span class=\"tag\">🎮 Simulation</span><h4 style=\"margin:.4em 0\">Moments: balancing a beam</h4><label>Left mass (kg): <b id=\"bLv\">4</b><input type=\"range\" id=\"bL\" min=\"1\" max=\"10\" value=\"4\" step=\"1\" oninput=\"sMo()\" style=\"padding:0;border:0;margin:4px 0\"></label><label>Left distance from pivot (m): <b id=\"bAv\">0.5</b><input type=\"range\" id=\"bA\" min=\"0.1\" max=\"1\" value=\"0.5\" step=\"0.1\" oninput=\"sMo()\" style=\"padding:0;border:0;margin:4px 0\"></label><label>Right mass (kg): <b id=\"bRv\">2</b><input type=\"range\" id=\"bR\" min=\"1\" max=\"10\" value=\"2\" step=\"1\" oninput=\"sMo()\" style=\"padding:0;border:0;margin:4px 0\"></label><label>Right distance from pivot (m): <b id=\"bBv\">0.5</b><input type=\"range\" id=\"bB\" min=\"0.1\" max=\"1\" value=\"0.5\" step=\"0.1\" oninput=\"sMo()\" style=\"padding:0;border:0;margin:4px 0\"></label><svg class=\"v\" id=\"bg\" viewBox=\"0 0 300 130\"></svg><p id=\"bo\"></p><img src=\"data:,\" alt=\"\" style=\"display:none\" onerror=\"sMo()\"></div><div class=\"card\" style=\"margin:12px 0\"><span class=\"tag\">🎮 Simulation</span><h4 style=\"margin:.4em 0\">Hooke’s law: spring (k = 2 N/cm, limit 12 N)</h4><label>Load F (N): <b id=\"hFv\">6</b><input type=\"range\" id=\"hF\" min=\"0\" max=\"20\" value=\"6\" step=\"1\" oninput=\"sHk()\" style=\"padding:0;border:0;margin:4px 0\"></label><svg class=\"v\" id=\"hg\" viewBox=\"0 0 260 150\"></svg><p id=\"ho\"></p><img src=\"data:,\" alt=\"\" style=\"display:none\" onerror=\"sHk()\"></div><div class=\"card\" style=\"margin:12px 0\"><span class=\"tag\">🎮 Simulation</span><h4 style=\"margin:.4em 0\">Stopping distance</h4><label>Speed (m/s): <b id=\"zVv\">20</b><input type=\"range\" id=\"zV\" min=\"10\" max=\"40\" value=\"20\" step=\"5\" oninput=\"sSt()\" style=\"padding:0;border:0;margin:4px 0\"></label><label>Reaction time (s): <b id=\"zRv\">0.7</b><input type=\"range\" id=\"zR\" min=\"0.2\" max=\"1.5\" value=\"0.7\" step=\"0.1\" oninput=\"sSt()\" style=\"padding:0;border:0;margin:4px 0\"></label><label>Road <select id=\"zD\" onchange=\"sSt()\"><option value=\"7\">Dry</option><option value=\"4\">Wet</option><option value=\"1.5\">Icy</option></select></label><svg class=\"v\" id=\"zg\" viewBox=\"0 0 300 40\"></svg><p id=\"zo\"></p><img src=\"data:,\" alt=\"\" style=\"display:none\" onerror=\"sSt()\"></div><h4>Load–extension graphs</h4><p>For a spring, plot extension against load. The graph is a straight line through the origin up to the limit of proportionality, then it curves because each extra newton stretches the spring more. Experiment: hang 1 N loads one at a time and measure the extension with a ruler each time. The gradient of the straight part is 1/k.</p><h4>Centre of gravity</h4><p>The centre of gravity is the point through which the whole weight of an object seems to act. To find it for an irregular lamina: hang it from a pin through one hole, hang a plumb line from the same pin and draw the vertical line on the lamina. Repeat from two other holes; the lines cross at the centre of gravity. An object is more stable with a low centre of gravity and a wide base, and it topples when the vertical line from its centre of gravity falls outside its base.</p><h4>Principle of moments</h4><p>When an object is in equilibrium, the total clockwise moment about any pivot equals the total anticlockwise moment. With no resultant force and no resultant moment, an object is in equilibrium.</p><p><span class=\"tag\">Supplement</span> The principle also applies with more than one force on each side of the pivot. Experiment: balance a metre rule on a pivot, hang masses at measured distances on both sides, and check that the clockwise and anticlockwise moments (F × d) are equal.</p>\n<span class=\"tag\">Topic 1.6</span><h3>Momentum (Supplement)</h3>\n<ul><li>Momentum p = mv (vector, kg m/s). Resultant force = rate of change of momentum.</li>\n<li><b>Impulse</b> = force × time = change in momentum.</li>\n<li><b>Conservation of momentum:</b> in a closed system, total momentum before = total momentum after a collision or explosion. Take care with direction signs.</li>\n<li>Crumple zones and airbags increase the collision time, so the force on passengers is smaller.</li></ul>\n<p><b>Exam tips:</b> always write the equation, substitute with units, then give the answer. For “explain” questions on forces, say “resultant force” and name the direction.</p>\n<ul><li><span class=\"tag\" style=\"background:#ec4899;color:#fff\">Supplement</span> Direction matters: choose one direction as positive. A 1.0 kg ball at +4 m/s hits a wall and returns at −3 m/s: change in momentum = 1.0 × (−3 − 4) = −7 kg m/s.</li><li><span class=\"tag\" style=\"background:#ec4899;color:#fff\">Supplement</span> Newton's second law in full: F = Δp ÷ Δt, so F = m(v − u)/t.</li></ul>\n<h4>Going deeper: momentum in action</h4><ul><li><span class=\"tag\" style=\"background:#ec4899;color:#fff\">Supplement</span> Explosion example: a 2 kg trolley and a 1 kg trolley are pushed apart by a spring from rest. Total momentum = 0 before and after, so 2v₁ = 1v₂ (opposite directions); the lighter trolley moves twice as fast.</li><li><span class=\"tag\" style=\"background:#ec4899;color:#fff\">Supplement</span> Impulse: a 0.15 kg ball at 20 m/s is stopped in 0.02 s: F = Δp ÷ t = 3 ÷ 0.02 = 150 N. A longer stopping time (catching with the hands moving back) reduces the force.</li><li><span class=\"tag\" style=\"background:#ec4899;color:#fff\">Supplement</span> Method: 1) choose positive direction; 2) total momentum before = total momentum after; 3) solve for the unknown; 4) check KE: elastic collisions conserve it, inelastic ones do not.</li></ul><div class=\"card\" style=\"margin:12px 0\"><span class=\"tag\">🎮 Simulation</span><h4 style=\"margin:.4em 0\">Collision: moving trolley hits a stationary one and they stick (Supplement)</h4><label>Mass of moving trolley (kg): <b id=\"pM1v\">2</b><input type=\"range\" id=\"pM1\" min=\"1\" max=\"5\" value=\"2\" step=\"1\" oninput=\"sMm()\" style=\"padding:0;border:0;margin:4px 0\"></label><label>Initial speed (m/s): <b id=\"pUv\">3</b><input type=\"range\" id=\"pU\" min=\"1\" max=\"6\" value=\"3\" step=\"1\" oninput=\"sMm()\" style=\"padding:0;border:0;margin:4px 0\"></label><label>Mass of stationary trolley (kg): <b id=\"pM2v\">1</b><input type=\"range\" id=\"pM2\" min=\"1\" max=\"5\" value=\"1\" step=\"1\" oninput=\"sMm()\" style=\"padding:0;border:0;margin:4px 0\"></label><p id=\"po\"></p><img src=\"data:,\" alt=\"\" style=\"display:none\" onerror=\"sMm()\"></div>\n<span class=\"tag\">Topic 1.7</span><h3>Energy, work and power</h3>\n<ul><li><b>Stores:</b> kinetic, gravitational potential, chemical, elastic (strain), nuclear, thermal (internal), electrostatic.</li>\n<li><b>Law of conservation of energy:</b> energy cannot be created or destroyed, only transferred from one store to another.</li>\n<li><b>Efficiency</b> = useful energy output ÷ total energy input. Wasted energy usually ends up as thermal energy in the surroundings.</li>\n<li><b>Energy resources:</b> fossil fuels, nuclear, biofuels, wind, hydroelectric, tidal, geothermal and solar. Renewable resources are replaced as fast as they are used. The Sun is the source of energy for most of them; nuclear fusion in the Sun releases the energy.</li></ul>\n<h4>Work and power</h4>\n<ul><li><b>Work done</b> = force × distance moved in the direction of the force = energy transferred. Unit: joule (J).</li>\n<li><b>Power</b> = work done ÷ time = energy transferred ÷ time. Unit: watt (W).</li>\n<li>Kinetic energy: E<sub>k</sub> = ½mv². Gravitational potential energy change: ΔE<sub>p</sub> = mgΔh.</li></ul>\n<h4>More detail</h4><ul><li><b>Generating electricity:</b> fuel heats water → steam → turbine → generator → electricity. Wind and hydroelectric turn the turbine directly; solar cells convert light straight to electricity.</li><li><b>Pros and cons:</b> fossil fuels are reliable but release CO₂ and run out. Nuclear fission releases no CO₂ but leaves radioactive waste. Wind and solar are renewable but depend on weather. Hydroelectric is reliable but floods land. Geothermal is limited to certain regions.</li><li><span class=\"tag\" style=\"background:#ec4899;color:#fff\">Supplement</span> Efficiency calculations: a motor takes in 500 J and gives 350 J of useful output: efficiency = 350 ÷ 500 × 100% = 70%; the other 150 J is wasted as heat and sound.</li><li>Energy is also conserved in a pendulum: gravitational potential energy at the top becomes kinetic at the bottom.</li><li><b>Nuclear fission</b> splits large nuclei (uranium, plutonium) to release energy; <b>fusion</b> joins small nuclei and powers the Sun.</li></ul>\n<svg class=\"v\" viewBox=\"0 0 340 120\" role=\"img\" aria-label=\"Energy transfer diagram for a lamp\"><rect x=\"10\" y=\"35\" width=\"100\" height=\"50\" fill=\"#f59e0b\"/><rect x=\"110\" y=\"35\" width=\"170\" height=\"6\" fill=\"#facc15\"/><polygon points=\"110,41 170,41 240,108 190,108 110,85\" fill=\"#94a3b8\"/><text x=\"14\" y=\"64\" style=\"font-size:10px\">100 J electrical</text><text x=\"200\" y=\"28\" style=\"font-size:10px\">10 J light (useful)</text><text x=\"196\" y=\"96\" style=\"font-size:10px\" fill=\"currentColor\">90 J thermal (wasted)</text></svg><p style=\"font-size:12px;text-align:center\">Efficiency = 10 ÷ 100 = 10%. Arrow widths show energy.</p><h4>Going deeper: energy calculations</h4><ul><li><b>Energy transfer table:</b> lamp: electrical → light + thermal; motor: electrical → kinetic + thermal + sound; solar cell: light → electrical; falling object: gravitational potential → kinetic; battery: chemical → electrical.</li><li><b>Worked examples:</b> E<sub>k</sub> of a 0.20 kg ball at 12 m/s = ½ × 0.2 × 144 = 14.4 J. Lifting 5 kg through 2 m: ΔE<sub>p</sub> = 5 × 10 × 2 = 100 J. If the ball is thrown straight up at 12 m/s, its maximum height is h = v² ÷ 2g = 144 ÷ 20 = 7.2 m.</li><li><b>Work = energy transferred:</b> pushing a box with 40 N for 6 m does 240 J of work.</li><li><b>Power examples:</b> a 2.0 kW kettle transfers 2000 J every second. A crane lifts 300 kg through 10 m in 20 s: P = 300 × 10 × 10 ÷ 20 = 1500 W.</li><li><b>Efficiency:</b> no machine is 100% efficient, because some energy is always transferred to the surroundings.</li></ul><div class=\"card\" style=\"margin:12px 0\"><span class=\"tag\">🎮 Simulation</span><h4 style=\"margin:.4em 0\">Falling object: energy transfer (mass 2 kg)</h4><label>Drop height (m): <b id=\"eHv\">10</b><input type=\"range\" id=\"eH\" min=\"1\" max=\"20\" value=\"10\" step=\"1\" oninput=\"sEn()\" style=\"padding:0;border:0;margin:4px 0\"></label><svg class=\"v\" id=\"ep\" viewBox=\"0 0 300 100\"></svg><p id=\"epo\"></p><img src=\"data:,\" alt=\"\" style=\"display:none\" onerror=\"sEn()\"></div><h4>Flow diagrams and Sankey diagrams</h4><p>A flow diagram shows how energy moves between stores in a process, for example chemical → thermal → kinetic.</p><p><span class=\"tag\">Supplement</span> A Sankey diagram shows energy flow as arrows whose width is proportional to the amount of energy. The input arrow is widest, the useful output carries on forward, and wasted energy branches off (usually thermal energy to the surroundings). Energy in = useful energy out + wasted energy out.</p><h4>Solar panels and the Sun</h4><p>Solar panels use infrared and other radiation from the Sun to heat water. (Solar cells are different: they make electricity directly.) The Sun heating the atmosphere also causes the wind.</p><p><span class=\"tag\">Supplement</span> Radiation from the Sun is the main source of energy for all our energy resources except geothermal, nuclear and tidal.</p>\n<span class=\"tag\">Topic 1.8</span><h3>Pressure</h3>\n<ul><li><b>Pressure</b> = force ÷ area (pascal, Pa = N/m²). The same force on a smaller area gives a larger pressure (knives, drawing pins).</li>\n<li><b>Pressure in a liquid:</b> p = ρgh. It increases with depth and density, and acts equally in all directions at the same depth.</li></ul>\n<p><b>Exam tips:</b> use joules for energy in calculations (convert kJ and cm² to J and m²). Say “transferred to the thermal store of the surroundings”, not “lost”.</p><ul><li>Atmospheric pressure is about 100 kPa at sea level and falls as altitude rises; a barometer measures it. A manometer compares a gas pressure with the atmosphere using the height difference of liquid.</li><li><span class=\"tag\" style=\"background:#ec4899;color:#fff\">Supplement</span> Pressure in a liquid acts at right angles to the surfaces and is the same in all directions at one depth. Hydraulic machines use this: pressure transmitted equally, so a small force on a small piston gives a large force on a large piston.</li><li>Example: a 600 N person on 0.04 m² of feet: p = 600 ÷ 0.04 = 15 000 Pa.</li></ul>\n<p style=\"margin-top:14px\"><span class=\"tag\" style=\"background:#ec4899;color:#fff\">Supplement</span> items are only for the Extended course; everything else is Core.</p><h4>Going deeper: pressure applications</h4><ul><li><b>Large pressure (small area):</b> knives, nails, spikes. <b>Small pressure (large area):</b> skis, snowshoes, caterpillar tracks, wide tyres on soft ground.</li><li><b>Worked example:</b> a 60 kg person (600 N) stands on two shoes each of area 0.015 m²: p = 600 ÷ 0.03 = 20 000 Pa. On one foot: 40 000 Pa.</li><li><b>Liquid pressure:</b> p = ρgh rises with depth and density, so dams are thicker at the base. Pressure acts in all directions, so a submarine hull is built to withstand it.</li><li><b>Atmospheric pressure:</b> about 100 kPa, caused by the weight of air above. It is why a suction cup sticks and a drinking straw works.</li><li><span class=\"tag\" style=\"background:#ec4899;color:#fff\">Supplement</span> Hydraulic jack: pressure is the same throughout the fluid, so F₁/A₁ = F₂/A₂. A 20 N force on a 2 cm² piston gives 20 ÷ 2 = 10 N/cm², so a 100 cm² piston lifts 1000 N.</li><li><span class=\"tag\" style=\"background:#ec4899;color:#fff\">Supplement</span> Total pressure at depth h = atmospheric pressure + ρgh. At 10 m in water: 100 kPa + 100 kPa = 200 kPa.</li></ul><div class=\"card\" style=\"margin:12px 0\"><span class=\"tag\">🎮 Simulation</span><h4 style=\"margin:.4em 0\">Pressure calculator</h4><label>Force (N): <b id=\"qFv\">600</b><input type=\"range\" id=\"qF\" min=\"100\" max=\"2000\" value=\"600\" step=\"100\" oninput=\"sPr()\" style=\"padding:0;border:0;margin:4px 0\"></label><label>Area (cm²): <b id=\"qAv\">300</b><input type=\"range\" id=\"qA\" min=\"10\" max=\"1000\" value=\"300\" step=\"10\" oninput=\"sPr()\" style=\"padding:0;border:0;margin:4px 0\"></label><label>Depth in water (m): <b id=\"qHv\">10</b><input type=\"range\" id=\"qH\" min=\"1\" max=\"50\" value=\"10\" step=\"1\" oninput=\"sPr()\" style=\"padding:0;border:0;margin:4px 0\"></label><p id=\"qo\"></p><img src=\"data:,\" alt=\"\" style=\"display:none\" onerror=\"sPr()\"></div><div class=\"card\" style=\"margin:12px 0\"><span class=\"tag\">🎮 Simulation</span><h4 style=\"margin:.4em 0\">Density: float or sink?</h4><label>Mass (g): <b id=\"yMv\">200</b><input type=\"range\" id=\"yM\" min=\"10\" max=\"1000\" value=\"200\" step=\"10\" oninput=\"sDn()\" style=\"padding:0;border:0;margin:4px 0\"></label><label>Volume (cm³): <b id=\"yVv\">250</b><input type=\"range\" id=\"yV\" min=\"10\" max=\"500\" value=\"250\" step=\"10\" oninput=\"sDn()\" style=\"padding:0;border:0;margin:4px 0\"></label><label>Liquid <select id=\"yL\" onchange=\"sDn()\"><option value=\"1\">Water (1.0 g/cm³)</option><option value=\"0.9\">Oil (0.9 g/cm³)</option><option value=\"1.2\">Salt water (1.2 g/cm³)</option></select></label><svg class=\"v\" id=\"yg\" viewBox=\"0 0 300 130\"></svg><p id=\"yo\"></p><img src=\"data:,\" alt=\"\" style=\"display:none\" onerror=\"sDn()\"></div>\n<p style=\"margin-top:14px\"><b>Exam tips:</b> Write the equation, substitute with units, then give the answer with a unit. Convert units first (cm→m, g→kg, kJ→J). For graphs, say what the gradient or area represents. In ‘explain’ questions on forces, name the resultant force and its direction.</p><h4>Change in pressure beneath a liquid</h4><p><span class=\"tag\">Supplement</span> Going down a height Δh in a liquid of density ρ increases the pressure by Δp = ρgΔh. Example: 10 m down in water (ρ = 1000 kg/m³, g = 10 N/kg) gives Δp = 1000 × 10 × 10 = 100 000 Pa.</p><div class=\"f\">Δp = ρ g Δh</div>","kw":[["Scalar","A quantity with size only."],["Vector","A quantity with size and direction."],["Acceleration","Rate of change of velocity."],["Terminal velocity","Constant speed reached when air resistance equals weight."],["Density","Mass per unit volume."],["Resultant force","The single force equivalent to all forces acting."],["Limit of proportionality","Point beyond which extension is no longer proportional to load."],["Moment","Turning effect of a force: force × perpendicular distance from pivot."],["Momentum","Mass × velocity."],["Impulse","Force × time; equals change in momentum."],["Conservation of energy","Energy is never created or destroyed, only transferred."],["Efficiency","Useful energy output divided by total energy input."],["Work done","Energy transferred when a force moves an object."],["Power","Rate of doing work or transferring energy."],["Renewable","A resource that is replaced as fast as it is used."],["Pressure","Force acting per unit area."],["Inertia","The resistance of an object to a change in its motion."],["Thinking distance","Distance travelled while the driver reacts."],["Braking distance","Distance travelled while the brakes slow the vehicle."],["Centre of mass","The point where the whole weight appears to act."],["Gravitational field strength","Force per unit mass, g = W/m."],["Kinetic energy","Energy of a moving object, ½mv²."],["Displacement","Distance in a stated direction from the starting point."],["Anomalous result","A reading that does not fit the pattern of the others."],["Centripetal force","Force towards the centre that keeps an object moving in a circle."],["Elastic collision","A collision in which kinetic energy is conserved."],["Friction","Force opposing relative motion between surfaces."],["Hydraulic","Using pressure in a liquid to transmit force."],["Centre of gravity","The point through which the whole weight of an object seems to act."],["Sankey diagram","An energy flow diagram whose arrow widths are proportional to the energy."],["Mass","A measure of the quantity of matter in an object."]],"f":["speed = distance / time","a = (v − u) / t","W = mg","ρ = m / V","F = ma","F = kx","moment = F × d","p = mv","impulse = Ft = Δ(mv)","E_k = ½mv²","ΔE_p = mgΔh","W = Fd","P = W / t = E / t","efficiency = useful output / total input × 100%","p = F / A","p = ρgh","Stopping distance = thinking + braking distance","Average speed = total distance / total time","v² = u² + 2as","KE gained = PE lost (falling, no air resistance)","F = Δp / Δt","p₁ = F₁/A₁ = F₂/A₂ = p₂ (hydraulic)","Δp = ρ g Δh (change in pressure beneath a liquid)"],"qa":[["A car accelerates from 5 m/s to 25 m/s in 4 s. Find a.","a = (25 − 5)/4 = 5 m/s²."],["Find the density of a block of mass 540 g and volume 200 cm³.","ρ = 540/200 = 2.7 g/cm³."],["Why does a skydiver reach terminal velocity?","As speed rises, air resistance rises until it equals weight. The resultant force is zero, so acceleration stops."],["A 2 kg trolley at 3 m/s hits a stationary 1 kg trolley and they stick. Find the speed after.","Momentum before = 6 kg m/s. After: 6 = 3v, so v = 2 m/s."],["Find the kinetic energy of a 1200 kg car at 20 m/s.","E_k = ½ × 1200 × 20² = 240 000 J."],["A 60 kg student climbs 5 m in 10 s. Find the power.","W = 60 × 10 × 5 = 3000 J; P = 3000/10 = 300 W."],["Find the pressure 10 m deep in water (ρ = 1000 kg/m³).","p = 1000 × 10 × 10 = 100 000 Pa."],["Explain why a wide, low vehicle is more stable.","Its low centre of mass and wide base mean the line through the centre of mass stays inside the base until tilted a lot."],["A 0.5 kg ball is dropped from 20 m. Find its speed just before landing (g = 10 m/s², no air resistance).","Energy: mgh = ½mv², so v = √(2gh) = √(2×10×20) = 20 m/s."],["A 1500 kg car travelling at 30 m/s brakes to rest in 6.0 s. Find the braking force.","a = 5 m/s²; F = ma = 1500 × 5 = 7500 N."],["A metre ruler pivoted at 50 cm has 2 N at 20 cm. Where must a 3 N weight go to balance it?","2 × 0.30 = 3 × d, d = 0.20 m, so at the 70 cm mark."],["Explain why wet roads increase stopping distance.","There is less friction between tyres and road, so deceleration is smaller and braking distance increases. Thinking distance is unchanged."],["Why do skis stop you sinking into snow?","They spread weight over a large area so pressure is small."]],"mcq":[["The area under a speed–time graph gives…",["acceleration","distance","force"],1,"Area = speed × time = distance."],["A resultant force of 12 N acts on a 3 kg mass. Acceleration?",["4 m/s²","36 m/s²","0.25 m/s²"],0,"a = F/m = 12/3."],["Which is a vector?",["Mass","Speed","Velocity"],2,"Velocity has direction."],["Unit of power is…",["joule","watt","pascal"],1,"1 W = 1 J/s."],["Which is renewable?",["Coal","Uranium","Wind"],2,"Wind is replaced continuously."],["Doubling the area while keeping force the same does what to pressure?",["Halves it","Doubles it","No change"],0,"p = F/A."],["Thinking distance increases when…",["the road is wet","the driver is tired","the tyres are worn"],1,"Reaction time depends on the driver."],["Which gives the greatest pressure for the same force?",["Large area","Small area","Weight is not involved"],1,"p = F/A."],["Which has the greatest density?",["1 kg of feathers filling a room","1 kg of iron","1 kg of air"],1,"The iron has the most mass in the smallest volume."],["Momentum is conserved when…",["an external force acts","no external resultant force acts","only elastic collisions occur"],1,"Closed system, no external resultant force."],["A force of 20 N moves an object 5 m in the direction of the force. Work done?",["4 J","100 J","25 J"],1,"W = Fd = 20 × 5."],["Which is not a vector?",["Acceleration","Weight","Mass"],2,"Mass has size only."]]};
const PH2={"t":"Chapter 2: Thermal Physics (Cambridge 0625)","notes":"\n<span class=\"tag\">Topic 2.1</span><h3>Kinetic particle model and gases</h3>\n<ul><li>Solids: particles vibrate in fixed positions. Liquids: particles slide past each other. Gases: particles move randomly at high speed, far apart.</li>\n<li><b>Gas pressure</b> is caused by particles hitting the container walls. Heating a gas at constant volume makes particles faster, so collisions are harder and more frequent and pressure rises.</li>\n<li><b>Brownian motion:</b> visible specks (smoke, pollen) jiggle randomly because they are hit unevenly by invisible, fast-moving molecules.</li>\n<li><b>Boyle's law:</b> at constant temperature, pV = constant. Halving the volume doubles the pressure.</li>\n<li>Absolute zero (−273 °C, 0 K) is where particles have minimum energy. K = °C + 273.</li></ul>\n<ul><li><span class=\"tag\" style=\"background:#ec4899;color:#fff\">Supplement</span> Gas laws (fixed mass): pV = constant at constant T, so p₁V₁ = p₂V₂. At constant volume, pressure is proportional to absolute temperature (kelvin), not to °C.</li><li>Evidence for the particle model: diffusion of gases and Brownian motion of smoke particles in air.</li></ul>\n<h4>Going deeper: states and particles</h4><ul><li>Gas particles are separated by distances much larger than their size, so gases are compressible. Liquids and solids have particles touching, so they are not.</li><li>When the temperature of a gas rises, the <b>average</b> kinetic energy of its particles rises; temperature measures this average.</li><li>Pressure from a gas depends on the <b>number of collisions per second</b> and the <b>force of each collision</b>. Compressing the gas into a smaller volume increases collisions per second without changing the speed.</li></ul>\n<div class=\"card\" style=\"margin:12px 0\"><span class=\"tag\">🎮 Simulation</span><h4 style=\"margin:.4em 0\">Boyle’s law: pV = constant</h4><label>Volume V (cm³): <b id=\"gvv\">6</b><input type=\"range\" id=\"gv\" min=\"2\" max=\"12\" value=\"6\" step=\"1\" oninput=\"sG()\" style=\"padding:0;border:0;margin:4px 0\"></label><svg class=\"v\" id=\"gg\" viewBox=\"0 0 300 100\"></svg><p id=\"go\"></p><img src=\"data:,\" alt=\"\" style=\"display:none\" onerror=\"sG()\"></div>\n<h4>Going deeper: particles, pressure and temperature</h4><ul><li><b>Brownian motion explained:</b> smoke particles are large enough to see but light enough to be knocked about by billions of tiny, fast, invisible air molecules. The jerky, random path is evidence that the air molecules are moving randomly.</li><li><b>Gas pressure experiments:</b> a syringe with the end sealed: pushing in the plunger squashes the gas, so pressure rises (Boyle). A flask on a hot plate with a pressure gauge: pressure rises as temperature rises (volume fixed).</li><li><b>Temperature and kinetic energy:</b> at absolute zero particles have minimum energy. At 300 K the average speed of air molecules is about 500 m/s.</li><li><b>Gas, liquid, solid compared:</b> liquid and solid densities are about 1000 times larger than gas density because the particles are much closer.</li><li><span class=\"tag\" style=\"background:#ec4899;color:#fff\">Supplement</span> Pressure–temperature relation: for a fixed mass of gas at constant volume, p ∝ T (kelvin). Doubling T doubles p. Worked example: 100 kPa at 300 K heated to 450 K: p = 100 × 450/300 = 150 kPa.</li><li><span class=\"tag\" style=\"background:#ec4899;color:#fff\">Supplement</span> Boyle example: 4.0 dm³ of gas at 150 kPa expands to 10 dm³ at the same temperature: p = 150 × 4 ÷ 10 = 60 kPa. Always use p₁V₁ = p₂V₂ only when temperature and mass are constant.</li></ul><div class=\"card\" style=\"margin:12px 0\"><span class=\"tag\">🎮 Simulation</span><h4 style=\"margin:.4em 0\">Gas pressure and temperature (fixed volume)</h4><label>Temperature (K): <b id=\"kTv\">300</b><input type=\"range\" id=\"kT\" min=\"100\" max=\"600\" value=\"300\" step=\"50\" oninput=\"sKt()\" style=\"padding:0;border:0;margin:4px 0\"></label><svg class=\"v\" id=\"kg\" viewBox=\"0 0 300 100\"></svg><p id=\"ko\"></p><img src=\"data:,\" alt=\"\" style=\"display:none\" onerror=\"sKt()\"></div><h4>Particle diagrams</h4><p>Draw a solid as particles touching in a regular, tidy pattern. Draw a liquid as particles touching in a random arrangement. Draw a gas as a few particles far apart at random. In solids and liquids the particles are about the same distance apart; in a gas they are many particle diameters apart.</p>\n<span class=\"tag\">Topic 2.2</span><h3>Thermal properties</h3>\n<ul><li><b>Thermal expansion:</b> solids, liquids and gases expand when heated because particles move more. Gases expand most, solids least. Used in thermometers and bimetallic strips.</li>\n<li><b>Specific heat capacity</b> c: energy needed to raise the temperature of 1 kg of a substance by 1 °C. ΔQ = mcΔθ. Measure it with an electric heater and a thermometer.</li>\n<li><b>Melting and boiling:</b> temperature stays constant while the state changes, as energy breaks the bonds between particles (latent heat). <b>Evaporation</b> happens at the surface at any temperature and cools the liquid.</li></ul>\n<h4>More detail</h4><ul><li><b>Thermometers:</b> liquid-in-glass (sensitivity grows with a thinner bore, range depends on the liquid), thermocouple (wide range, fast response). Fixed points: 0 °C (melting ice) and 100 °C (boiling water).</li><li><b>Expansion examples:</b> gaps in bridges and railway lines, bimetallic strips in thermostats (the metal that expands more bends away).</li><li><span class=\"tag\" style=\"background:#ec4899;color:#fff\">Supplement</span> Specific heat capacity: ΔQ = mcΔθ, in J/kg °C. Water has c = 4200 J/kg °C, a high value, so it takes a lot of energy to heat.</li><li><span class=\"tag\" style=\"background:#ec4899;color:#fff\">Supplement</span> Specific latent heat: Q = mL. Specific latent heat of fusion is for melting; of vaporisation for boiling. L is higher for vaporisation because particles must be pulled completely apart.</li><li>Evaporation is faster with a higher temperature, a larger surface area and a draught of air.</li></ul>\n<h4>Going deeper: thermal properties and energy</h4><ul><li><b>Heating curve of water:</b> ice warms to 0 °C; melts at 0 °C (flat); water warms to 100 °C; boils at 100 °C (flat); steam warms further. Flat parts show changes of state: the energy goes into breaking bonds, not into increasing temperature.</li><li><b>Practical for specific heat capacity:</b> insulate a metal block, heat it with a known-power heater, record temperature against time. E = Pt; c = E ÷ (mΔθ). Insulation reduces heat loss, which would otherwise make c look too large.</li><li><b>Practical for latent heat:</b> boil water with a heater and measure the mass lost; L = E ÷ m.</li><li><b>Effects of expansion:</b> railway gaps, bimetallic strips and fire alarms, liquid-in-glass thermometers. Water is unusual: it expands when it freezes, which bursts pipes.</li><li><b>Cooling by evaporation:</b> sweating, a wet cloth on a hot day. The cooling is faster when the air is dry and moving.</li></ul><div class=\"card\" style=\"margin:12px 0\"><span class=\"tag\">🎮 Simulation</span><h4 style=\"margin:.4em 0\">Heating curve of 0.10 kg of ice at −20 °C</h4><label>Energy supplied (kJ): <b id=\"hEv\">100</b><input type=\"range\" id=\"hE\" min=\"0\" max=\"310\" value=\"100\" step=\"5\" oninput=\"sHc()\" style=\"padding:0;border:0;margin:4px 0\"></label><svg class=\"v\" id=\"hc\" viewBox=\"0 0 300 150\"></svg><p id=\"hn\"></p><img src=\"data:,\" alt=\"\" style=\"display:none\" onerror=\"sHc()\"></div><div class=\"card\" style=\"margin:12px 0\"><span class=\"tag\">🎮 Simulation</span><h4 style=\"margin:.4em 0\">Specific heat capacity calculator</h4><label>Mass (kg): <b id=\"uMv\">1</b><input type=\"range\" id=\"uM\" min=\"0.1\" max=\"5\" value=\"1\" step=\"0.1\" oninput=\"sSh()\" style=\"padding:0;border:0;margin:4px 0\"></label><label>Temperature rise Δθ (°C): <b id=\"uTv\">20</b><input type=\"range\" id=\"uT\" min=\"1\" max=\"100\" value=\"20\" step=\"1\" oninput=\"sSh()\" style=\"padding:0;border:0;margin:4px 0\"></label><label>Material <select id=\"uC\" onchange=\"sSh()\"><option value=\"4200\">Water (4200 J/kg °C)</option><option value=\"900\">Aluminium (900)</option><option value=\"390\">Copper (390)</option><option value=\"2100\">Ice (2100)</option></select></label><p id=\"uo\"></p><img src=\"data:,\" alt=\"\" style=\"display:none\" onerror=\"sSh()\"></div><h4>Internal energy</h4><p>A rise in the temperature of an object increases its internal energy.</p><p><span class=\"tag\">Supplement</span> This is an increase in the average kinetic energy of all the particles in the object.</p><h4>Condensation and solidification (freezing)</h4><p>Condensation: gas particles lose energy and slow down, and the attractive forces pull them together into a liquid. Solidification: liquid particles lose energy until they can only vibrate about fixed positions in a regular pattern. Energy is given out to the surroundings during each change, and the temperature stays constant until the change is complete.</p>\n<span class=\"tag\">Topic 2.3</span><h3>Transfer of thermal energy</h3>\n<ul><li><b>Conduction:</b> particles vibrate and pass energy on. Metals are the best conductors because of free electrons. Not possible in a vacuum.</li>\n<li><b>Convection:</b> in liquids and gases, warmer fluid expands, becomes less dense and rises; cooler fluid sinks, forming convection currents.</li>\n<li><b>Radiation:</b> infrared waves, needs no medium. Dull black surfaces are the best absorbers and emitters; shiny white surfaces are the worst.</li>\n<li><b>Applications:</b> vacuum flask (vacuum stops conduction and convection; silvered walls reflect radiation), double glazing, loft insulation.</li></ul><ul><li><b>Insulation and conductors:</b> trapped air is a good insulator (wool, foam, double glazing). Copper pans conduct heat from the cooker to the food.</li><li><span class=\"tag\" style=\"background:#ec4899;color:#fff\">Supplement</span> Radiation: the rate of emission increases with surface temperature and surface area, and is larger for dull black surfaces than shiny ones. A hot object emits infrared; very hot objects also glow visible light.</li><li><span class=\"tag\" style=\"background:#ec4899;color:#fff\">Supplement</span> Convection in a room: a radiator heats air at the bottom, so it rises; cool air sinks near windows and moves along the floor to take its place.</li></ul>\n<svg class=\"v\" viewBox=\"0 0 340 150\" role=\"img\" aria-label=\"Convection currents in a room\"><rect x=\"10\" y=\"10\" width=\"320\" height=\"130\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><rect x=\"20\" y=\"95\" width=\"24\" height=\"40\" fill=\"#ef4444\"/><text x=\"12\" y=\"90\" style=\"font-size:10px\">radiator</text><path class=\"l\" d=\"M60 100C60 40 120 25 170 30C230 25 290 40 295 110C295 125 120 130 60 125\" fill=\"none\" stroke=\"#f59e0b\"/><path class=\"l\" d=\"M60 100V60M54 68L60 60L66 68M170 30L162 24M170 30L162 36M295 110V122M289 114L295 122L301 114\" stroke=\"#f59e0b\"/><text x=\"110\" y=\"75\">warm air rises</text><text x=\"170\" y=\"118\">cool air sinks</text></svg><svg class=\"v\" viewBox=\"0 0 260 180\" role=\"img\" aria-label=\"Vacuum flask\"><path class=\"l\" d=\"M70 20V150Q70 168 90 168H170Q190 168 190 150V20\" fill=\"none\"/><path class=\"l\" d=\"M82 28V148Q82 156 92 156H168Q178 156 178 148V28\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"4\"/><rect x=\"60\" y=\"8\" width=\"140\" height=\"12\" fill=\"#64748b\"/><text x=\"198\" y=\"90\" style=\"font-size:11px\">vacuum gap:</text><text x=\"198\" y=\"104\" style=\"font-size:11px\">no conduction</text><text x=\"198\" y=\"118\" style=\"font-size:11px\">or convection</text><text x=\"6\" y=\"60\" style=\"font-size:11px\">silvered walls</text><text x=\"6\" y=\"74\" style=\"font-size:11px\">reflect radiation</text></svg><h4>Going deeper: transfer of thermal energy</h4><ul><li><b>Conduction in metals:</b> free electrons gain energy, move rapidly and collide with other particles, passing energy along far faster than vibrations alone. Non-metals conduct only by vibrations and collisions, so they are poorer conductors.</li><li><b>Convection experiments:</b> a crystal of purple dye under a corner of a beaker heated from below shows currents rising and falling. Convection cannot occur in solids or a vacuum.</li><li><b>Radiation experiments:</b> two cans, one dull black and one shiny, filled with hot water: the dull black one cools faster. Leslie's cube: the black face gives the greatest reading on an infrared detector.</li><li><b>Reducing heat loss in a house:</b> loft insulation and cavity wall foam (trapped air reduces conduction and convection), double glazing, curtains, reflective foil behind radiators (reflects radiation).</li><li><b>Vacuum flask summary:</b> glass walls conduct poorly; the vacuum stops conduction and convection; silvering reflects radiation back; the insulated stopper reduces losses at the top.</li><li><span class=\"tag\" style=\"background:#ec4899;color:#fff\">Supplement</span> Rate of radiation depends on surface area, temperature difference to the surroundings and surface colour/texture. The Sun emits energy by radiation, the only way it can cross the vacuum of space.</li></ul>\n<p style=\"margin-top:14px\"><b>Exam tips:</b> Say ‘particles move faster’, never ‘particles expand’. Use °C for temperature differences but kelvin in gas-law work. Link energy to the thermal store rather than saying heat is ‘lost’. Name the method of transfer (conduction, convection or radiation) and say why.</p><h4>Solids between insulators and good conductors</h4><p><span class=\"tag\">Supplement</span> Many solids conduct thermal energy better than thermal insulators but less well than good thermal conductors such as metals.</p><h4>Constant temperature and the Earth's temperature</
