fill=\"#ef4444\"/><circle cx=\"188\" cy=\"40\" r=\"16\" fill=\"#d97706\"/><circle cx=\"240\" cy=\"40\" r=\"13\" fill=\"#fcd34d\"/><circle cx=\"290\" cy=\"40\" r=\"9\" fill=\"#22d3ee\"/><circle cx=\"335\" cy=\"40\" r=\"9\" fill=\"#2563eb\"/><g style=\"font-size:9px\"><text x=\"14\" y=\"76\">Sun</text><text x=\"64\" y=\"76\">Mer</text><text x=\"86\" y=\"76\">Ven</text><text x=\"108\" y=\"76\">Earth</text><text x=\"132\" y=\"76\">Mars</text><text x=\"170\" y=\"76\">Jupiter</text><text x=\"226\" y=\"76\">Saturn</text><text x=\"278\" y=\"76\">Uranus</text><text x=\"318\" y=\"76\">Neptune</text></g></svg>\n<svg class=\"v\" viewBox=\"0 0 360 150\" role=\"img\" aria-label=\"Earth's tilt and the seasons\"><circle cx=\"40\" cy=\"75\" r=\"28\" fill=\"#fbbf24\"/><text x=\"28\" y=\"80\" style=\"font-size:10px\">Sun</text><circle cx=\"160\" cy=\"75\" r=\"22\" fill=\"#3b82f6\"/><line x1=\"150\" y1=\"40\" x2=\"170\" y2=\"110\" stroke=\"currentColor\" stroke-width=\"2\"/><circle cx=\"300\" cy=\"75\" r=\"22\" fill=\"#3b82f6\"/><line x1=\"290\" y1=\"40\" x2=\"310\" y2=\"110\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"120\" y=\"130\" style=\"font-size:10px\">N hemisphere tilted towards Sun</text><text x=\"240\" y=\"138\" style=\"font-size:10px\">tilted away: winter</text><text x=\"120\" y=\"20\" style=\"font-size:10px\">summer in N hemisphere (23.5° tilt, axis points the same way)</text></svg><svg class=\"v\" viewBox=\"0 0 360 140\" role=\"img\" aria-label=\"Planet and comet orbits\"><ellipse cx=\"180\" cy=\"70\" rx=\"90\" ry=\"55\" fill=\"none\" stroke=\"#94a3b8\"/><ellipse cx=\"200\" cy=\"70\" rx=\"150\" ry=\"30\" fill=\"none\" stroke=\"#ec4899\"/><circle cx=\"130\" cy=\"70\" r=\"9\" fill=\"#fbbf24\"/><text x=\"120\" y=\"104\" style=\"font-size:10px\">Sun</text><text x=\"250\" y=\"126\" style=\"font-size:10px\">comet: elongated orbit, fastest near the Sun</text><text x=\"10\" y=\"16\" style=\"font-size:10px\">planet: near-circular orbit</text></svg><h4>Going deeper: Earth, Moon and the Solar System</h4><ul><li><b>Day and night:</b> Earth rotates once every 24 h. <b>Seasons:</b> the axis is tilted by 23.5° and points the same way all year, so the Northern Hemisphere is tilted towards the Sun in June (longer days, more direct sunlight, warmer) and away in December.</li><li><b>Moon:</b> orbits Earth in about 27.3 days and shines by reflected sunlight. It takes about 29.5 days to go through its phases.</li><li><b>Planets:</b> the four inner planets are small and rocky; the outer four are large and made of gas or ice. The orbital period increases with distance from the Sun.</li><li><b>Comets:</b> large balls of ice and dust in highly elliptical orbits; they speed up near the Sun and slow down far from it. <b>Asteroids</b> are rocky bodies mostly between Mars and Jupiter. <b>Dwarf planets</b> such as Pluto are too small to clear their orbits.</li><li><b>Distances:</b> Earth–Sun is 1.5 × 10¹¹ m (1 astronomical unit). Light takes about 8 minutes to reach Earth, so we see the Sun as it was 8 minutes ago.</li><li><span class=\"tag\" style=\"background:#ec4899;color:#fff\">Supplement</span> Gravitational force provides the centripetal force for circular orbits. Orbital speed v = 2πr ÷ T. If the radius increases, the orbital speed decreases and the period increases. Example: Mars r = 2.28 × 10¹¹ m, T = 5.94 × 10⁷ s gives v = 2.4 × 10⁴ m/s.</li></ul><div class=\"card\" style=\"margin:12px 0\"><span class=\"tag\">🎮 Simulation</span><h4 style=\"margin:.4em 0\">Orbital speed of the planets</h4><label>Planet <select id=\"oP\" onchange=\"sOr()\"><option>Mercury</option><option>Venus</option><option selected>Earth</option><option>Mars</option><option>Jupiter</option><option>Saturn</option><option>Uranus</option><option>Neptune</option></select></label><p id=\"oo\"></p><img src=\"data:,\" alt=\"\" style=\"display:none\" onerror=\"sOr()\"></div><h4>How the Solar System formed (accretion model)</h4><p>Gravity pulled together an interstellar cloud of gas and dust that contained many elements. The cloud rotated and flattened into a spinning accretion disc, and material clumped together (accreted) to form the Sun at the centre and the planets in the disc. Near the hot Sun the light gases were driven away, leaving small rocky planets. Far from the Sun it was cold enough for large gaseous planets to form. The Sun contains most of the mass of the Solar System, so its gravitational attraction keeps the planets in orbit.</p>\n<span class=\"tag\">Topic 6.2</span><h3>Stars and the Universe</h3>\n<ul><li>The Sun is a medium-sized star, energy from <b>nuclear fusion</b> of hydrogen into helium.</li>\n<li><b>Stellar life cycle:</b> nebula → protostar → main sequence star → (Sun-like) red giant → white dwarf; (massive) red supergiant → supernova → neutron star or black hole.</li>\n<li>A <b>galaxy</b> is a huge group of stars (the Milky Way). The Universe contains billions of galaxies. A <b>light-year</b> is the distance light travels in one year.</li>\n<li><b>Redshift:</b> light from distant galaxies has longer wavelengths, which shows they are moving away. The further the galaxy, the faster it recedes: v = H₀d.</li>\n<li><b>Big Bang theory:</b> the Universe began about 13.8 billion years ago from a hot, dense state and has been expanding since. Evidence: redshift and the <b>cosmic microwave background radiation (CMBR)</b>.</li></ul><ul><li>The Sun emits across the electromagnetic spectrum; stars vary in <b>luminosity</b> (total power output) and colour (hotter stars are bluer, cooler stars are redder).</li><li><span class=\"tag\" style=\"background:#ec4899;color:#fff\">Supplement</span> Hubble constant H₀ ≈ 2.2 × 10⁻¹⁸ per second, so the age of the Universe ≈ 1/H₀ ≈ 14 billion years (consistent with 13.8 billion years).</li><li>Distances in space: 1 light-year ≈ 9.5 × 10¹⁵ m. The nearest star after the Sun (Proxima Centauri) is about 4.2 light-years away.</li></ul>\n<h4>Going deeper: life cycle of stars</h4><div class=\"wrap\"><table><tr><th>Stage</th><th>Sun-like star</th><th>Massive star</th></tr><tr><td>1</td><td colspan=\"2\">Nebula (gas and dust) pulled together by gravity → protostar</td></tr><tr><td>2</td><td colspan=\"2\">Main sequence: stable, hydrogen → helium by fusion; gravity balances radiation pressure</td></tr><tr><td>3</td><td>Red giant</td><td>Red supergiant</td></tr><tr><td>4</td><td>Planetary nebula → white dwarf</td><td>Supernova → neutron star or black hole</td></tr></table></div>\n<svg class=\"v\" viewBox=\"0 0 340 120\" role=\"img\" aria-label=\"Redshift of spectral lines\"><rect x=\"10\" y=\"20\" width=\"320\" height=\"26\" fill=\"#475569\"/><path class=\"l\" d=\"M60 20V46M120 20V46M190 20V46\" stroke=\"#fff\" stroke-width=\"3\"/><text x=\"10\" y=\"14\" style=\"font-size:10px\">Light from a laboratory source</text><rect x=\"10\" y=\"74\" width=\"320\" height=\"26\" fill=\"#475569\"/><path class=\"l\" d=\"M80 74V100M140 74V100M210 74V100\" stroke=\"#fff\" stroke-width=\"3\"/><text x=\"10\" y=\"68\" style=\"font-size:10px\">Distant galaxy: lines shifted towards red (longer λ)</text><path class=\"l\" d=\"M60 60H80M74 56L80 60L74 64\" stroke=\"#ef4444\"/></svg><h4>Going deeper: stars, galaxies and the Universe</h4><ul><li><b>Star formation:</b> gravity pulls a cloud of hydrogen and dust together; temperature rises until nuclear fusion starts and the star becomes stable (main sequence). Our Sun has been stable for about 4.6 billion years and has about the same left.</li><li><b>Fusion</b> in stars makes helium from hydrogen, and heavier elements from helium in later stages; supernovae scatter these elements, which form new stars and planets (including us).</li><li><b>Galaxies:</b> the Milky Way holds about 10¹¹ stars; the Sun is in one spiral arm. There are billions of galaxies in the observable Universe.</li><li><b>Redshift and the expanding Universe:</b> the wavelength of light from distant galaxies is longer than expected. Most galaxies are moving away from us and those further away move faster, as if the Universe is expanding in all directions.</li><li><b>Big Bang evidence:</b> the expansion, and the cosmic microwave background radiation (CMBR), which is leftover radiation from the early Universe stretched to microwave wavelengths. Observed CMBR comes from all directions.</li><li><span class=\"tag\" style=\"background:#ec4899;color:#fff\">Supplement</span> Hubble constant H₀ ≈ 2.2 × 10⁻¹⁸ per second. For a galaxy 1.0 × 10²⁴ m away: v = H₀d = 2.2 × 10⁶ m/s. Age of the Universe ≈ 1/H₀ ≈ 4.5 × 10¹⁷ s ≈ 14 billion years.</li><li><span class=\"tag\" style=\"background:#ec4899;color:#fff\">Supplement</span> CMBR evidence: as the Universe expanded, the original high-energy radiation was stretched to longer wavelength; it now corresponds to microwave radiation (about 2.7 K).</li></ul><div class=\"card\" style=\"margin:12px 0\"><span class=\"tag\">🎮 Simulation</span><h4 style=\"margin:.4em 0\">Hubble’s law</h4><label>Distance to galaxy (billion light-years): <b id=\"uHv\">1</b><input type=\"range\" id=\"uH\" min=\"0.1\" max=\"10\" value=\"1\" step=\"0.1\" oninput=\"sHu()\" style=\"padding:0;border:0;margin:4px 0\"></label><p id=\"ub\"></p><img src=\"data:,\" alt=\"\" style=\"display:none\" onerror=\"sHu()\"></div><div class=\"card\" style=\"margin:12px 0\"><span class=\"tag\">🎮 Simulation</span><h4 style=\"margin:.4em 0\">Life of a star</h4><label>Mass of star (Sun = 1): <b id=\"fMv\">1</b><input type=\"range\" id=\"fM\" min=\"0.5\" max=\"40\" value=\"1\" step=\"0.5\" oninput=\"sFt()\" style=\"padding:0;border:0;margin:4px 0\"></label><p id=\"fo\"></p><img src=\"data:,\" alt=\"\" style=\"display:none\" onerror=\"sFt()\"></div>\n<p style=\"margin-top:14px\"><b>Exam tips:</b> Learn the order of the planets and the stages of a star's life cycle for both a Sun-like and a massive star. Redshift means longer observed wavelength, and CMBR and redshift are the two Big Bang evidence points. Give units for orbital speed (m/s) and keep powers of ten tidy.</p><h4>The Sun as a star</h4><p>The Sun is a star of medium size, made mostly of hydrogen and helium. It radiates most of its energy in the infrared, visible light and ultraviolet regions of the electromagnetic spectrum.</p><h4>Size of the Milky Way</h4><p>The Milky Way is one of many billions of galaxies that make up the Universe. Its diameter is approximately 100 000 light-years.</p><h4>Distances to far galaxies</h4><p><span class=\"tag\">Supplement</span> The distance to a far galaxy can be found from the brightness of a supernova in that galaxy. Such supernovae have a known true brightness, so the fainter one looks, the further away its galaxy is.</p>","kw":[["Orbital period","Time for one complete orbit."],["Nuclear fusion","Joining of light nuclei to make a heavier nucleus, releasing energy."],["Galaxy","A very large group of stars held together by gravity."],["Light-year","Distance light travels in one year."],["Redshift","Increase in observed wavelength from a receding source."],["Big Bang","Theory that the Universe expanded from a hot, dense state."],["CMBR","Microwave radiation left over from the early Universe."],["Asteroid belt","A region of rocky objects between Mars and Jupiter."],["Luminosity","Total power output of a star."],["Supernova","The explosion of a massive star at the end of its life."],["Elliptical orbit","An oval-shaped orbit, like a comet's."],["Astronomical unit","The average distance from Earth to the Sun, 1.5 × 10¹¹ m."],["Main sequence","Long stable phase in a star's life in which it fuses hydrogen."],["Neutron star","Extremely dense remnant of a supernova."],["Black hole","Region with such strong gravity that nothing, not even light, can escape."],["Accretion","Material clumping together under gravity to build up larger bodies such as planets."]],"f":["orbital speed v = 2πr / T","Hubble: v = H₀d","speed of light c = 3 × 10⁸ m/s","1 light-year ≈ 9.5 × 10¹⁵ m","age of Universe ≈ 1/H₀","Hubble constant H₀ ≈ 2.2 × 10⁻¹⁸ s⁻¹"],"qa":[["Earth orbits at r = 1.5 × 10¹¹ m in 3.15 × 10⁷ s. Find v.","v = 2π × 1.5×10¹¹ / 3.15×10⁷ ≈ 3.0 × 10⁴ m/s."],["Why do we have seasons?","Earth's axis is tilted, so each hemisphere gets more direct sunlight at different parts of the orbit."],["Give two pieces of evidence for the Big Bang.","Redshift of galaxies and CMBR."],["Why do stars turn into red giants?","When hydrogen in the core runs low, the star expands and cools, becoming redder."],["Why do planets closer to the Sun orbit faster?","Gravity is stronger there, so a higher orbital speed is needed to stay in a circular orbit."],["Explain why Earth has day and night.","Earth rotates on its axis once every 24 hours."],["Why is a year 365¼ days?","Earth takes about 365¼ days to orbit the Sun; the extra quarters add up to a leap day every four years."],["What does the Doppler-type redshift of galaxies suggest about the Universe?","The Universe is expanding, and distant galaxies move away faster."],["Why does light from a distant galaxy appear redshifted?","The galaxy is moving away, so the observed wavelengths are stretched to longer values."],["Describe the evidence for the Big Bang.","Redshift shows the Universe is expanding from a hot, dense start; CMBR is leftover radiation from the early Universe, stretched to microwaves."],["Why do planets further from the Sun take longer to orbit?","They have a longer orbit to travel and move more slowly because the Sun's gravity is weaker."],["Name the stages in the life of a Sun-like star.","Nebula → protostar → main sequence → red giant → white dwarf."]],"mcq":[["The Sun's energy comes from…",["fission","fusion","burning"],1,"Hydrogen fuses to helium."],["Redshift shows galaxies are…",["moving away","approaching","stationary"],0,"Longer wavelength, receding source."],["Which planet has the longest orbital period?",["Mercury","Earth","Neptune"],2,"Further out, longer period."],["Which has the longest wavelength?",["Gamma","Visible","Radio"],2,"Radio waves have the longest wavelength."],["Which is a gas giant?",["Mars","Jupiter","Mercury"],1,"Jupiter and Saturn are gas giants."],["A massive star may end as…",["a white dwarf","a black hole","a nebula"],1,"Supernova leaves a neutron star or black hole."],["Light from the Sun takes about…",["8 seconds","8 minutes","8 hours"],1,"About 500 s."],["The Milky Way is a…",["galaxy","solar system","star"],0,"A galaxy of billions of stars."],["Which planet is a rocky planet?",["Saturn","Mars","Neptune"],1,"The four inner planets are rocky."],["A light-year is a unit of…",["time","distance","speed"],1,"Distance light travels in a year."],["The Sun is currently in the…",["red giant stage","main sequence","white dwarf stage"],1,"It fuses hydrogen steadily."],["The CMBR is mainly in the…",["radio","microwave","X-ray"],1,"The early radiation was stretched to microwaves."]]};

<span class="tag">Topic 12.1</span><h3>Respiration and the uses of energy</h3>
<p class="lg"><b>Key:</b> <span class="xt">EXT</span> = Extended (Supplement) only. No tag = Core (Extended students need it too).</p>
<p><b>Respiration</b> is the set of chemical reactions in cells that break down nutrient molecules and <b>release the energy stored in them</b>. Energy is released, not created or “made”. It happens in every living cell all the time, including plants and microorganisms.</p>
<p><b>Respiration is not breathing.</b> Breathing is the movement of air in and out of the lungs. It helps supply oxygen for aerobic respiration, but the respiration itself happens inside cells.</p>
<h3>The seven uses of respiration’s energy</h3>
<ul><li><b>Muscle contraction</b>: movement, the heartbeat and the breathing muscles.</li>
<li><b>Protein synthesis</b>: joining amino acids to make proteins.</li>
<li><b>Cell division</b>: making new cells for growth and repair.</li>
<li><b>Active transport</b>: moving particles across a membrane against a concentration gradient, e.g. root hair cells taking up mineral ions.</li>
<li><b>Growth</b>: building new cells and new material.</li>
<li><b>Passage of nerve impulses</b>.</li>
<li><b>Maintenance of a constant body temperature</b> in mammals, because some of the energy is released as heat.</li></ul>

<tr><td>for movement</td><td>for muscle contraction</td></tr><tr><td>for making cells</td><td>for cell division</td></tr>
<tr><td>for transport</td><td>for active transport</td></tr><tr><td>for the nervous system</td><td>for the passage of nerve impulses</td></tr>
<tr><td>to stay warm</td><td>for maintenance of a constant body temperature</td></tr></table></div>
<h3>Investigating temperature and respiration in yeast</h3>
<ul><li>Respiration is controlled by <b>enzymes</b>. At low temperature the rate is slow; as temperature rises it increases to an <b>optimum</b>; above the optimum the enzymes lose their shape and the rate falls, and may almost stop.</li>
<li><b>Method:</b> mix yeast with glucose solution, keep identical mixtures in water baths at different temperatures, and measure the carbon dioxide made in a fixed time (e.g. with a gas syringe). Rate = volume of CO₂ ÷ time.</li>
<li><b>Variables:</b> independent = temperature; dependent = rate of CO₂ production. Keep the same amount and concentration of yeast and glucose, the same pH and the same time.</li>
<li><b>Reliability:</b> repeat each temperature and take a mean; ignore anomalous results.</li>
<li><b>Reading data:</b> if you measure time to reach a fixed end-point, faster respiration means a shorter time. Check which one you are given.</li></ul>
<p><b>Exam tips:</b> say “releases energy stored in nutrient molecules”, never “produces energy”. Do not give one fixed “optimum” number; describe the pattern from the data.</p>
<span class="tag">Topic 12.2</span><h3>Aerobic respiration</h3>
<p><b>Aerobic respiration</b> is the chemical process in cells that uses <b>oxygen</b> to break down nutrient molecules and release energy.</p>
<p><b>Word equation:</b> glucose + oxygen → carbon dioxide + water. Do not write “+ energy” as a product in the word equation.</p>
<p><span class="xt">EXT</span> <b>Balanced equation:</b> C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O. The numbers in front balance each atom: 6 C, 12 H and 18 O on each side.</p>
<ul><li>The main site is the <b>mitochondria</b>.</li>
<li>Common mistakes: swapping oxygen and carbon dioxide; adding lactic acid or ethanol (those belong to anaerobic respiration); reversing it with photosynthesis (CO₂ + water → glucose + oxygen).</li></ul>
<span class="tag">Topic 12.3</span><h3>Anaerobic respiration</h3>
<p><b>Anaerobic respiration</b> is the release of energy from nutrient molecules <b>without using oxygen</b>. It still releases energy, but <b>much less energy per glucose molecule</b> than aerobic respiration, because glucose is not broken down completely.</p>
<ul><li><b>In yeast</b> (fermentation): glucose → alcohol (ethanol) + carbon dioxide. Used in brewing and bread making.</li>
<li><b>In muscles</b> (during vigorous exercise, when oxygen cannot be supplied fast enough): glucose → lactic acid. <b>No carbon dioxide is made.</b></li></ul>
<p><span class="xt">EXT</span> <b>Balanced equation (yeast):</b> C₆H₁₂O₆ → 2C₂H₅OH + 2CO₂.</p>
<div class="wrap"><table><tr><th></th><th>Aerobic</th><th>Anaerobic, yeast</th><th>Anaerobic, muscle</th></tr>
<tr><td>Oxygen used?</td><td>Yes</td><td>No</td><td>No</td></tr>
<tr><td>Energy per glucose</td><td>More</td><td>Much less</td><td>Much less</td></tr>
<tr><td>Products</td><td>CO₂ + water</td><td>Alcohol + CO₂</td><td>Lactic acid only</td></tr></table></div>
<h3><span class="xt">EXT</span>Lactic acid and oxygen debt</h3>
<p><span class="xt">EXT</span> Lactic acid builds up in the muscles and blood during vigorous exercise. The <b>oxygen debt</b> is the extra oxygen needed afterwards to deal with this lactic acid. It is removed by three linked processes:</p>
<ul><li><span class="xt">EXT</span> The <b>heart keeps beating rapidly</b>, carrying blood with lactic acid from the muscles to the liver.</li>
<li><span class="xt">EXT</span> <b>Breathing stays deeper and faster</b>, bringing in the extra oxygen needed.</li>
<li><span class="xt">EXT</span> The lactic acid is broken down by <b>aerobic respiration in the liver</b>.</li></ul>
<p>That is why breathing and heart rate stay high for a while after exercise stops. Stick to these three points; extra physiology is not required.</p>
<p><b>Exam tips:</b> write “much less energy per glucose molecule”, not just “less energy”. For muscle, do not add carbon dioxide.</p>

const MA1={t:"Topic 1: Number (Cambridge 0580)",notes:`<span class="tag">Topic 1.1</span><h3>Types of number</h3><p class="lg"><b>Key:</b> <span class="xt">EXT</span> = Extended (Supplement) only. No tag = Core (Extended students need it too).</p><ul><li><b>Natural numbers</b> are 1, 2, 3, … <b>Integers</b> are …, −2, −1, 0, 1, 2, … <b>Prime numbers</b> have exactly two factors (1 and themselves): 2, 3, 5, 7, 11, 13, 17, 19, 23. The number 1 is not prime and 2 is the only even prime.</li><li><b>Square numbers:</b> 1, 4, 9, 16, 25, 36, 49, 64, 81, 100, 121, 144, 169, 196, 225. <b>Cube numbers:</b> 1, 8, 27, 64, 125, 1000. <b>Triangular numbers:</b> 1, 3, 6, 10, 15, 21 (add 1, 2, 3, … each time). Learn these and their roots by heart for the non-calculator paper.</li><li>A <b>factor</b> divides exactly into a number; a <b>multiple</b> is in its times table. The <b>reciprocal</b> of a number is 1 ÷ the number (reciprocal of 4 is 1/4; of 2/3 is 3/2).</li><li><b>Rational</b> numbers can be written as a fraction of two integers (3/4, 0.25, −5, 0.333…). <b>Irrational</b> numbers cannot (π, √2, √10); their decimals never end or repeat. √9 = 3 is rational, but √10 is irrational.</li><li><span class="xt">EXT</span> A <b>recurring decimal</b> is rational. Let x = 0.41666…, then 100x = 41.666… and 1000x = 416.666…, so 900x = 375 and x = 5/12. For 0.777…, 10x − x = 7 gives x = 7/9.</li><li><span class="xt">EXT</span> A rational number plus or times an irrational number is irrational (for example 2 + √3).</li></ul><h3>🔍 In more detail</h3><ul><li><b>Why 1 is not prime:</b> a prime must have exactly two factors and 1 has only one. This also keeps prime factorisation unique (12 = 2² × 3 in only one way).</li><li><b>Divisibility tests:</b> by 2 if the last digit is even; by 3 if the digit sum divides by 3; by 5 if it ends in 0 or 5; by 9 if the digit sum divides by 9; by 10 if it ends in 0. To test whether a number up to about 150 is prime, try 2, 3, 5, 7 and 11 only.</li><li>Square numbers always have an <b>odd</b> number of factors (36 has nine: 1, 2, 3, 4, 6, 9, 12, 18, 36).</li></ul><p>📝 <b>Example:</b> Is 91 prime? 91 = 7 × 13, so no. Is 97 prime? It is not divisible by 2, 3, 5 or 7 (7 × 14 = 98), so yes.</p><p>⚠️ <b>Exam trap:</b> 0.5 is rational (it is 1/2). Irrational means the decimal never ends and never repeats, like π.</p><ul><li><span class="xt">EXT</span> Recurring decimals: 0.2323… gives x = 0.2323…, 100x = 23.2323…, 99x = 23, so x = 23/99. Use 10x for one repeating digit, 100x for two, 1000x for three.</li></ul><svg class="v" viewBox="0 0 340 200" role="img" aria-label="Types of number" style="width:100%;max-width:520px;display:block;margin:12px auto"><g fill="currentColor" font-size="12"><rect x="4" y="4" width="332" height="192" rx="10" fill="none" stroke="currentColor"/><text x="12" y="20">Real numbers</text><ellipse cx="120" cy="108" rx="108" ry="80" fill="#3b4fd822" stroke="#3b4fd8"/><text x="30" y="52">Rational: 3/4, 0.25, −5</text><ellipse cx="120" cy="124" rx="76" ry="48" fill="#10b98122" stroke="#10b981"/><text x="62" y="102">Integers: −2, 0, 7</text><ellipse cx="120" cy="140" rx="46" ry="22" fill="#f59e0b33" stroke="#f59e0b"/><text x="76" y="144">Natural 1, 2, 3</text><ellipse cx="270" cy="108" rx="58" ry="46" fill="#ec489922" stroke="#ec4899"/><text x="226" y="100">Irrational</text><text x="228" y="118">π, √2, √10</text></g></svg><span class="tag">Topic 1.2</span><h3>Prime factors, HCF and LCM</h3><ul><li>Write a number as a product of primes with a factor tree: 72 = 2³ × 3² and 60 = 2² × 3 × 5.</li><li><b>HCF:</b> take the primes that are in both numbers, each with its <b>smallest</b> power: 2² × 3 = 12. <b>LCM:</b> take every prime that appears, each with its <b>largest</b> power: 2³ × 3² × 5 = 360.</li></ul><p>📝 <b>Example:</b> Check: HCF × LCM = 12 × 360 = 4320 = 72 × 60.</p><ul><li>Use LCM for "when will they next happen together" problems (two buses leaving every 12 and 15 minutes meet again after 60 minutes). Use HCF for "largest equal groups" problems.</li></ul><h3>🔍 In more detail</h3><ul><li>Prime factorise by dividing by the smallest possible prime each time: 360 ÷ 2 = 180, ÷ 2 = 90, ÷ 2 = 45, ÷ 3 = 15, ÷ 3 = 5, so 360 = 2³ × 3² × 5.</li><li>A number is a <b>perfect square</b> if every prime has an even power (144 = 2⁴ × 3², so √144 = 2² × 3 = 12). It is a <b>perfect cube</b> if every power is a multiple of 3.</li></ul><p>📝 <b>Example:</b> Find the smallest number to multiply 72 by to give a perfect square. 72 = 2³ × 3², so one more 2 is needed: 72 × 2 = 144 = 12².</p><p>📝 <b>Example:</b> Two buses leave together at 09:00 and then every 12 and 15 minutes. LCM of 12 and 15 is 60, so they meet again at 10:00.</p><p>⚠️ <b>Exam trap:</b> The HCF is never larger than the smaller number, and the LCM is never smaller than the larger number. Use this to check your answer.</p><div class="card" style="margin:12px 0"><span class="tag">🎮 Simulation</span><h4 style="margin:.4em 0">HCF and LCM finder</h4><label>First number: <b id="hav">72</b><input type="range" id="ha" min="2" max="120" value="72" step="1" oninput="hl()" style="padding:0;border:0;margin:4px 0"></label><label>Second number: <b id="hbv">60</b><input type="range" id="hb" min="2" max="120" value="60" step="1" oninput="hl()" style="padding:0;border:0;margin:4px 0"></label><p id="ho"></p><img src="data:," alt="" style="display:none" onerror="hl()"></div><span class="tag">Topic 1.3</span><h3>Sets and Venn diagrams</h3><ul><li>Symbols: { } a set; ∈ is an element of; ∉ is not an element of; ξ universal set; ∅ empty set; A′ complement (in ξ but not in A); A ∪ B union (in A or B or both); A ∩ B intersection (in both); n(A) number of elements; A ⊆ B subset.</li><li>Describe sets by listing, A = {2, 4, 6, 8}, or by a rule, B = {x : x is a prime less than 12}. A Venn diagram uses a rectangle for ξ and circles for sets.</li></ul><p>📝 <b>Example:</b> In a class of 30, 18 play football (F), 14 play tennis (T), 5 play neither. At least one sport = 25, so n(F ∩ T) = 18 + 14 − 25 = 7. Only football 11, only tennis 7, both 7, neither 5 (total 30).</p><ul><li>Always fill the <b>intersection first</b>, then work outwards, and check the regions add up to n(ξ).</li><li><span class="xt">EXT</span> Three-set Venn diagrams and shading regions such as A′ ∩ B, (A ∪ B)′, A ∩ B′ and A ∪ B′.</li><li><span class="xt">EXT</span> Set-builder notation with inequalities: {x : 2 < x ≤ 7, x an integer} = {3, 4, 5, 6, 7}. Use algebra when a region holds an unknown number of elements.</li></ul><h3>🔍 In more detail</h3><ul><li>Region notation: A ∩ B′ is A only; A′ ∩ B is B only; (A ∪ B)′ is neither, and (A ∪ B)′ = A′ ∩ B′.</li><li>Counting rule: n(A ∪ B) = n(A) + n(B) − n(A ∩ B). You subtract because the overlap would be counted twice.</li></ul><p>📝 <b>Example:</b> ξ = {1, …, 10}, A = {even numbers} = {2, 4, 6, 8, 10}, B = {multiples of 3} = {3, 6, 9}. A ∩ B = {6}; A ∪ B = {2, 3, 4, 6, 8, 9, 10}; (A ∪ B)′ = {1, 5, 7}.</p><p>⚠️ <b>Exam trap:</b> Read the symbols slowly: ∪ means "or" (everything in either circle) and ∩ means "and" (only the overlap).</p><ul><li><span class="xt">EXT</span> Three sets: fill the centre A ∩ B ∩ C first, then each pairwise overlap (minus the centre), then the single-set parts, then the outside. Check the total equals n(ξ).</li></ul><svg class="v" viewBox="0 0 320 180" role="img" aria-label="Venn diagram of football and tennis" style="width:100%;max-width:520px;display:block;margin:12px auto"><g fill="currentColor" font-size="12"><rect x="4" y="4" width="312" height="172" rx="8" fill="none" stroke="currentColor"/><text x="12" y="22">ξ (30)</text><circle cx="125" cy="92" r="62" fill="#3b4fd822" stroke="#3b4fd8"/><circle cx="195" cy="92" r="62" fill="#10b98122" stroke="#10b981"/><text x="78" y="40">F</text><text x="232" y="40">T</text><text x="92" y="97" font-size="18">11</text><text x="154" y="97" font-size="18">7</text><text x="224" y="97" font-size="18">7</text><text x="272" y="162" font-size="18">5</text><text x="150" y="166" font-size="11">F ∩ T = 7</text></g></svg><span class="tag">Topic 1.4</span><h3>Fractions, decimals and percentages</h3><ul><li>Common equivalents to learn: 1/2 = 0.5 = 50%; 1/4 = 0.25 = 25%; 3/4 = 0.75; 1/5 = 0.2 = 20%; 1/8 = 0.125 = 12.5%; 1/3 = 0.333… ; 1/10 = 0.1 = 10%.</li><li>Fraction to decimal: divide top by bottom. Decimal to percentage: multiply by 100. To <b>order</b> numbers, convert them all to decimals.</li><li><b>Add and subtract</b> with a common denominator: 3/8 + 5/12 = 9/24 + 10/24 = 19/24. <b>Multiply</b> tops and bottoms (cancel first). <b>Divide</b> by flipping the second fraction. Change mixed numbers to improper fractions first.</li></ul><p>📝 <b>Example:</b> 2¾ ÷ 1⅕ = 11/4 × 5/6 = 55/24 = 2 7/24.</p><ul><li><b>BIDMAS:</b> Brackets, Indices, Division and Multiplication (left to right), Addition and Subtraction (left to right). 2 + 3 × 4 = 14, not 20.</li><li><b>Negatives:</b> 5 + (−3) = 2; 5 − (−3) = 8. Same signs in a product or quotient give positive, different signs give negative.</li></ul><p>⚠️ <b>Exam trap:</b> On a calculator −3² = −9 but (−3)² = 9. Type the brackets.</p><h3>🔍 In more detail</h3><ul><li><b>Comparing fractions:</b> 5/8 = 0.625 and 7/11 = 0.636, so 7/11 is larger. <b>Fraction of a quantity:</b> 3/5 of 40 = 40 ÷ 5 × 3 = 24.</li><li>A fraction gives a <b>terminating</b> decimal only if its denominator (in lowest terms) has no prime factors other than 2 and 5. So 1/8 terminates but 1/3 recurs.</li><li><b>Mixed numbers:</b> 3¼ − 1⅚ = 13/4 − 11/6 = 39/12 − 22/12 = 17/12 = 1 5/12.</li></ul><p>📝 <b>Example:</b> 8 − 2 × (3 + 1)² ÷ 4: bracket 4, index 16, then 2 × 16 = 32, 32 ÷ 4 = 8, finally 8 − 8 = 0.</p><p>📝 <b>Example:</b> −4 × −3 = 12; −12 ÷ 4 = −3; −2 − 5 = −7; −2 − (−5) = 3.</p><p>⚠️ <b>Exam trap:</b> Never add the denominators: 1/2 + 1/3 = 5/6, not 2/5.</p><span class="tag">Topic 1.5</span><h3>Powers and roots</h3><ul><li>√49 = 7 and ∛27 = 3. Estimate other roots by bracketing: √20 lies between √16 = 4 and √25 = 5 (calculator: 4.47).</li><li>Every positive number has two square roots (± the value), but the symbol √ means the positive one.</li></ul><h3>🔍 In more detail</h3><ul><li>Roots of fractions and decimals: √0.25 = 0.5, √(1/9) = 1/3, √(4/25) = 2/5. Powers of 10: 10² = 100, 10³ = 1000, 10⁻¹ = 0.1.</li><li><b>Estimating a root:</b> √70 lies between √64 = 8 and √81 = 9, and is nearer 8, so about 8.4 (calculator 8.37).</li></ul><p>📝 <b>Example:</b> Without a calculator: √0.04 = 0.2; ∛0.008 = 0.2; √(144/25) = 12/5.</p><p>⚠️ <b>Exam trap:</b> √(9 + 16) = √25 = 5, not 3 + 4 = 7. A root does not split over addition.</p><span class="tag">Topic 1.6</span><h3>Indices (powers)</h3><ul><li>aᵐ × aⁿ = aᵐ⁺ⁿ. aᵐ ÷ aⁿ = aᵐ⁻ⁿ. (aᵐ)ⁿ = aᵐⁿ. a⁰ = 1. a⁻ⁿ = 1/aⁿ. These work with numbers and letters: x⁵ × x² = x⁷; 2⁻³ = 1/8.</li></ul><p>⚠️ <b>Exam trap:</b> (2x)³ = 8x³, not 2x³: the power applies to the number and the letter. Also 3x⁻² = 3/x², not 1/(3x²).</p><ul><li><span class="xt">EXT</span> <b>Fractional indices:</b> a^(1/n) is the nth root of a, and a^(m/n) = (ⁿ√a)ᵐ. 27^(2/3) = 3² = 9. (1/4)^(−3/2) = 4^(3/2) = 8.</li><li><span class="xt">EXT</span> <b>Exponential equations:</b> write both sides with the same base. 2ˣ = 32 gives x = 5. 9ˣ = 27 gives 3²ˣ = 3³, so x = 1.5.</li><li><span class="xt">EXT</span> Simplify (2x³y)² × 3x⁻¹ = 4x⁶y² × 3x⁻¹ = 12x⁵y².</li></ul><h3>🔍 In more detail</h3><ul><li><b>Why a⁰ = 1:</b> aⁿ ÷ aⁿ = aⁿ⁻ⁿ = a⁰, and any number divided by itself is 1. <b>Why a⁻ⁿ = 1/aⁿ:</b> a² ÷ a⁵ = a⁻³, and also a²/a⁵ = 1/a³.</li><li>A negative power of a fraction flips it: (2/3)⁻² = (3/2)² = 9/4. You can only combine powers with the <b>same base</b>.</li></ul><p>📝 <b>Example:</b> Simplify (3a²b)³ ÷ 9a⁴ = 27a⁶b³ ÷ 9a⁴ = 3a²b³. Also 5⁻² = 1/25 and (1/2)⁻³ = 8.</p><p>⚠️ <b>Exam trap:</b> 2³ × 2⁴ = 2⁷, not 4⁷. You add the powers; the base stays the same.</p><ul><li><span class="xt">EXT</span> Negative fractional power: 16^(−3/4) = 1/(⁴√16)³ = 1/2³ = 1/8.</li><li><span class="xt">EXT</span> Solve 4^(x+1) = 8ˣ: 2^(2x+2) = 2^(3x), so 2x + 2 = 3x and x = 2 (check: 4³ = 64 = 8²).</li></ul><span class="tag">Topic 1.7</span><h3>Standard form</h3><ul><li>A number in standard form is a × 10ⁿ with 1 ≤ a < 10 and n an integer. Big numbers have positive n (45 000 000 = 4.5 × 10⁷); small numbers have negative n (0.00032 = 3.2 × 10⁻⁴).</li><li><b>Multiply:</b> multiply the a-parts and add the powers: (3 × 10⁴)(2 × 10⁻²) = 6 × 10². <b>Divide:</b> divide the a-parts and subtract the powers: (6.4 × 10⁵) ÷ (1.6 × 10²) = 4 × 10³.</li><li><b>Add or subtract:</b> change to ordinary numbers or the same power first: 4.5 × 10³ + 6 × 10² = 4500 + 600 = 5.1 × 10³.</li></ul><p>⚠️ <b>Exam trap:</b> 25 × 10³ is not standard form; write 2.5 × 10⁴. On a calculator use the EXP key, not 10 × 10ˣ.</p><h3>🔍 In more detail</h3><ul><li><b>Comparing:</b> compare the powers of 10 first, then the a-parts. 3.2 × 10⁵ is bigger than 9.9 × 10⁴.</li><li><b>Ordinary numbers:</b> 6.7 × 10⁻³ = 0.0067 (move the point 3 places left). Typical sizes: distance to the Sun about 1.5 × 10⁸ km; a hydrogen atom has mass about 1.7 × 10⁻²⁷ kg.</li></ul><p>📝 <b>Example:</b> (4 × 10⁻³) ÷ (8 × 10⁵) = 0.5 × 10⁻⁸ = 5 × 10⁻⁹.</p><p>📝 <b>Example:</b> 3.6 × 10⁴ − 5 × 10³ = 36 000 − 5000 = 31 000 = 3.1 × 10⁴.</p><p>⚠️ <b>Exam trap:</b> After multiplying, check the a-part is still between 1 and 10: (6 × 10³)(5 × 10²) = 30 × 10⁵ = 3 × 10⁶.</p><div class="card" style="margin:12px 0"><span class="tag">🎮 Simulation</span><h4 style="margin:.4em 0">Standard form builder</h4><label>a (1 to 9.9): <b id="sav">3.2</b><input type="range" id="sa" min="1" max="9.9" value="3.2" step="0.1" oninput="sf()" style="padding:0;border:0;margin:4px 0"></label><label>Power n: <b id="snv">-4</b><input type="range" id="sn" min="-6" max="8" value="-4" step="1" oninput="sf()" style="padding:0;border:0;margin:4px 0"></label><p id="so"></p><img src="data:," alt="" style="display:none" onerror="sf()"></div><span class="tag">Topic 1.8</span><h3>Rounding, estimation and accuracy</h3><ul><li><b>Decimal places:</b> count after the point; look at the next digit (5 or more rounds up). 3.4672 to 2 d.p. is 3.47. <b>Significant figures:</b> count from the first non-zero digit. 0.004073 to 2 s.f. is 0.0041; 58 640 to 2 s.f. is 59 000.</li><li>If no accuracy is given, give 3 s.f. (angles 1 d.p., money 2 d.p.). <b>Truncating</b> just cuts digits off: 3.789 to 1 d.p. truncated is 3.7.</li><li><b>Estimate</b> by rounding each number to 1 s.f.: (4.87 × 31.2) ÷ 0.52 ≈ (5 × 30) ÷ 0.5 = 300.</li></ul><p>⚠️ <b>Exam trap:</b> Never round in the middle of a calculation; keep the full calculator value (use ANS) and round only the final answer.</p><ul><li><span class="xt">EXT</span> <b>Bounds:</b> a value rounded to the nearest u lies within ± u/2. A length of 7.3 cm (1 d.p.) has 7.25 ≤ l < 7.35.</li><li><span class="xt">EXT</span> Upper bound of a + b = upper a + upper b. Upper bound of a − b = upper a − <b>lower</b> b. Upper bound of a ÷ b = upper a ÷ <b>lower</b> b. A rectangle 7.3 by 4.2 (1 d.p.) has area between 7.25 × 4.15 = 30.0875 and 7.35 × 4.25 = 31.2375, so the area is 30 cm² to 1 s.f.</li></ul><h3>🔍 In more detail</h3><ul><li>Keep the trailing zero to show accuracy: 0.0996 to 2 s.f. is 0.10 and 3.996 to 2 d.p. is 4.00. To the nearest 100, 4780 is 4800.</li><li>When estimating, round sensibly: 19.8 × 4.1 ≈ 20 × 4 = 80 (exact answer 81.18, so it is sensible).</li><li>Rounded to the nearest 10, 50 means 45 ≤ x < 55.</li></ul><p>📝 <b>Example:</b> Round 5849 to 2 s.f.: the third digit is 4, so it stays 5800 (not 58).</p><p>⚠️ <b>Exam trap:</b> Write a lower bound with ≤ and an upper bound with <. The upper bound itself is not reached.</p><ul><li><span class="xt">EXT</span> A distance of 100 m (nearest metre) is run in 12.5 s (1 d.p.). Upper speed = 100.5 ÷ 12.45 = 8.07; lower speed = 99.5 ÷ 12.55 = 7.93. Both round to 8, so the speed is 8 m/s to 1 s.f.</li></ul><span class="tag">Topic 1.9</span><h3>Ratio and proportion</h3><ul><li>Simplify a ratio by dividing by the HCF (24 : 36 = 2 : 3), using the same units. To <b>share</b> in a ratio, add the parts, find one part, then multiply: $240 in the ratio 3 : 5 : 4 gives 12 parts of $20, so $60, $100, $80.</li><li><b>Maps and scales:</b> a scale of 1 : 50 000 means 1 cm is 50 000 cm = 500 m. 6 cm on a 1 : 25 000 map is 150 000 cm = 1.5 km.</li><li><b>Direct proportion</b> (both increase together): use the unitary method. 5 pens cost $3.50, so 8 pens cost 3.50 ÷ 5 × 8 = $5.60.</li><li><b>Inverse proportion</b> (one rises, one falls): the product stays the same. 6 workers take 10 days is 60 worker-days, so 4 workers take 15 days.</li></ul><h3>🔍 In more detail</h3><ul><li>Ratios with fractions or decimals: 1/2 : 1/3 becomes 3 : 2 (multiply by 6); 0.5 : 2 becomes 1 : 4.</li><li><b>Given one part:</b> if A : B = 3 : 5 and A is 12, one part is 4, so B = 20 and the total is 32. <b>Given the difference:</b> if A : B = 7 : 4 and A has $18 more, 3 parts = $18, one part = $6, so A = $42 and B = $24.</li></ul><p>📝 <b>Example:</b> A recipe for 4 people uses 300 g of flour. For 10 people: 300 ÷ 4 × 10 = 750 g.</p><p>📝 <b>Example:</b> A plan has scale 1 : 200. A wall of 4.5 cm on the plan is 900 cm = 9 m in real life. Areas scale by 1 : 40 000.</p><p>⚠️ <b>Exam trap:</b> In inverse proportion, more workers means <b>less</b> time, so you divide when the number of workers goes up.</p><span class="tag">Topic 1.10</span><h3>Rates, speed and time</h3><ul><li>Speed = distance ÷ time; distance = speed × time; time = distance ÷ speed. Average speed = <b>total distance ÷ total time</b>, not the average of the speeds. Density = mass ÷ volume.</li></ul><p>📝 <b>Example:</b> 72 km in 45 minutes: 45 min = 0.75 h, so speed = 72 ÷ 0.75 = 96 km/h.</p><ul><li><b>Currency:</b> multiply or divide by the exchange rate, then check whether the answer should be bigger or smaller. <b>Time:</b> use the 12-hour and 24-hour clock and timetables; minutes ÷ 60 gives decimal hours (2 h 24 min = 2.4 h).</li><li><span class="xt">EXT</span> Unit conversions: 1 m² = 10 000 cm² and 1 m³ = 1 000 000 cm³. km/h to m/s is ÷ 3.6 (90 km/h = 25 m/s). 8.9 g/cm³ = 8900 kg/m³.</li></ul><h3>🔍 In more detail</h3><ul><li>Always use matching units (km with hours, m with seconds). To change 0.35 h to minutes multiply by 60 (21 min); 2 h 45 min = 2.75 h.</li><li><b>Round trip:</b> 60 km out at 40 km/h takes 1.5 h and 60 km back at 60 km/h takes 1 h. Average speed = 120 ÷ 2.5 = 48 km/h, not 50.</li><li><b>Currency:</b> if £1 = 1.25 euro, then 80 euro = 80 ÷ 1.25 = £64. Dividing gives fewer pounds, which is sensible.</li></ul><p>📝 <b>Example:</b> A train leaves at 08:50 and arrives at 11:20, taking 2 h 30 min = 2.5 h. If it covers 300 km, speed = 300 ÷ 2.5 = 120 km/h.</p><p>⚠️ <b>Exam trap:</b> A calculator time of 1.5 h is 1 h 30 min, not 1 h 50 min.</p><ul><li><span class="xt">EXT</span> Population density: 2.4 × 10⁶ people on 1.2 × 10³ km² is 2000 people per km².</li></ul><span class="tag">Topic 1.11</span><h3>Percentages and finance</h3><ul><li>Percentage of a quantity: 35% of 240 = 0.35 × 240 = 84. Express as a percentage: part ÷ whole × 100. Use multipliers: +15% is × 1.15 and −15% is × 0.85.</li><li><b>Percentage change</b> = change ÷ original × 100. Price $50 to $62 is 12 ÷ 50 = 24% increase. <b>Profit</b> % = profit ÷ cost price × 100.</li><li><b>Simple interest:</b> I = PRT ÷ 100. $2000 at 4% for 3 years earns 2000 × 4 × 3 ÷ 100 = $240.</li><li><span class="xt">EXT</span> <b>Reverse percentages:</b> divide by the multiplier. After a 20% rise the price is $48, so the original is 48 ÷ 1.2 = $40. After a 15% discount the price is $68, so the original is 68 ÷ 0.85 = $80.</li><li><span class="xt">EXT</span> <b>Compound interest:</b> A = P(1 + r/100)ⁿ. $2000 at 4% for 3 years is 2000 × 1.04³ = $2249.73. <b>Depreciation:</b> $15 000 losing 12% a year for 4 years is 15 000 × 0.88⁴ = $8995.43.</li></ul><p>⚠️ <b>Exam trap:</b> A 20% rise followed by a 20% fall is × 1.2 × 0.8 = 0.96, a 4% loss overall.</p><h3>🔍 In more detail</h3><ul><li>Multipliers: 7% tax added is × 1.07; 30% off is × 0.7. Two changes multiply: +10% then +10% is × 1.21, a 21% rise.</li><li><b>Percentage profit:</b> bought for $40, sold for $50, profit $10, so 10 ÷ 40 = 25%.</li></ul><p>📝 <b>Example:</b> A $120 bike is reduced by 15%, then a further 10% is taken off: 120 × 0.85 × 0.9 = $91.80.</p><p>⚠️ <b>Exam trap:</b> The base matters: 50 to 60 is a 20% rise, but 60 to 50 is only a 16.7% fall. Always divide by the <b>original</b>.</p><ul><li><span class="xt">EXT</span> <b>Find the time:</b> how many whole years until $1000 at 5% compound passes $1200? 1.05³ = 1.1576 and 1.05⁴ = 1.2155, so 4 years.</li><li><span class="xt">EXT</span> <b>Find the rate:</b> $5000 becomes $5618 in 2 years. 5618 ÷ 5000 = 1.1236, whose square root is 1.06, so the rate is 6%.</li></ul><div class="card" style="margin:12px 0"><span class="tag">🎮 Simulation</span><h4 style="margin:.4em 0">Simple vs compound interest (EXT)</h4><label>Principal $: <b id="ipv">2000</b><input type="range" id="ip" min="100" max="5000" value="2000" step="100" oninput="ci()" style="padding:0;border:0;margin:4px 0"></label><label>Rate % per year: <b id="irv">4</b><input type="range" id="ir" min="1" max="15" value="4" step="1" oninput="ci()" style="padding:0;border:0;margin:4px 0"></label><label>Years: <b id="iyv">3</b><input type="range" id="iy" min="1" max="20" value="3" step="1" oninput="ci()" style="padding:0;border:0;margin:4px 0"></label><svg class="v" id="ig" viewBox="0 0 300 130"></svg><p id="io"></p><img src="data:," alt="" style="display:none" onerror="ci()"></div><span class="tag">Topic 1.12</span><h3>Surds</h3><ul><li><span class="xt">EXT</span> A surd is an irrational root such as √2 that is kept exact. √a × √b = √(ab) and (√a)² = a. Do not split √(a + b).</li><li><span class="xt">EXT</span> <b>Simplify</b> by taking out the largest square factor: √72 = √36 × √2 = 6√2; √50 + √18 = 5√2 + 3√2 = 8√2.</li><li><span class="xt">EXT</span> <b>Expand:</b> (3 + √2)² = 11 + 6√2 and (4 + √3)(4 − √3) = 13.</li><li><span class="xt">EXT</span> <b>Rationalise:</b> 6/√3 = 2√3. For 1/(2 + √3) multiply top and bottom by the conjugate (2 − √3) to get 2 − √3.</li></ul><h3>🔍 In more detail</h3><ul><li>Use surds when the question says "exact" or "in surd form". Only add <b>like</b> surds: 3√2 + 5√2 = 8√2, but √2 + √3 cannot be simplified.</li><li>Find the largest square factor: 48 = 16 × 3 so √48 = 4√3; 75 = 25 × 3 so √75 = 5√3.</li></ul><p>📝 <b>Example:</b> A square has side 3√2. Area = (3√2)² = 9 × 2 = 18 exactly.</p><p>📝 <b>Example:</b> (√5 + 2)(√5 − 2) = 5 − 4 = 1. And 12/√6 = 12√6/6 = 2√6.</p><p>⚠️ <b>Exam trap:</b> √(a + b) is not √a + √b. For example √(9 + 16) = 5 but √9 + √16 = 7.</p><span class="tag">Topic 1.13</span><h3>Using a calculator</h3><ul><li>Know the fraction, power, root, EXP, ANS and bracket keys. Put brackets round the whole top and bottom of a fraction, and use degree mode for trigonometry.</li><li>On non-calculator papers use factors, exact fractions, surds and standard form. Practise written multiplication and division.</li></ul><h3>🔍 In more detail</h3><ul><li>Enter fractions with brackets: (3.2 + 4.1) ÷ (2.5 × 1.9). Check the angle mode is DEG with a test such as sin 30 = 0.5.</li><li>Always check a calculator answer with an estimate.</li><li>Non-calculator tricks: 24 × 15 = 24 × 10 + 24 × 5 = 360; dividing by 0.5 is the same as multiplying by 2.</li></ul><p>⚠️ <b>Exam trap:</b> Do not round half-way; use the ANS or memory keys and round only at the end.</p>`,kw:[["Prime number", "A number with exactly two factors, 1 and itself."], ["HCF", "Highest common factor: the largest number that divides into both."], ["LCM", "Lowest common multiple: the smallest number both divide into."], ["Rational number", "A number that can be written as a fraction of two integers."], ["Standard form", "a × 10ⁿ with 1 ≤ a < 10 and n an integer."], ["Surd", "An irrational root such as √2 left in exact form."], ["Reverse percentage", "Finding the original amount by dividing by the multiplier."], ["Bounds", "The lower and upper limits a rounded value could really have."]],f:["HCF uses smallest powers; LCM uses largest powers", "Compound interest: A = P(1 + r/100)ⁿ", "Average speed = total distance ÷ total time", "Upper bound of a ÷ b = upper a ÷ lower b", "Indices: aᵐ × aⁿ = aᵐ⁺ⁿ; aᵐ ÷ aⁿ = aᵐ⁻ⁿ; (aᵐ)ⁿ = aᵐⁿ; a⁰ = 1; a⁻ⁿ = 1/aⁿ", "Simple interest: I = PRT ÷ 100"],qa:[["Find the HCF and LCM of 72 and 60.", "72 = 2³ × 3² and 60 = 2² × 3 × 5. HCF = 12, LCM = 360."], ["Increase 80 by 15%.", "80 × 1.15 = 92."], ["Write 4.5 × 10³ + 6 × 10² in standard form.", "4500 + 600 = 5100 = 5.1 × 10³."], ["Write 0.41666… as a fraction. (EXT)", "900x = 375, so x = 5/12."], ["After a 20% rise a price is $48. Find the original. (EXT)", "48 ÷ 1.2 = $40."], ["Simplify √72. (EXT)", "√36 × √2 = 6√2."]],mcq:[["What is the HCF of 72 and 60?", ["6", "12", "360"], 1, "Common primes with the smallest powers: 2² × 3 = 12."], ["Which is in standard form?", ["25 × 10³", "2.5 × 10⁴", "0.25 × 10⁵"], 1, "The first part must be at least 1 and less than 10."], ["Increasing a price by 20% then reducing the new price by 20% gives...", ["the same price", "a 4% loss", "a 4% gain"], 1, "1.2 × 0.8 = 0.96."], ["What is 27^(2/3)? (EXT)", ["6", "9", "18"], 1, "(∛27)² = 3² = 9."]]};
const MA2={t:"Topic 2: Algebra and graphs (Cambridge 0580)",notes:`<span class="tag">Topic 2.1</span><h3>Expanding, factorising and algebraic fractions</h3><p class="lg"><b>Key:</b> <span class="xt">EXT</span> = Extended (Supplement) only. No tag = Core (Extended students need it too).</p><ul><li><b>Language:</b> a term is one part of an expression (3x², −5y); the coefficient is the number in front of the letter; an expression has no equals sign; an equation can be solved; a formula links quantities; an identity (≡) is true for every value.</li><li><b>Simplify</b> by collecting like terms: 3x + 5y − x + 2y = 2x + 7y. <b>Substitute</b> with brackets: if x = −3 then 2x² = 2(−3)² = 18.</li><li><b>Expand:</b> 3(2x − 5) = 6x − 15. Two brackets: (x + 3)(x − 5) = x² − 5x + 3x − 15 = x² − 2x − 15. A square: (x + 4)² = x² + 8x + 16.</li><li><b>Factorise</b> by taking out the highest common factor: 6x² + 9x = 3x(2x + 3). With four terms, group them: ax + ay + bx + by = (a + b)(x + y).</li><li><span class="xt">EXT</span> <b>Quadratics:</b> x² − 2x − 15 = (x − 5)(x + 3), two numbers that multiply to −15 and add to −2. For 2x² + 7x + 3 multiply 2 × 3 = 6, split 7x into x + 6x, then group: (2x + 1)(x + 3).</li><li><span class="xt">EXT</span> <b>Difference of two squares:</b> a² − b² = (a − b)(a + b), so x² − 49 = (x − 7)(x + 7) and 4x² − 25 = (2x − 5)(2x + 5).</li><li><span class="xt">EXT</span> <b>Completing the square:</b> x² + bx + c = (x + b/2)² − (b/2)² + c. So x² + 6x + 2 = (x + 3)² − 7, with a minimum at (−3, −7).</li><li><span class="xt">EXT</span> <b>Algebraic fractions:</b> factorise first, then cancel factors. (x² − 9)/(x² + x − 6) = (x − 3)(x + 3)/((x + 3)(x − 2)) = (x − 3)/(x − 2). Add with a common denominator: 2/(x + 1) + 3/(x − 2) = (5x − 1)/((x + 1)(x − 2)).</li></ul><h3>🔍 In more detail</h3><ul><li><b>Check by expanding:</b> if you factorise, expand your answer to see whether you get the original. Check an expansion by substituting x = 1 into both sides.</li><li>Always take out the <b>highest</b> common factor first: 3x² − 12 = 3(x² − 4) = 3(x − 2)(x + 2).</li></ul><p>📝 <b>Example:</b> Expand (2x − 3)(x + 4) = 2x² + 8x − 3x − 12 = 2x² + 5x − 12. Complete the square for x² − 8x + 5 = (x − 4)² − 11.</p><p>⚠️ <b>Exam trap:</b> (x + 4)² is not x² + 16; the middle term 8x is the one students forget. Also −x² with x = −3 is −9, not +9.</p><p>⚠️ <b>Exam trap:</b> In (x + 3)/3 you cannot cancel the 3s. You may only cancel a factor of the <b>whole</b> top and <b>whole</b> bottom.</p><span class="tag">Topic 2.2</span><h3>Formulae</h3><ul><li>A <b>formula</b> such as v = u + at lets you substitute numbers (u = 5, a = 2, t = 3 gives v = 11) or rearrange it.</li><li><b>Changing the subject:</b> undo operations in the reverse of BIDMAS, keeping the equation balanced. v = u + at gives t = (v − u)/a. C = 5(F − 32)/9 gives F = 9C/5 + 32.</li><li><span class="xt">EXT</span> When the new subject appears <b>twice</b>, collect those terms on one side and factorise: y = (x + 1)/(x − 2) gives y(x − 2) = x + 1, xy − x = 1 + 2y, x(y − 1) = 1 + 2y, so <b>x = (1 + 2y)/(y − 1)</b>.</li><li><span class="xt">EXT</span> With roots and squares, undo them last: A = πr² gives r = √(A/π). v² = u² + 2as gives a = (v² − u²)/(2s).</li></ul><h3>🔍 In more detail</h3><ul><li>Plan: (1) clear fractions, (2) expand brackets, (3) get all terms with the new subject on one side, (4) factorise, (5) divide.</li></ul><p>📝 <b>Example:</b> P = 2l + 2w gives 2w = P − 2l, so w = (P − 2l)/2. For T = 2π√(l/g): T/2π = √(l/g), so T²/4π² = l/g and <b>l = gT²/4π²</b>.</p><p>⚠️ <b>Exam trap:</b> Whatever you do to one term you must do to the whole side. Squaring (a + b) means (a + b)², not a² + b².</p><span class="tag">Topic 2.3</span><h3>Equations</h3><ul><li><b>Linear:</b> expand, collect letters on one side, divide. 3(x − 2) = 2x + 5 gives x = 11. With fractions, cross-multiply: (x + 1)/3 = (x − 2)/2 gives 2x + 2 = 3x − 6, so x = 8.</li><li><b>Forming equations:</b> define the unknown, write an equation from the information, solve, and answer the question asked with units.</li><li><b>Simultaneous equations:</b> make a pair of terms match, then add or subtract (elimination), or substitute. 3x + 2y = 16 and 5x − 2y = 8: adding gives 8x = 24, so x = 3 and y = 3.5.</li><li><span class="xt">EXT</span> <b>One linear, one non-linear:</b> substitute the linear equation into the other. y = x + 1 with x² + y² = 25 gives 2x² + 2x − 24 = 0, so (x + 4)(x − 3) = 0. Answers (3, 4) and (−4, −3).</li><li><span class="xt">EXT</span> <b>Quadratic equations:</b> write as ax² + bx + c = 0, then factorise, use x = (−b ± √(b² − 4ac)) / 2a, or complete the square. 3x² − 4x − 2 = 0 gives x = 1.72 or −0.387 (3 s.f.).</li><li><span class="xt">EXT</span> <b>Discriminant</b> b² − 4ac: above 0 two roots, equal to 0 one repeated root, below 0 no real roots.</li><li><span class="xt">EXT</span> <b>Algebraic fraction equations:</b> multiply through by the denominators. 3/(x − 1) + 2/(x + 2) = 1 gives x² − 4x − 6 = 0, so x = 5.16 or −1.16.</li></ul><h3>🔍 In more detail</h3><ul><li>Always check by substituting back into an original equation (use the one you did <b>not</b> use in elimination).</li></ul><p>📝 <b>Example:</b> 3 pens and 2 books cost $13 and 2 pens and 4 books cost $18. Halve the second: p + 2b = 9. Eliminate: 3p + 2b = 13 minus p + 2b = 9 gives 2p = 4, so p = $2 and b = $3.50.</p><p>📝 <b>Example:</b> (EXT) A rectangle is 3 cm longer than it is wide and has area 40 cm². x(x + 3) = 40 gives x² + 3x − 40 = 0, so (x + 8)(x − 5) = 0. Width = 5 cm (reject −8, a length cannot be negative).</p><p>⚠️ <b>Exam trap:</b> For x² = 5x do not divide by x. Write x² − 5x = 0, x(x − 5) = 0, so x = 0 or 5. Reject answers that do not fit the context.</p><div class="card" style="margin:12px 0"><span class="tag">🎮 Simulation</span><h4 style="margin:.4em 0">Quadratic explorer (EXT): y = ax² + bx + c</h4><label>a: <b id="qav">1</b><input type="range" id="qa" min="-3" max="3" value="1" step="0.5" oninput="qd()" style="padding:0;border:0;margin:4px 0"></label><label>b: <b id="qbv">-4</b><input type="range" id="qb" min="-6" max="6" value="-4" step="1" oninput="qd()" style="padding:0;border:0;margin:4px 0"></label><label>c: <b id="qcv">3</b><input type="range" id="qc" min="-6" max="6" value="3" step="1" oninput="qd()" style="padding:0;border:0;margin:4px 0"></label><svg class="v" id="qg" viewBox="0 0 300 220"></svg><p id="qo"></p><img src="data:," alt="" style="display:none" onerror="qd()"></div><span class="tag">Topic 2.4</span><h3>Inequalities</h3><ul><li>Symbols: < , > , ≤ , ≥. Solve like an equation but <b>reverse the sign when you multiply or divide by a negative</b>. −2x < 8 gives x > −4.</li><li><b>Number line:</b> an open circle for < or >, a closed circle for ≤ or ≥, with an arrow towards the solutions. −3 < 2x + 1 ≤ 9 gives −2 < x ≤ 4 (integers −1, 0, 1, 2, 3, 4).</li><li>Write an inequality from a number line: an open circle at 2 with an arrow to the right is x > 2.</li><li><span class="xt">EXT</span> <b>Regions:</b> draw the boundary line (dashed for < or >, solid for ≤ or ≥), test (0, 0) and shade the correct side. For several inequalities, find the region that satisfies all of them and read off any integer points inside.</li></ul><h3>🔍 In more detail</h3><p>📝 <b>Example:</b> 5 − 2x ≥ 11 gives −2x ≥ 6, so x ≤ −3 (the sign flips when dividing by −2). Largest integer solution: −3.</p><p>📝 <b>Example:</b> (EXT) y ≤ x + 2 and y > 1: draw y = x + 2 solid and y = 1 dashed. At (0, 0), 0 ≤ 2 is true, so shade below the first line. The second needs y above 1.</p><p>⚠️ <b>Exam trap:</b> The sign only flips when you multiply or divide by a negative, not when you subtract a negative number.</p><svg class="v" viewBox="0 0 320 90" role="img" aria-label="Number line for −2 < x ≤ 4" style="width:100%;max-width:520px;display:block;margin:12px auto"><g fill="currentColor" font-size="12"><line x1="20" y1="45" x2="300" y2="45" stroke="currentColor" stroke-width="2"/><line x1="70" y1="45" x2="250" y2="45" stroke="#3b4fd8" stroke-width="6"/><line x1="40" y1="40" x2="40" y2="50" stroke="currentColor"/><text x="36" y="68">-3</text><line x1="70" y1="40" x2="70" y2="50" stroke="currentColor"/><text x="66" y="68">-2</text><line x1="100" y1="40" x2="100" y2="50" stroke="currentColor"/><text x="96" y="68">-1</text><line x1="130" y1="40" x2="130" y2="50" stroke="currentColor"/><text x="126" y="68">0</text><line x1="160" y1="40" x2="160" y2="50" stroke="currentColor"/><text x="156" y="68">1</text><line x1="190" y1="40" x2="190" y2="50" stroke="currentColor"/><text x="186" y="68">2</text><line x1="220" y1="40" x2="220" y2="50" stroke="currentColor"/><text x="216" y="68">3</text><line x1="250" y1="40" x2="250" y2="50" stroke="currentColor"/><text x="246" y="68">4</text><line x1="280" y1="40" x2="280" y2="50" stroke="currentColor"/><text x="276" y="68">5</text><circle cx="70" cy="45" r="6" fill="var(--card,#fff)" stroke="#3b4fd8" stroke-width="2.5"/><circle cx="250" cy="45" r="6" fill="#3b4fd8"/><text x="70" y="22">−2 < x ≤ 4</text></g></svg><span class="tag">Topic 2.5</span><h3>Sequences</h3><ul><li>A <b>term-to-term rule</b> gives the next term from the last; a <b>position-to-term rule</b> (nth term) gives any term directly. Know square, cube, triangular, Fibonacci and power-of-2 sequences.</li><li><b>Linear sequences:</b> nth term = dn + (first term − d). 5, 8, 11, 14 has d = 3 so nth term = 3n + 2 and the 50th term is 152.</li><li><b>Test a number:</b> is 100 in 3n + 2? 3n = 98 has no whole-number solution, so no.</li><li><span class="xt">EXT</span> <b>Quadratic sequences:</b> second difference ÷ 2 gives a. 3, 8, 15, 24: first differences 5, 7, 9 and second difference 2, so a = 1. Subtract n² to leave 2, 4, 6, 8 = 2n, so nth term = n² + 2n.</li><li><span class="xt">EXT</span> <b>Exponential sequences</b> multiply by a fixed number: 3, 6, 12, 24 has nth term 3 × 2ⁿ⁻¹. Simple cubic sequences have nth term like n³ + 2.</li></ul><h3>🔍 In more detail</h3><ul><li><b>Decreasing sequences:</b> 20, 17, 14 has d = −3, so nth term = −3n + 23.</li><li>To find which term equals 152 in 3n + 2, solve 3n + 2 = 152, so n = 50.</li></ul><p>📝 <b>Example:</b> (EXT) 4, 10, 20, 34: differences 6, 10, 14; second difference 4, so a = 2. Subtract 2n² (2, 8, 18, 32) to leave 2, 2, 2, 2, so nth term = 2n² + 2.</p><p>⚠️ <b>Exam trap:</b> The nth term is the <b>rule</b>, not a single term. Check it with n = 1 and n = 2.</p><div class="card" style="margin:12px 0"><span class="tag">🎮 Simulation</span><h4 style="margin:.4em 0">Linear sequence explorer</h4><label>Common difference d: <b id="sdv">3</b><input type="range" id="sd" min="-6" max="10" value="3" step="1" oninput="sq()" style="padding:0;border:0;margin:4px 0"></label><label>First term: <b id="sxv">5</b><input type="range" id="sx" min="-10" max="20" value="5" step="1" oninput="sq()" style="padding:0;border:0;margin:4px 0"></label><p id="sqo"></p><img src="data:," alt="" style="display:none" onerror="sq()"></div><span class="tag">Topic 2.6</span><h3>Variation and functions</h3><ul><li><span class="xt">EXT</span> <b>Variation:</b> y = kx (direct), y = kx² , y = k√x, y = k/x (inverse), y = k/x². Write the equation with k, use the given pair to find k, then use it.</li><li><span class="xt">EXT</span> y ∝ x² with y = 18 at x = 3 gives k = 2, so y = 2x² and y = 50 at x = 5. y inversely proportional to x with y = 4 at x = 6 gives k = 24, so y = 3 when x = 8.</li><li><span class="xt">EXT</span> <b>Functions:</b> f(x) = 2x + 3 gives f(4) = 11. fg(x) means g first, then f. The inverse f⁻¹(x) undoes f: y = 2x + 3 gives f⁻¹(x) = (x − 3)/2.</li><li><span class="xt">EXT</span> <b>Domain</b> = allowed x-values; <b>range</b> = resulting y-values. g(x) = 1/(x − 2) has domain x ≠ 2; f(x) = x² has range f(x) ≥ 0.</li></ul><h3>🔍 In more detail</h3><p>📝 <b>Example:</b> y = k√x with y = 12 at x = 4 gives k = 6, so y = 18 when x = 9. If y ∝ 1/x² and x doubles, y is divided by 4.</p><p>📝 <b>Example:</b> f(x) = x + 1 and g(x) = 2x: fg(x) = 2x + 1 but gf(x) = 2x + 2, so fg and gf are usually different. To solve f(x) = g(x) here, x + 1 = 2x gives x = 1.</p><p>⚠️ <b>Exam trap:</b> For fg(x), apply g first (the one nearest x). Always state k once found.</p><span class="tag">Topic 2.7</span><h3>Graphs and calculus</h3><ul><li><b>Straight lines:</b> y = mx + c; m is the gradient (rise ÷ run), c the y-intercept. Parallel lines share m. Roots are where y = 0.</li><li><b>Quadratic graphs</b> are U-shaped (positive x²) or ∩-shaped (negative x²). <b>Reciprocal graphs</b> y = a/x have two branches and never touch the axes (asymptotes).</li><li><b>Quadratic features:</b> y = x² − 4x + 3 has roots 1 and 3, line of symmetry x = 2, turning point (2, −1), y-intercept 3.</li><li><b>Travel graphs:</b> distance-time gradient = speed, a flat line = stationary. Speed-time gradient = acceleration, <b>area</b> under the graph = distance. Speed up 0 to 12 m/s in 4 s then steady for 6 s: acceleration 3 m/s², distance = ½ × 4 × 12 + 12 × 6 = 96 m.</li><li><span class="xt">EXT</span> <b>More graphs:</b> cubics, y = axⁿ (n from −2 to 3), exponential y = aˣ (passes through (0, 1), asymptote y = 0). Solve equations by finding where graphs cross. A <b>tangent</b> drawn at a point gives the gradient (rate of change) there.</li><li><span class="xt">EXT</span> <b>Differentiation:</b> d/dx (kxⁿ) = knxⁿ⁻¹, including negative powers: 5/x² = 5x⁻² gives −10x⁻³. The gradient of a curve at a point is dy/dx there.</li><li><span class="xt">EXT</span> <b>Turning points:</b> set dy/dx = 0. y = x² − 6x + 5 gives 2x − 6 = 0, x = 3, y = −4, so a minimum at (3, −4). Check by the sign of the gradient either side: negative then positive is a minimum, positive then negative is a maximum.</li></ul><h3>🔍 In more detail</h3><ul><li>To draw a curve, make a table of values, plot every point, and join with a <b>smooth</b> curve, never straight segments.</li><li>To read a root from a graph give the x-value where it crosses the x-axis; use a ruler to draw gradient triangles as large as possible.</li></ul><p>📝 <b>Example:</b> y = x³ − 3x: dy/dx = 3x² − 3 = 0 gives x = ±1, so a minimum at (1, −2) and a maximum at (−1, 2).</p><p>⚠️ <b>Exam trap:</b> A flat line on a distance-time graph means stopped, but on a speed-time graph it means constant speed. Read the axes first.</p><svg class="v" viewBox="0 0 320 170" role="img" aria-label="Graph of y = x² − 4x + 3" style="width:100%;max-width:520px;display:block;margin:12px auto"><g fill="currentColor" font-size="12"><line x1="30" y1="122" x2="310" y2="122" stroke="currentColor"/><line x1="85" y1="10" x2="85" y2="160" stroke="currentColor"/><line x1="175" y1="14" x2="175" y2="150" stroke="#f59e0b" stroke-dasharray="4"/><polyline fill="none" stroke="#3b4fd8" stroke-width="3" points="62.5,48.5 85,80 107.5,104.5 130,122 152.5,132.5 175,136 197.5,132.5 220,122 242.5,104.5 265,80 287.5,48.5"/><circle cx="130" cy="122" r="4" fill="#ec4899"/><circle cx="220" cy="122" r="4" fill="#ec4899"/><circle cx="175" cy="136" r="4" fill="#10b981"/><circle cx="85" cy="80" r="4" fill="#ec4899"/><text x="104" y="116">1</text><text x="224" y="116">3</text><text x="182" y="152">minimum (2, −1)</text><text x="180" y="26">x = 2</text><text x="12" y="76">(0, 3)</text><text x="230" y="50">y = x² − 4x + 3</text></g></svg><div class="card" style="margin:12px 0"><span class="tag">🎮 Simulation</span><h4 style="margin:.4em 0">Straight line explorer: y = mx + c</h4><label>Gradient m: <b id="lmv">2</b><input type="range" id="lm" min="-5" max="5" value="2" step="0.5" oninput="ln()" style="padding:0;border:0;margin:4px 0"></label><label>y-intercept c: <b id="lcv">1</b><input type="range" id="lc" min="-6" max="6" value="1" step="1" oninput="ln()" style="padding:0;border:0;margin:4px 0"></label><svg class="v" id="lg" viewBox="0 0 300 220"></svg><p id="lo"></p><img src="data:," alt="" style="display:none" onerror="ln()"></div>`,kw:[["Discriminant", "b² − 4ac; shows how many real roots a quadratic has."], ["Identity", "An equation true for all values of the variable, written ≡."], ["Domain and range", "The set of inputs and the set of outputs of a function."], ["Gradient", "Steepness of a line: change in y ÷ change in x."], ["Asymptote", "A line that a curve gets closer and closer to but never touches."], ["Inverse function", "A function that undoes another function, written f⁻¹(x)."], ["Turning point", "A point where the gradient is zero and the curve changes direction."], ["Inequality", "A statement using <, >, ≤ or ≥."]],f:["Quadratic formula: x = (−b ± √(b² − 4ac)) / 2a", "nth term of a linear sequence = dn + (first term − d)", "Difference of two squares: a² − b² = (a − b)(a + b)", "Completing the square: x² + bx + c = (x + b/2)² − (b/2)² + c", "Differentiation: d/dx (kxⁿ) = knxⁿ⁻¹", "Straight line: y = mx + c; parallel lines have equal m"],qa:[["Solve x² − 5x + 6 = 0. (EXT)", "(x − 2)(x − 3) = 0, so x = 2 or x = 3."], ["Solve −2x < 8.", "Divide by −2 and reverse the sign: x > −4."], ["Find the nth term of 5, 8, 11, 14.", "d = 3, so 3n + 2."], ["Make x the subject of y = (x + 1)/(x − 2). (EXT)", "x = (1 + 2y)/(y − 1)."], ["Differentiate y = 4x³ − 5x. (EXT)", "dy/dx = 12x² − 5."], ["f(x) = 2x + 3. Find f⁻¹(x). (EXT)", "f⁻¹(x) = (x − 3)/2."]],mcq:[["Which sign is correct for −3x ≥ 12?", ["x ≥ −4", "x ≤ −4", "x ≤ 4"], 1, "Dividing by −3 reverses the sign: x ≤ −4."], ["What is the nth term of 7, 11, 15, 19?", ["4n + 3", "3n + 4", "7n"], 0, "d = 4 and 7 − 4 = 3."], ["The discriminant of a quadratic is negative. How many real roots? (EXT)", ["0", "1", "2"], 0, "A negative discriminant means no real roots."], ["Factorise x² − 49. (EXT)", ["(x − 7)²", "(x − 7)(x + 7)", "x(x − 49)"], 1, "Difference of two squares."]]};

const sl=(id,t,a,b,v,s,f)=>`<label>${t}: <b id="${id}v">${v}</b><input type="range" id="${id}" min="${a}" max="${b}" value="${v}" step="${s}" oninput="${f}()" style="padding:0;border:0;margin:4px 0"></label>`;
const sim=(h,svg,o,f)=>`<div class="card" style="margin:12px 0"><span class="tag">🎮 Simulation</span>${h}<svg class="v g" id="${svg}" viewBox="0 0 260 260"></svg><p id="${o}"></p><img src="data:," alt="" style="display:none" onerror="${f}()"></div>`;
const fg=(n,cap)=>`<figure style="margin:14px 0"><svg class="v g" id="c3f${n}" viewBox="0 0 260 260" role="img" aria-label="${cap}"></svg><figcaption class="lg" style="text-align:center">${cap}</figcaption><img src="data:," alt="" style="display:none" onerror="c3f(${n})"></figure>`;

return{t:"Topic 3: Coordinate geometry (Cambridge 0580)",notes:`<span class="tag">Topic 3.1</span><h3>Coordinates (syllabus C3.1 and E3.1)</h3>
<p class="lg"><b>Key:</b> ${C} = Core content (Extended students must know it too). ${E} = Extended (Supplement) only. This chapter follows the Cambridge 0580 syllabus for 2025, 2026 and 2027, section by section.</p>
<h4>Topic 3 at a glance: what is Core and what is Extended</h4>
<div class="wrap"><table><tr><th>Syllabus</th><th>Content</th><th>Core</th><th>Extended</th></tr>
<tr><td>3.1</td><td>Coordinates</td><td>Yes</td><td>Same</td></tr>
<tr><td>3.2</td><td>Drawing linear graphs</td><td>Equations given as y = mx + c, or a table of values</td><td>Any linear equation, e.g. y = 7 − 4x and 3x + 2y = 5</td></tr>
<tr><td>3.3</td><td>Gradient</td><td>Read from a grid only</td><td>Also calculated from two points</td></tr>
<tr><td>3.4</td><td>Length and midpoint of a line segment</td><td><b>Not in Core</b></td><td>Yes</td></tr>
<tr><td>3.5</td><td>Equations of linear graphs</td><td>Forms y = mx + c and x = k</td><td>Also ax + by = c</td></tr>
<tr><td>3.6</td><td>Parallel lines</td><td>Yes</td><td>Yes</td></tr>
<tr><td>3.7</td><td>Perpendicular lines</td><td><b>Not in Core</b></td><td>Yes, including perpendicular bisectors</td></tr></table></div>
<h4>The Cartesian plane ${C}</h4>
<p>René Descartes' idea: fix a point in a flat surface by giving two numbers. Two number lines cross at right angles. The horizontal one is the <b>x-axis</b>, the vertical one is the <b>y-axis</b>, and they meet at the <b>origin</b> O(0, 0). The axes split the plane into four <b>quadrants</b>, numbered anticlockwise starting at the top right.</p>
<ul><li>A point is written <b>(x, y)</b>. The <b>x-coordinate is always first</b>: move along the corridor (horizontally) first, then up or down the stairs (vertically).</li>
<li>x is positive to the right of the y-axis and negative to the left. y is positive above the x-axis and negative below it.</li>
<li><b>Quadrant I:</b> (+, +). <b>II:</b> (−, +). <b>III:</b> (−, −). <b>IV:</b> (+, −).</li>
<li>A point on the x-axis has y = 0, e.g. (5, 0). A point on the y-axis has x = 0, e.g. (0, −3). Points on an axis are in no quadrant.</li></ul>
${fg(1,"The four quadrants with A(3, 2), B(−4, 3), C(−2, −5) and D(5, −3) plotted")}
<h4>Plotting and reading points ${C}</h4>
<ul><li><b>To plot</b> (−4, 3): start at O, go 4 left, then 3 up. Mark a small cross (×) and label it. Cambridge asks for each point to be within half a small square.</li>
<li><b>To read</b> a point: find where its vertical line meets the x-axis, then where its horizontal line meets the y-axis.</li>
<li>Scales: if each square on an axis is worth 2 units, read carefully. Always check the numbers on the axes before you answer.</li></ul>
${sim(sl("k1x","x",-6,6,3,1,"c3p")+sl("k1y","y",-6,6,2,1,"c3p"),"c3pg","c3po","c3p")}
<h4>Coordinates in problems ${C}</h4>
<ul><li><b>Missing vertex:</b> plot the known points and use the shape's properties. In a parallelogram opposite sides are equal and parallel; in a rectangle all angles are 90°; in a rhombus all sides are equal; a kite has two pairs of equal adjacent sides.</li>
<li><b>Lines x = k and y = k:</b> x = 3 is the vertical line through (3, 0); y = −2 is the horizontal line through (0, −2). The line y = x passes through (1, 1), (2, 2), (−3, −3)...</li></ul>
<p>📝 <b>Example:</b> A(1, 1), B(5, 2), C(6, 5) are three corners of parallelogram ABCD. Going from B to C is +1 across and +3 up, so going from A to D is the same: D = (1 + 1, 1 + 3) = <b>(2, 4)</b>. Check: AB = (+4, +1) and DC = (6 − 2, 5 − 4) = (+4, +1). ✓</p>
<p>⚠️ <b>Exam trap:</b> Writing (y, x) instead of (x, y). Also, count squares, not tick marks, if the scale is not 1.</p>
<span class="tag">Topic 3.2</span><h3>Drawing linear graphs (C3.2 and E3.2)</h3>
<p>A <b>linear equation</b> has x and y only to the power 1 (no x², no xy, no 1/x). Its graph is always a <b>straight line</b>, and every point on the line fits the equation.</p>
<h4>Method 1: table of values ${C} ${E}</h4>
<ol><li>Choose at least <b>three</b> x-values (e.g. −2, 0, 2) spread across the grid. The third point is a <b>check</b>: if the three points do not line up, there is an arithmetic mistake.</li><li>Substitute into the equation to get y. Write the coordinate pairs.</li><li>Plot each point with a small cross, then join them with a <b>ruled</b> line that extends across the whole grid. Label the line with its equation.</li></ol>
<p>📝 <b>Example (Core):</b> Draw y = −2x + 5 for −1 ≤ x ≤ 3.</p>
<div class="wrap"><table><tr><th>x</th><td>−1</td><td>0</td><td>1</td><td>2</td><td>3</td></tr><tr><th>y</th><td>7</td><td>5</td><td>3</td><td>1</td><td>−1</td></tr></table></div>
<p>Each time x goes up by 1, y goes down by 2: that is the gradient −2. The line crosses the y-axis at 5.</p>
<h4>Method 2: gradient and intercept ${C}</h4>
<p>Core equations are given as <b>y = mx + c</b>. Plot the y-intercept (0, c) first. Then use the gradient: from (0, c) go 1 across and m up (or down if m is negative) to find a second point. Repeat to check.</p>
<h4>Equations not in the form y = mx + c ${E}</h4>
<ul><li><b>y = 7 − 4x</b> is y = −4x + 7 in a different order: gradient −4, intercept 7. Table: x = 0, 1, 2, 3 gives y = 7, 3, −1, −5.</li>
<li><b>3x + 2y = 5</b> (form ax + by = c). Either rearrange: 2y = −3x + 5, so y = −1.5x + 2.5. Or choose x-values making y a whole number: x = −1 gives y = 4; x = 1 gives y = 1; x = 3 gives y = −2.</li>
<li><b>Intercept (cover-up) method:</b> put x = 0 to find where it crosses the y-axis, and y = 0 to find where it crosses the x-axis. For 3x + 2y = 6: (0, 3) and (2, 0). Join them.</li></ul>
${sim(sl("k2m","gradient m",-4,4,2,0.5,"c3l")+sl("k2c","y-intercept c",-5,5,-1,1,"c3l"),"c3lg","c3lo","c3l")}
<p>⚠️ <b>Exam trap:</b> Marks are lost for a line that is freehand, that stops short of the grid edges or that misses the required range. Use a sharp pencil and a ruler.</p>
<span class="tag">Topic 3.3</span><h3>Gradient of linear graphs (C3.3 and E3.3)</h3>
<p>The <b>gradient</b> (slope) measures how steep a line is: <b>gradient = rise ÷ run = change in y ÷ change in x</b>. It is also the <b>rate of change</b> of y with respect to x. In a real graph (e.g. cost against units) it tells you the cost per unit.</p>
<h4>Reading the gradient from a grid ${C}</h4>
<ol><li>Pick two points exactly on grid corners, as far apart as possible (this reduces reading errors).</li><li>Draw a right-angled triangle between them. Count the <b>rise</b> (vertical side) and the <b>run</b> (horizontal side), using the scale on the axes.</li><li>Divide: rise ÷ run. A line going <b>down to the right</b> has a <b>negative</b> gradient.</li></ol>
${fg(2,"Gradient triangle: run 6, rise 4, so m = 4 ÷ 6 = 2/3")}
<h4>Four kinds of gradient ${C}</h4>
<ul><li><b>Positive:</b> rises from left to right (uphill).</li><li><b>Negative:</b> falls from left to right (downhill).</li><li><b>Zero:</b> a horizontal line y = k. It has no steepness.</li><li><b>Undefined:</b> a vertical line x = k. The run is 0 and you cannot divide by 0.</li></ul>
${fg(3,"Positive (green), negative (red), zero (blue) and undefined (amber) gradients")}
<h4>Gradient from two points ${E}</h4>
<p>For points (x₁, y₁) and (x₂, y₂): <b>m = (y₂ − y₁) ÷ (x₂ − x₁)</b>. Subtract in the <b>same order</b> on the top and bottom. Swapping both gives the same answer.</p>
<p>📝 <b>Example:</b> P(−2, 5) and Q(4, −1): m = (−1 − 5) ÷ (4 − (−2)) = −6 ÷ 6 = <b>−1</b>. Brackets prevent sign errors when subtracting negatives.</p>
<p>📝 <b>Example:</b> The gradient of the line through (1, 3) and (5, k) is 2. Then (k − 3) ÷ 4 = 2, so k − 3 = 8 and <b>k = 11</b>.</p>
<p>📝 <b>Example (rate of change):</b> A taxi graph passes through (2 km, $9) and (10 km, $25). m = 16 ÷ 8 = 2, so the fare increases by <b>$2 per km</b>.</p>
${sim(sl("k3a","x₁",-6,6,-4,1,"c3t")+sl("k3b","y₁",-6,6,-2,1,"c3t")+sl("k3c","x₂",-6,6,4,1,"c3t")+sl("k3d","y₂",-6,6,4,1,"c3t"),"c3tg","c3to","c3t")}
<p>⚠️ <b>Exam trap:</b> Mixing the order, e.g. (y₂ − y₁) ÷ (x₁ − x₂), flips the sign. Also, on a graph where the axes use different scales, use the <b>axis values</b>, not the number of squares.</p>
<span class="tag">Topic 3.4</span><h3>Length and midpoint of a line segment (E3.4, Extended only)</h3>
<p>${E} <b>This subtopic is not in the Core syllabus.</b> A <b>line segment</b> is the part of a line between two points.</p>
<h4>Midpoint ${E}</h4>
<p>The midpoint is the average of the x-values and the average of the y-values: <b>M = ((x₁ + x₂) ÷ 2, (y₁ + y₂) ÷ 2)</b>.</p>
<h4>Length (distance) ${E}</h4>
<p>Draw a right-angled triangle with the segment as the hypotenuse. The legs are the horizontal and vertical differences, so by Pythagoras' theorem: <b>length = √[(x₂ − x₁)² + (y₂ − y₁)²]</b>.</p>
${fg(5,"A(−4, −2) and B(4, 4): legs 8 and 6, length √(64 + 36) = 10, midpoint M(0, 1)")}
<p>📝 <b>Example:</b> A(−4, −2), B(4, 4): midpoint = (0, 1). Length = √(8² + 6²) = √100 = <b>10</b>.</p>
<p>📝 <b>Example (exact answer):</b> (−3, 8) and (9, −2): differences 12 and −10, so length = √(144 + 100) = √244 = <b>2√61 ≈ 15.6</b> (3 s.f.). Square the differences, so a negative sign disappears.</p>
<p>📝 <b>Example (find an endpoint):</b> M(2, 1) is the midpoint of AB and A = (−1, 4). Double the midpoint and subtract A: B = (2 × 2 − (−1), 2 × 1 − 4) = <b>(5, −2)</b>.</p>
<p>📝 <b>Example (use of both):</b> To show that triangle with A(0, 0), B(6, 0), C(3, 4) is isosceles: AC = √(9 + 16) = 5 and BC = √(9 + 16) = 5, so AC = BC.</p>
<p>⚠️ <b>Exam trap:</b> The distance formula is <b>not</b> (x₂ − x₁) + (y₂ − y₁). You must square, add, then take the square root. The midpoint uses <b>addition</b>, the gradient uses <b>subtraction</b>.</p>
<span class="tag">Topic 3.5</span><h3>Equations of linear graphs (C3.5 and E3.5)</h3>
<h4>The form y = mx + c ${C}</h4>
<p><b>m</b> is the gradient and <b>c</b> is the y-intercept (where the line crosses the y-axis). From y = 6x + 3: gradient 6, y-intercept 3, so the line crosses the y-axis at (0, 3).</p>
${fg(4,"y = ½x + 2: c = 2 is where it meets the y-axis, the triangle shows gradient 1 ÷ 2")}
<h4>Finding the equation from a graph ${C}</h4>
<ol><li>Read c: where the line crosses the y-axis.</li><li>Find m with a gradient triangle (rise ÷ run).</li><li>Write y = mx + c, giving the equation in its simplest form.</li></ol>
<p>📝 <b>Example:</b> A line crosses the y-axis at (0, −2) and passes through (2, 2). m = (2 − (−2)) ÷ 2 = 2, so <b>y = 2x − 2</b>.</p>
<h4>Special lines ${C}</h4>
<ul><li><b>Horizontal:</b> y = k (gradient 0). The x-axis is y = 0.</li><li><b>Vertical:</b> x = k (gradient undefined). The y-axis is x = 0.</li><li>Cambridge says to give equations in a <b>fully simplified form</b>: write y = 2x − 2, not y = 2x + (−2) or 2x − 2 = y.</li></ul>
<h4>Finding an equation from a point and a gradient ${E}</h4>
<p>Substitute the point into y = mx + c to find c, or use y − y₁ = m(x − x₁). 📝 <b>Example:</b> gradient 3 through (2, 1): 1 = 3 × 2 + c, so c = −5 and <b>y = 3x − 5</b>.</p>
<h4>Finding an equation from two points ${E}</h4>
<p>First find m, then c by substituting either point. 📝 <b>Example:</b> (−2, 5) and (4, −1): m = −1. Using (4, −1): −1 = −4 + c, so c = 3 and <b>y = −x + 3</b>. Check with the other point: −(−2) + 3 = 5 ✓.</p>
<h4>The form ax + by = c ${E}</h4>
<p>Extended questions use equations like 5x + 4y = 8 and ask for the gradient and y-intercept. <b>Make y the subject:</b> 4y = −5x + 8, so y = −(5/4)x + 2. The gradient is <b>−5/4</b> and the y-intercept is <b>2</b>. For 2y + 4x = 6 the gradient is −2 and the intercept is 3.</p>
<p>To write y = (3/2)x − 1 in the form ax + by = c with whole numbers: multiply by 2 to get 2y = 3x − 2, so <b>3x − 2y = 2</b>.</p>
<p>⚠️ <b>Exam trap:</b> In 2y = 4x + 6, the gradient is <b>2</b> and the intercept is <b>3</b> (divide <b>every</b> term by 2), not 4 and 6. In 3x + y = 7 the gradient is −3, not 3.</p>
<span class="tag">Topic 3.6</span><h3>Parallel lines (C3.6 and E3.6)</h3>
<p>${C} ${E} <b>Parallel lines have the same gradient</b> (and different y-intercepts). Lines such as y = 2x + 1, y = 2x − 3 and 2y = 4x + 5 are all parallel, because each has gradient 2.</p>
${fg(7,"y = 2x + 1 and y = 2x − 3 are parallel: both gradient triangles are run 1, rise 2")}
<h4>Finding the equation of a parallel line</h4>
<ol><li>Write the given line as y = mx + c and take its gradient m.</li><li>The new line has the <b>same m</b>. Substitute the given point to find the new c.</li></ol>
<p>📝 <b>Example (syllabus type):</b> Parallel to y = 4x − 1 through (1, −3). m = 4, so −3 = 4 × 1 + c, giving c = −7. The line is <b>y = 4x − 7</b>.</p>
<p>📝 <b>Example ${E}:</b> Parallel to 2x + 3y = 6 through (3, −1). Rearranging gives y = −(2/3)x + 2, so m = −2/3. Then −1 = −(2/3) × 3 + c = −2 + c, so c = 1. The line is y = −(2/3)x + 1, i.e. <b>2x + 3y = 3</b>.</p>
<p>📝 <b>Example:</b> Are y = 3x + 2 and 6x − 2y = 5 parallel? The second gives −2y = −6x + 5, so y = 3x − 2.5. Same gradient 3, so <b>yes</b>.</p>
${sim(sl("k6m","gradient m",-4,4,2,0.5,"c3x")+sl("k6c","c of green line",-5,5,-3,1,"c3x"),"c3xg","c3xo","c3x")}
<span class="tag">Topic 3.7</span><h3>Perpendicular lines (E3.7, Extended only)</h3>
<p>${E} <b>This subtopic is not in the Core syllabus.</b> Two lines are <b>perpendicular</b> when they meet at 90°. Their gradients satisfy <b>m₁ × m₂ = −1</b>. So the perpendicular gradient is the <b>negative reciprocal</b>: flip the fraction and change the sign.</p>
<div class="wrap"><table><tr><th>Gradient</th><td>2</td><td>−3</td><td>1/2</td><td>−2/5</td><td>3/4</td></tr><tr><th>Perpendicular gradient</th><td>−1/2</td><td>1/3</td><td>−2</td><td>5/2</td><td>−4/3</td></tr></table></div>
${fg(6,"y = 2x and y = −½x meet at right angles: 2 × (−½) = −1")}
<p>Special cases: a horizontal line (gradient 0) is perpendicular to a vertical line (gradient undefined), for example y = 4 and x = −1.</p>
<h4>Worked examples ${E}</h4>
<p>📝 <b>1.</b> Gradient perpendicular to 2y = 3x + 1: y = (3/2)x + 1/2, so m = 3/2 and the perpendicular gradient is <b>−2/3</b>.</p>
<p>📝 <b>2.</b> Perpendicular to y = 2x + 1 through (4, 3): m = −1/2. 3 = −2 + c, so c = 5 and <b>y = −(1/2)x + 5</b>.</p>
<p>📝 <b>3. Perpendicular bisector</b> of the line joining (−3, 8) and (9, −2). <b>Step 1:</b> midpoint = (3, 3). <b>Step 2:</b> gradient of AB = (−2 − 8) ÷ (9 − (−3)) = −10/12 = −5/6. <b>Step 3:</b> perpendicular gradient = 6/5. <b>Step 4:</b> 3 = (6/5) × 3 + c, so c = −3/5. The line is y = (6/5)x − 3/5, or <b>5y = 6x − 3</b>. Every point on it is equally far from both ends of AB.</p>
<p>📝 <b>4.</b> Show that A(0, 0), B(4, 2), C(2, −4) has a right angle at A. Gradient AB = 2/4 = 1/2 and gradient AC = −4/2 = −2. Since (1/2) × (−2) = −1, AB ⟂ AC ✓.</p>
${sim(sl("k7a","A x",-6,6,-3,1,"c3b")+sl("k7b","A y",-6,6,-1,1,"c3b")+sl("k7c","B x",-6,6,3,1,"c3b")+sl("k7d","B y",-6,6,3,1,"c3b"),"c3bg","c3bo","c3b")}
<p>⚠️ <b>Exam trap:</b> Perpendicular is <b>not</b> just changing the sign (that gives a reflection, not 90°) and not just flipping the fraction. Do both. And the perpendicular bisector must pass through the <b>midpoint</b>, not through one of the end points.</p>
