<ul><li>Use <b>word families</b> (<i>happy, unhappy, happiness</i>), <b>prefixes</b> (<i>un-, re-, mis-</i>) and <b>suffixes</b> (<i>-ful, -less, -ment</i>) to guess meaning. Replace the word with your guess and check that the sentence still makes sense.</li><li>${E} Learn common <b>phrasal verbs</b> (<i>look after = take care of, give up = stop, put off = delay</i>) and <b>idioms</b>.</li></ul>
<h4>Time plan for Paper 1 reading ${C}</h4>
<ul><li>Do not spend more than about <b>10 minutes</b> on each reading exercise, leaving time for the two writing tasks. If stuck, guess and return.</li></ul>
<h4>Question words and what they ask for ${C}</h4>
<div class="wrap"><table><tr><th>Question word</th><th>Look for</th><th>Example answer</th></tr><tr><td>Who</td><td>A person or group</td><td>the head teacher</td></tr><tr><td>When / How long</td><td>A time, date or period</td><td>in 2019; for six months</td></tr><tr><td>Where</td><td>A place</td><td>near the station</td></tr><tr><td>Why</td><td>A reason (because, so, to)</td><td>to save money</td></tr><tr><td>How many / much</td><td>A number or amount</td><td>about 200 pupils</td></tr><tr><td>What does “it” refer to?</td><td>The noun before it</td><td>the new park</td></tr></table></div>
<h4>Worked attitude question ${E}</h4>
<p><i>Text:</i> “The council <b>finally</b> agreed to repair the road, though many residents felt it was <b>far too late</b>.” <i>Q: What is the writer’s attitude to the council?</i> The words “finally” and “far too late” show <b>criticism</b>: the council acted slowly. A neutral writer would simply say “The council agreed to repair the road.”</p>
<h4>Inference practice ${E}</h4>
<ul><li>“Sam checked his watch for the fifth time.” Implied: he is <b>impatient or nervous</b>.</li><li>“She smiled politely and changed the subject.” Implied: she <b>did not want to discuss it</b>.</li><li>Method: ask “What does the writer want me to understand without saying it?” and find the clue words.</li></ul>
<h4>Summary of the four reading skills ${C}</h4>
<div class="wrap"><table><tr><th>Skill</th><th>You must</th><th>Best technique</th></tr><tr><td>R1</td><td>Find facts</td><td>Scan for key words and numbers</td></tr><tr><td>R2</td><td>Link ideas</td><td>Track pronouns and linking words</td></tr><tr><td>R3</td><td>Select details</td><td>Match the purpose in the question</td></tr><tr><td>R4</td><td>Understand implied meaning</td><td>Read around, find clue words, infer</td></tr></table></div>
<h4>Terms from the earlier short topic</h4>
<ul><li><b>Inference</b> = a conclusion drawn from clues. <b>Connotation</b> = the feeling a word suggests (<i>slim</i> is positive, <i>skinny</i> is negative). <b>Tone</b> = the writer’s attitude, e.g. formal, sarcastic or enthusiastic.</li><li><b>PEE:</b> Point, Evidence, Explain, a way to answer a question using the text.</li></ul>
<span class="tag">Topic 1.6</span><h3>Full worked mini-paper: “The Rooftop Garden”</h3>
<p class="lg">Work through this like the real Paper 1. Cover the answers first, try each question, then check. ${C} = every candidate. ${E} = stretch.</p>
<div class="card" style="margin:10px 0"><p><b>Text (about 130 words).</b> <i>Last March, Greenfield School turned its flat roof into a vegetable garden. The idea came from Ms Reyes, the science teacher, who had read that pupils eat more vegetables when they grow them. Fifty pupils volunteered, although at first many thought the project would fail because the roof was windy. They built twelve wooden boxes and filled them with soil donated by a local builder. By June the pupils were harvesting lettuces, and the canteen now serves them every Friday. The school hopes to raise money by selling extra vegetables at a weekend market, and next year it plans to add a small greenhouse. Ms Reyes admitted she was surprised by the pupils’ enthusiasm.</i></p></div>
<h4>Exercise 1 style: short answers ${C}</h4>
<div class="wrap"><table><tr><th>Question</th><th>Answer</th><th>Why</th></tr>
<tr><td>When was the roof turned into a garden?</td><td><b>last March</b></td><td>“When” needs a time.</td></tr>
<tr><td>Who gave the soil?</td><td><b>a local builder</b></td><td>“Who” needs a person.</td></tr>
<tr><td>How many boxes did pupils build?</td><td><b>twelve</b> (or 12)</td><td>“How many” needs a number; not “fifty”, which is the pupils.</td></tr>
<tr><td>Why did some pupils doubt the project?</td><td><b>the roof was windy</b></td><td>A reason, copied from the text.</td></tr></table></div>
<h4>Exercise 2 style: matching ideas ${C} ${E}</h4>
<ul><li>${C} “Which idea is a plan for the future?” → <b>the greenhouse</b> (“next year it plans…”). Plan words: <i>plans, hopes, will, next year</i>.</li>
<li>${E} “Which shows the teacher was impressed?” → <b>“admitted she was surprised by the pupils’ enthusiasm”</b>. The question paraphrases: <i>impressed</i> ≈ <i>surprised by enthusiasm</i>.</li></ul>
<h4>Exercise 3 style: complete the notes ${C}</h4>
<ul><li><b>Idea from:</b> ____ (a person). → <b>Ms Reyes / the science teacher</b>. <b>Number of volunteers:</b> ____ → <b>fifty / 50</b>. <b>Hopes to sell vegetables at a ____</b> → <b>weekend market</b>. Check each answer fits the grammar of the gap and is 1 to 3 words.</li></ul>
<h4>Exercise 4 style: multiple choice ${C} ${E}</h4>
<p><i>Q: What does Ms Reyes feel about the pupils’ reaction?</i> A) She is disappointed. B) She is pleasantly surprised. C) She expected it.</p>
<ul><li>A is the opposite. C copies the idea of “expected” but the text says <i>surprised</i>. <b>B</b> is correct. ${E} “<i>admitted</i>” suggests she did not expect it, which supports B.</li></ul>
${fg(4,"A question and the text say the same thing in different words")}
<span class="tag">Topic 1.7</span><h3>Paraphrase: the skill behind Exercises 2 and 4</h3>
<ul><li>${C} A <b>paraphrase</b> says the same thing in different words. Exam questions almost never copy the text, so you must match <b>meaning</b>, not spelling.</li>
<li>${C} Four common changes: <b>synonym</b> (<i>big → large</i>), <b>word class</b> (<i>decide → decision</i>), <b>active ↔ passive</b> (<i>The council built it → It was built by the council</i>), <b>negative ↔ opposite</b> (<i>not many → few</i>).</li>
<li>${E} Check <b>strength</b>: <i>pleased</i> is weaker than <i>delighted</i>; <i>sometimes</i> is not <i>never</i>. A wrong option often changes the strength or adds words such as <i>always, all, only, completely</i>.</li></ul>

<ul><li><b>Introduction:</b> “The aim of this report is to suggest improvements to the school library.”</li><li><b>Current problems:</b> “Many books are old, and there are too few computers.”</li><li><b>Recommendations:</b> “I would recommend buying new books and extending opening hours.”</li><li><b>Conclusion:</b> “These changes would encourage more pupils to read.”</li></ul>

<div class="wrap"><table><tr><th>Purpose</th><th>Informal</th><th>Formal ${E}</th></tr><tr><td>Add</td><td>and, also, plus</td><td>moreover, furthermore, in addition</td></tr><tr><td>Contrast</td><td>but, though</td><td>however, nevertheless, whereas</td></tr><tr><td>Reason</td><td>because, so</td><td>since, therefore, consequently</td></tr><tr><td>Example</td><td>like, for example</td><td>for instance, such as</td></tr><tr><td>Sequence</td><td>first, then, after that</td><td>firstly, subsequently, finally</td></tr><tr><td>Conclude</td><td>so, in the end</td><td>in conclusion, to sum up</td></tr></table></div>
<h4>Verb tenses you must control ${C}</h4>
<div class="wrap"><table><tr><th>Use</th><th>Form</th><th>Example</th></tr><tr><td>Habits, facts</td><td>Present simple</td><td>I walk to school every day.</td></tr><tr><td>Happening now</td><td>Present continuous</td><td>I am revising for my exams.</td></tr><tr><td>Finished past event</td><td>Past simple</td><td>We visited the museum last week.</td></tr><tr><td>Past up to now</td><td>Present perfect</td><td>I have lived here for five years.</td></tr><tr><td>Plans, predictions</td><td>will / going to</td><td>I am going to join the chess club.</td></tr><tr><td>${E} Unreal situations</td><td>Conditional</td><td>If I had more time, I would learn guitar.</td></tr></table></div>
<h4>Punctuation and spelling ${C}</h4>
<ul><li><b>Commas</b> separate items in a list and follow openers (<i>However,</i>). Do not join two full sentences with a comma; use a full stop or a linking word.</li><li><b>Apostrophes:</b> <i>it’s</i> = it is; <i>its</i> shows ownership. <b>Their / there / they’re</b>, <b>your / you’re</b>, <b>to / too</b> are common errors.</li><li>Learn topic spellings: <i>definitely, necessary, separate, environment, recommend, receive</i>.</li></ul>
<h4>Proofreading plan (last 2 minutes) ${C}</h4>
<ul><li>Read once for <b>content</b> (every bullet covered?), once for <b>tenses and agreement</b>, once for <b>spelling and punctuation</b>. Cross out neatly with one line.</li></ul>
<p>⚠️ <b>Exam trap:</b> Mixing registers, for example starting with <i>Dear Sir</i> and then writing <i>I’m gonna</i>. Keep one register from the first line to the last.</p>
<h4>Worked model: informal email (full length) ${C}</h4>
<p><i>Task: your friend wants to start a hobby. Suggest one, say why you like it and offer to help.</i></p>
<p>“Hi Jo, thanks for your message! I’m glad you want to try a new hobby. My suggestion is photography, because you can start with just your phone. I’ve been doing it for two years, and I love it because it makes me notice things I never saw before. Last month, for instance, I took a picture of a sunrise over the river, and my mum has now framed it! It’s also cheap and you can do it anywhere, even on the way to school. If you like, I can show you some simple tricks and take you to my favourite park on Saturday. We could have a picnic as well, and it would be a great way for us to spend more time together. Let me know what you think! Write soon, Dan” (about 133 words)</p>
<h4>Worked model: formal article (full length) ${C} ${E}</h4>
<p><i>Task: write an article for a magazine: “Should pupils wear uniforms?”</i></p>
<p>“<b>Uniforms: help or hindrance?</b> Have you ever wondered why most schools ask pupils to dress alike? Supporters argue that uniforms make everyone equal, because nobody can be judged by expensive clothes. They also save time in the morning and help pupils feel part of a team. Moreover, parents often say that uniforms are cheaper than a large wardrobe of fashionable outfits. However, opponents believe that clothes are a way of expressing personality, and that being forced to wear the same thing can feel dull. Nevertheless, in my view the benefits are greater. A smart dress code, with some freedom over shoes or accessories, would give pupils the best of both worlds. If schools listened to pupils’ opinions, uniforms might even become popular. In conclusion, uniforms are not perfect, but they build fairness and community.” (about 134 words)</p>
<h4>Why these answers score well ${E}</h4>
<ul><li>All parts of the task covered; clear paragraphs; correct register; opinions with reasons; contrast and conditional structures; precise vocabulary; an ending.</li></ul>
<h4>Paragraph structure: TEEL ${C}</h4>
<ul><li><b>T</b>opic sentence, <b>E</b>vidence or detail, <b>E</b>xplanation, <b>L</b>ink to the next idea.</li></ul>
<h4>Vocabulary upgrades ${E}</h4>
<div class="wrap"><table><tr><th>Basic</th><th>Better</th></tr><tr><td>good</td><td>excellent, beneficial, valuable</td></tr><tr><td>bad</td><td>harmful, disappointing, unpleasant</td></tr><tr><td>big</td><td>enormous, significant, considerable</td></tr><tr><td>say</td><td>explain, suggest, argue, mention</td></tr><tr><td>get</td><td>receive, obtain, achieve</td></tr></table></div>
<h4>Sentence variety ${E}</h4>
<ul><li>Mix <b>short</b> sentences for impact with <b>longer</b> ones using <i>because, although, who, which</i>. Begin some sentences with an <b>-ing</b> phrase (<i>Walking home, I noticed…</i>) or a <b>time phrase</b> (<i>Last summer, we…</i>).</li></ul>

return{t:"Topic 3: Listening (Cambridge 0510)",notes:`<span class="tag">Topic 3.1</span><h3>Listening skills and the exam (L1 to L4)</h3>
<p class="lg"><b>Key:</b> ${C} = skills every candidate needs. ${E} = stretch skills for the top grades (Lumen’s study labels; Cambridge has no tiers in 0510). Check the timing and marks of the Listening paper in the official syllabus.</p>
<ul><li>${C} The four listening skills match reading: <b>L1</b> facts and specific details, <b>L2</b> connections between ideas, <b>L3</b> opinions and attitudes, <b>L4</b> implied meaning.</li>
<li>${C} You hear each recording <b>twice</b>. Use the first listening to get the gist and answer what you can, and the second to check and fill gaps.</li>
<li>${E} Top grades come from <b>L3 and L4</b>: how a speaker feels, and what is meant but not said.</li></ul>
${fg(1,"Before, during and after listening")}
<h4>Before the recording ${C}</h4>
<ul><li>Use the pause to <b>read the questions</b>. Underline key words and <b>predict</b> the answer type: a number, a place, a reason, a feeling.</li><li>Look at the options in multiple choice; think of <b>paraphrases</b> you might hear.</li></ul>
<h4>During the recording ${C}</h4>
<ul><li>Write short notes, not full sentences. <b>Never leave a blank</b>; a sensible guess may earn a mark.</li><li>Answers come in the <b>same order</b> as the questions. If you miss one, move on at once.</li></ul>
<span class="tag">Topic 3.2</span><h3>Listening for specific information (L1)</h3>
<ul><li>${C} Numbers, dates, prices, times and spellings are often tested. Listen for <b>stress</b>: THIR-teen has stress at the end, THIR-ty at the start.</li>

${sim1}
<h4>Distractors ${C} ${E}</h4>
<ul><li>${C} <b>Speakers change their mind or correct themselves</b> (<i>at six… no, at seven</i>). The <b>final</b> version is the answer.</li><li>${E} Several options may be mentioned; only one answers the question. Listen for words such as <i>but, actually, in the end, however</i>.</li></ul>
${sim2}
<span class="tag">Topic 3.3</span><h3>Opinions, attitudes and implied meaning (L3, L4)</h3>
<ul><li>${C} <b>Opinion phrases:</b> <i>I think, in my view, I’m convinced that</i>. <b>Agreement:</b> <i>exactly, that’s true</i>. <b>Disagreement:</b> <i>I see what you mean, but…</i></li>
<li>${E} <b>Tone of voice</b> shows feelings: a rising, excited voice means enthusiasm; a flat, slow voice may mean boredom or disappointment. <b>Sarcasm</b> says the opposite of what is meant (<i>“Great, another rainy day!”</i>).</li>
<li>${E} <b>Implied meaning:</b> “I’ve heard that film three times already” may imply the speaker does not want to see it again.</li></ul>
${fg(2,"Tone of voice: the same words can show different feelings")}
<p>⚠️ <b>Exam trap:</b> Choosing an option because you heard the same word. Check the whole meaning, not one word.</p>
<span class="tag">Topic 3.4</span><h3>Note-taking and answer technique</h3>
<ul><li>${C} In note completion, decide the <b>word type</b> (noun, number, adjective) and write only <b>1 to 3 words</b>. Spell words correctly, especially if they are spelt out.</li><li>${C} In multiple choice, cross out options that are clearly wrong after the first listening.</li><li>${E} Use the second listening to <b>check meaning</b>, not to change answers without a reason.</li></ul>
<span class="tag">Topic 3.5</span><h3>Going deeper: listening in detail</h3>
<h4>Types of recording ${C}</h4>
<div class="wrap"><table><tr><th>Type</th><th>What to listen for</th></tr><tr><td>Short announcements and messages</td><td>Who, where, when, what to do; numbers and times</td></tr><tr><td>Conversations between two people</td><td>Who says what; agreement, disagreement, changes of mind</td></tr><tr><td>Interviews</td><td>The speaker’s experiences, reasons and opinions</td></tr><tr><td>Talks or presentations</td><td>Main points, signposting (<i>firstly, another point is…</i>)</td></tr></table></div>
<h4>Worked example with a distractor ${C} ${E}</h4>
<p><i>You hear:</i> “The trip leaves at half past eight. Actually, the coach is late, so it will leave at nine. Please bring lunch and, if you can, a raincoat.”</p>
<ul><li><b>Q: What time does the trip leave?</b> The first time (8.30) is a distractor; “actually” signals the correction, so the answer is <b>9.00</b>.</li><li><b>Q: What must pupils bring?</b> Lunch (a raincoat is only “if you can”, so it is not required).</li><li><b>Lesson:</b> small words (<i>actually, but, only, if</i>) change the answer.</li></ul>
<h4>Signal words ${C}</h4>
<ul><li><b>Correction:</b> <i>actually, sorry, I mean, rather</i>. <b>Contrast:</b> <i>but, however, although</i>. <b>Reason:</b> <i>because, so, that’s why</i>. <b>Emphasis:</b> <i>the main thing, most importantly</i>.</li></ul>
<h4>Paraphrase matching ${E}</h4>
<div class="wrap"><table><tr><th>You hear</th><th>The option says</th></tr><tr><td>“I could hardly believe it.”</td><td>She was very surprised.</td></tr><tr><td>“It cost an arm and a leg.”</td><td>It was very expensive.</td></tr><tr><td>“I’d rather stay in.”</td><td>He prefers not to go out.</td></tr></table></div>
<h4>Accents and speed ${C}</h4>
<ul><li>Speakers may have different accents. Do not panic if one word is unclear: use the words around it, and keep listening for the next question.</li><li>Practise with <b>podcasts, news and interviews</b> at normal speed, 15 minutes a day, noting 5 new words each time.</li></ul>
<h4>Practice routine ${C}</h4>
<ul><li>1) Predict from the questions. 2) Listen once and note. 3) Listen again and check. 4) Read the transcript if available and mark the exact words that gave each answer. 5) Record mistakes by type (numbers, distractor, vocabulary).</li></ul>
<h4>Second worked example ${C} ${E}</h4>
<p><i>You hear (interview):</i> “I started cycling to work last year. At first I did it to save money, but now I do it mainly because I feel healthier. It takes forty minutes, which is ten longer than the bus, though I don’t mind.”</p>
<ul><li><b>Q: Why did he start cycling?</b> To <b>save money</b> (the first reason).</li><li><b>Q: Why does he cycle now?</b> He <b>feels healthier</b> (“mainly because”).</li><li><b>Q: How long does the journey take?</b> <b>40 minutes</b> (not 30 or 10).</li><li>${E} <b>Q: How does he feel about the extra time?</b> He <b>does not mind</b>; “though I don’t mind” shows acceptance.</li></ul>
<h4>Note-taking shortcuts ${C}</h4>
<div class="wrap"><table><tr><th>Write</th><th>Meaning</th></tr><tr><td>&amp; or +</td><td>and</td></tr><tr><td>→</td><td>leads to, so</td></tr><tr><td>w/</td><td>with</td></tr><tr><td>approx.</td><td>about</td></tr><tr><td>1st, 2nd</td><td>order</td></tr></table></div>
<ul><li>Write key nouns, verbs and numbers only. Copy the answer in full only when you write your final answer.</li></ul>
<h4>Listening for gist ${C}</h4>
<ul><li>Ask: <b>Who</b> is speaking? <b>Where</b>? <b>Why</b> (to inform, complain, persuade, invite)? Notice the first and last sentences, which often state the main idea.</li></ul>
<h4>Common sound problems ${C}</h4>
<ul><li><b>Linked speech:</b> “a lot of” sounds like “alotta”. <b>Weak forms:</b> “can” is short, “can’t” is long. <b>Silent letters:</b> “knife”, “write”, “listen”. Practise by listening and repeating.</li></ul>
<h3>🔍 Topic 3 exam checklist</h3>
<ul><li>${C} Read and predict; digits for numbers; final version wins; short notes; no blanks.</li><li>${E} Attitude words and tone; paraphrase matching; implied meaning.</li></ul>`,

return{t:"Topic 4: Speaking (Cambridge 0510)",notes:`<span class="tag">Topic 4.1</span><h3>The speaking test and what examiners listen for (S1 to S4)</h3>
<p class="lg"><b>Key:</b> ${C} = skills every candidate needs. ${E} = stretch skills for the top grades (Lumen’s study labels; Cambridge has no tiers in 0510). In 0510 the Speaking test is separate from the written papers, so check its length and parts in the official syllabus and with your teacher.</p>
<ul><li>${C} You talk one-to-one with an examiner and the test is recorded. Examiners reward <b>clear communication</b>, <b>developed answers</b>, <b>accurate grammar</b>, a <b>range of vocabulary</b> and <b>clear pronunciation</b>.</li>
<li>${C} Short answers (“Yes.”, “Football.”) earn little. Say <b>what, why and an example</b>.</li>
<li>${E} Top performance sounds natural: you give opinions, compare ideas, <b>respond to the examiner’s follow-up</b>, and can recover when you make a mistake.</li></ul>
${fg(1,"The answer ladder: answer, reason, example, link back")}
<h4>Before the test ${C}</h4>
<ul><li>Practise common topics: school, family, hobbies, food, travel, technology, health, the environment, future plans.</li><li>Prepare <b>ideas</b>, not memorised speeches; examiners notice learned scripts.</li><li>Sleep well, speak a little English that morning, and arrive calm.</li></ul>
<span class="tag">Topic 4.2</span><h3>Developing answers</h3>
<ul><li>${C} <b>ARE method:</b> <b>A</b>nswer the question, give a <b>R</b>eason (<i>because…</i>), add an <b>E</b>xample (<i>for instance, last year I…</i>).</li>
<li>${E} Add a <b>comparison</b> or <b>opinion</b>: <i>In my view…, On the other hand…, I used to… but now…</i></li></ul>
${sim1}
<h4>Useful phrases ${C}</h4>
<div class="wrap"><table><tr><th>Purpose</th><th>Phrases</th></tr><tr><td>Give an opinion</td><td>I think…, In my opinion…, I strongly believe…</td></tr><tr><td>Agree / disagree</td><td>I agree because…, I see your point, but…</td></tr><tr><td>Buy thinking time</td><td>That’s an interesting question…, Let me think…</td></tr><tr><td>Ask for repetition</td><td>Sorry, could you repeat that, please?</td></tr><tr><td>Explain a word you forget</td><td>It’s a kind of…, It’s something you use for…</td></tr></table></div>
<p>⚠️ <b>Exam trap:</b> Saying “I don’t know”. Say “I haven’t thought about it, but I think…” and keep talking.</p>
<span class="tag">Topic 4.3</span><h3>Pronunciation, stress and fluency</h3>
<ul><li>${C} <b>Speak clearly and not too fast.</b> Pause at the ends of ideas. Pronounce the ends of words (<i>asked, helps, months</i>).</li>
<li>${C} <b>Word stress:</b> in multi-syllable words one syllable is stronger (<i>PHO-to-graph</i>, <i>pho-TO-gra-pher</i>). Wrong stress can make a word hard to recognise.</li>
<li>${E} <b>Intonation:</b> the voice rises for yes/no questions and falls at the end of statements; stress the important words to show meaning (<i>I didn’t say HE took it</i>).</li>
<li>Natural fluency means few long silences; use fillers sparingly (<i>well, you know</i>), not constantly (<i>um, um</i>).</li></ul>
${sim2}
${fg(2,"Word stress: the strong syllable is the tall bar")}
<span class="tag">Topic 4.4</span><h3>Going deeper: speaking in detail</h3>
<h4>Types of question and how to answer ${C}</h4>
<div class="wrap"><table><tr><th>Type</th><th>Example</th><th>How to answer</th></tr><tr><td>Personal</td><td>Tell me about your family.</td><td>Give details, names, feelings, a short story</td></tr><tr><td>Past</td><td>What did you do last holiday?</td><td>Use past tenses; add order words (first, then)</td></tr><tr><td>Future</td><td>What would you like to do after school?</td><td>Use will, going to, would like to, hope to</td></tr><tr><td>Opinion ${E}</td><td>Should homework be banned?</td><td>Opinion, two reasons, one example, a different view</td></tr><tr><td>Describing</td><td>Describe your favourite place.</td><td>Where, what you see, how you feel, why it matters</td></tr></table></div>
<h4>Model answer ${C} ${E}</h4>
<p><i>Q: Do you think technology helps students?</i></p>

return{t:"Topic 7: Grammar and vocabulary reference (Cambridge 0510)",notes:`<span class="tag">Topic 7.1</span><h3>Why grammar matters for every skill</h3>
<p class="lg"><b>Key:</b> ${C} = every candidate. ${E} = stretch (Lumen labels, not Cambridge tiers). Accurate and varied grammar helps Reading (understanding), Writing and Speaking (marks for accuracy and range) and Listening (recognising structures). This topic is a reference you can return to.</p>

<span class="tag">Topic 7.2</span><h3>Verb tenses in depth</h3>
${sim1}
<div class="wrap"><table><tr><th>Tense</th><th>Form</th><th>Use</th><th>Signal words</th></tr><tr><td>Present simple</td><td>I work / he works</td><td>Habits, facts, timetables</td><td>always, usually, every day</td></tr><tr><td>Present continuous</td><td>I am working</td><td>Now, temporary, near future plans</td><td>now, at the moment, today</td></tr><tr><td>Past simple</td><td>I worked / I went</td><td>Finished past actions</td><td>yesterday, last week, in 2019, ago</td></tr><tr><td>Past continuous</td><td>I was working</td><td>Action in progress in the past</td><td>while, when, at 8 o’clock yesterday</td></tr><tr><td>Present perfect</td><td>I have worked</td><td>Past with a link to now; experience</td><td>already, yet, ever, never, since, for, just</td></tr><tr><td>${E} Past perfect</td><td>I had worked</td><td>The earlier of two past actions</td><td>before, after, by the time</td></tr><tr><td>Future</td><td>will / going to / present continuous</td><td>Predictions, decisions, plans</td><td>tomorrow, next year, soon</td></tr></table></div>
<ul><li>${C} <b>Present perfect or past simple?</b> Use <b>past simple</b> with a finished time (<i>I saw the film last night</i>) and <b>present perfect</b> when the time is not stated or continues to now (<i>I have seen the film; I have lived here for five years</i>).</li><li>${C} <b>for / since:</b> <i>for</i> + a period (for two years); <i>since</i> + a starting point (since 2022).</li><li>${C} <b>Irregular verbs</b> to learn: go–went–gone, see–saw–seen, take–took–taken, write–wrote–written, buy–bought–bought, begin–began–begun.</li><li>${E} <b>Will or going to?</b> <i>Will</i> for sudden decisions and predictions (<i>I’ll help you</i>); <i>going to</i> for plans and evidence (<i>Look at those clouds, it’s going to rain</i>).</li></ul>
<span class="tag">Topic 7.3</span><h3>Modal verbs</h3>
<div class="wrap"><table><tr><th>Modal</th><th>Meaning</th><th>Example</th></tr><tr><td>can / could</td><td>Ability, possibility, polite request</td><td>Could you help me, please?</td></tr><tr><td>must / have to</td><td>Obligation, strong advice</td><td>You must wear a seat belt.</td></tr><tr><td>mustn’t</td><td>Prohibition</td><td>You mustn’t use phones in the exam.</td></tr><tr><td>don’t have to</td><td>No obligation</td><td>You don’t have to come early.</td></tr><tr><td>should / ought to</td><td>Advice</td><td>You should revise every day.</td></tr><tr><td>may / might</td><td>Possibility</td><td>It might rain later.</td></tr><tr><td>${E} must have / can’t have</td><td>Deduction about the past</td><td>He must have forgotten. She can’t have left.</td></tr></table></div>
<ul><li>Modals are followed by the <b>base verb</b> without “to” (<i>I can swim</i>, not <i>I can to swim</i>) and do not take -s (<i>she can</i>).</li></ul>
<span class="tag">Topic 7.4</span><h3>Conditionals</h3>
${sim2}
<div class="wrap"><table><tr><th>Type</th><th>Form</th><th>Example</th></tr><tr><td>Zero</td><td>If + present, present</td><td>If you heat ice, it melts.</td></tr><tr><td>First</td><td>If + present, will + base</td><td>If it rains, we will stay home.</td></tr><tr><td>${E} Second</td><td>If + past, would + base</td><td>If I had more time, I would learn guitar.</td></tr><tr><td>${E} Third</td><td>If + past perfect, would have + past participle</td><td>If I had studied, I would have passed.</td></tr></table></div>
<span class="tag">Topic 7.5</span><h3>Passive voice, reported speech and relative clauses</h3>
<ul><li>${C} <b>Passive:</b> be + past participle. <i>The window was broken by a ball.</i> Use it when the action matters more than who did it (<i>The road is cleaned every morning</i>). Active: <i>A ball broke the window.</i></li>
<li>${C} <b>Reported speech:</b> the tense usually moves back and pronouns, time words change. “I am tired,” she said → She said <b>she was</b> tired. “I will come tomorrow” → He said he <b>would come the next day</b>. Reported questions keep statement order: “Where do you live?” → He asked <b>where I lived</b>.</li>
<li>${C} <b>Relative clauses:</b> <i>who</i> (people), <i>which</i> (things), <i>that</i> (people or things), <i>whose</i> (possession), <i>where</i> (places). <i>The girl who won the prize is my cousin.</i></li>
<li>${E} <b>Non-defining clauses</b> add extra information between commas: <i>My brother, who lives in Dubai, is an engineer.</i> Do not use <i>that</i> in these.</li></ul>
<span class="tag">Topic 7.6</span><h3>Articles, nouns, quantifiers and prepositions</h3>
<ul><li>${C} <b>a / an</b> for singular, first mention (<i>a book, an apple</i>); <b>the</b> for something known or unique (<i>the sun, the book on the table</i>); <b>no article</b> for general plurals and uncountables (<i>Dogs are loyal. Water is essential</i>).</li>
<li>${C} <b>Countable / uncountable:</b> <i>many books, few friends, a number of</i>; <i>much water, little time, a lot of information</i>. Words like <i>advice, information, news, furniture, homework</i> are uncountable (no -s).</li>
<li>${C} <b>Prepositions of time:</b> <i>at</i> six o’clock / night; <i>on</i> Monday / 5 May; <i>in</i> May / 2024 / the morning. <b>Of place:</b> <i>at</i> the station; <i>on</i> the table; <i>in</i> the room. <b>Fixed:</b> good <i>at</i>, interested <i>in</i>, afraid <i>of</i>, depend <i>on</i>, arrive <i>at/in</i>, listen <i>to</i>.</li>
<li>${E} <b>Gerund or infinitive:</b> enjoy / avoid / finish + <i>-ing</i>; want / hope / decide + <i>to</i> + verb; stop <i>doing</i> (quit) vs stop <i>to do</i> (pause in order to).</li></ul>
<span class="tag">Topic 7.7</span><h3>Vocabulary building</h3>
<div class="wrap"><table><tr><th>Word formation</th><th>Examples</th></tr><tr><td>Prefixes (negative)</td><td>un-happy, dis-agree, im-possible, ir-regular, in-correct</td></tr><tr><td>Prefixes (other)</td><td>re-write, mis-understand, over-react, inter-national</td></tr><tr><td>Suffixes: noun</td><td>happi-ness, educa-tion, move-ment, friend-ship</td></tr><tr><td>Suffixes: adjective</td><td>help-ful, care-less, danger-ous, child-ish</td></tr><tr><td>Suffixes: adverb</td><td>quick-ly, careful-ly, happi-ly</td></tr></table></div>
<ul><li>${C} <b>Collocations</b> (words that go together): <i>make a decision, do homework, take a photo, heavy rain, strong coffee, pay attention</i>.</li><li>${E} <b>Phrasal verbs:</b> <i>look up</i> (search), <i>carry on</i> (continue), <i>turn down</i> (refuse), <i>come up with</i> (invent), <i>run out of</i> (have none left).</li><li>${E} <b>Idioms:</b> <i>a piece of cake</i> (very easy), <i>under the weather</i> (ill), <i>break the ice</i> (start a conversation).</li><li>${C} <b>Commonly confused:</b> affect (verb) / effect (noun); advice (noun) / advise (verb); lose / loose; quiet / quite; accept / except; principal / principle.</li></ul>
<span class="tag">Topic 7.8</span><h3>Punctuation and spelling rules</h3>
<ul><li>${C} <b>Full stop</b> ends a statement; <b>question mark</b> a question; <b>comma</b> separates list items, follows introductory words and sets off extra information. <b>Semicolon</b> joins two closely related sentences. <b>Colon</b> introduces a list or explanation. <b>Apostrophe:</b> contractions (<i>don’t</i>) and ownership (<i>the girl’s bag, the girls’ bags</i>).</li><li>${C} <b>Spelling patterns:</b> “i before e except after c” (<i>believe, receive</i>); double the final consonant in short words (<i>run → running</i>); drop silent e before -ing (<i>make → making</i>); change y to i (<i>happy → happiness</i>).</li><li>${C} <b>Direct speech:</b> “I’m ready,” said Mia. New speaker, new line.</li></ul>
<span class="tag">Topic 7.9</span><h3>Using grammar in the exam</h3>
<ul><li>${C} <b>Writing:</b> check each verb for tense and agreement; vary structures; use linking words.</li><li>${C} <b>Speaking:</b> use correct tenses without stopping; self-correct calmly.</li><li>${E} <b>Reading:</b> grammar clues (a pronoun, a modal like <i>might</i>, a conditional) show attitude and certainty: <i>might</i> is less certain than <i>will</i>.</li><li><b>Practice routine:</b> pick one rule a week, write five sentences using it, and correct them.</li></ul>
<h3>🔍 Topic 7 exam checklist</h3>
<ul><li>${C} Tenses, modals, first conditional, passive, reported speech, relative clauses, articles, prepositions, word formation, punctuation.</li><li>${E} Past perfect, second and third conditionals, non-defining clauses, phrasal verbs, idioms, deduction with modals.</li></ul>`,

{t:"Topic 1: Characteristics and classification of living organisms (Cambridge 0610)",notes:`
<span class="tag">Topic 1.1</span><h3>Characteristics of living organisms</h3>
<p class="lg"><b>Key:</b> <span class="xt">EXT</span> = Extended (Supplement) only. No tag = Core (Extended students need it too).</p>
<p>All living things share seven characteristics. A useful memory aid is <b>MRS GREN</b>. Each needs its exact syllabus definition.</p><ul><li><b>Movement</b>: an action by an organism or part of an organism causing a change of position or place. Plants move parts (e.g. shoots towards light) but do not usually change place.</li><li><b>Respiration</b>: the chemical reactions in cells that break down nutrient molecules and release energy for metabolism.</li><li><b>Sensitivity</b>: the ability to detect and respond to changes in the internal or external environment.</li><li><b>Growth</b>: a permanent increase in size and dry mass. Dry mass is used because water content changes.</li><li><b>Reproduction</b>: the processes that make more of the same kind of organism.</li><li><b>Excretion</b>: removal of the waste products of metabolism and substances in excess of requirements (e.g. CO₂, urea).</li><li><b>Nutrition</b>: taking in materials for energy, growth and development.</li></ul><p>p <b>Exam tip:</b> excretion is not egestion. Egestion is removing undigested food (faeces) that never entered body cells.</p>
<h3>In more detail</h3><ul><li><b>Movement.</b> Animals move their whole body (walking, swimming, flying) from place to place. Plants usually cannot change place but move parts, e.g. a sunflower head turning, leaves folding in a Venus fly trap, shoots bending to light. Single-celled organisms such as <i>Amoeba</i> move by changing shape.</li><li><b>Respiration.</b> This is not breathing. Breathing is moving air into and out of the lungs. Respiration happens inside every living cell, all the time, and releases energy that is used for muscle contraction, growth, active transport and keeping warm. Energy is released, not made.</li><li><b>Sensitivity.</b> A stimulus is a change in the environment (light, temperature, touch, chemicals, sound). Receptors detect it and the organism produces a response. Example: your pupil gets smaller in bright light; a root grows downwards in response to gravity.</li><li><b>Growth.</b> Growth must be a permanent increase. A balloon getting bigger is not growth. Dry mass is used because the water content of an organism can change from hour to hour (for example when a plant wilts or an animal drinks). Size includes length, height or volume.</li><li><b>Reproduction.</b> Organisms make more of their own kind, either asexually (one parent) or sexually (two parents). This ensures the species survives even though individuals die.</li><li><b>Excretion.</b> Metabolic waste must be removed because it is toxic or no longer needed: carbon dioxide from respiration (lungs, or stomata in plants), urea from breakdown of amino acids (kidneys), excess water and ions (kidneys). Substances in excess of requirements include extra salts and vitamins.</li><li><b>Nutrition.</b> Animals take in organic food (heterotrophic nutrition). Green plants make their own food by photosynthesis, taking in carbon dioxide, water and mineral ions (autotrophic nutrition).</li></ul><h3>Common exam mistakes</h3><ul><li>Writing “excretion is getting rid of waste”. Say “removal of the waste products of metabolism and substances in excess of requirements”.</li><li>Confusing excretion (metabolic waste made in cells) with egestion (undigested food that was never absorbed).</li><li>Defining growth as “getting bigger”. It must be “a permanent increase in size and dry mass”.</li><li>Saying respiration “makes” energy. It releases energy stored in nutrient molecules.</li></ul><h3>Summary</h3><p>p Every living organism shows all seven characteristics, and a non-living object (a car, a fire, a crystal) may show some but never all seven. Viruses are borderline: they reproduce only inside host cells and do not respire or excrete on their own.</p><span class="tag">Topic 1.2</span><h3>Concept and uses of classification systems</h3>
<ul><li>Organisms are classified into groups by the <b>features they share</b>. Classification makes living things easier to study and identify.</li><li>A <b>species</b> is a group of organisms that can reproduce to produce <b>fertile</b> offspring (a horse and a donkey give a sterile mule, so they are different species).</li><li>The <b>binomial system</b> is an internationally agreed naming system. The scientific name has two parts: the <b>genus</b> (capital letter) then the <b>species</b> (lower case), e.g. <i>Homo sapiens</i>. Written in italics or underlined.</li><li><b>Dichotomous keys</b>: a series of paired statements based on identifiable features. Each step has two choices and leads to a name or to another pair. Construct and use them; make each question have a clear yes/no answer about an observable feature.</li><li><span class="xt">EXT</span>Classification systems aim to reflect <b>evolutionary relationships</b>.</li><li><span class="xt">EXT</span>The <b>sequence of bases in DNA</b> is used for classification.</li><li><span class="xt">EXT</span>Organisms sharing a <b>more recent common ancestor</b> (more closely related) have <b>more similar DNA base sequences</b> than those sharing only a distant ancestor.</li></ul>
<h3>Why classify?</h3><ul><li>Classification organises the huge variety of organisms into groups, making them easier to study, identify and compare, and shows how they are related. Modern classification uses features that can be seen and, in Extended, evidence from DNA.</li></ul><h3>Species and the binomial system in more detail</h3><ul><li>Fertile offspring is the key idea. A <b>lion and tiger</b> can produce a liger, which is sterile, so they are separate species. Members of one species share genes and can interbreed.</li><li>Binomial names are used because common names vary between countries and languages (the same animal may have many names). A scientific name is understood by scientists everywhere.</li><li>Rules: two parts, <b>genus first with a capital letter</b>, <b>species second with a lower case letter</b>. Handwritten names are underlined; printed names are in italics. Example: <i>Panthera leo</i> (lion), <i>Panthera tigris</i> (tiger). They share a genus, showing they are closely related.</li></ul><h3>Using and constructing a dichotomous key</h3><ul><li>A key is made of numbered pairs of statements. Each statement describes an observable feature (e.g. “has wings” / “has no wings”). The user follows the choice that fits the specimen until reaching a name.</li><li>To construct a key: (1) list the features of the organisms; (2) choose a feature that splits the group into two; (3) split each new group again with a different feature; (4) continue until every organism is separate; (5) test the key on an organism.</li><li>Good features are easy to see and do not change (number of legs, presence of a shell). Avoid size, colour or “big/small” when possible, as these vary.</li></ul><p>p <b>Example:</b> 1a Has wings → go to 2. 1b No wings → go to 3. 2a One pair of wings → housefly. 2b Two pairs of wings → bee.</p><ul><li><span class="xt">EXT</span><b>Evolutionary relationships.</b> Organisms that evolved from a common ancestor share many features. A classification system tries to put closely related organisms in the same group. Early classification was based only on appearance, but similar appearance does not always mean close relationship.</li><li><span class="xt">EXT</span><b>DNA evidence.</b> The sequence of bases in DNA is the code for the organism. Comparing the base sequences of two species shows how similar they are. The more similar the sequences, the more recently the species shared an ancestor. This is a more accurate method and has rearranged some groups.</li><li><span class="xt">EXT</span><b>Worked reasoning:</b> species A and B share 98 % of their base sequence, while A and C share 85 %. A and B shared a more recent common ancestor, so A and B are more closely related.</li></ul><h3>Summary</h3><p>p Species is defined by fertile offspring; binomial names have genus then species; keys use paired observable features; DNA similarity measures relatedness (extended).</p><span class="tag">Topic 1.3</span><h3>Features of organisms</h3>
<h3>The main groups</h3><ul><li><b>Animal kingdom</b>: multicellular, no cell walls or chloroplasts, feed on organic matter (heterotrophic), nervous coordination, usually move.</li><li><b>Plant kingdom</b>: multicellular, cell walls of cellulose, chloroplasts, make food by photosynthesis, store starch.</li></ul><div class="wrap"><table><tr><th>Vertebrate group</th><th>Main features</th></tr><tr><td>Mammals</td><td>Hair/fur, mammary glands, external ears (pinna), live young (mostly), constant body temperature</td></tr><tr><td>Birds</td><td>Feathers, wings, beak, lay hard-shelled eggs, constant body temperature</td></tr><tr><td>Reptiles</td><td>Dry scaly skin, lay soft-shelled eggs on land, variable body temperature</td></tr><tr><td>Amphibians</td><td>Moist smooth skin, eggs (frogspawn) laid in water, lungs and skin used for gas exchange</td></tr><tr><td>Fish</td><td>Wet scales, gills, fins, eggs laid in water</td></tr></table></div><div class="wrap"><table><tr><th>Arthropod group</th><th>Main features</th></tr><tr><td>Insects</td><td>3 pairs of legs, 3 body parts (head, thorax, abdomen), 1 or 2 pairs of wings, 1 pair of antennae</td></tr><tr><td>Arachnids</td><td>4 pairs of legs, 2 body parts, no antennae, no wings</td></tr><tr><td>Crustaceans</td><td>More than 4 pairs of legs, hard exoskeleton, 2 pairs of antennae</td></tr><tr><td>Myriapods</td><td>Many segments each with legs (centipedes 1 pair, millipedes 2 pairs), long body, 1 pair of antennae</td></tr></table></div><p>p All arthropods have an exoskeleton, jointed legs and a segmented body. Classify organisms using these features (including with keys).</p><h3>Extended: all five kingdoms, plant groups and viruses</h3><ul><li><span class="xt">EXT</span><b>Animal</b>: multicellular, no cell walls, no chloroplasts, feed heterotrophically. <b>Plant</b>: multicellular, cellulose cell walls, chloroplasts, autotrophic.</li><li><span class="xt">EXT</span><b>Fungi</b>: body of threads called <b>hyphae</b> forming a mycelium, cell walls of <b>chitin</b>, no chloroplasts, feed by <b>extracellular digestion</b> (saprotrophic or parasitic), store <b>glycogen</b>, may be multicellular or unicellular (yeast).</li><li><span class="xt">EXT</span><b>Prokaryotes</b> (bacteria): unicellular, no nucleus (circular DNA, plasmids), cell wall, no membrane-bound organelles.</li><li><span class="xt">EXT</span><b>Protoctists</b>: mostly microscopic single-celled organisms, some have chloroplasts (algae such as <i>Chlorella</i>), others behave like animals (<i>Amoeba</i>), some cause disease (<i>Plasmodium</i> causes malaria).</li><li><span class="xt">EXT</span><b>Ferns</b>: leaves called fronds, no flowers, reproduce by <b>spores</b>. <b>Flowering plants</b>: reproduce by flowers and seeds. <b>Dicotyledons</b>: 2 seed leaves, net-veined leaves, flower parts in 4s or 5s. <b>Monocotyledons</b>: 1 seed leaf, parallel-veined leaves, flower parts in 3s.</li><li><span class="xt">EXT</span><b>Viruses</b>: not made of cells; only a <b>protein coat</b> and <b>genetic material</b> (DNA or RNA). They reproduce only inside living host cells.</li></ul><h3>Further detail on the animal groups</h3><ul><li><b>Mammals</b> are the only animals with hair and mammary glands that feed young with milk. Most give birth to live young (a few, such as the platypus, lay eggs). They have a diaphragm and four-chambered heart.</li><li><b>Birds</b> have a beak with no teeth, wings (most fly), a light skeleton and lay eggs with hard shells. They are warm-blooded and insulate with feathers.</li><li><b>Reptiles</b> (lizards, snakes, crocodiles) have dry scaly skin that prevents water loss, lay leathery eggs on land and depend on the surroundings to warm up.</li><li><b>Amphibians</b> (frogs, newts) have thin moist skin through which gases pass, lay jelly-covered eggs in water and live both in water (larvae) and on land (adults).</li><li><b>Fish</b> have gills, fins, streamlined bodies and scales covered in slime; they live in water.</li><li><b>Insects</b> (bee, butterfly) have a head, thorax and abdomen, three pairs of jointed legs, compound eyes and a pair of antennae. <b>Arachnids</b> (spider, scorpion, tick) have a combined head and thorax, eight legs and no antennae. <b>Crustaceans</b> (crab, prawn, woodlouse) usually have a hard shell, two pairs of antennae and more than four pairs of legs. <b>Myriapods</b> (centipede, millipede) have a long body of many similar segments.</li></ul><h3>Practical: classify using features</h3><ul><li>Look at the number of legs, body parts, wings, antennae, skin covering and how it reproduces, then match to the table. Use a hand lens to count carefully.</li><li>Example: an animal with 6 legs, 3 body parts, 2 antennae is an insect; one with 8 legs and 2 body parts is an arachnid.</li><li><span class="xt">EXT</span><b>Fungi in more detail.</b> Fungi cannot photosynthesise. They secrete enzymes onto dead organic matter and absorb the soluble products (extracellular digestion). Mould on bread and mushrooms are examples. Yeast is a single-celled fungus. They reproduce by releasing spores.</li><li><span class="xt">EXT</span><b>Bacteria</b> are tiny, single-celled prokaryotes. Some cause disease, some decompose waste, some make yoghurt and cheese. They reproduce very quickly by binary fission.</li><li><span class="xt">EXT</span><b>Protoctists</b>: <i>Amoeba</i> lives in pond water and feeds by engulfing food; <i>Chlorella</i> has chloroplasts and photosynthesises; <i>Plasmodium</i> is a parasite carried by mosquitoes that causes malaria.</li><li><span class="xt">EXT</span><b>Ferns versus flowering plants:</b> ferns have fronds and reproduce by spores in structures under the leaves; flowering plants reproduce using flowers and seeds. In dicots the vascular bundles are in a ring and the leaf veins form a network; in monocots (grasses, maize) the leaves are long and thin with parallel veins.</li><li><span class="xt">EXT</span><b>Viruses</b> are far smaller than bacteria and need living host cells to copy themselves. They are not alive on their own and so are not in any of the five kingdoms. Examples: HIV, influenza, tobacco mosaic virus. Antibiotics do not work on viruses.</li></ul><h3>Common exam mistakes</h3><ul><li>Saying a spider is an insect (it has 8 legs and 2 body parts so it is an arachnid).</li><li>Saying viruses are single-celled. They are not made of cells.</li><li>Giving “has a backbone” as the only feature for a vertebrate group. Give the feature that separates the group (e.g. feathers for birds).</li></ul>`,kw:[["Movement", "Action by an organism or part of it causing a change of position or place."], ["Respiration", "Chemical reactions in cells that break down nutrient molecules and release energy for metabolism."], ["Sensitivity", "Ability to detect and respond to changes in the internal or external environment."], ["Growth", "Permanent increase in size and dry mass."], ["Excretion", "Removal of waste products of metabolism and substances in excess of requirements."], ["Nutrition", "Taking in of materials for energy, growth and development."], ["Species", "A group of organisms that can reproduce to produce fertile offspring."], ["Binomial system", "Naming system with two parts: genus then species."], ["Dichotomous key", "A key using paired statements on identifiable features to identify organisms."], ["Hyphae", "Thread-like structures making up the body of a fungus."], ["Prokaryote", "Single-celled organism with no nucleus, e.g. bacterium."], ["Virus", "Non-cellular particle with a protein coat and genetic material; reproduces only inside host cells."]],f:["Species = group able to reproduce to produce fertile offspring", "Binomial name = Genus species"],qa:[["Define growth.", "A permanent increase in size and dry mass."], ["Give two features of insects.", "Three pairs of legs and three body parts; one or two pairs of wings."], ["(Extended) Why is a virus not placed in any kingdom?", "It is not made of cells; it has only a protein coat and genetic material."], ["(Extended) How does DNA support classification?", "Organisms that share a more recent ancestor have more similar base sequences."]],mcq:[["Which group has feathers?", ["Reptiles", "Birds", "Mammals"], 1, "Feathers are a feature of birds."], ["Fungal cell walls are made of…", ["cellulose", "chitin", "protein"], 1, "Chitin (extended)."], ["Arachnids have…", ["3 pairs of legs", "4 pairs of legs", "no legs"], 1, "Spiders, scorpions: 4 pairs, 2 body parts."]]},
{t:"Topic 2: Organisation of the organism (Cambridge 0610)",notes:`
<span class="tag">Topic 2.1</span><h3>Cell structure</h3>
<p class="lg"><b>Key:</b> <span class="xt">EXT</span> = Extended (Supplement) only. No tag = Core (Extended students need it too).</p>
<svg viewBox="0 0 560 210" style="max-width:100%;height:auto" role="img" aria-label="Animal and plant cell"><g font-size="11" fill="currentColor"><ellipse cx="130" cy="105" rx="105" ry="85" fill="#cde4ff" stroke="#3a3cf0" stroke-width="3"/><circle cx="120" cy="95" r="28" fill="#b08cff"/><text x="102" y="99">Nucleus</text><ellipse cx="190" cy="140" rx="18" ry="9" fill="#ff9d7a"/><text x="165" y="162">Mitochondrion</text><text x="60" y="190">Membrane · cytoplasm</text><text x="85" y="16" font-weight="700">ANIMAL</text><rect x="305" y="22" width="235" height="175" rx="10" fill="#d9f5dc" stroke="#1f9d63" stroke-width="6"/><ellipse cx="400" cy="140" rx="70" ry="35" fill="#fff" stroke="#59a"/><text x="375" y="143">Vacuole</text><circle cx="360" cy="80" r="20" fill="#b08cff"/><text x="338" y="84">Nucleus</text><ellipse cx="465" cy="70" rx="16" ry="9" fill="#2fb36b"/><text x="440" y="56">Chloroplast</text><text x="330" y="16" font-weight="700">PLANT</text><text x="440" y="212">Cell wall</text></g></svg><h3>Plant, animal and bacterial cells</h3><div class="wrap"><table><tr><th>Structure</th><th>Function</th><th>Animal</th><th>Plant</th><th>Bacterium</th></tr><tr><td>Cell membrane</td><td>Controls what enters and leaves</td><td>Yes</td><td>Yes</td><td>Yes</td></tr><tr><td>Cytoplasm</td><td>Where most chemical reactions happen</td><td>Yes</td><td>Yes</td><td>Yes</td></tr><tr><td>Nucleus</td><td>Contains DNA, controls the cell</td><td>Yes</td><td>Yes</td><td>No (circular DNA)</td></tr><tr><td>Cell wall</td><td>Strength and support (cellulose in plants)</td><td>No</td><td>Yes</td><td>Yes (not cellulose)</td></tr><tr><td>Chloroplasts</td><td>Photosynthesis; contain chlorophyll</td><td>No</td><td>Yes</td><td>No</td></tr><tr><td>Mitochondria</td><td>Aerobic respiration releases energy</td><td>Yes</td><td>Yes</td><td>No</td></tr><tr><td>Ribosomes</td><td>Protein synthesis</td><td>Yes</td><td>Yes</td><td>Yes</td></tr><tr><td>Vacuole</td><td>Stores cell sap; keeps cell firm</td><td>Small, temporary</td><td>Large, permanent</td><td>No</td></tr><tr><td>Circular DNA / plasmids</td><td>Genetic information; plasmids carry extra genes</td><td>No</td><td>No</td><td>Yes</td></tr></table></div><ul><li>Be able to identify all these structures in diagrams and images and state each function.</li><li>New cells are produced by <b>division of existing cells</b>.</li></ul><h3>Specialised cells</h3><ul><li><b>Ciliated cells</b>: cilia move mucus in the trachea and bronchi.</li><li><b>Root hair cells</b>: absorption of water and ions; long extension gives a large surface area.</li><li><b>Palisade mesophyll cells</b>: photosynthesis; many chloroplasts, tall and packed at the top of the leaf.</li><li><b>Neurones</b>: conduct electrical impulses; long with branched ends.</li><li><b>Red blood cells</b>: transport oxygen; biconcave, no nucleus, contain haemoglobin.</li><li><b>Sperm and egg cells (gametes)</b>: reproduction.</li></ul><h3>Levels of organisation</h3><ul><li><b>Cell</b> → <b>tissue</b> (group of similar cells with the same function, e.g. muscle) → <b>organ</b> (different tissues working together, e.g. stomach) → <b>organ system</b> (organs with a common function, e.g. digestive system) → <b>organism</b>.</li></ul>
<h3>More about the structures</h3><ul><li><b>Cell membrane</b>: a thin partially permeable layer around the cytoplasm that controls the movement of substances into and out of the cell. In plants it lies just inside the cell wall.</li><li><b>Cell wall</b>: in plants made of cellulose; it is fully permeable and gives strength, keeping the shape of the cell and preventing it bursting when it takes in water. Bacterial walls are made of different material. Fungal walls are chitin.</li><li><b>Nucleus</b>: surrounded by a membrane, contains chromosomes of DNA, controls all cell activities including growth and division.</li><li><b>Chloroplasts</b>: contain green pigment chlorophyll that absorbs light energy for photosynthesis. Found in the green parts of plants (leaves, young stems) but not in root cells.</li><li><b>Mitochondria</b>: release energy from glucose in aerobic respiration. Active cells (muscle, sperm, root hairs, neurones) have many.</li><li><b>Ribosomes</b>: tiny structures where amino acids are joined to make proteins.</li><li><b>Vacuole</b>: a plant cell has one large permanent vacuole filled with cell sap (water, sugars, salts). It pushes the cytoplasm against the wall and keeps the cell firm.</li></ul><h3>Bacterial cell</h3><ul><li>Structure: cell wall, cell membrane, cytoplasm, ribosomes, a single <b>circular chromosome of DNA</b> lying free in the cytoplasm (no nucleus) and small rings of DNA called <b>plasmids</b>. Many have a flagellum for movement.</li><li>Bacteria are much smaller than plant and animal cells (about 1–5 µm compared with 10–100 µm).</li></ul><h3>Why each specialised cell is suited to its function</h3><ul><li><b>Ciliated cell</b>: cilia sweep mucus with trapped dust and bacteria away from the lungs.</li><li><b>Root hair cell</b>: long hair-like extension gives a large surface area for absorbing water and mineral ions; thin wall.</li><li><b>Palisade mesophyll</b>: many chloroplasts, tall shape, close to the leaf surface to absorb light.</li><li><b>Neurone</b>: long fibre (axon) to carry impulses over long distances; branched endings to connect to other cells.</li><li><b>Red blood cell</b>: biconcave disc increases surface area for oxygen absorption; no nucleus leaves more room for haemoglobin; flexible to squeeze through capillaries.</li><li><b>Sperm</b>: tail for swimming, many mitochondria, acrosome with enzymes. <b>Egg cell</b>: large, contains food store (cytoplasm), jelly coat.</li></ul><h3>Drawing and viewing cells</h3><ul><li>Use a light microscope: low power first to find the specimen, then high power with fine focus. Draw with a sharp pencil, clear continuous lines, no shading and no colouring; label lines drawn with a ruler touching the structure.</li><li>Staining: iodine stains onion epidermis (nuclei and cell walls visible); methylene blue stains animal cheek cells.</li></ul><h3>Levels of organisation with examples</h3><div class="wrap"><table><tr><th>Level</th><th>Meaning</th><th>Example</th></tr><tr><td>Cell</td><td>Basic unit of life</td><td>Palisade cell, muscle cell, neurone</td></tr><tr><td>Tissue</td><td>Group of similar cells doing the same job</td><td>Muscle tissue, xylem, epithelium</td></tr><tr><td>Organ</td><td>Different tissues working together as a unit</td><td>Stomach, heart, leaf, kidney</td></tr><tr><td>Organ system</td><td>Group of organs with a common function</td><td>Digestive, circulatory, nervous, respiratory system</td></tr><tr><td>Organism</td><td>All organ systems working together</td><td>Human, oak tree</td></tr></table></div><ul><li>Example chain: muscle cell → muscle tissue → stomach (also contains glandular and epithelial tissue) → digestive system → human.</li><li>A single-celled organism (<i>Amoeba</i>, bacterium) is a cell and an organism at the same time. A multicellular organism needs specialised cells because different cells do different jobs efficiently.</li><li><b>Cell division:</b> new cells are made only by division of existing cells (mitosis, see Topic 17), which is how multicellular organisms grow and repair tissues.</li></ul><span class="tag">Topic 2.2</span><h3>Size of specimens</h3>
<ul><li><b>Magnification = image size ÷ actual size.</b> Rearrange: actual size = image size ÷ magnification; image size = actual size × magnification.</li><li>Measure drawings or photographs in <b>millimetres</b> with a ruler.</li><li><b>Worked example:</b> a cell image is 36 mm long. The actual cell is 0.12 mm. Magnification = 36 ÷ 0.12 = ×300.</li><li><span class="xt">EXT</span><b>Unit conversion:</b> 1 mm = 1000 µm. Multiply mm by 1000 for µm; divide µm by 1000 for mm. Example: 0.045 mm = 45 µm.</li></ul><p>p <b>Exam tip:</b> convert all measurements to the same unit before dividing, and give the answer with × in front.</p><h3>Step-by-step calculation</h3><ul><li>Step 1: measure the image (the drawing or photograph) in mm with a ruler. Step 2: take the actual size (often given on a scale bar or in the question). Step 3: use the formula and give the answer as ×number.</li><li><b>Scale bar method:</b> if the scale bar is 20 mm long and represents 0.1 mm, the magnification is 20 ÷ 0.1 = ×200.</li><li><b>Worked example 1:</b> a drawing of a leaf is 85 mm long. The leaf is 17 mm long. Magnification = 85 ÷ 17 = ×5.</li><li><b>Worked example 2:</b> a photo of a cell is ×400 and the image is 30 mm. Actual size = 30 ÷ 400 = 0.075 mm.</li><li><b>Worked example 3:</b> an actual cell is 0.02 mm and the magnification is ×500. Image size = 0.02 × 500 = 10 mm.</li><li>A magnification of ×1 means the same size as real; below ×1 means smaller (e.g. ×0.5 means the image is half the size).</li><li><span class="xt">EXT</span><b>Unit conversions.</b> mm → µm: multiply by 1000. µm → mm: divide by 1000. Example: image 24 mm, actual 80 µm. Convert 24 mm to 24 000 µm; magnification = 24 000 ÷ 80 = ×300. Or convert 80 µm to 0.08 mm: 24 ÷ 0.08 = ×300.</li><li><span class="xt">EXT</span>Typical sizes: animal cell about 20–30 µm; plant cell about 40–100 µm; bacterium 1–5 µm; red blood cell about 7 µm; a virus about 0.1 µm.</li></ul><h3>Common exam mistakes</h3><ul><li>Using different units for the image and the object before dividing.</li><li>Giving an answer with no ×, or writing the formula the wrong way round (always image ÷ actual; use the “I A M” triangle: Image on top, Actual and Magnification below).</li></ul>`,kw:[["Cell membrane", "Controls the movement of substances into and out of the cell."], ["Nucleus", "Contains DNA and controls the activities of the cell."], ["Cytoplasm", "Jelly-like material where chemical reactions occur."], ["Mitochondria", "Site of aerobic respiration."], ["Ribosomes", "Site of protein synthesis."], ["Chloroplast", "Contains chlorophyll; site of photosynthesis."], ["Cell wall", "Rigid layer giving support; cellulose in plants."], ["Vacuole", "Sac of cell sap in plant cells."], ["Plasmid", "Small circular loop of DNA in bacteria."], ["Tissue", "Group of similar cells with the same function."], ["Organ system", "Group of organs working together for a common function."], ["Magnification", "Image size divided by actual size."]],f:["magnification = image size ÷ actual size", "1 mm = 1000 µm"],qa:[["Name two structures in plant cells but not animal cells.", "Cell wall and chloroplasts (also a large permanent vacuole)."], ["Image 45 mm, actual 0.15 mm. Calculate magnification.", "45 ÷ 0.15 = ×300."], ["(Extended) Convert 0.06 mm to µm.", "60 µm."]],mcq:[["Which makes protein?", ["Ribosome", "Mitochondrion", "Vacuole"], 0, "Ribosomes."], ["Bacteria lack…", ["a cell wall", "a nucleus", "ribosomes"], 1, "DNA is circular, free in cytoplasm."], ["A group of similar cells is a…", ["tissue", "organ", "system"], 0, "Tissue."]]},
{t:"Topic 3: Movement into and out of cells (Cambridge 0610)",notes:`
<span class="tag">Topic 3.1</span><h3>Diffusion</h3>
<p class="lg"><b>Key:</b> <span class="xt">EXT</span> = Extended (Supplement) only. No tag = Core (Extended students need it too).</p>
<ul><li><b>Diffusion</b> is the net movement of particles from a region of their <b>higher concentration</b> to a region of their <b>lower concentration</b> (down a concentration gradient) as a result of their <b>random movement</b>.</li><li>The energy for diffusion comes from the <b>kinetic energy</b> of the random movement of molecules and ions. No energy from respiration is needed.</li><li>Some substances move into and out of cells by diffusion through the cell membrane (e.g. oxygen into cells, carbon dioxide out).</li><li><b>Importance:</b> gas exchange (oxygen and carbon dioxide in lungs, leaves), and solutes such as digested food molecules moving from intestine into the blood.</li></ul><h3>Factors affecting the rate of diffusion</h3><ul><li><b>Surface area</b>: larger surface area, faster diffusion.</li><li><b>Temperature</b>: higher temperature gives more kinetic energy, faster diffusion.</li><li><b>Concentration gradient</b>: steeper gradient, faster diffusion.</li><li><b>Distance</b>: shorter diffusion distance, faster diffusion.</li></ul><p>p <b>Practical:</b> investigate with agar cubes containing indicator placed in acid, or with different sized agar blocks; time how long the colour change takes.</p>
<h3>Understanding diffusion</h3><ul><li>Particles of a gas, liquid or dissolved substance are always moving randomly. In a region where there are many particles, more collide and spread out into a region with fewer particles. Eventually they are evenly spread (equilibrium), although they keep moving.</li><li><b>Examples in organisms:</b> oxygen diffuses from the alveoli into the blood and carbon dioxide diffuses the other way; carbon dioxide diffuses into leaves through stomata for photosynthesis; digested nutrients diffuse from the small intestine into the blood; urea diffuses from cells into the blood.</li><li>Diffusion happens in gases and liquids but is fastest in gases. It works over short distances only, which is why large organisms need transport systems.</li></ul><h3>Why each factor matters</h3><ul><li><b>Surface area:</b> more membrane surface means more particles cross per second (that is why alveoli, villi and root hairs are folded or extended).</li><li><b>Temperature:</b> particles have more kinetic energy, move faster and collide more.</li><li><b>Concentration gradient:</b> a bigger difference between the two sides means a faster net movement (blood flow keeps the gradient steep in the lungs).</li><li><b>Distance:</b> thin membranes mean a short distance (alveolus walls are one cell thick).</li></ul><h3>Practical investigation</h3><ul><li>Method: cut agar jelly containing alkali and indicator into cubes of different sizes. Place in dilute acid. Time how long each takes to go colourless. Smaller cubes with a larger surface area to volume ratio change faster.</li><li>Variables: independent = cube size (or temperature); dependent = time to decolourise; control = same acid volume, same temperature, same agar.</li></ul><h3>Common exam mistakes</h3><ul><li>Saying particles “want” to move to areas of low concentration. It is a result of random movement.</li><li>Forgetting “net”: particles move both ways, but more move down the gradient.</li></ul><span class="tag">Topic 3.2</span><h3>Osmosis</h3>
<ul><li>Water is a <b>solvent</b> in organisms: it dissolves substances for digestion (enzymes act in solution), excretion (urea dissolved in urine) and transport (blood plasma carries dissolved substances).</li><li>Water diffuses through <b>partially permeable membranes</b> by <b>osmosis</b>, and moves into and out of cells by osmosis through the cell membrane.</li><li>Plants are supported by the <b>pressure of water inside the cells pressing outwards on the cell wall</b>. Lack of water makes plants wilt.</li><li><b>Practicals:</b> dialysis (Visking) tubing with sugar solution in water; potato cylinders in different sucrose concentrations, measuring percentage change in mass (use the same size/surface, blot dry, controls).</li><li><span class="xt">EXT</span><b>Osmosis</b> is the net movement of water molecules from a region of <b>higher water potential</b> (dilute solution) to a region of <b>lower water potential</b> (concentrated solution) through a partially permeable membrane.</li></ul><div class="wrap"><table><tr><th>Solution outside</th><th>Plant cell</th><th>Animal cell (e.g. red blood cell)</th></tr><tr><td>Dilute (higher water potential)</td><td>Water enters: becomes <b>turgid</b>, <b>turgor pressure</b> against cell wall</td><td>Takes in water and may burst</td></tr><tr><td>Concentrated (lower water potential)</td><td>Water leaves: <b>flaccid</b>, then <b>plasmolysis</b> (membrane pulls away from wall)</td><td>Loses water and shrinks (crenates)</td></tr></table></div><ul><li><span class="xt">EXT</span>Importance of water potential and osmosis: uptake of water by root hair cells; loss of water; keeping plant tissues rigid; controlling water content of animal cells.</li></ul>
<h3>Osmosis in detail</h3><ul><li>A partially permeable membrane lets small molecules like water pass but blocks larger solute molecules (sugar). The cell membrane acts like this.</li><li>Water moves from the dilute solution (more water molecules, higher water potential) to the concentrated solution (fewer free water molecules, lower water potential).</li><li>Water as a solvent: in digestion, enzymes and food are dissolved in water; in excretion, urea is dissolved in water as urine; in transport, blood plasma carries dissolved glucose, ions, hormones and carbon dioxide.</li></ul><h3>Practical: potato cylinders</h3><ul><li>Cut cylinders of the same length and mass from one potato using a cork borer. Put one in each of several sucrose concentrations (including distilled water). Leave for the same time, blot dry, reweigh and calculate <b>percentage change in mass</b> = (final − initial) ÷ initial × 100.</li><li>Plot concentration (x) against % change (y). Where the line crosses 0 % is the concentration inside the potato cells (no net osmosis).</li><li>Results: in dilute solutions the potato gains mass and becomes firm; in concentrated solutions it loses mass and becomes soft.</li></ul><h3>Practical: dialysis tubing</h3><ul><li>Tie a piece of Visking tubing, fill with concentrated sucrose solution, place in a beaker of water. The tubing swells and gains mass as water enters. Starch and sugar do not leave unless the pores allow (glucose can, starch cannot).</li><li><span class="xt">EXT</span><b>Plant cells in different solutions (explain):</b> in pure water, water enters the vacuole, the cytoplasm pushes on the wall, the cell is <b>turgid</b> and <b>turgor pressure</b> keeps stems and leaves upright. In a concentrated solution water leaves, the vacuole shrinks, the cell is <b>flaccid</b> and the plant wilts. If water loss continues, the membrane tears away from the cell wall: <b>plasmolysis</b>.</li><li><span class="xt">EXT</span><b>Animal cells</b> have no wall. Red blood cells in water swell and burst (lysis); in concentrated solution they shrivel. Tissue fluid and blood plasma are kept at a constant water potential to prevent damage.</li><li><span class="xt">EXT</span><b>Importance of water potential:</b> controls uptake of water by root hair cells (soil water has higher water potential than root cell sap), loss of water from cells, support from turgidity, and the opening of stomata by guard cells.</li></ul><h3>Common exam mistakes</h3><ul><li>Saying osmosis is the movement of water “from a high concentration to a low concentration” without saying it is through a partially permeable membrane.</li><li>Saying plant cells burst. They do not because the cell wall resists. Animal cells burst.</li></ul><span class="tag">Topic 3.3</span><h3>Active transport</h3>
<ul><li><b>Active transport</b> is the movement of particles through a cell membrane from a region of <b>lower concentration to a region of higher concentration</b> (against a concentration gradient) using <b>energy from respiration</b>.</li><li><span class="xt">EXT</span>Importance: moving molecules or ions across membranes against the gradient, e.g. <b>ion uptake by root hair cells</b> from soil with low mineral concentration, and glucose uptake in the gut and kidney.</li><li><span class="xt">EXT</span><b>Protein carriers</b> in the membrane pick up the molecule or ion and move it across. Cells that do a lot of active transport have many mitochondria.</li></ul><div class="wrap"><table><tr><th>Feature</th><th>Diffusion</th><th>Osmosis</th><th>Active transport</th></tr><tr><td>Direction</td><td>High → low</td><td>High → low water potential</td><td>Low → high</td></tr><tr><td>Energy from respiration</td><td>No</td><td>No</td><td>Yes</td></tr><tr><td>Particles</td><td>Any</td><td>Water only</td><td>Ions, molecules</td></tr><tr><td>Protein carriers</td><td>No</td><td>No</td><td>Yes (extended)</td></tr></table></div><h3>Understanding active transport</h3><ul><li>Diffusion would move substances the wrong way when the cell needs to accumulate them. Active transport works against the gradient and so needs energy (ATP from respiration).</li><li>It happens only in living cells. If cells are poisoned with cyanide or deprived of oxygen (so respiration stops), active transport stops.</li><li><b>Examples:</b> root hair cells take up nitrate and other mineral ions from soil water where their concentration is lower than in the cell; cells in the small intestine absorb glucose when the gut concentration is lower than the blood; kidney tubules reabsorb glucose.</li><li><span class="xt">EXT</span><b>How carriers work:</b> a specific protein carrier in the membrane binds the ion or molecule on one side, changes shape using energy and releases it on the other side. Because carriers are specific and limited in number, the rate depends on the number of carriers and the energy supply.</li><li><span class="xt">EXT</span>Cells carrying out lots of active transport (root hair cells, cells of the intestine lining, kidney tubule cells) have many mitochondria.</li></ul><h3>Comparing the three processes</h3><ul><li>Diffusion and osmosis are <b>passive</b> (no energy from respiration); active transport is <b>active</b>.</li><li>The first two follow the gradient; the third goes against it.</li></ul><h3>Common exam mistakes</h3><ul><li>Writing “active transport uses energy” without saying “from respiration”.</li><li>Saying active transport moves substances “from low to high” without saying “concentration” or “against a concentration gradient”.</li></ul><div style="border:1.5px dashed var(--pr);border-radius:14px;padding:12px;margin:12px 0"><b>🧪 Simulation: potato in sucrose</b><br>Concentration <b id="ov">0.0</b> M <input type="range" min="0" max="1" step="0.1" value="0" style="width:100%" oninput="bioOsm(this.value)"><div id="oo">Water enters; cells turgid; mass +18%.</div></div>`,kw:[["Diffusion", "Net movement of particles from higher to lower concentration, down a concentration gradient."], ["Concentration gradient", "Difference in concentration between two regions."], ["Osmosis", "Net movement of water molecules through a partially permeable membrane."], ["Partially permeable membrane", "Membrane allowing some substances through but not others."], ["Water potential", "Measure of the tendency of water to move; dilute solutions have higher water potential."], ["Turgid", "Plant cell full of water, firm."], ["Turgor pressure", "Pressure of the cell contents pushing on the cell wall."], ["Flaccid", "Plant cell that has lost water and is soft."], ["Plasmolysis", "Cell membrane pulls away from the cell wall after water loss."], ["Active transport", "Movement of particles against a concentration gradient using energy from respiration."], ["Solvent", "Substance in which other substances dissolve, e.g. water."]],f:["Osmosis: high → low water potential", "Active transport: low → high concentration, needs respiration energy"],qa:[["Define diffusion.", "Net movement of particles down a concentration gradient due to random movement."], ["Why does a potato chip gain mass in distilled water?", "Water enters by osmosis."], ["(Extended) Describe plasmolysis.", "Water leaves by osmosis; the membrane pulls away from the cell wall."], ["(Extended) Why do root hair cells contain many mitochondria?", "They release energy from respiration for active transport."]],mcq:[["Which process needs energy from respiration?", ["Diffusion", "Osmosis", "Active transport"], 2, "Against the gradient."], ["A cell in concentrated solution becomes…", ["turgid", "flaccid", "larger"], 1, "Water leaves."], ["Which factor does NOT speed up diffusion?", ["higher temperature", "longer distance", "steeper gradient"], 1, "Longer distance slows it."]]},
{t:"Topic 4: Biological molecules (Cambridge 0610)",notes:`
<span class="tag">Topic 4.1</span><h3>Biological molecules</h3>
<p class="lg"><b>Key:</b> <span class="xt">EXT</span> = Extended (Supplement) only. No tag = Core (Extended students need it too).</p>
<h3>Elements and building blocks</h3><div class="wrap"><table><tr><th>Molecule</th><th>Elements</th><th>Made from</th><th>Examples</th></tr><tr><td>Carbohydrates</td><td>C, H, O</td><td>Glucose (sugars)</td><td>Starch, glycogen, cellulose</td></tr><tr><td>Fats and oils</td><td>C, H, O</td><td>3 fatty acids + 1 glycerol</td><td>Triglycerides</td></tr><tr><td>Proteins</td><td>C, H, O, N (sometimes S)</td><td>Amino acids</td><td>Enzymes, haemoglobin</td></tr></table></div><ul><li><b>Large molecules are made from smaller molecules:</b> starch, glycogen and cellulose are made from <b>glucose</b>; proteins from <b>amino acids</b>; fats and oils from <b>fatty acids and glycerol</b>.</li></ul><h3>Food tests</h3><div class="wrap"><table><tr><th>Test</th><th>Reagent and method</th><th>Positive result</th></tr><tr><td>Starch</td><td>Add iodine solution</td><td>Yellow-brown → blue-black</td></tr><tr><td>Reducing sugar</td><td>Add Benedict’s solution and heat in a water bath</td><td>Blue → green → yellow → orange → brick-red</td></tr><tr><td>Protein</td><td>Add biuret reagent</td><td>Blue → purple (pale lilac)</td></tr><tr><td>Fat / oil</td><td>Dissolve in ethanol, add water (emulsion test)</td><td>Cloudy white emulsion</td></tr><tr><td>Vitamin C</td><td>Add drops of food to DCPIP</td><td>Blue DCPIP decolourised (becomes colourless)</td></tr></table></div><p>p <b>Exam tip:</b> a negative Benedict’s test stays blue; a negative iodine test stays brown. Sucrose is not a reducing sugar.</p><ul><li><span class="xt">EXT</span><b>DNA structure:</b> two strands coiled together forming a <b>double helix</b>. Each strand contains chemicals called <b>bases</b>. <b>Bonds between pairs of bases</b> hold the strands together. Bases always pair the same way: <b>A with T, and C with G</b> (full names not required).</li></ul><h3>Carbohydrates</h3><ul><li>Made of C, H and O. <b>Simple sugars</b> (glucose) are small and soluble. <b>Starch</b> is the plant energy store, <b>glycogen</b> is the animal energy store (liver, muscle) and <b>cellulose</b> forms the cell wall: all three are made of many glucose molecules joined together. Starch is insoluble so it does not affect water potential in cells.</li><li>Sources: bread, rice, potatoes, pasta (starch); fruit (sugars). Function: main source of energy.</li></ul><h3>Fats and oils</h3><ul><li>Made of C, H and O (less oxygen than carbohydrates, so they store more energy per gram). One glycerol joins three fatty acids. Used for energy storage, insulation under the skin, protection of organs and as part of membranes.</li></ul><h3>Proteins</h3><ul><li>Made of C, H, O, N and sometimes S. Chains of <b>amino acids</b> folded into specific shapes. There are about 20 different amino acids; the order of amino acids decides the shape and job of the protein.</li><li>Functions: growth and repair, enzymes, antibodies, haemoglobin, hormones, muscle. Sources: meat, fish, eggs, beans.</li></ul><h3>Water</h3><ul><li>Makes up about 70 % of the body. It is the solvent in cells and for transport, takes part in reactions and helps to regulate temperature.</li></ul><h3>Food tests: method in steps</h3><ul><li><b>Iodine (starch):</b> add a few drops of iodine solution to the food; blue-black means starch.</li><li><b>Benedict’s (reducing sugar):</b> add Benedict’s solution to the food solution, heat in a water bath at about 80 °C for a few minutes. Colour goes green, yellow, orange then brick-red as the amount of sugar increases. Used to estimate the amount of sugar (semi-quantitative).</li><li><b>Biuret (protein):</b> add biuret reagent (or sodium hydroxide then copper sulfate). Purple means protein. No heating is needed.</li><li><b>Ethanol emulsion (fat):</b> crush food, shake with ethanol, filter and pour the liquid into water. A cloudy white layer shows fat/oil.</li><li><b>DCPIP (vitamin C):</b> add the food juice drop by drop to blue DCPIP; the more drops needed to turn it colourless, the less vitamin C. Compare juices with the same v
