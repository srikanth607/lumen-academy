<div class="wrap"><table><tr><th>Shape</th><th>Key properties</th></tr>
<tr><td>Square</td><td>4 equal sides, 4 right angles, diagonals equal and bisect each other at 90°</td></tr>
<tr><td>Rectangle</td><td>Opposite sides equal and parallel, 4 right angles, diagonals equal</td></tr>
<tr><td>Parallelogram</td><td>Opposite sides equal and parallel, opposite angles equal, diagonals bisect each other</td></tr>
<tr><td>Rhombus</td><td>4 equal sides, opposite angles equal, diagonals bisect each other at 90°</td></tr>
<tr><td>Kite</td><td>2 pairs of equal adjacent sides, one pair of equal angles, diagonals cross at 90°</td></tr>
<tr><td>Trapezium</td><td>One pair of parallel sides (isosceles trapezium: the other two sides are equal)</td></tr></table></div>
<h4>Polygons and solids ${C}</h4>
<ul><li>A <b>polygon</b> is a closed shape with straight sides. Regular = all sides and angles equal. Names: pentagon 5, hexagon 6, heptagon 7, octagon 8, nonagon 9, decagon 10 sides.</li>
<li><b>Solids:</b> cube, cuboid, prism (uniform cross-section), cylinder, pyramid, cone, sphere. A <b>face</b> is a flat surface, an <b>edge</b> is where two faces meet, a <b>vertex</b> is where edges meet.</li></ul>
<div class="wrap"><table><tr><th>Solid</th><th>Faces</th><th>Edges</th><th>Vertices</th></tr><tr><td>Cube or cuboid</td><td>6</td><td>12</td><td>8</td></tr><tr><td>Triangular prism</td><td>5</td><td>9</td><td>6</td></tr><tr><td>Square-based pyramid</td><td>5</td><td>8</td><td>5</td></tr></table></div>
<h4>Circle vocabulary ${C}</h4>
<p><b>Centre, radius</b> (plural radii), <b>diameter</b> (through the centre, twice the radius), <b>circumference</b> (the distance round), <b>semicircle</b> (half), <b>chord</b> (line joining two points on the circle), <b>tangent</b> (touches at one point), <b>arc</b> (part of the circumference), <b>sector</b> (slice between two radii), <b>segment</b> (region between a chord and an arc).</p>
${fg(3,"Parts of a circle: radius, diameter, chord, tangent, arc, sector and segment")}
<h4>Extra terms ${E}</h4>
<ul><li><b>Plane</b> (a flat surface extending forever), <b>perpendicular bisector</b> (cuts a line in half at 90°), <b>hemisphere</b> (half a sphere), <b>frustum</b> (a cone or pyramid with the top cut off parallel to the base), and <b>major arc</b> and <b>minor arc</b> (the longer and the shorter arc cut off by a chord).</li></ul>
<p>⚠️ <b>Exam trap:</b> A square is also a rectangle and a rhombus, but you must give the <b>most specific</b> name the question asks for. And a rectangle is <b>not</b> a rhombus.</p>
<span class="tag">Topic 4.2</span><h3>Geometrical constructions (C4.2 and E4.2)</h3>
<p>${C} ${E} Same at both tiers.</p>
<ul><li><b>Measuring and drawing lines and angles:</b> use a sharp pencil and a ruler for every straight edge. Place the protractor's centre exactly on the vertex and its baseline along one arm. Read from the correct scale (start from 0 on the arm you use). Accept about ±1° and ±1 mm.</li>
<li><b>Construct a triangle from its three sides</b> (ruler and compasses only): (1) draw the longest side as the base; (2) set the compasses to the second length, centre on one end, draw an arc; (3) set to the third length, centre on the other end, draw a crossing arc; (4) join the crossing point to both ends. <b>Leave all the construction arcs visible</b>: they earn the marks.</li>
<li><b>Constructing a rhombus:</b> draw two identical triangles that share a base (a rhombus is two equal isosceles triangles back to back).</li></ul>
<p>📝 <b>Example:</b> Construct triangle ABC with AB = 6 cm, BC = 5 cm, AC = 4 cm. Draw AB = 6. Arc of radius 4 from A, arc of radius 5 from B. They cross at C. Check by measuring.</p>
<p><b>Not required (either tier):</b> constructing perpendicular bisectors and angle bisectors with compasses. Do not spend revision time on them for this syllabus.</p>
<h4>Nets ${C}</h4>
<p>A <b>net</b> is a 2D pattern that folds into a 3D solid. Know nets of cubes, cuboids, prisms and pyramids, and how to draw and interpret them (a cube net has 6 squares in a connected pattern, and there are 11 different ones). You may be asked to use measurements from a net to find a surface area or volume.</p>
${fg(10,"A net of a cube: six equal squares that fold into a cube")}
<p>📝 <b>Example:</b> A cuboid is 3 cm by 4 cm by 5 cm. Its net has six rectangles: 2(3×4) + 2(3×5) + 2(4×5) = 24 + 30 + 40 = <b>94 cm²</b> of surface. Its volume is 3 × 4 × 5 = 60 cm³.</p>
<span class="tag">Topic 4.3</span><h3>Scale drawings and bearings (C4.3 and E4.3)</h3>
<h4>Scale drawings ${C}</h4>
<ul><li>A scale such as <b>1 : 50 000</b> means 1 cm on the drawing is 50 000 cm = 500 m in real life. Convert units carefully: 100 cm = 1 m, 100 000 cm = 1 km.</li>
<li>To use a scale drawing: measure with a ruler, multiply by the scale to get the real length; to draw, divide the real length by the scale.</li></ul>
<p>📝 <b>Example:</b> On a map with scale 1 : 25 000, two villages are 6.4 cm apart. Real distance = 6.4 × 25 000 = 160 000 cm = <b>1.6 km</b>.</p>
<h4>Three-figure bearings ${C}</h4>
<ul><li>A <b>bearing</b> is an angle measured <b>clockwise from north</b>, always written with <b>three figures</b>: 000° to 360°. 25° is written 025°.</li>
<li>Due north 000°, east 090°, south 180°, west 270°. North-east is 045°.</li>
<li>"The bearing of B <b>from</b> A" means stand at A, face north, then turn clockwise to face B.</li>
<li><b>Back bearing:</b> if the bearing of B from A is b, the bearing of A from B is b + 180° (if b is less than 180°) or b − 180° (if b is 180° or more). This works because the north lines at A and B are parallel and co-interior angles add to 180°.</li></ul>
${fg(4,"Bearing of B from A is 065°; the bearing of A from B is 245°")}
<p>📝 <b>Example (syllabus type):</b> The bearing of B from A is 025°. The bearing of A from B is 025° + 180° = <b>205°</b>.</p>
<p>📝 <b>Example:</b> A ship sails 8 km on a bearing of 090°, then 6 km on 180°. It has gone east then south, so it is √(8² + 6²) = 10 km from the start. (Bearings and trigonometry are combined in Topic 6.)</p>
${sim(sl("m3b","bearing of B from A",0,355,65,5,"c4b"),"c4bg","c4bo","c4b")}
<p>⚠️ <b>Exam trap:</b> Measuring anticlockwise, or measuring from the wrong point. For "bearing of A from B", draw the north line at B.</p>
<span class="tag">Topic 4.4</span><h3>Similarity (C4.4 and E4.4)</h3>
<h4>Similar shapes: lengths ${C}</h4>
<p>Shapes are <b>similar</b> if all corresponding angles are equal and all corresponding sides are in the same ratio. That ratio is the <b>scale factor</b> k. <b>k = new length ÷ old length</b>. Every length in the shape is multiplied by k, including perimeters.</p>
<p>📝 <b>Example:</b> Two similar triangles: the small one has sides 3, 4, 5. The larger has a shortest side of 9. k = 9 ÷ 3 = 3, so the other sides are 12 and 15.</p>
<p>📝 <b>Example:</b> A photo 10 cm by 15 cm is enlarged so that the long side is 24 cm. k = 24 ÷ 15 = 1.6, so the short side is 10 × 1.6 = 16 cm.</p>
${fg(5,"Two similar triangles with scale factor 2: lengths ×2, area ×4")}
<h4>Areas and volumes ${E}</h4>
<ul><li><b>Length</b> scale factor k. <b>Area</b> (and surface area) scale factor <b>k²</b>. <b>Volume</b> scale factor <b>k³</b>.</li>
<li>Going the other way: if the area ratio is A₁ : A₂, the length ratio is √A₁ : √A₂; if the volume ratio is V₁ : V₂, the length ratio is ∛V₁ : ∛V₂.</li></ul>
<p>📝 <b>Example:</b> Two similar vases have heights 10 cm and 15 cm (k = 1.5). Surface area ratio = 1.5² = 2.25; volume ratio = 1.5³ = 3.375. If the small vase holds 400 ml, the large holds 400 × 3.375 = <b>1350 ml</b>.</p>
<p>📝 <b>Example:</b> Similar solids have volumes 8 cm³ and 27 cm³. Length ratio = ∛8 : ∛27 = 2 : 3, so the surface area ratio is 4 : 9.</p>
<p>📝 <b>Example:</b> Similar shapes with areas 12 cm² and 75 cm²: length ratio = √12 : √75 = 2 : 5 (since √12 = 2√3 and √75 = 5√3).</p>
<h4>Proving triangles are similar ${E}</h4>
<p>Show that <b>two angles</b> are equal (the third must then be equal too), giving a reason for each: <i>vertically opposite angles</i>, <i>corresponding angles</i> or <i>alternate angles in parallel lines</i>, a <i>common angle</i>. Then state "the triangles are similar" and use the ratio of corresponding sides.</p>
<p>📝 <b>Example:</b> In triangle ABC, D is on AB and E is on AC with DE parallel to BC. AD = 4, DB = 2, DE = 6. Angle A is common; angle ADE = angle ABC (corresponding angles). So triangles ADE and ABC are similar, with k = AB ÷ AD = 6 ÷ 4 = 1.5. BC = 6 × 1.5 = <b>9</b>.</p>
${sim(sl("m4k","scale factor k",0.5,4,2,0.5,"c4s"),"c4sg","c4so","c4s")}
<p>⚠️ <b>Exam trap:</b> Doubling the lengths does <b>not</b> double the area: it multiplies it by 4 (and the volume by 8). Match corresponding sides in the right order, small to small.</p>
<span class="tag">Topic 4.5</span><h3>Symmetry (C4.5 and E4.5)</h3>
<h4>Two-dimensional symmetry ${C}</h4>
<ul><li><b>Line symmetry:</b> a mirror line splits the shape into two reflections of each other. Count the mirror lines.</li>
<li><b>Rotational symmetry:</b> the shape looks the same after a turn of less than 360° about its centre. The <b>order</b> is the number of times it fits in one full turn (a shape with no rotational symmetry has order 1).</li></ul>
<div class="wrap"><table><tr><th>Shape</th><th>Lines of symmetry</th><th>Order of rotation</th></tr>
<tr><td>Equilateral triangle</td><td>3</td><td>3</td></tr><tr><td>Isosceles triangle</td><td>1</td><td>1</td></tr><tr><td>Scalene triangle</td><td>0</td><td>1</td></tr>
<tr><td>Square</td><td>4</td><td>4</td></tr><tr><td>Rectangle</td><td>2</td><td>2</td></tr><tr><td>Parallelogram</td><td>0</td><td>2</td></tr><tr><td>Rhombus</td><td>2</td><td>2</td></tr><tr><td>Kite</td><td>1</td><td>1</td></tr><tr><td>Isosceles trapezium</td><td>1</td><td>1</td></tr><tr><td>Regular n-sided polygon</td><td>n</td><td>n</td></tr></table></div>
<p>Symmetry explains properties: a kite's diagonal is a mirror line, so the angles it splits are equal; the order of rotation of a parallelogram (2) shows that opposite sides and angles are equal.</p>
<h4>Symmetry of solids ${E}</h4>
<ul><li>A <b>plane of symmetry</b> cuts a solid into two mirror-image halves. An <b>axis of symmetry</b> is a line about which the solid can be rotated to look the same.</li>
<li><b>Cuboid</b> (with no square faces): 3 planes, 3 axes (each of order 2). <b>Cube:</b> 9 planes, 13 axes. <b>Square-based pyramid:</b> 4 planes, 1 axis (order 4). <b>Cylinder:</b> an infinite number of planes through its axis plus 1 plane halfway along it. <b>Cone:</b> infinitely many planes through its axis; 1 axis of symmetry. <b>Equilateral triangular prism:</b> 4 planes.</li></ul>
<span class="tag">Topic 4.6</span><h3>Angles (C4.6 and E4.6)</h3>
<h4>Basic angle facts ${C}</h4>
<p>In exams you must give the <b>correct geometrical reason</b> in words.</p>
<ul><li>Angles on a straight line add up to 180°.</li><li>Angles at a point add up to 360°.</li><li>Vertically opposite angles are equal.</li><li>Angles in a triangle add up to 180°; angles in a quadrilateral add up to 360°.</li><li>Base angles of an isosceles triangle are equal.</li><li>An exterior angle of a triangle equals the sum of the two opposite interior angles.</li></ul>
<h4>Parallel lines ${C}</h4>
<ul><li><b>Corresponding</b> angles are equal (F shape).</li><li><b>Alternate</b> angles are equal (Z shape).</li><li><b>Co-interior</b> angles add up to 180° (C or U shape), also called supplementary.</li></ul>
${fg(1,"Parallel lines cut by a transversal: green angles all equal 61°, amber angles all equal 119°")}
${sim(sl("m6t","angle of the transversal",30,150,60,5,"c4a"),"c4ag","c4ao","c4a")}
<h4>Polygons ${C}</h4>
<ul><li>Sum of interior angles of an n-sided polygon = <b>(n − 2) × 180°</b> (split into n − 2 triangles).</li><li>Sum of exterior angles of any polygon = <b>360°</b>.</li><li>For a <b>regular</b> polygon: exterior angle = <b>360° ÷ n</b>; interior angle = 180° − exterior angle.</li></ul>
${fg(2,"Regular pentagon: exterior angle 72°, interior angle 108° (they add to 180°)")}
<p>📝 <b>Example:</b> Each interior angle of a regular polygon is 150°. Exterior = 30°, so n = 360 ÷ 30 = <b>12</b> sides.</p>
<p>📝 <b>Example:</b> Interior angle sum of a hexagon = (6 − 2) × 180 = 720°. Regular: each = 120°.</p>
<h4>Irregular polygons ${E}</h4>
<p>Use the same sum formulas with unknown angles. 📝 <b>Example:</b> A pentagon has angles 100°, 110°, 120°, x and x. Sum = 540°, so 330 + 2x = 540 and <b>x = 105°</b>. 📝 <b>Example:</b> Exterior angles of a polygon: 40°, 50°, 60°, 70°, 80° and one more. They total 300°, so the last is 60°.</p>
${sim(sl("m6n","number of sides n",3,12,5,1,"c4p"),"c4pg","c4po","c4p")}
<p>⚠️ <b>Exam trap:</b> Writing only "Z angles" or "F angles" gets no reason mark: say <i>alternate angles</i> or <i>corresponding angles</i>, and "parallel lines". Never measure an angle on a diagram marked "not drawn accurately".</p>
<span class="tag">Topic 4.7</span><h3>Circle theorems I (C4.7 and E4.7)</h3>
<h4>Two theorems for Core and Extended ${C}</h4>
<ul><li><b>Angle in a semicircle = 90°.</b> If AB is a diameter and C is on the circumference, angle ACB = 90°.</li>
<li><b>Angle between a tangent and a radius = 90°.</b> The radius to the point of contact is perpendicular to the tangent.</li></ul>
${fg(6,"Left: angle in a semicircle is 90°. Right: tangent and radius meet at 90°")}
<p>📝 <b>Example:</b> AB is a diameter and C is on the circle with angle BAC = 35°. Angle ACB = 90° (angle in a semicircle), so angle ABC = 180 − 90 − 35 = <b>55°</b>.</p>
<p>📝 <b>Example:</b> PT is a tangent at T to a circle with centre O. Angle TOP = 50°. Angle OTP = 90° (tangent and radius), so angle TPO = 180 − 90 − 50 = <b>40°</b>.</p>
<h4>Four more theorems ${E}</h4>
<ul><li><b>Angle at the centre is twice the angle at the circumference</b> (when both stand on the same arc).</li>
<li><b>Angles in the same segment are equal</b>.</li>
<li><b>Opposite angles of a cyclic quadrilateral add up to 180°</b> (all four vertices on the circle; supplementary).</li>
<li><b>Alternate segment theorem:</b> the angle between a tangent and a chord equals the angle in the alternate segment (the segment on the other side of the chord).</li></ul>
${fg(7,"Left: angle at the centre 2x, at the circumference x. Right: opposite angles of a cyclic quadrilateral a and 180° − a")}
${fg(9,"Alternate segment theorem: the angle between tangent and chord equals the angle x in the alternate segment")}
<p>📝 <b>Example:</b> The angle at the centre is 140°, so the angle at the circumference on the same arc is <b>70°</b>.</p>
<p>📝 <b>Example:</b> In cyclic quadrilateral ABCD, angle ABC = 105°, so angle ADC = 180 − 105 = <b>75°</b> (opposite angles in a cyclic quadrilateral).</p>
<p>📝 <b>Example:</b> A tangent meets a chord making an angle of 48°. The angle in the alternate segment is also 48°.</p>
${sim(sl("m7a","angle at the centre (AOB)",40,180,100,10,"c4c")+sl("m7p","position of C on the circle",5,175,90,5,"c4c"),"c4cg","c4co","c4c")}
<p>⚠️ <b>Exam trap:</b> Write the full reason. "Angle at the centre is twice the angle at the circumference", not "circle theorem". The theorem only works if both angles are on the <b>same arc</b>. A cyclic quadrilateral needs all 4 vertices on the circle.</p>
<span class="tag">Topic 4.8</span><h3>Circle theorems II (E4.8, Extended only)</h3>
<p>${E} <b>This subtopic is not in the Core syllabus.</b> These are symmetry properties of circles.</p>
<ul><li><b>Equal chords are equidistant from the centre</b> (and chords that are the same distance from the centre are equal).</li>
<li><b>The perpendicular bisector of a chord passes through the centre.</b> So a line from the centre perpendicular to a chord bisects the chord. (This makes the right-angled triangles you use with Pythagoras.)</li>
<li><b>Tangents from an external point are equal in length.</b> If PA and PB touch a circle at A and B, then PA = PB, the line from P to the centre bisects angle APB, and triangle PAB is isosceles.</li></ul>
${fg(8,"Left: a perpendicular from the centre bisects a chord. Right: tangents PT₁ and PT₂ from P are equal")}
<p>📝 <b>Example:</b> A circle has radius 13 cm. A chord is 5 cm from the centre. Half the chord = √(13² − 5²) = √144 = 12, so the chord is <b>24 cm</b>.</p>
<p>📝 <b>Example:</b> P is 17 cm from the centre O of a circle of radius 8 cm. The tangent from P touches at T. Angle OTP = 90°, so PT = √(17² − 8²) = √225 = <b>15 cm</b>. The other tangent from P is also 15 cm.</p>
<p>📝 <b>Example:</b> Tangents from P touch the circle at A and B, and angle APB = 50°. PA = PB, so the base angles of triangle PAB are (180 − 50) ÷ 2 = <b>65°</b>.</p>

<h4>The metric units ${C}</h4>
<ul><li><b>Length:</b> mm, cm, m, km. 10 mm = 1 cm; 100 cm = 1 m; 1000 m = 1 km.</li>
<li><b>Area:</b> mm², cm², m², km². <b>Volume:</b> mm³, cm³, m³. <b>Capacity:</b> ml, l (litre). <b>Mass:</b> g, kg.</li>
<li><b>Area and volume conversions are the length conversion squared or cubed.</b> Since 1 m = 100 cm: 1 m² = 100² = <b>10 000 cm²</b> and 1 m³ = 100³ = <b>1 000 000 cm³</b>. Since 1 cm = 10 mm: 1 cm² = <b>100 mm²</b> and 1 cm³ = <b>1000 mm³</b>. 1 km² = 1 000 000 m².</li>
<li><b>Capacity:</b> 1 l = 1000 ml. 1 ml = 1 cm³, so <b>1 l = 1000 cm³</b>. 1 m³ = <b>1000 l</b>. 1 kg = 1000 g.</li></ul>
${fg(1,"A square metre is 100 cm × 100 cm = 10 000 cm²")}
<p>📝 <b>Example:</b> 3.5 m² = 3.5 × 10 000 = <b>35 000 cm²</b>. 7500 mm² = 7500 ÷ 100 = <b>75 cm²</b>.</p>
<p>📝 <b>Example:</b> 2400 cm³ = 2400 ÷ 1000 = <b>2.4 l</b>. A tank of 0.5 m³ holds <b>500 l</b>.</p>
<p>📝 <b>Example:</b> A cuboid is 20 cm by 30 cm by 50 cm. Volume = 30 000 cm³ = 30 l.</p>
${sim(sl("n1s","side of a cube (cm)",1,100,40,1,"c5d"),"c5dg","c5do","c5d")}
<p>⚠️ <b>Exam trap:</b> Converting cm² to m² by dividing by 100 (wrong) instead of 10 000. Convert all lengths to the <b>same unit before</b> you calculate.</p>
<span class="tag">Topic 5.2</span><h3>Area and perimeter (C5.2 and E5.2)</h3>
<p>${C} ${E} Same at both tiers. <b>Perimeter</b> is the distance round the outside (add all sides, units: cm, m). <b>Area</b> is the space inside (units: cm², m²).</p>
<p><b>Formulas:</b> only the area of a triangle is given in the exam. <b>Learn the others.</b></p>
<div class="wrap"><table><tr><th>Shape</th><th>Area</th><th>Given in exam?</th></tr>
<tr><td>Rectangle</td><td>A = l × w</td><td>No</td></tr><tr><td>Triangle</td><td>A = ½ × b × h</td><td><b>Yes</b></td></tr>
<tr><td>Parallelogram</td><td>A = b × h</td><td>No</td></tr><tr><td>Trapezium</td><td>A = ½(a + b)h</td><td>No</td></tr></table></div>
${fg(2,"Rectangle, triangle, parallelogram and trapezium with their perpendicular heights")}
<ul><li><b>h is always the perpendicular height</b> (at 90° to the base), not the slanting side. a and b are the two <b>parallel</b> sides of a trapezium.</li>
<li>Any side can be the base, as long as you use the matching perpendicular height.</li></ul>
<p>📝 <b>Example:</b> Trapezium with parallel sides 6 cm and 10 cm and height 4 cm: A = ½(6 + 10) × 4 = <b>32 cm²</b>.</p>
<p>📝 <b>Example:</b> Parallelogram with base 9 cm, slant side 6 cm, perpendicular height 5 cm: A = 9 × 5 = <b>45 cm²</b> (the slant side is not used).</p>
<p>📝 <b>Example (work backwards):</b> A triangle has area 48 cm² and base 12 cm. ½ × 12 × h = 48, so 6h = 48 and <b>h = 8 cm</b>.</p>
<p>📝 <b>Example (Pythagoras for a missing height):</b> An isosceles triangle has sides 10, 10 and 12. Drop a perpendicular onto the base 12: it splits the base into 6 and 6, so h = √(10² − 6²) = 8. Area = ½ × 12 × 8 = <b>48</b>.</p>
<p>📝 <b>Example:</b> A rectangle has area 54 cm² and length 9 cm. Width = 54 ÷ 9 = 6 cm and perimeter = 2(9 + 6) = <b>30 cm</b>.</p>
${sim(sl("n2a","top side a",2,10,6,1,"c5a")+sl("n2b","bottom side b",2,14,10,1,"c5a")+sl("n2h","height h",2,8,4,1,"c5a"),"c5ag","c5ao","c5a")}
<p>⚠️ <b>Exam trap:</b> Using the slant side as the height. Also, a trapezium needs the <b>average</b> of the parallel sides: add them <b>before</b> multiplying by the height.</p>
<span class="tag">Topic 5.3</span><h3>Circles, arcs and sectors (C5.3 and E5.3)</h3>
<h4>Circumference and area ${C}</h4>
<ul><li><b>Circumference</b> C = 2πr = πd. <b>Area</b> A = πr². (Both are given in the exam.) Diameter d = 2r.</li>
<li>Use the π button on your calculator, or 3.142 if instructed. Leave answers <b>in terms of π</b> if the question says so, e.g. 25π.</li></ul>
<p>📝 <b>Example:</b> r = 7 cm: C = 14π ≈ <b>44.0 cm</b>; A = 49π ≈ <b>154 cm²</b> (3 s.f.).</p>
<p>📝 <b>Example (work backwards):</b> A circle has circumference 30 cm: r = 30 ÷ (2π) = <b>4.77 cm</b>. A circle has area 50 cm²: r² = 50 ÷ π, so r = √15.9 = <b>3.99 cm</b>.</p>
<p>📝 <b>Example:</b> Perimeter of a semicircle of radius r: curved part πr <b>plus</b> the diameter 2r. For r = 5: 5π + 10 = <b>25.7 cm</b>.</p>
<h4>Arcs and sectors ${C}</h4>
<p>A sector with angle θ is the fraction <b>θ/360</b> of the whole circle. So <b>arc length = θ/360 × 2πr</b> and <b>sector area = θ/360 × πr²</b>. The perimeter of a sector is the arc <b>plus the two radii</b>.</p>
${fg(3,"A sector of angle 60° is 60/360 = 1/6 of the circle")}
<p>${C} In Core questions the sector angle is a <b>factor of 360°</b>, such as 30°, 45°, 60°, 90°, 120° or 180°, so the fraction is simple.</p>
<p>📝 <b>Example:</b> r = 6 cm, θ = 60°. Fraction 1/6. Arc = (1/6) × 12π = 2π ≈ <b>6.28 cm</b>. Area = (1/6) × 36π = 6π ≈ <b>18.8 cm²</b>. Perimeter = 2π + 12 ≈ <b>18.3 cm</b>.</p>
<h4>Any angle: minor and major sectors ${E}</h4>
<ul><li>Extended questions use angles that are not factors of 360° (e.g. 72°, 140°, 215°) and <b>major sectors</b> (angle more than 180°). A major sector's angle is 360° − the minor angle.</li>
<li>To find an angle: θ = 360 × arc ÷ (2πr), or θ = 360 × area ÷ (πr²).</li></ul>
<p>📝 <b>Example:</b> Major sector, r = 5 cm, angle 300°: area = (300/360) × 25π = 125π/6 ≈ <b>65.4 cm²</b>.</p>
<p>📝 <b>Example:</b> An arc of length 10 cm in a circle of radius 8 cm: θ = 360 × 10 ÷ (16π) = <b>71.6°</b>.</p>
${sim(sl("n3r","radius r (cm)",2,10,6,1,"c5b")+sl("n3t","sector angle θ (°)",30,360,60,15,"c5b"),"c5bg","c5bo","c5b")}
<p>⚠️ <b>Exam trap:</b> Forgetting the two radii when asked for the perimeter of a sector. And mixing up the formulas: area uses r², circumference uses r (not squared).</p>
<span class="tag">Topic 5.4</span><h3>Surface area and volume (C5.4 and E5.4)</h3>
<p>${C} ${E} Same at both tiers. <b>Volume</b> is the space inside (units cm³, m³). <b>Surface area</b> is the total area of all the outside faces (cm², m²). A <b>prism</b> is any solid with a uniform cross-section (a triangle, a circle, or even a cylindrical sector).</p>
<div class="wrap"><table><tr><th>Solid</th><th>Volume</th><th>Surface area</th></tr>
<tr><td>Cuboid</td><td>l × w × h <i>(learn)</i></td><td>2(lw + lh + wh) <i>(learn)</i></td></tr>
<tr><td>Prism</td><td><b>V = Al</b> <i>(given)</i></td><td>2 × end area + perimeter × length <i>(learn)</i></td></tr>
<tr><td>Cylinder</td><td><b>V = πr²h</b> <i>(given)</i></td><td>Curved: <b>2πrh</b> <i>(given)</i>; total = 2πrh + 2πr²</td></tr>
<tr><td>Pyramid</td><td><b>V = ⅓Ah</b> <i>(given)</i></td><td>Base + the triangular faces <i>(learn)</i></td></tr>
<tr><td>Cone</td><td><b>V = ⅓πr²h</b> <i>(given)</i></td><td>Curved: <b>πrl</b> <i>(given)</i>; total = πrl + πr²</td></tr>
<tr><td>Sphere</td><td><b>V = 4/3 πr³</b> <i>(given)</i></td><td><b>4πr²</b> <i>(given)</i></td></tr></table></div>
<p>In the formulas, A is the cross-section or base area, h the perpendicular height, l (for the cone) the <b>slant height</b>, and for a prism l is its length. For a cone, <b>l² = r² + h²</b> (Pythagoras).</p>
${fg(4,"A cylinder (radius r, height h) and a cone (radius r, height h, slant height l)")}
${fg(5,"A triangular prism (V = cross-section × length) and a square-based pyramid (V = ⅓ × base × height)")}
<p>📝 <b>Cylinder:</b> r = 5, h = 12. V = π × 25 × 12 = 300π ≈ <b>942 cm³</b>. Total surface = 2π × 5 × 12 + 2π × 25 = 170π ≈ <b>534 cm²</b>.</p>
<p>📝 <b>Cone:</b> r = 6, h = 8. l = √(36 + 64) = 10. V = ⅓ × π × 36 × 8 = 96π ≈ <b>302 cm³</b>. Curved area = π × 6 × 10 = 60π ≈ <b>188 cm²</b>.</p>
<p>📝 <b>Sphere:</b> r = 3: V = 4/3 × π × 27 = <b>36π</b> and surface area = 4π × 9 = <b>36π</b>.</p>
<p>📝 <b>Triangular prism:</b> ends are right-angled triangles 3, 4, 5 and the length is 10. V = ½ × 3 × 4 × 10 = <b>60</b>. Surface = 2 × 6 + (3 + 4 + 5) × 10 = <b>132</b>.</p>
<p>📝 <b>Square pyramid:</b> base 6 × 6, height 4. V = ⅓ × 36 × 4 = <b>48</b>. Slant height of a side face = √(3² + 4²) = 5, so surface = 36 + 4 × (½ × 6 × 5) = <b>96</b>.</p>
<p>📝 <b>Work backwards:</b> a cylinder of radius 4 cm has volume 500 cm³. h = 500 ÷ (16π) = <b>9.95 cm</b>.</p>
<p>📝 <b>Capacity:</b> a cylindrical tank has radius 0.5 m and height 2 m. V = π × 0.25 × 2 = 1.57 m³ = <b>1570 l</b>.</p>
${sim(sl("n4r","radius r (cm)",1,8,4,1,"c5c")+sl("n4h","height h (cm)",1,12,8,1,"c5c"),"c5cg","c5co","c5c")}
<p>⚠️ <b>Exam trap:</b> Using the vertical height of a cone in πrl. Use the <b>slant</b> height l for curved area, the <b>vertical</b> height h for volume. Also remember to add the circular ends if the question asks for the <b>total</b> surface area of a closed cylinder.</p>
<span class="tag">Topic 5.5</span><h3>Compound shapes and parts of shapes (C5.5 and E5.5)</h3>
<h4>Compound 2D shapes ${C}</h4>
<ul><li><b>Split</b> into rectangles, triangles, circles and so on, find each area and <b>add</b>; or find the area of a large shape and <b>subtract</b> the hole or missing part.</li>
<li><b>Perimeter</b> of a compound shape: add only the outside edges. If a semicircle is added to a side, that side is <b>not</b> part of the perimeter.</li>
<li><b>Parts of shapes:</b> semicircle (½), quarter circle (¼), sector, and the ring between two circles (an annulus, area π(R² − r²)).</li></ul>
${fg(6,"An L-shape split into two rectangles, and a rectangle with a semicircle on one side")}
<p>📝 <b>Example:</b> L-shape: a 10 by 6 rectangle with a 4 by 3 corner removed. Area = 60 − 12 = <b>48</b>.</p>
<p>📝 <b>Example:</b> A circle of radius 5 with a circular hole of radius 3. Area = 25π − 9π = <b>16π ≈ 50.3</b>.</p>
<p>📝 <b>Example:</b> A rectangle 8 cm by 5 cm has a semicircle on a 5 cm side. Perimeter = 8 + 8 + 5 + (π × 5 ÷ 2) = 21 + 7.85 = <b>28.9 cm</b>. Area = 40 + ½π(2.5)² = 40 + 9.82 = <b>49.8 cm²</b>.</p>
<h4>Compound solids and parts of solids ${C}</h4>
<ul><li><b>Compound solids:</b> add the volumes. For surface area, add only the faces you can still <b>see on the outside</b> (a join hides faces).</li>
<li><b>Hemisphere</b> (half a sphere): volume = ⅔πr³, curved surface = 2πr², total surface = 3πr² (curved part plus the flat circle πr²). Half-cylinders and quarter-spheres follow the same idea. The syllabus example is "find the volume of half of a sphere".</li>
<li>Answers may be asked for <b>in terms of π</b>.</li></ul>
<p>📝 <b>Example:</b> A solid is a cylinder (r = 3, h = 10) with a hemisphere on top. V = π × 9 × 10 + ⅔π × 27 = 90π + 18π = <b>108π ≈ 339</b>. Surface = 2π(3)(10) + π(3)² [base] + 2π(3)² [hemisphere] = 60π + 9π + 18π = <b>87π ≈ 273</b>.</p>
<h4>The frustum ${E}</h4>
<p>${E} A <b>frustum</b> is a cone with the top cut off parallel to the base. Find its volume and surface area by <b>big cone minus small cone</b>. The small cone is <b>similar</b> to the big one, so use ratios of lengths (Topic 4.4) to find its measurements. The surface area is the curved surface (difference of the two cone curves) plus the two flat circles.</p>
${fg(7,"A frustum is a big cone minus a small similar cone; a cylinder topped with a hemisphere")}
<p>📝 <b>Example:</b> A cone has radius 6 and height 12. A small cone of height 4 is cut off the top, so its radius is 6 × 4/12 = 2.<br>V = ⅓π(6²)(12) − ⅓π(2²)(4) = 144π − 16π/3 = 416π/3 ≈ <b>435.6</b>.<br>Slant heights: big = √(144 + 36) = 6√5; small = √(16 + 4) = 2√5. Curved area = π(6)(6√5) − π(2)(2√5) = 32√5π ≈ 224.8. Total surface = 224.8 + π(6²) + π(2²) ≈ <b>350.5</b>.</p>
${sim(sl("n5R","bottom radius R",2,10,6,1,"c5e")+sl("n5r","top radius r",1,9,2,1,"c5e")+sl("n5h","height h",2,12,8,1,"c5e"),"c5eg","c5eo","c5e")}
<p>⚠️ <b>Exam trap:</b> Subtracting the <b>lengths</b> of the cones instead of the <b>volumes</b>. Also, in a compound solid do not count the circle where two solids are joined.</p>
<h3>🔍 Topic 5 exam checklist</h3>
<ul><li>${C} Unit conversions (squared and cubed), area and perimeter of rectangle, triangle, parallelogram, trapezium, circle, arc and sector (angle a factor of 360°), volume and surface area of all six solids, compound shapes and solids, a hemisphere.</li><li>${E} Also: sector angles that are not factors of 360°, major sectors, harder compound solids such as a frustum.</li><li>Know which formulas are <b>given</b> (check page 2 of the paper) and which you must <b>recall</b>: rectangle, parallelogram, trapezium, cuboid, surface areas of a prism and a pyramid.</li><li>Include units, and give non-exact answers to 3 significant figures.</li></ul>`,

return{t:"Topic 6: Trigonometry (Cambridge 0580)",notes:`<span class="tag">Topic 6.1</span><h3>Pythagoras' theorem (C6.1 and E6.1)</h3>
<p class="lg"><b>Key:</b> ${C} = Core content (Extended students must know it too). ${E} = Extended (Supplement) only. Followed section by section from the Cambridge 0580 syllabus for 2025, 2026 and 2027.</p>
<h4>Topic 6 at a glance: Core and Extended</h4>
<div class="wrap"><table><tr><th>Syllabus</th><th>Content</th><th>Core</th><th>Extended</th></tr>
<tr><td>6.1</td><td>Pythagoras' theorem</td><td>Yes</td><td>Same</td></tr>
<tr><td>6.2</td><td>Right-angled triangles</td><td>sin, cos, tan for sides and angles; 2D problems; bearings</td><td>Same, <b>plus</b> shortest distance from a point to a line, <b>angles of elevation and depression</b></td></tr>
<tr><td>6.3</td><td>Exact trigonometric values</td><td><b>Not in Core</b></td><td>Yes</td></tr>
<tr><td>6.4</td><td>Trigonometric functions (graphs and equations)</td><td><b>Not in Core</b></td><td>Yes, for 0° ≤ x ≤ 360°</td></tr>
<tr><td>6.5</td><td>Non-right-angled triangles</td><td><b>Not in Core</b></td><td>Sine rule, cosine rule, area = ½ab sin C, obtuse angles, ambiguous case</td></tr>
<tr><td>6.6</td><td>Pythagoras and trigonometry in 3D</td><td><b>Not in Core</b></td><td>Yes, including the angle between a line and a plane</td></tr></table></div>
<p><b>Which formulas are given?</b> Core papers give <b>no</b> trigonometry formulas, so learn Pythagoras and SOH CAH TOA. Extended papers give the sine rule, cosine rule and ½ab sin C, but <b>not</b> SOH CAH TOA, Pythagoras or the exact values. Angles are given and answered in degrees, with decimals to <b>1 d.p.</b>; other non-exact answers to 3 s.f.</p>
<h4>The theorem ${C}</h4>
<p>In a <b>right-angled triangle</b> the side opposite the right angle is the <b>hypotenuse</b>, and it is always the longest side. <b>a² + b² = c²</b>, where c is the hypotenuse. In words: the square on the hypotenuse equals the sum of the squares on the other two sides.</p>
${fg(1,"3² + 4² = 5²: the areas of the two small squares add up to the area of the big square")}
<ul><li><b>Finding the hypotenuse:</b> add the squares, then square root. <b>Finding a shorter side:</b> <b>subtract</b>: a² = c² − b², then square root.</li>
<li>Know squares up to 15² and roots (Paper 1 and Paper 2 have no calculator).</li>
<li><b>Pythagorean triples</b> (whole numbers): 3, 4, 5; 5, 12, 13; 8, 15, 17; 7, 24, 25; and multiples such as 6, 8, 10 and 9, 12, 15.</li>
<li><b>Converse:</b> if a² + b² = c² for the three sides, the triangle has a right angle opposite c.</li></ul>
<p>📝 <b>Example:</b> Legs 7 and 24: c² = 49 + 576 = 625, so <b>c = 25</b>. Hypotenuse 13, one leg 5: other leg = √(169 − 25) = <b>12</b>.</p>
<p>📝 <b>Example (rectangle):</b> A 9 cm by 12 cm rectangle has diagonal √(81 + 144) = <b>15 cm</b>.</p>
<p>📝 <b>Example (is it right-angled?):</b> Sides 6, 7, 10: 6² + 7² = 85 but 10² = 100, so <b>no</b>. Sides 9, 40, 41: 81 + 1600 = 1681 = 41², so <b>yes</b>.</p>
<p>📝 <b>Example (ladder):</b> A 5 m ladder has its foot 1.5 m from a wall. Height = √(25 − 2.25) = √22.75 = <b>4.77 m</b>.</p>
<p>📝 <b>Example (isosceles triangle):</b> Sides 10, 10, 12. The height splits the base into 6 and 6: h = √(100 − 36) = <b>8</b>. This is the key step for finding areas.</p>
<p>📝 <b>Example ${E} (exact form):</b> Legs 4 and 6: hypotenuse = √52 = √(4 × 13) = <b>2√13</b> (simplified surd, see Topic 1.18) ≈ 7.21.</p>
${sim(sl("t1a","short side a",1,12,3,1,"c6a")+sl("t1b","short side b",1,12,4,1,"c6a"),"c6ag","c6ao","c6a")}
<p>⚠️ <b>Exam trap:</b> Adding when you should subtract (finding a leg), or forgetting the final square root. Pythagoras only works in <b>right-angled</b> triangles.</p>
<span class="tag">Topic 6.2</span><h3>Right-angled triangles (C6.2 and E6.2)</h3>
<h4>The three ratios ${C}</h4>
<p>Label the sides <b>from the angle θ you are using</b>: the <b>hypotenuse</b> (opposite the 90°), the <b>opposite</b> (facing θ) and the <b>adjacent</b> (next to θ, not the hypotenuse).</p>
${fg(2,"Sides labelled from the angle θ: opposite, adjacent and hypotenuse")}
<p><b>sin θ = opposite ÷ hypotenuse</b> (SOH). <b>cos θ = adjacent ÷ hypotenuse</b> (CAH). <b>tan θ = opposite ÷ adjacent</b> (TOA). These work for the acute angles of a right-angled triangle.</p>
<h4>Finding a side ${C}</h4>
<ol><li>Label the sides: hypotenuse, opposite, adjacent for the given angle.</li><li>Pick the ratio that uses the side you know and the side you want.</li><li>Write the equation, then rearrange: unknown on top, <b>multiply</b>; unknown at the bottom, <b>divide</b>.</li></ol>
<p>📝 <b>Example:</b> sin 35° = x ÷ 12, so x = 12 × sin 35° = <b>6.88</b>.</p>
<p>📝 <b>Example:</b> cos 40° = 8 ÷ x, so x = 8 ÷ cos 40° = <b>10.4</b> (unknown at the bottom: divide).</p>
<h4>Finding an angle ${C}</h4>
<p>Use the <b>inverse</b> button (sin⁻¹, cos⁻¹, tan⁻¹): θ = sin⁻¹(opp ÷ hyp), cos⁻¹(adj ÷ hyp) or tan⁻¹(opp ÷ adj).</p>
<p>📝 <b>Example:</b> opposite 5, adjacent 8: tan θ = 5/8, so θ = tan⁻¹(0.625) = <b>32.0°</b>. 📝 <b>Example:</b> opposite 7, hypotenuse 10: θ = sin⁻¹(0.7) = <b>44.4°</b>.</p>
${sim(sl("t2t","angle θ (°)",5,85,35,1,"c6b")+sl("t2h","hypotenuse (cm)",4,14,10,1,"c6b"),"c6bg","c6bo","c6b")}
<h4>Two-dimensional problems and bearings ${C}</h4>
<ul><li>Split compound shapes (isosceles triangles, rectangles with diagonals, trapeziums) into right-angled triangles. Use Pythagoras for two sides, trigonometry when an angle is involved.</li>
<li><b>Bearings:</b> draw the north line at each point; measure bearings clockwise from north. The eastward distance is d sin b and the northward distance is d cos b for a bearing b between 0° and 90°.</li></ul>
<p>📝 <b>Example:</b> A ship sails 12 km on a bearing of 070°. East = 12 sin 70° = <b>11.3 km</b>; north = 12 cos 70° = <b>4.10 km</b>.</p>
<p>📝 <b>Example:</b> A ship goes 8 km east and then 6 km north. It is √(64 + 36) = 10 km from the start, and its bearing from the start is tan⁻¹(8 ÷ 6) = 53.1°, written <b>053.1°</b>.</p>
<p>📝 <b>Example (isosceles):</b> An isosceles triangle has equal sides of 10 cm and a base of 12 cm. Half the base is 6, so the base angle satisfies cos θ = 6 ÷ 10, so θ = <b>53.1°</b>.</p>
<h4>Shortest distance from a point to a line ${E}</h4>
<p>${E} The <b>shortest distance</b> from a point to a line is the <b>perpendicular distance</b> (at 90° to the line). Draw the perpendicular to make a right-angled triangle. 📝 <b>Example:</b> A is 10 m from a point B on a straight path, and AB makes an angle of 30° with the path. The shortest distance from A to the path is 10 sin 30° = <b>5 m</b>. In an isosceles triangle with sides 10, 10, 12, the shortest distance from the apex to the base is the height, <b>8</b>.</p>
<h4>Angles of elevation and depression ${E}</h4>
<ul><li>The <b>angle of elevation</b> is the angle <b>up</b> from the horizontal to the line of sight. The <b>angle of depression</b> is the angle <b>down</b> from the horizontal to the line of sight. Both are measured from the <b>horizontal</b>.</li>
<li>The angle of depression from the top equals the angle of elevation from the bottom (alternate angles between parallel horizontals).</li></ul>
${fg(3,"The angle of depression from the observer equals the angle of elevation from the object")}
<p>📝 <b>Example:</b> A tower is 30 m high. From a point on the ground the angle of elevation of the top is 25°. Distance = 30 ÷ tan 25° = <b>64.3 m</b>.</p>
<p>📝 <b>Example:</b> From the top of a 50 m cliff, the angle of depression of a boat is 20°. Distance from the cliff = 50 ÷ tan 20° = <b>137 m</b>. (The angle inside the triangle at the boat is also 20°.)</p>
${sim(sl("t2e","height (m)",1,30,10,1,"c6c")+sl("t2d","horizontal distance (m)",1,40,15,1,"c6c"),"c6cg","c6co","c6c")}
<p>⚠️ <b>Exam trap:</b> Calculator in <b>radian</b> mode (check for D or DEG on the display). Labelling the opposite and adjacent from the wrong angle. Measuring the angle of depression from the vertical.</p>
<span class="tag">Topic 6.3</span><h3>Exact trigonometric values (E6.3, Extended only)</h3>
<p>${E} <b>This subtopic is not in the Core syllabus.</b> You must know these <b>without a calculator</b> (Paper 2 is non-calculator).</p>
<div class="wrap"><table><tr><th>x</th><th>0°</th><th>30°</th><th>45°</th><th>60°</th><th>90°</th></tr>
<tr><th>sin x</th><td>0</td><td>1/2</td><td>√2/2</td><td>√3/2</td><td>1</td></tr>
<tr><th>cos x</th><td>1</td><td>√3/2</td><td>√2/2</td><td>1/2</td><td>0</td></tr>
<tr><th>tan x</th><td>0</td><td>√3/3 (= 1/√3)</td><td>1</td><td>√3</td><td>(not required)</td></tr></table></div>
${fg(6,"Two triangles give every exact value: half a square (1, 1, √2) and half an equilateral triangle (1, 2, √3)")}
<ul><li>sin 45° = 1/√2 = √2/2 (rationalised). tan = sin ÷ cos, so tan 30° = (1/2) ÷ (√3/2) = 1/√3 = √3/3.</li>
<li><b>Memory trick:</b> sin of 0°, 30°, 45°, 60°, 90° = √0/2, √1/2, √2/2, √3/2, √4/2. Cos is the same list backwards.</li></ul>
<p>📝 <b>Example:</b> A right triangle has hypotenuse 10 and an angle of 30°. The opposite side = 10 sin 30° = <b>5</b>; the adjacent side = 10 cos 30° = <b>5√3</b>.</p>
<p>📝 <b>Example:</b> sin 60° × cos 30° = (√3/2)(√3/2) = <b>3/4</b>. 📝 <b>Example:</b> tan 45° + sin 30° = 1 + 1/2 = <b>3/2</b>.</p>
<p>📝 <b>Example:</b> Solve sin x = 1/2 for acute x: <b>x = 30°</b>. Solve tan x = √3: <b>x = 60°</b>.</p>
${sim(sl("t3a","angle x (°)",0,360,30,15,"c6d"),"c6dg","c6do","c6d")}
<p>⚠️ <b>Exam trap:</b> Mixing up sin 30° (1/2) and cos 30° (√3/2), or giving tan 30° as √3/2. Draw the 30-60-90 and 45-45-90 triangles if you forget.</p>
<span class="tag">Topic 6.4</span><h3>Trigonometric functions (E6.4, Extended only)</h3>
<p>${E} <b>This subtopic is not in the Core syllabus.</b> For angles from 0° to 360°. Extend the ratios using the unit circle: for a point at angle x on a circle of radius 1, cos x is the horizontal coordinate and sin x is the vertical coordinate.</p>
<h4>Graphs of sin x, cos x and tan x ${E}</h4>
${fg(4,"y = sin x (blue) and y = cos x (green) for 0° to 360°")}
<ul><li><b>y = sin x:</b> starts at 0, maximum 1 at 90°, 0 at 180°, minimum −1 at 270°, back to 0 at 360°. <b>Period 360°</b>, range −1 to 1.</li>
<li><b>y = cos x:</b> starts at 1, 0 at 90°, −1 at 180°, 0 at 270°, 1 at 360°. It is the sine curve shifted left by 90°. Period 360°, range −1 to 1.</li></ul>
${fg(5,"y = tan x has vertical asymptotes at 90° and 270°")}
<ul><li><b>y = tan x:</b> 0 at 0°, 180° and 360°; tan 45° = 1; goes to infinity at <b>90° and 270°</b> (vertical asymptotes, the curve never touches them). <b>Period 180°</b>, no limit on the range.</li>
<li>When you sketch: label axes, mark key values (maximum, minimum, intercepts, asymptotes) and use a smooth freehand curve.</li></ul>
<h4>Solving trigonometric equations ${E}</h4>
${fg(10,"CAST diagram: which ratios are positive in each quadrant")}
<p>For 0° ≤ x ≤ 360° there are usually <b>two solutions</b>. Rearrange to sin x = k (or cos x = k, tan x = k), find the calculator angle x₁, then use the symmetry of the graph:</p>
<ul><li><b>sin x = k:</b> x = x₁ and <b>180° − x₁</b>. <b>cos x = k:</b> x = x₁ and <b>360° − x₁</b>. <b>tan x = k:</b> x = x₁ and <b>x₁ + 180°</b>.</li>
<li>If the calculator gives a negative angle, add 360° (or use the CAST diagram) to get an angle in range. Check each answer is between 0° and 360°.</li></ul>
<p>📝 <b>Example (syllabus type):</b> sin x = √3/2: x₁ = 60°, and 180° − 60° = 120°. <b>x = 60°, 120°</b>.</p>
<p>📝 <b>Example (syllabus type):</b> 2 cos x + 1 = 0 gives cos x = −1/2. x₁ = 120°, and 360° − 120° = 240°. <b>x = 120°, 240°</b>.</p>
<p>📝 <b>Example:</b> tan x = −1: calculator −45°. In range: −45° + 180° = <b>135°</b> and −45° + 360° = <b>315°</b>.</p>
<p>📝 <b>Example:</b> sin x = −0.6: calculator −36.9°. Solutions 180° + 36.9° = <b>216.9°</b> and 360° − 36.9° = <b>323.1°</b>.</p>
${sim('<label>function: <select id="t4f" onchange="c6e()" style="width:auto"><option value="s">sin x = k</option><option value="c">cos x = k</option><option value="t">tan x = k</option></select></label>'+sl("t4k","k",-3,3,0.5,0.25,"c6e"),"c6eg","c6eo","c6e")}
<p>⚠️ <b>Exam trap:</b> Giving only one solution. sin x = k can never have |k| > 1. Also remember sin and cos graphs repeat every 360°, but tan repeats every 180°.</p>
<span class="tag">Topic 6.5</span><h3>Non-right-angled triangles (E6.5, Extended only)</h3>
<p>${E} <b>This subtopic is not in the Core syllabus.</b> Label the triangle so that <b>side a is opposite angle A</b>, b opposite B, c opposite C.</p>
${fg(7,"Triangle ABC: each side is named after the opposite angle")}
<div class="wrap"><table><tr><th>Rule</th><th>Formula (given on the paper)</th><th>Use it when you know</th></tr>
<tr><td>Sine rule</td><td>a/sin A = b/sin B = c/sin C</td><td>A side and its opposite angle, plus one more side or angle</td></tr>
<tr><td>Cosine rule</td><td>a² = b² + c² − 2bc cos A</td><td>Two sides and the angle <b>between</b> them (SAS) to find the third side; or all three sides (SSS) to find an angle</td></tr>
<tr><td>Area</td><td>Area = ½ab sin C</td><td>Two sides and the angle between them</td></tr></table></div>
<p>To find an angle with the sine rule, flip it: sin A / a = sin B / b. To find an angle with the cosine rule, rearrange (this form is <b>not</b> given): <b>cos A = (b² + c² − a²) ÷ 2bc</b>. If cos A comes out negative, the angle is obtuse.</p>
<p>📝 <b>Sine rule (side):</b> A = 40°, B = 65°, a = 8. b = 8 × sin 65° ÷ sin 40° = <b>11.3</b>.</p>
<p>📝 <b>Cosine rule (side):</b> b = 7, c = 9, A = 50°. a² = 49 + 81 − 2(7)(9) cos 50° = 130 − 126(0.6428) = 49.01, so <b>a = 7.00</b>.</p>
<p>📝 <b>Cosine rule (angle):</b> sides 7, 8, 10. Largest angle is opposite 10: cos C = (49 + 64 − 100) ÷ (2 × 7 × 8) = 13 ÷ 112, so <b>C = 83.3°</b>.</p>
<p>📝 <b>Area:</b> sides 7 and 9 with the angle between them 50°. Area = ½ × 7 × 9 × sin 50° = <b>24.1</b>. A triangle with two sides 8 and 10 and included angle 30° has area ½ × 8 × 10 × ½ = <b>20</b>.</p>
<p>📝 <b>Bearing problem:</b> A ship sails 8 km on a bearing of 040° from A to B, then 5 km on a bearing of 100° to C. The back bearing from B to A is 220°, so angle ABC = 220° − 100° = 120°. AC² = 64 + 25 − 2(8)(5) cos 120° = 89 + 40 = 129, so <b>AC = 11.4 km</b>.</p>
${sim(sl("t5b","side b",3,12,7,1,"c6k")+sl("t5c","side c",3,12,9,1,"c6k")+sl("t5A","angle A (°)",20,160,50,5,"c6k"),"c6kg","c6ko","c6k")}
<h4>The ambiguous case ${E}</h4>
<p>If you know two sides and an angle <b>not</b> between them (SSA), the sine rule can give <b>two</b> possible triangles, because sin B = sin (180° − B). If B₁ is the calculator angle, the other possibility is B₂ = 180° − B₁. Accept it only if the angle sum with A stays below 180°.</p>
${fg(8,"Ambiguous case: the arc of radius a cuts the base line at two points B₁ and B₂")}
<p>📝 <b>Example:</b> A = 30°, a = 5, b = 8. sin B = 8 sin 30° ÷ 5 = 0.8, so B = 53.1° or 126.9°. Both fit (30 + 126.9 < 180). So C = 96.9° or 23.1°, giving c = 9.93 or c = 3.92. <b>Two triangles.</b></p>
${sim(sl("t5a","angle A (°)",20,60,30,5,"c6g")+sl("t5d","side b",6,10,8,1,"c6g")+sl("t5s","side a (opposite A)",2,12,5,0.5,"c6g"),"c6gg","c6go","c6g")}
<p>⚠️ <b>Exam trap:</b> Using the sine rule when the angle is not opposite a known side (use the cosine rule). Rounding early. Forgetting that the largest angle is opposite the longest side, which helps you spot an error.</p>
<span class="tag">Topic 6.6</span><h3>Pythagoras and trigonometry in 3D (E6.6, Extended only)</h3>
<p>${E} <b>This subtopic is not in the Core syllabus.</b> Solve 3D problems by finding <b>right-angled triangles</b> inside the solid and drawing each one <b>flat</b>, one at a time.</p>
${fg(9,"A cuboid: the base diagonal AC, the space diagonal AG and the angle between AG and the base")}
<ul><li><b>Diagonal of the base:</b> d = √(l² + w²). <b>Space diagonal</b> (corner to opposite corner, also the longest rod that fits in a box): √(l² + w² + h²).</li>
<li><b>Angle between a line and a plane:</b> drop a perpendicular from the line onto the plane. The angle is between the line and its <b>shadow</b> (projection) on the plane. For the space diagonal and the base, tan θ = h ÷ d where d is the base diagonal.</li></ul>
<p>📝 <b>Example:</b> A cuboid is 8 by 6 by 5. Base diagonal = √(64 + 36) = 10. Space diagonal = √(100 + 25) = √125 = <b>11.2</b>. Angle with the base = tan⁻¹(5 ÷ 10) = <b>26.6°</b>.</p>
<p>📝 <b>Example (pyramid):</b> A square-based pyramid has base 10 and a vertical height of 12 (the apex is above the centre). Half the base diagonal = 5√2 = 7.07. Slant edge = √(50 + 144) = <b>13.9</b>. Angle between a slant edge and the base = tan⁻¹(12 ÷ 7.07) = <b>59.5°</b>. The line from the apex to the midpoint of a base edge makes an angle tan⁻¹(12 ÷ 5) = <b>67.4°</b> with the base.</p>
${sim(sl("t6l","length l",2,10,8,1,"c6h")+sl("t6w","width w",2,10,6,1,"c6h")+sl("t6h","height h",2,10,5,1,"c6h"),"c6hg","c6ho","c6h")}
<p>⚠️ <b>Exam trap:</b> Using a 3D slanted line as a flat length. Always identify the right angle first: the vertical edge is perpendicular to everything in the base.</p>
<h3>🔍 Topic 6 exam checklist</h3>
<ul><li>${C} Pythagoras (find any side); SOH CAH TOA for sides and angles (calculator in degrees); 2D problems and bearings; angles to 1 d.p.</li><li>${E} Also: shortest distance from a point to a line; elevation and depression; exact values for 0°, 30°, 45°, 60°, 90°; sin, cos, tan graphs and solving equations for 0° to 360°; sine rule, cosine rule and ½ab sin C; the ambiguous case; 3D problems and the angle between a line and a plane.</li><li>Draw a clear diagram for every problem, label the sides, and keep full calculator values until the final answer.</li></ul>`,

<tr><td>7.2</td><td>Vectors in two dimensions</td><td><b>Not in Core</b></td><td>Column vectors, add, subtract, multiply by a scalar</td></tr>
<tr><td>7.3</td><td>Magnitude of a vector</td><td><b>Not in Core</b></td><td>|a| = √(x² + y²)</td></tr>
<tr><td>7.4</td><td>Vector geometry</td><td><b>Not in Core</b></td><td>Position vectors, proofs of parallel, collinear, ratio</td></tr></table></div>
<p><b>The golden rule for "describe":</b> a transformation must be described <b>fully</b>, and you must give <b>one single transformation</b> only. Use a ruler for all straight edges. The <b>object</b> is the original shape and the <b>image</b> is the shape after the transformation (written with a dash, A → A′).</p>
<div class="wrap"><table><tr><th>Transformation</th><th>You must state</th><th>Image is congruent to the object?</th></tr>
<tr><td>Reflection</td><td>The <b>mirror line</b> (its equation)</td><td>Yes (but flipped)</td></tr><tr><td>Rotation</td><td>The <b>angle</b>, the <b>direction</b> (clockwise or anticlockwise) and the <b>centre</b></td><td>Yes</td></tr>
<tr><td>Enlargement</td><td>The <b>scale factor</b> and the <b>centre</b></td><td>No: similar, not congruent (unless the scale factor is 1 or −1)</td></tr><tr><td>Translation</td><td>The <b>vector</b> ${cv("x","y")}</td><td>Yes</td></tr></table></div>
<h4>Reflection ${C}</h4>
<ul><li>Each point and its image are the <b>same perpendicular distance</b> from the <b>mirror line</b>, on opposite sides. The line joining a point to its image is perpendicular to the mirror line, and the mirror line is its perpendicular bisector.</li>
<li>Points <b>on</b> the mirror line do not move (they are <b>invariant</b>). The image is the same size but is <b>flipped</b> (the order of the vertices goes the other way round).</li>
<li>Core mirror lines are <b>vertical</b> (x = k) or <b>horizontal</b> (y = k), including the axes (the y-axis is x = 0; the x-axis is y = 0).</li></ul>
${fg(1,"Reflection in the line x = 1: every point and its image are the same distance from the mirror")}
<p>📝 <b>Example:</b> Reflect P(2, 3) in x = 4: P is 2 to the left of the mirror, so P′ is 2 to the right: <b>(6, 3)</b>. Reflect P(2, 3) in y = −1: P is 4 above the line, so P′ is 4 below it: <b>(2, −5)</b>.</p>
<p><b>To describe a reflection:</b> find the mirror line. Take one point and its image, find the <b>midpoint</b> of the pair, and the mirror passes through it, perpendicular to the line joining them. If the midpoint of A(1, 2) and A′(5, 2) is (3, 2), the mirror line is <b>x = 3</b>.</p>
<h4>Reflection in any line ${E}</h4>
<ul><li>${E} Extended mirror lines include <b>diagonals</b>: y = x, y = −x, or lines such as y = x + 1. Fold along the line (or use tracing paper) and mark the image at the same perpendicular distance.</li>
<li>Rules: reflection in <b>y = x</b>: (x, y) → <b>(y, x)</b>. Reflection in <b>y = −x</b>: (x, y) → <b>(−y, −x)</b>. 📝 (2, 3) goes to (3, 2) and (−3, −2).</li>
<li>📝 <b>Example:</b> Reflect (4, 0) in y = x + 1. The image is (−1, 5): the midpoint (1.5, 2.5) is on the line and the segment joining the points has gradient −1, so it is perpendicular to the line (gradient 1).</li></ul>
${fg(2,"Reflection in the diagonal y = x swaps the coordinates")}
${sim(sel("r1f","c7a",["mirror line",[["x","x = k (vertical)"],["y","y = k (horizontal)"],["d","y = x (EXT)"],["a","y = −x (EXT)"]]])+sl("r1k","k",-4,4,1,1,"c7a"),"c7ag","c7ao","c7a")}
<h4>Rotation ${C}</h4>
<ul><li>A rotation turns the shape about a fixed point, the <b>centre</b>, through an angle in a stated direction. Core angles are <b>multiples of 90°</b> (90°, 180°, 270°). 180° needs no direction. A 270° anticlockwise turn is the same as 90° clockwise.</li>
<li>Core centres: the <b>origin</b>, a <b>vertex</b> of the shape or the <b>midpoint of an edge</b>. The centre is the only invariant point. The image is congruent and keeps the same orientation. Each point stays the same distance from the centre.</li>
<li><b>Method:</b> use <b>tracing paper</b>. Trace the shape and the centre, hold the centre with a pencil point, and turn the paper through the angle.</li></ul>
<p><b>About the origin:</b> 90° clockwise (x, y) → <b>(y, −x)</b>; 90° anticlockwise (x, y) → <b>(−y, x)</b>; 180° (x, y) → <b>(−x, −y)</b>.</p>
${fg(3,"Rotation of triangle A through 90° clockwise about the origin: (x, y) becomes (y, −x)")}
<p>📝 <b>Example:</b> Rotate the triangle (1, 1), (4, 1), (4, 3) through 90° clockwise about the origin: <b>(1, −1), (1, −4), (3, −4)</b>. Check P(2, 3): 90° clockwise gives (3, −2); 90° anticlockwise gives (−3, 2).</p>
<p>📝 <b>To describe a rotation:</b> the angle can be found by comparing a point, the centre and the image. The direction is the way the paper has to turn.</p>
<h4>Rotation about any centre ${E}</h4>
<ul><li>${E} The centre can be <b>any point</b>. Treat the centre as a temporary origin: find the vector from the centre to the point, rotate that vector, then add it back to the centre.</li>
<li>📝 <b>Example:</b> Rotate P(3, 2) 90° anticlockwise about C(1, 1). The vector CP = (2, 1). Rotated: (−1, 2). The image is (1 − 1, 1 + 2) = <b>(0, 3)</b>.</li>
<li><b>Finding the centre:</b> draw the <b>perpendicular bisectors</b> of two different pairs of points and images; they cross at the centre. The angle is the angle between the line from the centre to a point and the line from the centre to its image.</li></ul>
${sim(sel("r2d","c7b",["rotation",[["c","90° clockwise"],["a","90° anticlockwise"],["h","180°"]]])+sl("r2x","centre x",-3,3,0,1,"c7b")+sl("r2y","centre y",-3,3,0,1,"c7b"),"c7bg","c7bo","c7b")}
<h4>Enlargement ${C}</h4>
<ul><li>An enlargement has a <b>centre</b> and a <b>scale factor</b> k. Every length is multiplied by k. The image is <b>similar</b> to the object: same angles, sides in the same ratio. Core scale factors are <b>positive</b> and may be <b>fractions</b> (a fraction less than 1 makes the shape smaller, but it is still called an enlargement).</li>
<li><b>To draw:</b> from the centre, draw a ray through each vertex. Along each ray the image vertex is k times as far from the centre as the object vertex. Image position = centre + k × (point − centre).</li>
<li><b>Lengths × k; areas × k²</b> (Topic 4.4). Scale factor k = image length ÷ object length.</li>
<li><b>To describe:</b> find k by comparing a pair of corresponding sides. Find the centre by drawing lines through pairs of corresponding vertices: they meet at the centre.</li></ul>
${fg(4,"Enlargement scale factor 2, centre (−1, −1): each image point is twice as far from the centre")}
<p>📝 <b>Example:</b> Centre (−1, −1), scale factor 2: (0, 0) goes to (−1, −1) + 2(1, 1) = <b>(1, 1)</b>. Centre O, scale factor 3: (2, 1) goes to <b>(6, 3)</b>. Centre (4, 4), scale factor ½: (0, 0) goes to (4, 4) + ½(−4, −4) = <b>(2, 2)</b>.</p>
<p>📝 <b>Example:</b> A triangle of area 6 cm² is enlarged by scale factor 3. The area of the image is 6 × 9 = <b>54 cm²</b>.</p>
<h4>Negative scale factors ${E}</h4>
<p>${E} With a <b>negative</b> scale factor the image is on the <b>opposite side</b> of the centre and is <b>upside down</b> (turned through 180°), and lengths are multiplied by |k|. 📝 Centre O, scale factor −2: (1, 2) goes to <b>(−2, −4)</b>. Scale factor −1 is a rotation of 180° about the centre.</p>
${fg(5,"Enlargement with scale factor −2, centre O: the image is on the other side, inverted and twice as big")}
${sim(sl("r3k","scale factor k",-3,3,2,0.5,"c7c")+sl("r3x","centre x",-3,3,-1,1,"c7c")+sl("r3y","centre y",-3,3,-1,1,"c7c"),"c7cg","c7co","c7c")}
<h4>Translation ${C}</h4>
<ul><li>A translation slides every point the <b>same distance in the same direction</b>. It is described by a <b>column vector</b> ${cv("x","y")}: x = movement <b>right</b> (negative means left) and y = movement <b>up</b> (negative means down). The shape does not turn or flip; there are no invariant points.</li>
<li>Image = object point + vector.</li></ul>
${fg(6,"Translation by the vector (3, −2): every point moves 3 right and 2 down")}
<p>📝 <b>Example:</b> Translate (−4, 3) by ${cv(3,"−2")}: <b>(−1, 1)</b>. 📝 <b>Describe:</b> A(2, 5) maps to A′(−1, 1): the movement is −3 horizontally and −4 vertically, the translation by ${cv("−3","−4")}.</p>
${sim(sl("r4x","x (right)",-6,6,3,1,"c7d")+sl("r4y","y (up)",-6,6,-2,1,"c7d"),"c7dg","c7do","c7d")}
<h4>Combinations of transformations ${E}</h4>
<ul><li>${E} Extended questions may ask for <b>one transformation followed by another</b>, or for the <b>single transformation</b> equal to a combination. Apply them in the stated order: <b>order matters</b>.</li>
<li>📝 <b>Example:</b> P(2, 1). Translate by ${cv(3,0)} then reflect in the y-axis: (5, 1) then <b>(−5, 1)</b>. Reflect first then translate: (−2, 1) then <b>(1, 1)</b>. Different answers.</li>
<li>Useful facts: reflection in the x-axis followed by reflection in the y-axis = <b>rotation of 180° about the origin</b> (P(2, 1) → (2, −1) → (−2, −1)). Two reflections in <b>parallel</b> lines = a <b>translation</b> (perpendicular to the lines, twice the distance between them). Two reflections in <b>intersecting</b> lines = a <b>rotation</b> about the intersection point, through twice the angle between the lines.</li></ul>
<p>⚠️ <b>Exam trap:</b> Giving <b>two</b> transformations when asked for a single one (this scores no marks). Saying "enlargement" without the centre, or "rotation" without the direction. In a reflection, giving "x-axis" instead of the equation of the line. Using the wrong sign for the vector: <b>x is horizontal, y is vertical</b>.</p>
<span class="tag">Topic 7.2</span><h3>Vectors in two dimensions (E7.2, Extended only)</h3>
<p>${E} <b>This subtopic is not in the Core syllabus.</b> A <b>vector</b> has both <b>size (magnitude)</b> and <b>direction</b>. It is written as a <b>column vector</b> ${cv("x","y")}, as a letter in bold (<b>a</b>, printed bold; in handwriting underline it), or as <b>AB</b> (the vector from A to B). The vector <b>AB</b> is not the same as <b>BA</b>: <b>BA = −AB</b>.</p>
<ul><li><b>Translation vector:</b> ${cv("x","y")} describes a movement of x across and y up. Two vectors are <b>equal</b> if they have the same magnitude and direction, wherever they are drawn.</li>
<li><b>Vector between points:</b> AB = (end point) − (start point). 📝 A(1, 2), B(4, 6): <b>AB</b> = ${cv(3,4)} and <b>BA</b> = ${cv("−3","−4")}.</li></ul>
<h4>Adding and subtracting ${E}</h4>
<ul><li><b>Add or subtract the top numbers and the bottom numbers separately.</b> ${cv("a₁","a₂")} + ${cv("b₁","b₂")} = ${cv("a₁ + b₁","a₂ + b₂")}.</li>
<li><b>Triangle rule:</b> draw <b>a</b>, then draw <b>b</b> starting where <b>a</b> ends. The resultant <b>a + b</b> goes from the start of <b>a</b> to the end of <b>b</b>. Also <b>AB + BC = AC</b>.</li>
<li><b>Subtracting:</b> <b>a − b = a + (−b)</b>, where −b has the same size as b but the opposite direction.</li></ul>
${fg(7,"Vector addition by the triangle rule: a + b goes from the start of a to the end of b")}
<h4>Multiplying by a scalar ${E}</h4>
<p>A <b>scalar</b> is an ordinary number. Multiply <b>both</b> components: k${cv("x","y")} = ${cv("kx","ky")}. If k > 0 the direction is unchanged; if k < 0 the direction reverses; |k| scales the size. <b>Parallel vectors</b> are scalar multiples of each other: ${cv(2,3)} and ${cv(6,9)} are parallel.</p>
<p>📝 <b>Example:</b> <b>a</b> = ${cv(2,3)}, <b>b</b> = ${cv("−1",4)}. <b>a + b</b> = ${cv(1,7)}; <b>a − b</b> = ${cv(3,"−1")}; 3<b>a</b> = ${cv(6,9)}; 2<b>a</b> − 3<b>b</b> = ${cv(4,6)} − ${cv("−3",12)} = ${cv(7,"−6")}.</p>
${sim(sl("v1a","a: x",-4,4,3,1,"c7e")+sl("v1b","a: y",-4,4,1,1,"c7e")+sl("v1c","b: x",-4,4,1,1,"c7e")+sl("v1d","b: y",-4,4,3,1,"c7e"),"c7eg","c7eo","c7e")}
<span class="tag">Topic 7.3</span><h3>Magnitude of a vector (E7.3, Extended only)</h3>
<p>${E} <b>This subtopic is not in the Core syllabus.</b> The <b>magnitude</b> (length) of a vector is found with Pythagoras' theorem. It is written with <b>modulus signs</b>: |<b>a</b>| or |<b>AB</b>|.</p>
<p>For <b>a</b> = ${cv("x","y")}: <b>|a| = √(x² + y²)</b>. Magnitude is never negative. |k<b>a</b>| = |k| × |<b>a</b>|.</p>
<p>📝 <b>Examples:</b> |${cv(3,4)}| = √(9 + 16) = <b>5</b>. |${cv("−5",12)}| = √(25 + 144) = <b>13</b>. |${cv(2,"−3")}| = √13 = <b>3.61</b> (3 s.f.). The <b>distance between two points</b> A and B is |<b>AB</b>| (compare Topic 3.4).</p>
<p>📝 <b>Example:</b> <b>a</b> = ${cv(3,4)}. Find k so that |k<b>a</b>| = 10: |k| × 5 = 10, so <b>k = 2 or k = −2</b>. 📝 If <b>p</b> = ${cv(6,"−8")} then |<b>p</b>| = <b>10</b>.</p>
${sim(sl("m1x","x",-6,6,3,1,"c7m")+sl("m1y","y",-6,6,4,1,"c7m"),"c7mg","c7mo","c7m")}
<p>⚠️ <b>Exam trap:</b> Subtracting instead of adding under the square root, or forgetting that a negative component squares to a positive. Also |<b>a</b> + <b>b</b>| is <b>not</b> |<b>a</b>| + |<b>b</b>|: add the vectors first, then find the magnitude.</p>
<span class="tag">Topic 7.4</span><h3>Vector geometry (E7.4, Extended only)</h3>
<p>${E} <b>This subtopic is not in the Core syllabus.</b></p>
<ul><li>A <b>directed line segment</b> is a line with an arrow showing its direction: it represents a vector.</li>
<li>A <b>position vector</b> gives the position of a point relative to the origin O: <b>OA</b> = <b>a</b> means A is at the end of the vector <b>a</b> from O.</li>
<li>The vector from A to B: <b>AB = −a + b = b − a</b> (go from A back to O, then on to B).</li>
<li><b>Midpoint:</b> the midpoint M of AB has position vector <b>OM = ½(a + b)</b>. A point P on AB with <b>AP : PB = m : n</b> has <b>AP = m/(m + n) × AB</b>, so <b>OP = a + m/(m + n)(b − a)</b>.</li></ul>
${fg(8,"Triangle OAB: OA = a, OB = b, AB = b − a, and the midpoint M has OM = ½(a + b)")}
<h4>Expressing vectors in terms of a and b ${E}</h4>
<ol><li>Find a route from the start to the end using vectors you know.</li><li>If you travel <b>along</b> an arrow, add the vector; if you travel <b>against</b> it, subtract the vector.</li><li>Simplify by collecting the a terms and b terms.</li></ol>
<p>📝 <b>Example:</b> OA = <b>a</b>, OB = <b>b</b>, and M is the midpoint of AB. AB = <b>b − a</b>; AM = ½(<b>b − a</b>); OM = <b>a</b> + ½(<b>b − a</b>) = <b>½(a + b)</b>.</p>
<p>📝 <b>Example (ratio):</b> P is on AB with AP : PB = 2 : 1. AP = ⅔(<b>b − a</b>). OP = <b>a</b> + ⅔(<b>b − a</b>) = <b>⅓a + ⅔b</b> = ⅓(<b>a + 2b</b>).</p>
<h4>Using vectors to reason ${E}</h4>
<ul><li><b>Parallel vectors:</b> one is a scalar multiple of the other. PQ = 2<b>a</b> + 4<b>b</b> and RS = <b>a</b> + 2<b>b</b> are parallel because PQ = 2 RS, and PQ is twice as long.</li>
<li><b>Collinear points</b> (on one straight line): show two vectors are parallel <b>and share a point</b>. 📝 If PQ = 2<b>a</b> + 4<b>b</b> and QR = <b>a</b> + 2<b>b</b>, then PQ = 2 QR. They are parallel and share Q, so <b>P, Q, R are collinear</b>.</li>
<li><b>Ratio and similarity:</b> X on OA with OX = ⅓ OA and Y on OB with OY = ⅓ OB. XY = Y − X = ⅓<b>b</b> − ⅓<b>a</b> = ⅓(<b>b − a</b>) = ⅓ AB. So XY is parallel to AB and one third of its length: triangles OXY and OAB are similar with scale factor ⅓ (Topic 4.4).</li>
<li>📝 <b>Parallelogram OABC</b> with OA = <b>a</b> and OC = <b>c</b>: OB = <b>a + c</b>. The midpoint of the diagonal OB is ½(<b>a + c</b>). The midpoint of the diagonal AC is <b>a</b> + ½(<b>c − a</b>) = ½(<b>a + c</b>). It is the same point, so <b>the diagonals bisect each other</b>.</li></ul>
${sim(sl("g1t","AP as a fraction of AB",0,1,0.5,0.1,"c7g"),"c7gg","c7go","c7g")}
<p>⚠️ <b>Exam trap:</b> Getting the direction wrong: <b>AB = b − a</b>, not a − b (end minus start). Writing |<b>a</b>| for a vector answer, or forgetting to <b>simplify</b>. To prove points are collinear, parallel is <b>not enough</b>: you also need a shared point.</p>
<h3>🔍 Topic 7 exam checklist</h3>
<ul><li>${C} Reflection in vertical and horizontal lines (give the equation); rotation about the origin, a vertex or an edge midpoint through multiples of 90° (angle, direction and centre); enlargement with positive and fractional scale factors (factor and centre); translation by a column vector. <b>One transformation at a time.</b></li><li>${E} Also: reflection in lines such as y = x and y = −x; rotation about any centre; negative scale factors; combinations of transformations; column vectors, addition, subtraction, scalar multiples; magnitude; position vectors and vector proofs (parallel, collinear, ratio).</li><li>Use a ruler for every straight edge and tracing paper for rotations.</li></ul>`,

return{t:"Topic 8: Probability (Cambridge 0580)",notes:`<span class="tag">Topic 8.1</span><h3>Introduction to probability (C8.1 and E8.1)</h3>
<p class="lg"><b>Key:</b> ${C} = Core content (Extended students must know it too). ${E} = Extended (Supplement) only. Followed section by section from the Cambridge 0580 syllabus for 2025, 2026 and 2027.</p>
<h4>Topic 8 at a glance: Core and Extended</h4>
<div class="wrap"><table><tr><th>Syllabus</th><th>Content</th><th>Core</th><th>Extended</th></tr>
<tr><td>8.1</td><td>Introduction to probability</td><td>Probability scale 0 to 1; single events; P(not A) = 1 − P(A). <b>Notation not required.</b> Venn diagrams with <b>two sets</b></td><td>Also <b>probability notation</b> P(A), P(A′); Venn diagrams from tables and graphs</td></tr>
<tr><td>8.2</td><td>Relative and expected frequencies</td><td>Relative frequency as an estimate; expected frequency; fair, bias, random</td><td>Same</td></tr>
<tr><td>8.3</td><td>Combined events</td><td>Sample space, Venn (two sets) and tree diagrams, <b>with replacement only</b></td><td>Also <b>without replacement</b>; notation P(A ∩ B) and P(A ∪ B)</td></tr>
<tr><td>8.4</td><td>Conditional probability</td><td><b>Not in Core</b></td><td>Using Venn diagrams, tree diagrams and tables. Notation P(A|B) is <b>not</b> required</td></tr></table></div>
<h4>The probability scale ${C}</h4>
<ul><li>A <b>probability</b> measures how likely an event is, from <b>0 (impossible)</b> to <b>1 (certain)</b>. It is never negative and never more than 1. Give it as a <b>fraction, decimal or percentage</b>.</li>
<li>For <b>equally likely</b> outcomes: <b>P(event) = number of favourable outcomes ÷ total number of outcomes</b>.</li>
<li><b>P(not A) = 1 − P(A)</b>. The probabilities of all the possible outcomes add up to <b>1</b>.</li></ul>
${fg(1,"The probability scale from impossible (0) to certain (1)")}
<p>📝 <b>Example:</b> A bag has 4 red, 3 blue and 5 green counters. P(red) = 4 ÷ 12 = <b>⅓</b>. P(not green) = 1 − 5/12 = <b>7/12</b>. P(yellow) = <b>0</b> (impossible).</p>
<p>📝 <b>Example:</b> The probability that a counter is blue is 0.8. The probability that it is not blue is 1 − 0.8 = <b>0.2</b>. Information may come from a <b>table, bar chart or Venn diagram</b>: find the total first.</p>
<h4>Probability notation ${E}</h4>
<ul><li>${E} <b>P(A)</b> is the probability of event A and <b>P(A′)</b> is the probability of <b>not</b> A, so P(A′) = 1 − P(A). 📝 If P(B) = 0.8, then P(B′) = 0.2.</li>
<li>${E} Venn diagrams are not limited to two sets for Extended (see Topic 1.2).</li></ul>
<p>⚠️ <b>Exam trap:</b> Writing a probability as a ratio (1 : 6) or as "1 in 6". Use <b>1/6, 0.167 or 16.7%</b>. Always simplify fractions, and never give an answer above 1.</p>
<span class="tag">Topic 8.2</span><h3>Relative and expected frequencies (C8.2 and E8.2)</h3>
<ul><li>${C} <b>Relative frequency = number of times the event happened ÷ total number of trials.</b> It is an <b>estimate</b> of the probability from an experiment. The <b>more trials</b>, the closer it usually gets to the true probability.</li>
<li>${C} <b>Expected frequency = number of trials × probability.</b> It is what you expect on average, not what must happen.</li>
<li>${C} <b>Fair</b> means every outcome is equally likely. <b>Biased</b> means some outcomes are more likely than others. <b>Random</b> means each outcome is unpredictable and no pattern controls it.</li></ul>
<p>📝 <b>Example:</b> A spinner is spun 150 times and lands on red 45 times: relative frequency = 45 ÷ 150 = <b>0.3</b>. For a fair die rolled 120 times, expected number of sixes = 120 × 1/6 = <b>20</b>.</p>
<p>📝 <b>Is it biased?</b> A die gives a six 90 times in 300 rolls. Relative frequency = 0.3, but a fair die gives 1/6 ≈ 0.167. With so many rolls this is a big difference, so the die is probably <b>biased</b>.</p>
${sim(sel("ra0","c8a",["experiment",[["0","fair coin: heads (p = 0.5)"],["1","fair die: a six (p = 1/6)"],["2","biased coin: heads (p = 0.7)"]]])+sl("ra1","trials",10,2000,50,10,"c8a")+'<button class="o" onclick="c8a()">Run again</button>',"c8ag","c8ao","c8a")}
<span class="tag">Topic 8.3</span><h3>Probability of combined events (C8.3 and E8.3)</h3>
<h4>Sample space diagrams ${C}</h4>
<ul><li>A <b>sample space diagram</b> lists <b>all</b> possible outcomes of two events (a table or grid). Count the outcomes that meet the condition and divide by the total.</li></ul>
${sim(sel("rb0","c8b",["event",[["e","sum is exactly"],["g","sum is at least"],["l","sum is at most"],["d","a double (ignore the slider)"]]])+sl("rb1","k",2,12,7,1,"c8b"),"c8bg","c8bo","c8b")}
<h4>Venn diagrams ${C}</h4>
<ul><li>${C} A Venn diagram (limited to <b>two sets</b> in Core) puts numbers in regions: <b>A only</b>, <b>both</b> (A ∩ B), <b>B only</b> and <b>neither</b> (outside both circles). Add all the numbers to get the total, then P = region ÷ total.</li>
<li>${E} Notation: <b>P(A ∩ B)</b> = probability of A <b>and</b> B (the overlap). <b>P(A ∪ B)</b> = probability of A <b>or</b> B (or both). <b>P(A ∪ B) = P(A) + P(B) − P(A ∩ B)</b>.</li></ul>
${sim(sl("rc1","A only",0,20,6,1,"c8c")+sl("rc2","both",0,20,4,1,"c8c")+sl("rc3","B only",0,20,5,1,"c8c")+sl("rc4","neither",0,20,5,1,"c8c"),"c8cg","c8co","c8c")}
<h4>Tree diagrams ${C} ${E}</h4>
<ul><li>${C} Draw a branch for each outcome and write the <b>probability on the branch</b> and the <b>outcome at the end</b>. <b>Multiply</b> along the branches for "and". <b>Add</b> the end results for "or". The branches from each point add to <b>1</b>.</li>
<li>${C} In Core, the second event is <b>with replacement</b>: the probabilities on the second set of branches are the <b>same</b> as the first.</li>
<li>${E} <b>Without replacement:</b> after an item is taken out, the total (and that colour) <b>changes</b>, so the second set of branch probabilities is different.</li></ul>
${fg(2,"Tree diagram: a bag with 3 red and 2 blue counters, two picks with replacement")}
<p>📝 <b>With replacement:</b> P(two reds) = 3/5 × 3/5 = <b>9/25</b>. P(one of each colour) = 3/5 × 2/5 + 2/5 × 3/5 = <b>12/25</b>.</p>
<p>📝 ${E} <b>Without replacement:</b> P(two reds) = 3/5 × 2/4 = <b>3/10</b>. P(different colours) = 3/5 × 2/4 + 2/5 × 3/4 = <b>3/5</b>.</p>
<p>⚠️ <b>Exam trap:</b> Adding along the branches instead of multiplying, forgetting a route when finding "one of each", and (without replacement) using the original total for the second pick.</p>
<span class="tag">Topic 8.4</span><h3>Conditional probability (E8.4, Extended only)</h3>
<p>${E} <b>This subtopic is not in the Core syllabus.</b> <b>Conditional probability</b> is the probability of an event <b>given that</b> another has already happened. The condition shrinks the sample space: the <b>total becomes the given group</b>. The notation P(A|B) is not required, so questions are written in words.</p>
<ul><li>${E} <b>From a Venn diagram or table:</b> restrict to the group in the condition. 📝 In a class of 30: 14 play football, 9 play tennis, 4 play both. P(tennis <b>given</b> football) = 4 ÷ 14 = <b>2/7</b> (not 4/30).</li>
<li>${E} <b>From a tree diagram (without replacement):</b> use the branch for the condition. 📝 A bag has 4 red and 6 blue. A counter is removed and is red. P(second red) = 3/9 = <b>1/3</b>.</li></ul>
${sim(sl("rd1","red counters",1,8,3,1,"c8d")+sl("rd2","blue counters",1,8,2,1,"c8d")+sel("rd3","c8d",["picks",[["0","with replacement"],["1","without replacement"]]]),"c8dg","c8do","c8d")}
<p>⚠️ <b>Exam trap:</b> Using the whole population as the total. "Given that" means the <b>total is only the people or items in the condition</b>.</p>
<h3>🔍 Topic 8 exam checklist</h3>
<ul><li>${C} Probability scale; P = favourable ÷ total; P(not A) = 1 − P(A); relative frequency and expected frequency; fair, biased, random; sample space diagrams; Venn diagrams (two sets); tree diagrams with replacement. Answers as fractions, decimals or percentages, simplified.</li><li>${E} Also: P(A), P(A′), P(A ∩ B), P(A ∪ B); three-set Venn diagrams; tree diagrams without replacement; conditional probability from Venn diagrams, trees and tables.</li></ul>`,

return{t:"Topic 9: Statistics (Cambridge 0580)",notes:`<span class="tag">Topic 9.1</span><h3>Classifying and tabulating data (C9.1 and E9.1)</h3>
<p class="lg"><b>Key:</b> ${C} = Core content (Extended students must know it too). ${E} = Extended (Supplement) only. Followed section by section from the Cambridge 0580 syllabus for 2025, 2026 and 2027.</p>
<h4>Topic 9 at a glance: Core and Extended</h4>
<div class="wrap"><table><tr><th>Syllabus</th><th>Content</th><th>Core</th><th>Extended</th></tr>
<tr><td>9.1</td><td>Classifying data</td><td>Classify and tabulate data (tally tables, two-way tables)</td><td>Same</td></tr>
<tr><td>9.2</td><td>Interpreting data</td><td>Read tables and diagrams, draw inferences, compare using <b>averages and range</b>, limits of conclusions</td><td>Same, comparing using <b>averages and measures of spread</b> (IQR)</td></tr>
<tr><td>9.3</td><td>Averages and spread</td><td>Mean, median, mode, range from a <b>list or frequency table</b>. <b>Never grouped.</b></td><td>Also quartiles and IQR; <b>estimate of the mean</b> from grouped data; modal class</td></tr>
<tr><td>9.4</td><td>Charts and diagrams</td><td>Bar (composite, dual), pie, pictogram, stem-and-leaf, simple frequency distributions</td><td>Same</td></tr>
<tr><td>9.5</td><td>Scatter diagrams</td><td>Draw, correlation, line of best fit by eye</td><td>Same</td></tr>
<tr><td>9.6</td><td>Cumulative frequency</td><td><b>Not in Core</b></td><td>Tables, curves, median, percentiles, quartiles, IQR</td></tr>
<tr><td>9.7</td><td>Histograms</td><td><b>Not in Core</b></td><td>Frequency density, unequal class widths</td></tr></table></div>
<p><b>Note:</b> box-and-whisker plots are <b>no longer</b> in the syllabus (removed for 2025 onwards). Data collection is part of the course but is not examined.</p>
<h4>Types of data ${C}</h4>
<ul><li><b>Categorical</b> (qualitative) data are labels or words: eye colour, type of transport.</li>
<li><b>Numerical</b> (quantitative) data are numbers. <b>Discrete</b> data are <b>counted</b> and take separate values only (number of siblings, shoe size). <b>Continuous</b> data are <b>measured</b> and can take any value in a range (height, mass, time).</li></ul>
<h4>Tally tables and two-way tables ${C}</h4>
<ul><li>In a <b>tally table</b> draw one stroke per item and cross out each group of five. The <b>frequency</b> is the number of items in each group. The total frequency is the number of items.</li>
<li>A <b>two-way table</b> shows two features at once. Rows and columns add to totals, so a missing value is found by <b>subtracting</b>.</li></ul>
<div class="wrap"><table><tr><th></th><th>Bus</th><th>Car</th><th>Walk</th><th>Total</th></tr><tr><td>Boys</td><td>12</td><td>7</td><td>?</td><td>25</td></tr><tr><td>Girls</td><td>9</td><td>?</td><td>8</td><td>30</td></tr><tr><td>Total</td><td>21</td><td>20</td><td>14</td><td>55</td></tr></table></div>
<p>📝 <b>Example:</b> Boys who walk = 25 − 12 − 7 = <b>6</b> (check: 14 − 8 = 6). Girls who come by car = 20 − 7 = <b>13</b> (check: 30 − 9 − 8 = 13).</p>
<span class="tag">Topic 9.2</span><h3>Interpreting statistical data (C9.2 and E9.2)</h3>
<ul><li>${C} <b>Read and interpret</b> values from tables and diagrams, find totals and differences, and <b>draw inferences</b> (a conclusion supported by the data).</li>
<li>${C} <b>Compare two data sets</b> with one <b>average</b> and one <b>measure of spread</b>, always <b>in context</b>. 📝 Class A: mean 62, range 40. Class B: mean 58, range 20. <i>Class A did better on average, but Class B was more consistent (smaller range).</i></li>
<li>${E} Compare using the <b>median and IQR</b>, which are not affected by extreme values.</li></ul>
<h4>Restrictions on conclusions ${C}</h4>
<ul><li><b>Sample size and bias:</b> a small or unrepresentative sample may not describe everyone.</li>
<li><b>Extrapolation:</b> predicting outside the range of the data assumes the trend continues, which may be false.</li>
<li><b>Correlation is not causation:</b> ice-cream sales and sunburn both rise in summer, but one does not cause the other.</li>
<li><b>Misleading graphs:</b> an axis that does not start at zero, uneven scales or 3D effects exaggerate differences.</li></ul>
<p>⚠️ <b>Exam trap:</b> Giving numbers without a comparison sentence. Use words such as "higher on average" and "more consistent", and mention the context.</p>
<span class="tag">Topic 9.3</span><h3>Averages and measures of spread (C9.3 and E9.3)</h3>
<h4>Mean, median, mode and range ${C}</h4>
<ul><li><b>Mean</b> = total of values ÷ number of values. <b>Median</b> = middle value of the <b>ordered</b> list (position (n + 1) ÷ 2; for an even number of values, halfway between the two middle ones). <b>Mode</b> = most common value (there may be none, or more than one). <b>Range</b> = largest − smallest.</li>
<li><b>From a frequency table:</b> mean = Σfx ÷ Σf (multiply each value by its frequency, add, then divide by the total frequency). The mode is the <b>value</b> with the highest frequency, not the frequency itself. Find the median position (Σf + 1) ÷ 2 using a running total of frequencies.</li></ul>
<p>📝 <b>Example:</b> Data 3, 5, 5, 7, 10: mean 30 ÷ 5 = <b>6</b>, median <b>5</b>, mode <b>5</b>, range <b>7</b>.</p>
<div class="wrap"><table><tr><th>x</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>Total</th></tr><tr><td>f</td><td>4</td><td>7</td><td>9</td><td>6</td><td>4</td><td>30</td></tr><tr><td>fx</td><td>4</td><td>14</td><td>27</td><td>24</td><td>20</td><td>89</td></tr></table></div>
<p>📝 Mean = 89 ÷ 30 = <b>2.97</b>. Median position (30 + 1) ÷ 2 = 15.5, so the 15th and 16th values: running totals 4, 11, 20 mean both are 3, median <b>3</b>. Mode = <b>3</b> (frequency 9 is the highest).</p>
<div class="wrap"><table><tr><th>Measure</th><th>Use it when</th><th>Weakness</th></tr><tr><td>Mean</td><td>Data are fairly symmetrical; every value should count</td><td>Pulled by extreme values (outliers)</td></tr><tr><td>Median</td><td>There are outliers or the data are skewed (salaries, house prices)</td><td>Does not use every value</td></tr><tr><td>Mode</td><td>You want the most popular choice (shoe size to stock)</td><td>May not exist, or may be several</td></tr><tr><td>Range</td><td>A quick measure of spread</td><td>Uses only the two extremes</td></tr></table></div>
${sim(sl("a1","last value",0,60,8,1,"c9a"),"c9ag","c9ao","c9a")}
<h4>Quartiles and interquartile range ${E}</h4>
<ul><li>${E} Put the data in order. The <b>lower quartile (LQ)</b> is the value at position (n + 1) ÷ 4 and the <b>upper quartile (UQ)</b> at position 3(n + 1) ÷ 4. If the position is not a whole number, go <b>halfway</b> between the two values either side.</li>
<li>${E} <b>IQR = UQ − LQ</b>: the spread of the middle 50% of the data. It is not affected by extreme values, so it is better than the range when there are outliers.</li></ul>
<p>📝 <b>Example:</b> 2, 4, 5, 7, 8, 10, 12, 13, 15 (n = 9). Median = 5th value = <b>8</b>. LQ position 2.5: halfway between 4 and 5 = <b>4.5</b>. UQ position 7.5: halfway between 12 and 13 = <b>12.5</b>. IQR = 12.5 − 4.5 = <b>8</b>.</p>
<h4>Grouped data ${E}</h4>
<ul><li>${E} The exact values are not known, so you can only <b>estimate</b> the mean: <b>estimated mean = Σ(f × midpoint) ÷ Σf</b>, where midpoint = (lower + upper boundary) ÷ 2.</li>
<li>${E} The <b>modal class</b> is the class with the highest frequency.</li></ul>
<div class="wrap"><table><tr><th>Height h (cm)</th><th>f</th><th>Midpoint</th><th>f × midpoint</th></tr><tr><td>140 &lt; h ≤ 150</td><td>4</td><td>145</td><td>580</td></tr><tr><td>150 &lt; h ≤ 160</td><td>10</td><td>155</td><td>1550</td></tr><tr><td>160 &lt; h ≤ 170</td><td>14</td><td>165</td><td>2310</td></tr><tr><td>170 &lt; h ≤ 180</td><td>2</td><td>175</td><td>350</td></tr><tr><td><b>Total</b></td><td><b>30</b></td><td></td><td><b>4790</b></td></tr></table></div>
<p>📝 Estimated mean = 4790 ÷ 30 = <b>159.7 cm</b>. Modal class: <b>160 &lt; h ≤ 170</b>.</p>
${sim(sl("b1","0–10",0,20,2,1,"c9b")+sl("b2","10–20",0,20,6,1,"c9b")+sl("b3","20–30",0,20,10,1,"c9b")+sl("b4","30–40",0,20,7,1,"c9b")+sl("b5","40–50",0,20,3,1,"c9b"),"c9bg","c9bo","c9b")}

<span class="tag">Topic 9.4</span><h3>Statistical charts and diagrams (C9.4 and E9.4)</h3>
