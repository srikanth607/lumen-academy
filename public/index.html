olume of DCPIP.</li></ul><h3>Safety and accuracy</h3><ul><li>Wear eye protection, take care with hot water baths and flammable ethanol, and use fresh reagents. Use a control (water) so you can compare the result with a negative test.</li><li><span class="xt">EXT</span><b>DNA</b> is the molecule of heredity. Each strand has a sugar-phosphate backbone with a base attached. The two strands form a double helix like a twisted ladder, with the base pairs as the rungs. Because A always pairs with T and C with G (complementary base pairing), one strand can be used to build the other, which is how DNA copies itself accurately.</li><li><span class="xt">EXT</span>The <b>sequence of bases</b> along a gene codes for the sequence of amino acids in a protein, so DNA controls the production of proteins (see Topic 17).</li></ul><h3>Common exam mistakes</h3><ul><li>Saying a positive Benedict’s result is “red” without heating.</li><li>Forgetting that the biuret test turns purple, not blue (blue is the negative result).</li><li>Mixing up DCPIP: the colour disappears, it does not turn blue.</li></ul><h3>Dietary sources and uses (links to Topic 7)</h3><div class="wrap"><table><tr><th>Molecule</th><th>Good sources</th><th>Main uses</th></tr><tr><td>Carbohydrate</td><td>Rice, bread, potatoes, fruit</td><td>Energy; fibre in plant walls</td></tr><tr><td>Fat / oil</td><td>Butter, nuts, oily fish, vegetable oil</td><td>Energy store, insulation, cell membranes</td></tr><tr><td>Protein</td><td>Meat, fish, eggs, beans, milk</td><td>Growth and repair, enzymes, antibodies</td></tr><tr><td>Vitamin C</td><td>Citrus fruit, peppers</td><td>Healthy skin and gums</td></tr></table></div><h3>Interpreting food test results</h3><ul><li>A food gives a brick-red precipitate with Benedict’s, a purple colour with biuret and stays brown with iodine: it contains reducing sugar and protein but no starch.</li><li>A solution that stays blue with Benedict’s may still contain sucrose (not a reducing sugar). Boiling with dilute acid, neutralising with alkali and retesting would then give a colour change.</li><li>In the DCPIP test, juice A decolourises 1 cm³ DCPIP after 4 drops and juice B after 10 drops: juice A has more vitamin C.</li></ul><h3>Remember</h3><ul><li><b>Polymer idea:</b> glucose units join to make starch, glycogen and cellulose; amino acids join to make proteins; fatty acids and glycerol join to make fats. Different proteins have different amino acid sequences, giving different shapes and functions (extended in Topic 17).</li><li>The test results come from the <b>type</b> of molecule, not the amount; the colour change intensity can show how much is present.</li></ul>`,kw:[["Carbohydrate", "Compound of carbon, hydrogen and oxygen, e.g. starch and glucose."], ["Protein", "Large molecule made of amino acids."], ["Amino acid", "Small molecule from which proteins are made."], ["Fat", "Lipid made of fatty acids and glycerol."], ["Glucose", "A simple sugar, building block of starch, glycogen and cellulose."], ["Starch", "Plant storage carbohydrate made from glucose."], ["Glycogen", "Animal storage carbohydrate made from glucose."], ["Cellulose", "Carbohydrate from glucose that forms plant cell walls."], ["Reducing sugar", "Sugar that turns Benedict’s solution orange-red on heating."], ["Biuret test", "Test for protein, turns purple."], ["DCPIP", "Blue dye decolourised by vitamin C."], ["DNA", "Double helix molecule carrying genetic information."], ["Base pairs", "A pairs with T; C pairs with G."]],f:["Starch → glucose; protein → amino acids; fat → 3 fatty acids + glycerol", "DNA: A–T, C–G"],qa:[["Name the test for protein and the positive result.", "Biuret; turns purple."], ["Which elements are in proteins but not carbohydrates?", "Nitrogen (and sometimes sulfur)."], ["(Extended) How are the strands of DNA held together?", "By bonds between pairs of bases, A with T and C with G."]],mcq:[["Iodine turns blue-black with…", ["glucose", "starch", "protein"], 1, "Starch test."], ["Fats are made of…", ["amino acids", "glucose", "fatty acids and glycerol"], 2, "Triglycerides."], ["Which base pairs with C?", ["A", "G", "T"], 1, "C–G."]]},
{t:"Topic 5: Enzymes (Cambridge 0610)",notes:`
<span class="tag">Topic 5.1</span><h3>Enzymes</h3>
<p class="lg"><b>Key:</b> <span class="xt">EXT</span> = Extended (Supplement) only. No tag = Core (Extended students need it too).</p>
<ul><li>A <b>catalyst</b> is a substance that increases the rate of a chemical reaction and is <b>not changed</b> by the reaction.</li><li><b>Enzymes</b> are <b>proteins</b> involved in all metabolic reactions, where they function as biological catalysts.</li><li><b>Importance:</b> enzymes make reactions fast enough to sustain life at body temperature (reaction rate necessary for life).</li><li><b>Enzyme action:</b> the shape of the <b>active site</b> is <b>complementary</b> to the shape of its <b>substrate</b>. The substrate fits into the active site and products form.</li><li><b>Temperature and pH (practical):</b> activity rises with temperature up to an <b>optimum temperature</b> (about 37 °C in humans) then falls rapidly as the enzyme is <b>denatured</b> (the shape of the active site changes permanently). Each enzyme has an optimum pH; away from it, activity falls and extremes denature the enzyme.</li><li><b>Investigations:</b> catalase (hydrogen peroxide giving oxygen bubbles), amylase and starch (iodine every 30 s to find the time for the colour to stop turning blue-black).</li><li><span class="xt">EXT</span><b>Enzyme–substrate complex:</b> substrate binds to active site, forming the complex, then product(s) are released and the enzyme is unchanged.</li><li><span class="xt">EXT</span><b>Specificity:</b> each enzyme works on one substrate because only that substrate has a shape complementary to the active site (lock-and-key).</li><li><span class="xt">EXT</span><b>Effect of temperature (explain):</b> low temperature: low kinetic energy, fewer collisions, fewer <b>effective collisions</b> so slow. Increasing temperature: more kinetic energy, more frequent effective collisions, rate rises. Above optimum: bonds in the enzyme break, shape of active site changes, substrate no longer fits (<b>denaturation</b>), rate drops to zero.</li><li><span class="xt">EXT</span><b>Effect of pH (explain):</b> extreme pH changes the enzyme’s shape and the fit of the active site, so the enzyme is denatured. Examples: pepsin optimum pH about 2; amylase about 7; trypsin about 8.</li></ul><p>p <b>Exam tip:</b> never say the enzyme is “killed”: enzymes are not alive. Say “denatured”.</p><h3>Why enzymes matter</h3><ul><li>Reactions in cells would be too slow at body temperature without catalysts. Heating cells to speed reactions would destroy them, so enzymes allow rapid reactions at moderate temperatures. Every metabolic reaction (respiration, digestion, protein synthesis, photosynthesis) is controlled by an enzyme.</li><li>Enzymes are not used up, so a small amount can work again and again. They are reusable.</li></ul><h3>Names and jobs of key enzymes</h3><ul><li><b>Amylase</b>: starch → sugars (salivary glands, pancreas). <b>Protease</b>: proteins → amino acids. <b>Lipase</b>: fats → fatty acids and glycerol. <b>Catalase</b>: hydrogen peroxide → water + oxygen. <b>Pectinase</b> and <b>lactase</b> are used in industry (Topic 21).</li></ul><h3>How an enzyme works</h3><ul><li>Enzyme molecules are made of a long chain of amino acids folded into a specific 3-D shape. The part where the substrate binds is the <b>active site</b>. Only a substrate with a complementary shape fits.</li><li>The enzyme can build large molecules from small ones or break big molecules into small ones.</li></ul><h3>Practical: effect of temperature</h3><ul><li>Mix amylase and starch in test tubes at different temperatures (e.g. 10, 20, 30, 40, 50, 60 °C in water baths). Take samples at timed intervals to test with iodine on a spotting tile. The time at which iodine stops turning blue-black is the end point. Rate = 1 ÷ time.</li><li>Control variables: volume and concentration of enzyme and substrate, pH, using a buffer. Repeat for reliability.</li><li>Result: rate increases up to the optimum then falls; plot a graph of rate (y) against temperature (x): a bell-shaped curve.</li></ul><h3>Practical: effect of pH</h3><ul><li>Use buffer solutions of different pH with the same enzyme and substrate. Amylase works best at pH 7, pepsin at pH 2. At extreme pH the enzyme is denatured.</li><li><span class="xt">EXT</span><b>Effective collisions:</b> a reaction happens only when substrate and active site collide with enough energy and the right orientation. At higher temperatures, molecules move faster so collisions are more frequent and more of them are effective. Rate roughly doubles for every 10 °C rise below the optimum.</li><li><span class="xt">EXT</span><b>Denaturation is permanent.</b> After denaturation cooling does not restore the enzyme, because the shape has changed irreversibly. Low temperature only slows an enzyme (inactive, not denatured) and the enzyme works again when warmed.</li><li><span class="xt">EXT</span><b>Interpreting graphs:</b> before the peak the rate rises because of increasing kinetic energy; the peak is the optimum; after it the rate drops sharply due to denaturation. For pH graphs the curve rises, peaks at the optimum pH and falls on both sides.</li></ul><h3>Common exam mistakes</h3><ul><li>Saying enzymes are “killed” or “die”. They are denatured.</li><li>Saying the substrate “has the same shape” as the active site. The shape is complementary (fits).</li><li>Saying a low temperature denatures the enzyme. It only slows down.</li></ul><h3>Summary</h3><p>p Enzymes are protein catalysts. They work by complementary shape (active site and substrate), are specific, have optimum temperature and pH, and are denatured by heat and extreme pH.</p><h3>Worked questions</h3><ul><li><b>Q:</b> An enzyme works fastest at 40 °C. Explain why activity is zero at 80 °C. <b>A:</b> the high temperature breaks bonds in the enzyme, the active site changes shape and the substrate no longer fits: the enzyme is denatured.</li><li><b>Calculating rate:</b> if starch disappears after 120 s at 30 °C and 60 s at 40 °C, rate = 1 ÷ time = 0.0083 per s and 0.0167 per s. The rate doubled for a 10 °C rise.</li><li><b>Q:</b> Why does an enzyme not work at 0 °C? <b>A:</b> molecules have very little kinetic energy so there are very few collisions; it is inactive but not denatured.</li><li><b>Describing a graph:</b> state the trend, quote values, and give the reason. “Rate increases from 10 °C to 40 °C, from 2 to 9 units, because the molecules have more kinetic energy; then decreases to 0 at 70 °C because the enzyme is denatured.”</li></ul><h3>Enzymes in the body (links forward)</h3><ul><li>Digestive enzymes (amylase, protease, lipase) break large insoluble molecules into small soluble ones (Topic 7). Enzymes also build molecules: protein synthesis in ribosomes, photosynthesis (Topic 6), respiration (Topic 12).</li><li>Industrial uses: biological washing powders, pectinase in fruit juice, lactase in lactose-free milk (Topic 21).</li></ul><div style="border:1.5px dashed var(--pr);border-radius:14px;padding:12px;margin:12px 0"><b>🧪 Simulation: enzyme activity</b><br>Temperature <b id="ev">37</b> °C <input id="et" type="range" min="0" max="80" value="37" style="width:100%" oninput="bioEnz()"><div style="background:var(--bd);border-radius:8px;height:16px"><div id="eb" style="height:16px;border-radius:8px;background:var(--pr);width:97%"></div></div><div id="eo">Near the optimum.</div></div>`,kw:[["Catalyst", "Substance that increases the rate of a reaction and is not changed by it."], ["Enzyme", "Protein that acts as a biological catalyst."], ["Substrate", "Molecule that an enzyme acts on."], ["Product", "Molecule formed by an enzyme-catalysed reaction."], ["Active site", "Region of an enzyme where the substrate binds."], ["Enzyme–substrate complex", "Enzyme and substrate temporarily joined at the active site."], ["Specificity", "Each enzyme works on only one substrate because of complementary shape."], ["Optimum temperature", "Temperature at which an enzyme works fastest."], ["Denaturation", "Permanent change of an enzyme’s shape, so the active site no longer fits."], ["Metabolic reaction", "Chemical reaction in a living cell."]],f:["Rate rises to optimum then falls: denaturation", "Substrate + enzyme → enzyme–substrate complex → product + enzyme"],qa:[["What is a catalyst?", "A substance that speeds up a reaction and is not changed by it."], ["Why is an enzyme specific?", "Its active site is complementary in shape to only one substrate."], ["(Extended) Explain why rate falls above the optimum temperature.", "The enzyme is denatured; the active site changes shape so the substrate cannot fit."]],mcq:[["Enzymes are…", ["lipids", "proteins", "starch"], 1, "Biological catalysts."], ["Denaturation changes the…", ["substrate", "active site shape", "product"], 1, "Shape lost permanently."], ["At low temperature enzyme activity is low because…", ["denaturation", "few effective collisions", "active site changes"], 1, "Low kinetic energy."]]},
{t:"Topic 6: Plant nutrition (Cambridge 0610)",notes:`
<span class="tag">Topic 6.1</span><h3>Photosynthesis</h3>
<p class="lg"><b>Key:</b> <span class="xt">EXT</span> = Extended (Supplement) only. No tag = Core.</p>
<ul><li><b>Photosynthesis</b> is the process by which plants <b>synthesise carbohydrates from raw materials using energy from light</b>. Plants are producers: nearly all food chains start with photosynthesis.</li><li><b>Word equation:</b> carbon dioxide + water → glucose + oxygen, in the presence of <b>light</b> and <b>chlorophyll</b>.</li><li><b>Chlorophyll</b> is a green pigment found in <b>chloroplasts</b>. It absorbs light and <b>transfers energy from light into energy in chemicals</b> used to make carbohydrates. Chlorophyll reflects green light, which is why leaves look green.</li><li><span class="xt">EXT</span><b>Balanced equation:</b> 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂ (light, chlorophyll).</li><li><span class="xt">EXT</span>Remember: the energy stored in glucose came from light; the oxygen released comes from the water.</li></ul><h3>Raw materials</h3><ul><li><b>Carbon dioxide</b> enters through the stomata by diffusion. <b>Water</b> is absorbed by root hairs and carried in the xylem. Light comes from the Sun.</li></ul><h3>Use and storage of the carbohydrates made</h3><ul><li><b>Starch</b> as an energy store (insoluble, so it does not affect water potential); <b>cellulose</b> to build cell walls; <b>glucose</b> used in respiration to provide energy; <b>sucrose</b> for transport in the phloem; <b>nectar</b> (sugars) to attract insects for pollination.</li><li>Fats and oils are also made from glucose and stored in seeds. Starch is found in leaves, roots, tubers, seeds.</li><li><span class="xt">EXT</span><b>Mineral ions:</b> <b>nitrate ions</b> are needed to make <b>amino acids</b> (and so proteins); <b>magnesium ions</b> are needed to make <b>chlorophyll</b>. Nitrate deficiency gives stunted growth and yellow older leaves; magnesium deficiency gives yellow leaves (chlorosis).</li></ul><h3>Practical investigations</h3><ul><li><b>Need for chlorophyll:</b> use a variegated leaf (green and white). Boil the leaf in water to kill it, then in hot ethanol (in a water bath, no flame) to remove chlorophyll, rinse in water, add iodine. Green areas turn blue-black (starch present); white areas stay brown.</li><li><b>Need for light:</b> cover part of a destarched leaf with foil or a black stencil. Test after some hours: only the lit area contains starch.</li><li><b>Need for carbon dioxide:</b> place a destarched plant in a sealed bag or jar with soda lime/potassium hydroxide to absorb CO₂ (control: sodium hydrogencarbonate). Test leaf for starch.</li><li>Always use a <b>control</b> and destarch the plant first by keeping it in the dark for 24–48 hours.</li><li><b>Rate of photosynthesis (aquatic plant such as <i>Elodea</i>):</b> count bubbles of oxygen per minute or collect the gas. Vary light intensity by moving a lamp (distance), vary CO₂ with sodium hydrogencarbonate concentration, vary temperature with a water bath. Keep other factors constant.</li><li><b>Hydrogencarbonate indicator:</b> it is red/orange in air-equilibrium CO₂ level, turns <b>yellow</b> when CO₂ increases and <b>purple</b> when CO₂ decreases. Tubes with a water plant in the light go purple (CO₂ used in photosynthesis); in the dark they go yellow (CO₂ released in respiration).</li></ul><h3>Limiting factors</h3><ul><li>A <b>limiting factor</b> is the factor in shortest supply that limits the rate. Light intensity, carbon dioxide concentration and temperature all affect the rate: increasing the limiting factor increases the rate until another factor becomes limiting, giving a graph that rises then levels off.</li><li>Temperature: rate rises with temperature up to about 35–40 °C then falls as the enzymes involved are denatured.</li><li><span class="xt">EXT</span><b>Identify and explain limiting factors in different conditions:</b> at night, light is limiting. On a bright cold day temperature is limiting. In a greenhouse on a sunny day carbon dioxide may be limiting. When the graph has levelled off, a factor other than the one on the x-axis is limiting.</li><li><span class="xt">EXT</span>Growers raise yields in greenhouses by adding light, warming and enriching the air with CO₂.</li></ul><p>p <b>Exam tips:</b> do not say light is “used up”; say it is the limiting factor. When describing a graph, say what is limiting at each stage and why.</p>
<h3>Understanding photosynthesis step by step</h3><ul><li>Light is absorbed by chlorophyll in the chloroplasts. The energy is used to join carbon dioxide and water into glucose. Oxygen is released as a by-product and leaves through the stomata (some is used in respiration).</li><li>Photosynthesis is an <b>endothermic</b> reaction: it takes in energy. Respiration is the reverse and releases it. During the day a plant does both; in bright light photosynthesis is faster, so oxygen is released overall. At the <b>compensation point</b> the two rates are equal and there is no net gas exchange.</li><li>Plants make their own food by photosynthesis (producers) while animals must eat plants or other animals (consumers). All the energy in food chains originally comes from light trapped by plants.</li></ul><h3>Where the glucose goes</h3><ul><li>Immediate use in respiration; conversion to <b>starch</b> for storage in leaves and storage organs; to <b>cellulose</b> for cell walls during growth; to <b>sucrose</b>, a transport sugar, taken to growing areas in the phloem; to <b>fats and oils</b> in seeds (more energy per gram); to <b>amino acids and proteins</b> by adding nitrogen from nitrate; to <b>nectar</b> to attract pollinators.</li><li>Why store as starch? It is <b>insoluble</b>, so it does not dissolve in the cell sap, does not change water potential and does not cause osmosis.</li></ul><h3>Detailed practical: testing a leaf for starch</h3><ul><li>1) Dip the leaf in boiling water for 30 s (kills the leaf, stops reactions and softens it). 2) Turn off the flame, then place the leaf in hot ethanol in a boiling tube in the hot water (ethanol is flammable) to remove chlorophyll. 3) Rinse in warm water to soften. 4) Spread on a white tile and add iodine solution. 5) Blue-black = starch present.</li><li><b>Controls:</b> a leaf from the same plant kept in the dark, a leaf with no covering, a pot with sodium hydrogencarbonate. A control leaf shows that the result is due to the factor being tested.</li><li><b>Conclusions:</b> variegated leaf: no starch in white parts, so chlorophyll is needed. Foil-covered part: no starch, so light is needed. Plant with soda lime: no starch, so CO₂ is needed.</li></ul><h3>Practical: rate of photosynthesis in pondweed</h3><ul><li>Place <i>Elodea</i> under a funnel in a beaker of water with sodium hydrogencarbonate. Count the bubbles from the cut stem in one minute at different distances from a lamp (10, 20, 30, 40, 50 cm). Allow 2 minutes to settle at each distance and repeat to find a mean.</li><li>Light intensity is proportional to 1 ÷ distance². Doubling the distance reduces the light to one quarter.</li><li>Use a water bath or beaker of water between lamp and plant as a heat shield so the temperature stays constant.</li><li><b>Graph:</b> rate increases as the lamp moves closer, then levels off when another factor limits the rate.</li><li><span class="xt">EXT</span><b>Reading limiting factor graphs:</b> on the rising part of a light intensity graph light is limiting. On the flat part something else (CO₂ or temperature) is limiting. Raising CO₂ and replotting gives a curve with a higher plateau, proving CO₂ was limiting the first plateau.</li><li><span class="xt">EXT</span><b>At high temperature</b> the rate falls because the enzymes controlling photosynthesis are denatured, not because the plant is “too hot to photosynthesise”.</li><li><span class="xt">EXT</span><b>Nitrate and magnesium deficiency in practice:</b> plants grown in a culture solution without nitrate show stunted growth and yellowing of older leaves; without magnesium the older leaves go yellow because chlorophyll cannot be made, so less photosynthesis occurs.</li></ul><h3>Common exam mistakes</h3><ul><li>Using “sunlight” instead of “light energy”. Plants also photosynthesise in artificial light.</li><li>Saying plants photosynthesise in the day and respire at night. They respire all the time.</li><li>Writing the equation backwards (that is respiration).</li></ul><span class="tag">Topic 6.2</span><h3>Leaf structure</h3>
<ul><li>Most leaves have a <b>large surface area</b> (to absorb as much light as possible) and are <b>thin</b> (so gases do not have far to diffuse and light reaches all the cells).</li><li>Identify in a leaf of a dicotyledon: <b>cuticle, upper epidermis, palisade mesophyll, spongy mesophyll, air spaces, lower epidermis, guard cells and stomata, vascular bundles (xylem and phloem)</b> and <b>chloroplasts</b>.</li></ul><div class="wrap"><table><tr><th>Structure</th><th>How it is adapted for photosynthesis</th></tr><tr><td>Cuticle</td><td>Waxy, waterproof layer reduces water loss; transparent so light passes through</td></tr><tr><td>Upper epidermis</td><td>Thin and transparent: lets light through to palisade cells</td></tr><tr><td>Palisade mesophyll</td><td>Tall, packed closely, many chloroplasts near the top where there is most light</td></tr><tr><td>Spongy mesophyll</td><td>Rounded cells with air spaces between, allowing gas diffusion; some chloroplasts</td></tr><tr><td>Air spaces</td><td>Large internal surface area for gas exchange; CO₂ diffuses to cells and O₂ leaves</td></tr><tr><td>Stomata and guard cells</td><td>Stomata are pores for gas exchange; guard cells open and close them (open in light, closed in dark or when short of water)</td></tr><tr><td>Xylem</td><td>Brings water and mineral ions to the leaf (and supports)</td></tr><tr><td>Phloem</td><td>Carries sucrose and amino acids away from the leaf</td></tr><tr><td>Chloroplasts</td><td>Contain chlorophyll to absorb light</td></tr></table></div><ul><li>Most stomata are on the <b>lower epidermis</b>, where it is cooler and less water vapour is lost.</li></ul><h3>Common exam mistakes</h3><ul><li>Saying the leaf is “thin to catch more light”: thin means a short diffusion distance; the large flat surface catches light.</li><li>Saying stomata “absorb” carbon dioxide; they are pores through which CO₂ diffuses.</li></ul><h3>Summary</h3><p>p Leaves are thin, flat, transparent on top, packed with chloroplasts in palisade cells and have air spaces and stomata for gas exchange.</p><div style="margin:10px 0"><svg viewBox="0 0 420 190" style="max-width:100%;height:auto" role="img" aria-label="Leaf cross-section"><g font-size="11" fill="currentColor"><rect x="20" y="20" width="300" height="14" fill="#cfe9a8" stroke="#6a9"/><text x="330" y="31">Upper epidermis (cuticle on top)</text><rect x="20" y="36" width="300" height="42" fill="#7cc47a" stroke="#2a7"/><text x="330" y="60">Palisade mesophyll (chloroplasts)</text><rect x="20" y="80" width="300" height="50" fill="#b9dfa0" stroke="#6a9"/><text x="330" y="108">Spongy mesophyll + air spaces</text><rect x="20" y="132" width="300" height="14" fill="#cfe9a8" stroke="#6a9"/><text x="330" y="143">Lower epidermis</text><rect x="135" y="130" width="26" height="18" fill="#fff" stroke="#3a3cf0"/><text x="125" y="165">Stomata + guard cells</text><circle cx="230" cy="100" r="14" fill="#fff" stroke="#e77"/><text x="205" y="104" font-size="10">xylem/phloem</text></g></svg></div><h3>A tour through the leaf</h3><ul><li>Light reaches the leaf and passes through the <b>transparent cuticle and upper epidermis</b> (which contain no chloroplasts) to the <b>palisade layer</b> where most photosynthesis happens. The <b>spongy mesophyll</b> beneath has fewer chloroplasts.</li><li><b>Gas exchange:</b> CO₂ diffuses in through the stomata, through the air spaces and dissolves in the film of water around the mesophyll cells and diffuses into the cells. Oxygen and water vapour diffuse out the same route. Stomata are the exit point for transpiration too.</li><li><b>Guard cells:</b> they are the only epidermal cells with chloroplasts. When they are turgid they bend apart and open the stoma; when they lose water they become flaccid and the stoma closes. Closing in the dark or in drought reduces water loss.</li><li><b>Vascular bundle:</b> <b>xylem</b> brings water and mineral ions in the veins; <b>phloem</b> removes the sucrose and amino acids. Veins also support the leaf and spread to all parts so no cell is far from water.</li></ul><h3>Why a large thin leaf?</h3><ul><li>A <b>large surface area to volume ratio</b> traps the maximum light; being thin gives a short diffusion distance so CO₂ reaches all the cells and light reaches all the chloroplasts.</li><li>Leaves are arranged to avoid shading each other (leaf mosaic) so each receives light.</li></ul><h3>How to identify structures in a diagram or photomicrograph</h3><ul><li>Top to bottom: cuticle (thin line), upper epidermis (one layer of brick-shaped cells), palisade (tall cells with green dots), spongy (round cells with gaps), lower epidermis with stomata and guard cells (kidney shaped). The vascular bundle is a ring of cells: xylem above and phloem below.</li></ul><h3>Practical: observing stomata</h3><ul><li>Paint clear nail varnish on the lower leaf, peel and view the impression under a microscope to count stomata per field of view. Lower epidermis has more than the upper.</li></ul><h3>Extension idea (not examinable beyond the list)</h3><ul><li>Hydrophytes and xerophytes (Topic 18) show leaf adaptations to wet and dry places, e.g. a thick waxy cuticle and sunken stomata in dry habitats.</li></ul><h3>Common exam mistakes</h3><ul><li>Putting chloroplasts in the epidermis (only guard cells have them).</li><li>Mixing up palisade (tall, near top) and spongy (rounded, near bottom).</li></ul><h3>Summary</h3><p>p Leaf structure = high light capture + short diffusion paths + water supply + export of sugars.</p><div style="border:1.5px dashed var(--pr);border-radius:14px;padding:12px;margin:12px 0"><b>🧪 Simulation: limiting factors of photosynthesis</b><br>Light <input id="pl" type="range" min="0" max="100" value="30" style="width:100%" oninput="bioPh()"> CO₂ <input id="pc" type="range" min="0" max="100" value="60" style="width:100%" oninput="bioPh()"> Temperature <b id="ptv">25</b> °C <input id="pt" type="range" min="0" max="60" value="25" style="width:100%" oninput="bioPh()"><div style="background:var(--bd);border-radius:8px;height:16px"><div id="pb" style="height:16px;border-radius:8px;background:var(--pr);width:30%"></div></div><div id="po6">Light is the limiting factor.</div></div>`,kw:[["Photosynthesis", "Process by which plants make carbohydrates from carbon dioxide and water using light energy."], ["Chlorophyll", "Green pigment in chloroplasts that absorbs light."], ["Chloroplast", "Organelle containing chlorophyll where photosynthesis occurs."], ["Limiting factor", "Factor in shortest supply that limits the rate of a process."], ["Stomata", "Pores in the leaf epidermis through which gases diffuse."], ["Guard cells", "Pair of cells that open and close a stoma."], ["Palisade mesophyll", "Layer of tall cells with many chloroplasts, the main site of photosynthesis."], ["Spongy mesophyll", "Loosely packed cells with air spaces for gas exchange."], ["Cuticle", "Waxy waterproof layer on the leaf surface."], ["Hydrogencarbonate indicator", "Indicator showing CO₂ level: yellow if more, purple if less."], ["Nitrate ions", "Needed to make amino acids."], ["Magnesium ions", "Needed to make chlorophyll."], ["Destarch", "Keep a plant in the dark so the leaves use up stored starch."]],f:["CO₂ + water → glucose + oxygen (light, chlorophyll)", "6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂"],qa:[["State the word equation for photosynthesis.", "Carbon dioxide + water → glucose + oxygen, in the presence of light and chlorophyll."], ["Why are palisade cells near the top of the leaf?", "They contain many chloroplasts and receive the most light there."], ["Why is a variegated leaf used?", "To show that chlorophyll is needed: only green parts make starch."], ["(Extended) Why does the rate level off when light intensity is increased?", "Another factor, such as CO₂ or temperature, is limiting."], ["(Extended) Why are nitrate ions needed?", "To make amino acids and so proteins."]],mcq:[["Which gas diffuses into a leaf in the light?", ["Oxygen", "Carbon dioxide", "Nitrogen"], 1, "CO₂ is used."], ["Hydrogencarbonate indicator turns purple when CO₂…", ["increases", "decreases", "is constant"], 1, "Photosynthesis removes CO₂."], ["Starch is stored because it is…", ["soluble", "insoluble", "sweet"], 1, "Insoluble."]]},
{t:"Topic 7: Human nutrition (Cambridge 0610)",notes:`
<span class="tag">Topic 7.1</span><h3>Diet</h3>
<p class="lg"><b>Key:</b> <span class="xt">EXT</span> = Extended (Supplement) only. No tag = Core.</p>
<ul><li>A <b>balanced diet</b> contains all the nutrients in the correct proportions for health: carbohydrates, fats, proteins, vitamins, mineral ions, fibre and water, with the right amount of energy for the person’s age, sex and activity.</li></ul><div class="wrap"><table><tr><th>Nutrient</th><th>Main sources</th><th>Importance</th></tr><tr><td>Carbohydrates</td><td>Bread, rice, potatoes, pasta</td><td>Main energy source</td></tr><tr><td>Fats and oils</td><td>Butter, oils, nuts, oily fish</td><td>Energy store, insulation, protection of organs</td></tr><tr><td>Proteins</td><td>Meat, fish, eggs, beans</td><td>Growth and repair, enzymes</td></tr><tr><td>Vitamin C</td><td>Citrus fruits, vegetables</td><td>Healthy skin, gums and tissue repair</td></tr><tr><td>Vitamin D</td><td>Oily fish, eggs, margarine; made in skin in sunlight</td><td>Helps absorb calcium for bones and teeth</td></tr><tr><td>Calcium</td><td>Milk, cheese, fish bones</td><td>Strong bones and teeth</td></tr><tr><td>Iron</td><td>Red meat, spinach, liver</td><td>Makes haemoglobin in red blood cells</td></tr><tr><td>Fibre (roughage)</td><td>Vegetables, wholegrain cereals</td><td>Provides bulk so peristalsis moves food; prevents constipation</td></tr><tr><td>Water</td><td>Drinks, food</td><td>Solvent for reactions and transport; needed in all cells</td></tr></table></div><ul><li><b>Scurvy</b> is caused by a lack of <b>vitamin C</b> (bleeding gums, poor wound healing). <b>Rickets</b> is caused by a lack of <b>vitamin D</b> (and calcium), giving soft, bendy bones in children.</li><li>Iron deficiency causes anaemia (tiredness) because fewer red blood cells can be made.</li></ul><p>p Energy needs vary: teenagers, pregnant women, breast-feeding mothers and active people need more. Too much energy food leads to obesity and increases the risk of heart disease and type 2 diabetes.</p>
<h3>Nutrients in more detail</h3><ul><li><b>Carbohydrates:</b> starch and sugars give energy (about 17 kJ per g). <b>Fats:</b> give twice as much energy per gram (about 37 kJ per g) and insulate. <b>Protein:</b> used mainly for growth and repair; excess amino acids are broken down in the liver (deamination).</li><li><b>Fibre</b> is not digested (it is cellulose from plant cell walls). It gives bulk, helps peristalsis and prevents constipation and may reduce bowel disease.</li><li><b>Water:</b> needed to dissolve substances and transport them; about 70% of the body by mass; lost in sweat, urine, breath and faeces and must be replaced.</li><li><b>Vitamins and minerals</b> are needed in small amounts; they are not sources of energy.</li></ul><h3>Deficiency diseases</h3><ul><li><b>Scurvy</b> (vitamin C): weak connective tissue, bleeding gums, slow wound healing. Cure: citrus fruit.</li><li><b>Rickets</b> (vitamin D, calcium): without vitamin D calcium cannot be absorbed from the gut properly, so bones are soft and bend under weight.</li><li><b>Anaemia</b> (iron): not enough haemoglobin; tired and pale. Iron sources: red meat, liver, green vegetables.</li><li><b>Kwashiorkor</b> (lack of protein) and starvation also occur worldwide.</li></ul><h3>Dietary needs differ</h3><ul><li>A <b>child</b> needs more protein per kg for growth; an <b>athlete</b> needs more energy; a <b>pregnant woman</b> needs more iron and calcium; an <b>elderly</b> person needs less energy. A vegetarian must combine plant proteins (beans, nuts) to obtain all amino acids.</li></ul><h3>Comparing diets: worked example</h3><ul><li>Diet A gives 11 000 kJ per day and diet B 8 500 kJ. A student aged 15 needs about 10 500 kJ. Diet A slightly exceeds, so extra stored as fat; diet B lacks energy so weight loss.</li></ul><h3>Energy value experiment</h3><ul><li>Burn a food sample under a boiling tube of water. Temperature rise × volume of water × 4.2 J gives the energy. It underestimates, since heat is lost to the air.</li></ul><h3>Common exam mistakes</h3><ul><li>Writing “vitamin C for bones”. Bones need vitamin D and calcium; vitamin C is for skin and gums.</li><li>Writing “fibre gives energy” (it does not).</li></ul><span class="tag">Topic 7.2</span><h3>Digestive system</h3>
<ul><li><b>Alimentary canal:</b> mouth → oesophagus → stomach → small intestine (duodenum and ileum) → large intestine (colon, rectum) → anus. <b>Associated organs:</b> salivary glands, pancreas, liver, gall bladder. Food does not pass through the associated organs; they release secretions.</li></ul><div class="wrap"><table><tr><th>Organ</th><th>Function</th></tr><tr><td>Mouth</td><td>Ingestion; teeth chew (physical digestion); saliva (amylase) begins starch digestion</td></tr><tr><td>Oesophagus</td><td>Carries food to the stomach by peristalsis</td></tr><tr><td>Stomach</td><td>Churns food; gastric juice has HCl and protease (pepsin)</td></tr><tr><td>Duodenum</td><td>Receives bile and pancreatic juice</td></tr><tr><td>Ileum</td><td>Final digestion and absorption of nutrients</td></tr><tr><td>Colon</td><td>Absorbs water</td></tr><tr><td>Rectum / anus</td><td>Stores faeces; egestion</td></tr><tr><td>Salivary glands</td><td>Secrete saliva containing amylase</td></tr><tr><td>Pancreas</td><td>Secretes amylase, protease and lipase into the duodenum</td></tr><tr><td>Liver</td><td>Makes bile</td></tr><tr><td>Gall bladder</td><td>Stores bile</td></tr></table></div><h3>The five processes</h3><ul><li><b>Ingestion:</b> taking substances (food, drink) into the body through the mouth.</li><li><b>Digestion:</b> breakdown of food (physical and chemical).</li><li><b>Absorption:</b> movement of nutrients from the intestines into the blood.</li><li><b>Assimilation:</b> uptake and use of nutrients by cells (e.g. glucose used in respiration, amino acids to make proteins).</li><li><b>Egestion:</b> removal of undigested food from the body as faeces. It is not excretion.</li><li><b>Peristalsis:</b> waves of muscle contraction of the gut wall that push food along.</li></ul>
<h3>Following a meal through the gut</h3><ul><li><b>Mouth:</b> teeth cut and grind food (physical); the tongue forms a ball called a bolus; saliva moistens it and amylase begins starch breakdown.</li><li><b>Oesophagus:</b> peristalsis pushes the bolus to the stomach. The muscles squeeze behind the food to push it forward (circular muscles contract behind, longitudinal ahead).</li><li><b>Stomach:</b> muscular walls churn the food with gastric juice into a liquid (chyme). Acid kills bacteria and pepsin starts protein digestion. A sphincter muscle releases small amounts into the duodenum.</li><li><b>Duodenum:</b> receives <b>bile</b> from the gall bladder (through the bile duct) and pancreatic juice from the pancreas; the mixture is alkaline.</li><li><b>Ileum:</b> long (about 5 m), folded, with villi; digestion is completed by enzymes on the epithelium and the nutrients are absorbed.</li><li><b>Colon:</b> absorbs water and mineral ions, leaving faeces; <b>rectum</b> stores faeces; <b>anus</b> sphincter controls egestion.</li></ul><h3>Associated organs</h3><ul><li><b>Salivary glands</b> secrete saliva into the mouth. <b>Pancreas</b> releases enzymes (amylase, protease, lipase) into the duodenum and also makes insulin (a hormone, Topic 14). <b>Liver</b> makes bile, stores glycogen, processes absorbed nutrients and breaks down toxins. <b>Gall bladder</b> stores and releases bile.</li></ul><h3>Using diagrams</h3><ul><li>When asked to label a digestive system diagram, remember the order: mouth, oesophagus, stomach, duodenum, ileum, colon, rectum, anus. The liver sits above and to the right of the stomach and the pancreas lies behind and below it.</li></ul><h3>Process definitions: model answers</h3><ul><li><b>Ingestion:</b> taking in food through the mouth. <b>Digestion:</b> breakdown of food. <b>Absorption:</b> movement of digested nutrients from the intestine into the blood. <b>Assimilation:</b> use by body cells. <b>Egestion:</b> removal of undigested food as faeces.</li></ul><h3>Common exam mistakes</h3><ul><li>Saying the pancreas or liver is part of the alimentary canal. Food does not pass through them.</li><li>Saying peristalsis “squashes” food. It is waves of contraction that push it along.</li></ul><span class="tag">Topic 7.3</span><h3>Physical digestion</h3>
<ul><li><b>Physical (mechanical) digestion</b> is the breakdown of food into smaller pieces <b>without chemical change</b> to the food molecules. It <b>increases the surface area</b> of food for enzymes in chemical digestion.</li></ul><h3>Teeth</h3><ul><li><b>Types:</b> <b>incisors</b> (chisel-shaped, cut and bite), <b>canines</b> (pointed, tear), <b>premolars</b> and <b>molars</b> (broad, ridged, crush and grind).</li><li><b>Structure of a tooth:</b> <b>enamel</b> (hardest substance in the body, protects), <b>dentine</b> (bone-like, below the enamel), <b>pulp</b> (the cavity in the centre containing nerves and blood vessels), <b>cement</b> (holds the root in the jawbone), embedded in bone and the <b>gums</b>.</li><li>Tooth decay: bacteria feed on sugar and produce acid that dissolves enamel. Reduce by eating less sugar, brushing with fluoride toothpaste and dental check-ups.</li><li>The <b>stomach</b> contributes to physical digestion by churning food with its muscular walls, mixing it with gastric juice.</li><li><span class="xt">EXT</span><b>Bile</b> (made in the liver, stored in the gall bladder) <b>emulsifies fats and oils</b>: it breaks large fat droplets into tiny droplets, increasing the surface area for lipase to act. This is physical digestion because the fat molecules themselves are unchanged.</li></ul>
<h3>Physical digestion explained</h3><ul><li>Teeth break food into small pieces. A large piece has a small surface area to volume ratio; many small pieces have a much larger total surface area, so enzymes can reach more of the food and digestion is faster. Chewing also mixes food with saliva.</li></ul><h3>Human dentition</h3><ul><li>Adults have 32 teeth: 8 incisors, 4 canines, 8 premolars, 12 molars. Children’s milk teeth are replaced.</li><li><b>Incisors:</b> sharp edges for biting and cutting. <b>Canines:</b> pointed for gripping and tearing. <b>Premolars/molars:</b> large flat ridged surfaces to crush and grind.</li><li><b>Herbivores</b> have broad molars; <b>carnivores</b> have large canines.</li></ul><h3>Tooth structure in more detail</h3><ul><li><b>Enamel:</b> hard, made of calcium salts, no living cells. <b>Dentine:</b> softer, with living cell extensions that carry sensation. <b>Pulp cavity:</b> blood vessels bring nutrients and oxygen; nerves give pain. <b>Cement:</b> thin bony layer that anchors the tooth in the jaw through ligaments.</li><li><b>Decay:</b> bacteria in plaque feed on sugars and release acid; acid dissolves enamel and forms a cavity; it reaches the dentine and pulp causing toothache.</li><li><b>Prevention:</b> brushing, flossing, fluoride (strengthens enamel), less frequent sugary food and drinks, dental check-ups.</li></ul><h3>Stomach and physical digestion</h3><ul><li>The stomach wall has three muscle layers that churn the food, mixing it into a thick liquid and increasing contact with gastric juice.</li><li><span class="xt">EXT</span><b>Bile and emulsification in detail:</b> bile salts break a large fat droplet into many tiny droplets. This does not change the chemical structure of the fat, so it is a physical process. The total surface area increases enormously, so <b>lipase</b> can digest the fat more quickly.</li><li><span class="xt">EXT</span>Bile also contains no enzymes. It is made continuously in the liver and stored in the gall bladder.</li></ul><h3>Common exam mistakes</h3><ul><li>Saying bile digests fat. Bile emulsifies it; lipase digests it.</li><li>Mixing up enamel and dentine, or forgetting that pulp contains nerves and blood vessels.</li></ul><span class="tag">Topic 7.4</span><h3>Chemical digestion</h3>
<ul><li><b>Chemical digestion</b> is the breakdown of <b>large insoluble molecules into small soluble molecules</b> by enzymes. The small molecules can be absorbed into the blood.</li></ul><div class="wrap"><table><tr><th>Enzyme</th><th>Substrate → products</th><th>Made in</th><th>Acts in</th></tr><tr><td>Amylase</td><td>Starch → simple reducing sugars (maltose)</td><td>Salivary glands, pancreas</td><td>Mouth, small intestine</td></tr><tr><td>Protease</td><td>Protein → amino acids</td><td>Stomach (pepsin), pancreas (trypsin)</td><td>Stomach, small intestine</td></tr><tr><td>Lipase</td><td>Fats and oils → fatty acids and glycerol</td><td>Pancreas</td><td>Small intestine</td></tr></table></div><ul><li><b>Hydrochloric acid</b> in gastric juice <b>kills harmful microorganisms</b> in food and provides an <b>acidic pH (about 2)</b> for optimum protease (pepsin) activity.</li><li><span class="xt">EXT</span><b>Starch digestion:</b> amylase breaks starch down to <b>maltose</b>; <b>maltase</b> (on the membranes of the epithelial cells lining the small intestine) breaks maltose down to <b>glucose</b>.</li><li><span class="xt">EXT</span><b>Protein digestion:</b> <b>pepsin</b> works in the acid conditions of the stomach; <b>trypsin</b> works in the alkaline conditions of the small intestine. Both break proteins to polypeptides then amino acids.</li><li><span class="xt">EXT</span><b>Bile</b> is an alkaline mixture that <b>neutralises the acid</b> in food and gastric juice entering the duodenum, giving a suitable pH for the enzymes of the small intestine (amylase, trypsin, lipase).</li></ul><h3>Summary table of the whole process</h3><p>p Mouth: starch begins to break down. Stomach: proteins begin to break down in acid. Small intestine: bile neutralises acid and emulsifies fats; pancreatic enzymes digest starch, protein and fat; final digestion on the epithelium; nutrients absorbed.</p>
<h3>Why chemical digestion is needed</h3><ul><li>The large insoluble food molecules (starch, proteins, fats) cannot pass through the wall of the gut into the blood. Enzymes break them down into small soluble molecules (sugars, amino acids, fatty acids and glycerol) that can be absorbed.</li><li>Digestive enzymes work outside cells in the gut cavity (extracellular) at body temperature and the optimum pH.</li></ul><h3>Summary of enzymes by location</h3><ul><li><b>Mouth:</b> amylase (starch → maltose), pH ≈ 7. <b>Stomach:</b> protease (pepsin), pH ≈ 2. <b>Small intestine:</b> amylase, trypsin (protease), lipase from the pancreas, and maltase from the epithelium; pH ≈ 8 because of bile and pancreatic juice.</li></ul><h3>Practical: effect of enzyme on food</h3><ul><li>Mix starch solution with amylase in a test tube and test samples with iodine every 30 s; the blue-black colour disappears when starch is gone. Test a sample with Benedict’s to show that reducing sugar has appeared.</li><li>Mix milk (or an oil with indicator) with lipase: the pH falls as fatty acids form; the indicator changes.</li><li>Control: boiled enzyme, or water in place of the enzyme.</li></ul><h3>Hydrochloric acid</h3><ul><li>Kills bacteria in the food, preventing infection. Provides an acidic pH of about 2 so pepsin works best; the mucus lining of the stomach protects its wall from the acid and enzymes.</li><li><span class="xt">EXT</span><b>Optimum pH and conditions:</b> pepsin is denatured in the alkaline small intestine, and so trypsin (optimum pH 8) takes over; this is why bile neutralises the acid first. Each enzyme is matched to the conditions where it acts.</li><li><span class="xt">EXT</span><b>Maltase</b> acts on the surface of the epithelium cells so that glucose is released right next to the cells that will absorb it.</li><li><span class="xt">EXT</span><b>Summary equations:</b> starch → (amylase) maltose → (maltase) glucose. Protein → (pepsin, trypsin) polypeptides → amino acids. Fat → (lipase) fatty acids + glycerol.</li></ul><h3>Common exam mistakes</h3><ul><li>Saying amylase produces glucose. It produces maltose; maltase produces glucose.</li><li>Saying enzymes are used up or killed by stomach acid.</li><li>Forgetting to give both the site of secretion and the site of action.</li></ul><span class="tag">Topic 7.5</span><h3>Absorption</h3>
<ul><li>The <b>small intestine</b> is the region where nutrients are absorbed. <b>Most water</b> is absorbed in the small intestine, but some is also absorbed from the colon. The colon absorbs mainly water, leaving semi-solid faeces.</li><li><span class="xt">EXT</span><b>Villi and microvilli:</b> the inner wall of the ileum is folded into millions of finger-like <b>villi</b>, and the surface cells have <b>microvilli</b> (tiny projections), together greatly increasing the <b>internal surface area</b> for absorption.</li><li><span class="xt">EXT</span><b>Structure of a villus:</b> a wall one cell thick (short diffusion distance); a network of <b>capillaries</b> and a central <b>lacteal</b> (lymph vessel); the epithelial cells have many mitochondria for active transport.</li><li><span class="xt">EXT</span><b>Roles:</b> <b>capillaries</b> absorb glucose, amino acids, mineral ions and vitamins into the blood (carried by the hepatic portal vein to the liver); the <b>lacteal</b> absorbs fatty acids and glycerol into the lymph. The rich blood supply keeps a steep concentration gradient.</li><li><span class="xt">EXT</span>Absorption occurs by diffusion and by active transport (e.g. glucose when the concentration in the gut is lower than in the blood).</li></ul><h3>Common exam mistakes</h3><ul><li>Confusing absorption (into blood) with assimilation (use by cells).</li><li>Saying digestion occurs in the large intestine. The large intestine absorbs water.</li><li>Saying bile is an enzyme: it contains no enzymes.</li></ul><h3>Absorption routes</h3><ul><li>Small soluble molecules move from the lumen into the villus cells by <b>diffusion</b> (when the concentration is high in the gut) and <b>active transport</b> (when the concentration is lower in the gut than in the blood, particularly for glucose and amino acids).</li><li><b>Glucose, amino acids, vitamins and mineral ions</b> enter capillaries and travel in the <b>hepatic portal vein</b> to the liver, where the liver controls the level of nutrients going to the rest of the body. <b>Fatty acids and glycerol</b> recombine into fat in the epithelial cells and enter the lacteals and then the blood at the neck.</li><li>Water is absorbed by <b>osmosis</b> in the small intestine and colon. About 9 dm³ of water enters the gut per day (food, drink and secretions) and only about 0.1 dm³ is lost in faeces.</li></ul><h3>Diarrhoea</h3><ul><li>If the colon cannot absorb water (e.g. because of infection) the faeces are runny; dehydration and loss of ions can be dangerous (see cholera, Topic 10).</li><li><span class="xt">EXT</span><b>Ileum adaptations summary:</b> very long (large area); folded wall with <b>villi</b> and <b>microvilli</b>; wall one cell thick (short diffusion distance); each villus has a rich <b>capillary network</b> (maintains a steep concentration gradient by removing absorbed products); a <b>lacteal</b>; many <b>mitochondria</b> in epithelial cells for active transport; thin permeable cell membranes.</li><li><span class="xt">EXT</span><b>Calculation idea:</b> a villus is about 1 mm long. A section of ileum with 20 villi per mm² has about 20 times more absorptive area than a smooth wall. Microvilli multiply the area again.</li></ul><h3>Common exam mistakes</h3><ul><li>Saying villi “absorb” without saying how they are adapted. Give the feature and the reason (e.g. thin wall → short diffusion distance).</li><li>Saying fatty acids enter the blood capillaries directly. They go into the lacteal first.</li></ul>`,kw:[["Balanced diet", "Diet containing all nutrients in the correct proportions and amounts of energy."], ["Scurvy", "Disease caused by lack of vitamin C."], ["Rickets", "Bone disease caused by lack of vitamin D (and calcium)."], ["Ingestion", "Taking food and drink into the body."], ["Digestion", "Breakdown of food into smaller pieces or small soluble molecules."], ["Absorption", "Movement of nutrients from the intestines into the blood."], ["Assimilation", "Uptake and use of nutrients by cells."], ["Egestion", "Removal of undigested food as faeces."], ["Peristalsis", "Muscular waves that push food along the gut."], ["Amylase", "Enzyme that breaks starch down to sugars."], ["Protease", "Enzyme that breaks down protein to amino acids."], ["Lipase", "Enzyme that breaks down fats to fatty acids and glycerol."], ["Bile", "Alkaline fluid from the liver that neutralises acid and emulsifies fat."], ["Villus", "Finger-like projection in the ileum that increases surface area."], ["Lacteal", "Lymph vessel in a villus that absorbs fatty acids and glycerol."]],f:["Amylase: starch → maltose; maltase: maltose → glucose", "Protease: protein → amino acids; lipase: fat → fatty acids + glycerol"],qa:[["State the difference between egestion and excretion.", "Egestion is removal of undigested food; excretion is removal of metabolic waste."], ["What is the function of hydrochloric acid in the stomach?", "Kills microorganisms and gives the optimum pH for pepsin."], ["Name the parts of a tooth.", "Enamel, dentine, pulp (nerves and blood vessels), cement."], ["(Extended) How is a villus adapted for absorption?", "Thin wall, rich capillary network, lacteal, microvilli for large surface area."], ["(Extended) Explain the role of bile.", "It is alkaline, neutralises stomach acid, and emulsifies fats to increase surface area for lipase."]],mcq:[["Vitamin D deficiency causes…", ["scurvy", "rickets", "anaemia"], 1, "Rickets."], ["Where is most absorption?", ["stomach", "small intestine", "colon"], 1, "Ileum."], ["Which enzyme digests fat?", ["Lipase", "Amylase", "Pepsin"], 0, "Lipase."]]},
{t:"Topic 8: Transport in plants (Cambridge 0610)",notes:`
<span class="tag">Topic 8.1</span><h3>Xylem and phloem</h3>
<p class="lg"><b>Key:</b> <span class="xt">EXT</span> = Extended (Supplement) only. No tag = Core.</p>
<ul><li><b>Xylem</b> transports <b>water and mineral ions</b> (from roots upwards) and gives <b>support</b>. <b>Phloem</b> transports <b>sucrose and amino acids</b> (in any direction).</li><li><b>Position in non-woody dicotyledonous plants:</b> in the <b>root</b> the xylem is in the centre (X or star shape) with phloem between the arms, surrounded by the cortex; in the <b>stem</b> vascular bundles are arranged in a <b>ring</b> near the outside with xylem inside the phloem; in the <b>leaf</b> they form the midrib and veins with xylem on the upper side and phloem below.</li><li><span class="xt">EXT</span><b>Xylem vessel structure and function:</b> <b>thick walls reinforced with lignin</b> (strength and support, prevents collapse under tension; details of lignification not needed); <b>no cell contents</b> (dead hollow cells so water flows freely); cells joined <b>end to end with no cross walls</b>, forming a <b>long continuous tube</b>.</li><li><span class="xt">EXT</span>Phloem is made of living sieve tube cells with companion cells; it moves dissolved food.</li></ul>
<h3>Vascular tissue in the plant body</h3><ul><li>Xylem and phloem lie side by side in <b>vascular bundles</b>. Together they form a transport network connecting roots, stems and leaves, an equivalent of blood vessels.</li></ul><h3>How to recognise the tissues in a section</h3><ul><li><b>Root:</b> the xylem is in the centre in an X shape; phloem sits between its arms; the surrounding ring is the cortex and the outside is the epidermis with root hairs.</li><li><b>Stem:</b> bundles in a ring around the edge of the stem, xylem on the inside of each bundle and phloem on the outside; the middle is pith.</li><li><b>Leaf:</b> in the midrib and veins, xylem on top (nearest the upper surface) and phloem below.</li></ul><h3>Features of xylem</h3><ul><li>Long hollow tubes made from dead cells. Mineral ions and water move through. Walls thickened with lignin are strong, so the tubes stay open and can support the plant, particularly important in trees where wood is mostly xylem.</li><li>Water is pulled up under tension; lignin prevents the vessels collapsing inwards.</li></ul><h3>Features of phloem</h3><ul><li>Living cells (sieve tube elements) with companion cells beside them. Sucrose and amino acids dissolve in the sap and flow from where they are made to where they are needed.</li></ul><h3>Table: xylem versus phloem</h3><div class="wrap"><table><tr><th>Feature</th><th>Xylem</th><th>Phloem</th></tr><tr><td>Transports</td><td>Water and mineral ions</td><td>Sucrose and amino acids</td></tr><tr><td>Direction</td><td>Upwards only (roots to leaves)</td><td>Up and down (source to sink)</td></tr><tr><td>Cells</td><td>Dead, hollow, lignified</td><td>Living</td></tr><tr><td>Other role</td><td>Support</td><td>None</td></tr></table></div><ul><li><span class="xt">EXT</span><b>Linking structure to function:</b> no cross walls and no contents give the lowest resistance to water flow; lignin gives strength against negative pressure; small pits in the walls allow water to move sideways between vessels.</li></ul><h3>Common exam mistakes</h3><ul><li>Swapping xylem and phloem functions. Memory trick: xylem = water, phloem = food (sugars).</li><li>Forgetting that xylem also supports the plant.</li></ul><span class="tag">Topic 8.2</span><h3>Water uptake</h3>
<ul><li><b>Root hair cells</b> are extensions of epidermal cells near the root tip. Their function is to absorb water and mineral ions. The <b>large surface area</b> of the many root hairs increases uptake.</li><li><b>Pathway of water:</b> soil → <b>root hair cells</b> → <b>root cortex cells</b> → <b>xylem</b> → up the stem → leaf <b>mesophyll cells</b> → evaporates into air spaces → out through stomata.</li><li>Water enters root hair cells by <b>osmosis</b> (soil water has a higher water potential than the cell sap); mineral ions are taken up by active transport (Topic 3).</li><li><b>Practical:</b> place a cut stem (e.g. celery or white flower) in water containing a stain (red ink or food colouring). After some time the stain shows the xylem pathway in the stem and leaf veins. Cut sections to see stained xylem under a microscope.</li></ul>
<h3>The root hair cell</h3><ul><li>Root hair cells are found just behind the root tip in the epidermis. The thin hair extends into the soil between soil particles. It has a <b>thin cell wall</b> and a large vacuole with concentrated sap, giving a <b>low water potential</b> so water enters by osmosis.</li><li>The thousands of hairs give a very large surface area. The hairs are replaced as the root grows, so they never become old.</li></ul><h3>Uptake of mineral ions</h3><ul><li>Ions (nitrate, magnesium, potassium) are present in lower concentrations in the soil than inside the root cell so they are taken up by <b>active transport</b>, needing energy from respiration (Topic 3). This is why waterlogged soil (no oxygen) can harm roots.</li></ul><h3>Movement of water across the root</h3><ul><li>Water enters root hair cells by osmosis and moves through the cortex cells (osmosis down a water potential gradient, or through the cell walls and spaces) into the xylem in the centre.</li><li>It then moves up in the xylem to the leaves. In the leaf the water leaves the xylem and moves to the mesophyll cells where it is used in photosynthesis, keeps cells turgid or evaporates.</li></ul><h3>Practical: tracing water</h3><ul><li>Stand a white carnation or celery stem in water coloured with red dye or food colouring for a few hours. The colour rises in the veins. Cut across the stem to see stained dots (xylem) in a ring. The coloured flower shows how quickly water is carried.</li><li>To compare, use a cut stem with leaves removed (less transpiration, less uptake).</li></ul><h3>Why can plants wilt in salty soil?</h3><ul><li>If the soil solution is more concentrated than the root cell sap, water leaves the roots by osmosis and the plant wilts (e.g. over-fertilising or flooding with salt water).</li></ul><h3>Common exam mistakes</h3><ul><li>Saying roots absorb water “by active transport”. Water enters by osmosis; ions enter by diffusion or active transport.</li><li>Writing “xylem” in the pathway before “root hair cells”.</li></ul><span class="tag">Topic 8.3</span><h3>Transpiration</h3>
<ul><li><b>Transpiration</b> is the loss of water vapour from leaves. Water <b>evaporates from the surfaces of the mesophyll cells</b> into the air spaces and then <b>diffuses out of the leaves through the stomata</b> as water vapour.</li><li>Importance: brings mineral ions up, cools the leaf, keeps cells turgid and supplies water for photosynthesis.</li><li><b>Investigating (potometer):</b> measure the distance a bubble moves along a capillary tube in a set time. Compare conditions of temperature and wind speed (e.g. with a fan). Alternative: weigh a potted plant in a sealed bag over time. Use the same shoot, seal joints, keep other variables constant.</li></ul><div class="wrap"><table><tr><th>Condition</th><th>Effect on rate</th><th>Reason</th></tr><tr><td>Higher temperature</td><td>Increases</td><td>Faster evaporation and diffusion (more kinetic energy)</td></tr><tr><td>Greater wind speed</td><td>Increases</td><td>Removes water vapour, keeping concentration gradient steep</td></tr><tr><td>Higher humidity</td><td>Decreases</td><td>Smaller concentration gradient (extended)</td></tr><tr><td>More light</td><td>Increases</td><td>Stomata open wider</td></tr></table></div><ul><li><span class="xt">EXT</span><b>Link between water loss and structure:</b> the <b>large internal surface area</b> provided by the interconnected air spaces between mesophyll cells and the <b>size and number of stomata</b> increase water vapour loss.</li><li><span class="xt">EXT</span><b>Transpiration pull:</b> evaporation from mesophyll cells lowers the water potential in leaf cells, drawing water from the xylem. Water molecules are held together by <b>cohesion</b> (forces of attraction between water molecules), so a continuous <b>column of water</b> is pulled up the xylem from the roots. This is a pulling force, not pushing.</li><li><span class="xt">EXT</span><b>Effects of temperature, wind speed and humidity (explain):</b> high temperature gives the molecules more energy, so more water evaporates; wind blows away humid air around the stomata, steepening the gradient; high humidity reduces the gradient so less vapour escapes.</li><li><span class="xt">EXT</span><b>Wilting:</b> if water is lost faster than it is absorbed, cells lose water and turgor pressure; cells become flaccid and the plant wilts. This reduces the surface area exposed and so lowers water loss. Stomata close to conserve water.</li></ul>
<h3>Why does transpiration happen?</h3><ul><li>The mesophyll cell surfaces are wet. Water evaporates into the air spaces, where the water vapour concentration is higher than in the air outside; so the vapour diffuses out through the stomata down the concentration gradient. Transpiration is an unavoidable cost of opening stomata for gas exchange.</li><li>Benefits: it creates the <b>transpiration stream</b> that brings minerals up, cools leaves by evaporation, and supplies cells with water for turgor and photosynthesis.</li></ul><h3>The potometer in detail</h3><ul><li>Cut a leafy shoot under water (to prevent air entering), fix to the potometer under water with the apparatus full of water, seal joints with petroleum jelly, dry the leaves and introduce an air bubble. Record the distance the bubble moves in 5 minutes. Reset the bubble with the reservoir.</li><li><b>Water uptake is a measure of transpiration</b> (nearly all water absorbed is lost). Rate = distance ÷ time (mm per min).</li><li>Vary one factor (e.g. fan for wind, lamp for light, temperature of room); keep the others constant. Repeat three times and average.</li></ul><h3>Calculation example</h3><ul><li>A bubble moves 24 mm in 4 min in still air and 52 mm in 4 min with a fan. Rates: 6 mm/min and 13 mm/min. Wind increased the rate by (13 − 6) ÷ 6 × 100 = 117%.</li><li><span class="xt">EXT</span><b>Explaining the effects:</b> <b>Temperature</b> – at higher temperature water molecules have more kinetic energy, evaporate faster and diffuse faster. <b>Wind</b> – moving air removes water vapour from near the stomata, keeping the gradient steep. <b>Humidity</b> – moist air has a high water vapour concentration so the gradient is smaller and transpiration slows. <b>Light</b> – opens stomata so more water vapour escapes.</li><li><span class="xt">EXT</span><b>Cohesion–tension:</b> as water leaves the leaf, a continuous column of water in the xylem is pulled up. Hydrogen bonds hold water molecules together (cohesion) and water also sticks to the xylem walls (adhesion). The pull is so strong that tree trunks can shrink slightly in the day.</li><li><span class="xt">EXT</span><b>Wilting:</b> when transpiration exceeds the supply of water, cells lose turgor and the plant droops. This reduces the surface exposed to the Sun and reduces water loss; stomata also close. Watering restores turgor.</li><li><span class="xt">EXT</span><b>Large internal surface area:</b> the spongy layer’s many interconnecting air spaces expose a large wet surface area from which evaporation occurs.</li></ul><h3>Common exam mistakes</h3><ul><li>Saying transpiration is evaporation from the stomata. It is evaporation from the mesophyll surfaces; vapour leaves via the stomata.</li><li>Not stating how a variable is controlled in the potometer experiment.</li></ul><span class="tag">Topic 8.4</span><h3>Translocation</h3>
<ul><li><span class="xt">EXT</span><b>Translocation</b> is the movement of <b>sucrose and amino acids in the phloem from sources to sinks</b>.</li><li><span class="xt">EXT</span><b>Sources</b> are parts of the plant that <b>release</b> sucrose or amino acids (e.g. mature green leaves making sugars, storage organs releasing in spring). <b>Sinks</b> are parts that <b>use or store</b> sucrose or amino acids (e.g. growing roots, shoot tips, fruits, seeds, storage organs).</li><li><span class="xt">EXT</span><b>Source and sink at different times:</b> a potato tuber or bulb is a <b>sink</b> in summer when it stores starch and a <b>source</b> in spring when stored food is moved to growing shoots. A leaf is a sink when young and a source when mature.</li><li><span class="xt">EXT</span>Translocation needs energy and can move materials up and down the plant, unlike xylem which moves water upwards only.</li></ul><h3>Common exam mistakes</h3><ul><li>Saying phloem carries “food”; say sucrose and amino acids.</li><li>Saying transpiration pull pushes water up. It pulls.</li><li>Saying xylem is living. Mature xylem vessels are dead and hollow.</li></ul><h3>Understanding sources and sinks</h3><ul><li>Sucrose is made in leaves by photosynthesis (source). It enters the phloem and flows to <b>sinks</b>: root tips, growing shoot tips, flowers and developing fruits, and storage organs. Sucrose is converted to starch in storage organs and back to sucrose when needed.</li><li>Amino acids are transported from leaves or storage organs to growing regions where proteins are made.</li></ul><h3>Why sucrose?</h3><ul><li>Sucrose is <b>soluble</b> and <b>unreactive</b>, so it is a good transport sugar (glucose would be used immediately in respiration).</li></ul><h3>Differences between xylem and phloem transport</h3><ul><li>Xylem moves water in one direction by a pull from evaporation (passive); phloem moves in any direction from source to sink and requires energy.</li></ul><h3>Examples of source/sink changes</h3><ul><li><b>Potato tuber:</b> a sink in summer (stores starch made in the leaves); source in spring (starch converted to sucrose to feed buds).</li><li><b>Leaves:</b> young leaves are sinks (they take sugars to grow); mature leaves are sources.</li><li><b>Seeds and fruits:</b> sinks while developing; a seed becomes a source for the seedling during germination.</li></ul><h3>Evidence for phloem transport</h3><ul><li>If a ring of bark (including phloem) is removed from a woody stem, sugars accumulate above the ring and the roots below starve. Aphids feed from phloem; their stylets show sap flowing.</li></ul><h3>Common exam mistakes</h3><ul><li>Writing “from leaves to roots”. Sources and sinks can be in many places, and flow can be upward as well.</li><li>Saying a part is always either a source or a sink.</li></ul>`,kw:[["Xylem", "Vessels that transport water and mineral ions and support the plant."], ["Phloem", "Tissue that transports sucrose and amino acids."], ["Lignin", "Hard substance that strengthens xylem walls."], ["Root hair cell", "Cell with a long extension that absorbs water and ions."], ["Transpiration", "Loss of water vapour from the leaves."], ["Potometer", "Apparatus to measure water uptake by a shoot."], ["Cohesion", "Attraction between water molecules."], ["Transpiration pull", "Force that draws a column of water up the xylem as water evaporates from leaves."], ["Wilting", "Plant droops because cells have lost turgor."], ["Translocation", "Movement of sucrose and amino acids in phloem from sources to sinks."], ["Source", "Part of the plant that releases sucrose or amino acids."], ["Sink", "Part of the plant that uses or stores sucrose or amino acids."]],f:["Water: soil → root hair → cortex → xylem → mesophyll → stomata", "Translocation: source → sink"],qa:[["State the functions of xylem and phloem.", "Xylem transports water and mineral ions and supports; phloem transports sucrose and amino acids."], ["Describe the pathway of water through a plant.", "Root hair cells, root cortex cells, xylem, mesophyll cells, then out through the stomata."], ["Name two factors that increase transpiration.", "Higher temperature, greater wind speed (also lower humidity, more light)."], ["(Extended) How do water molecules move up the xylem?", "Transpiration pull draws up a column of water held together by cohesion."], ["(Extended) Why is a bulb a sink then a source?", "It stores sugars in summer and releases them to growing shoots in spring."]],mcq:[["Which tissue contains lignin?", ["Phloem", "Xylem", "Epidermis"], 1, "Thick lignified walls."], ["Which condition decreases transpiration?", ["Wind", "High humidity", "High temperature"], 1, "Smaller gradient."], ["A sink in a plant is…", ["a leaf making sugar", "a root storing starch", "a stoma"], 1, "It stores or uses sucrose."]]},
{t:"Topic 9: Transport in animals (Cambridge 0610)",notes:`
<span class="tag">Topic 9.1</span><h3>Circulatory systems</h3>
<p class="lg"><b>Key:</b> <span class="xt">EXT</span> = Extended (Supplement) only. No tag = Core.</p>
<ul><li>The <b>circulatory system</b> is a system of <b>blood vessels with a pump (the heart) and valves</b> that ensures <b>one-way flow</b> of blood. It carries oxygen, nutrients, carbon dioxide, urea, hormones and heat around the body.</li><li><span class="xt">EXT</span><b>Single circulation (fish):</b> blood passes through the heart <b>once</b> in each complete circuit: heart → gills (gas exchange) → body → heart. Blood pressure falls after the gills so the flow to the body is slower.</li><li><span class="xt">EXT</span><b>Double circulation (mammals):</b> the blood passes through the heart <b>twice</b> in each circuit: a <b>pulmonary circuit</b> (heart → lungs → heart) and a <b>systemic circuit</b> (heart → body → heart).</li><li><span class="xt">EXT</span><b>Advantage of double circulation:</b> blood returns to the heart after the lungs and is <b>pumped again at high pressure</b> to the body, so oxygenated blood reaches tissues quickly; the high pressure supports a high metabolic rate and constant body temperature. It also keeps oxygenated and deoxygenated blood separate.</li></ul>
<h3>Why do large animals need a circulatory system?</h3><ul><li>Large animals have a small surface area to volume ratio and diffusion alone is too slow over long distances. A transport system carries oxygen and nutrients to the cells and takes away carbon dioxide and urea quickly.</li></ul><h3>What the blood carries</h3><ul><li>Oxygen (red blood cells), carbon dioxide (plasma), digested food (plasma), urea (plasma to kidneys), hormones (plasma), heat (to the skin), and white cells and antibodies for defence.</li></ul><h3>The system parts</h3><ul><li><b>Pump</b>: heart. <b>Vessels</b>: arteries, capillaries, veins. <b>Valves</b>: in the heart and veins stop backflow. <b>Fluid</b>: blood.</li><li><span class="xt">EXT</span><b>Fish – single circulation:</b> heart (2 chambers: one atrium and one ventricle) → gills (gas exchange) → rest of the body → heart. Because blood loses pressure as it flows through the narrow gill capillaries, it travels more slowly to the body, limiting how active the fish can be.</li><li><span class="xt">EXT</span><b>Mammal – double circulation:</b> right side pumps deoxygenated blood to the lungs (pulmonary circulation); the blood returns to the left side and is pumped again at high pressure to the body (systemic circulation). Each circuit is separate.</li><li><span class="xt">EXT</span><b>Advantages of double circulation in detail:</b> (1) the pressure is restored after the lungs, so blood flows quickly to the tissues; (2) so oxygen and glucose can be delivered faster, supporting a high metabolic rate, a constant body temperature and high activity; (3) oxygenated and deoxygenated blood do not mix, so the blood leaving the heart for the body is fully oxygenated.</li></ul><h3>Common exam mistakes</h3><ul><li>Saying the blood “goes round twice”. It passes through the heart twice per complete circuit of the body.</li><li>Missing the pressure explanation in “advantage” questions.</li></ul><span class="tag">Topic 9.2</span><h3>Heart</h3>
<svg viewBox="0 0 420 200" style="max-width:100%;height:auto" role="img" aria-label="Heart structure"><g font-size="11" fill="currentColor"><rect x="90" y="30" width="100" height="55" rx="10" fill="#bcd3ff" stroke="#3a3cf0"/><text x="100" y="62">Right atrium</text><rect x="220" y="30" width="100" height="55" rx="10" fill="#ffc9c9" stroke="#d33"/><text x="235" y="62">Left atrium</text><rect x="90" y="100" width="100" height="80" rx="10" fill="#bcd3ff" stroke="#3a3cf0"/><text x="100" y="145">Right ventricle</text><rect x="220" y="100" width="100" height="80" rx="16" fill="#ffc9c9" stroke="#d33"/><text x="235" y="145">Left ventricle</text><line x1="205" y1="25" x2="205" y2="185" stroke="currentColor" stroke-width="3"/><text x="165" y="195">Septum</text><text x="5" y="20">Vena cava →</text><text x="330" y="20">← Pulmonary vein</text><text x="330" y="135">Aorta ↑ (thick wall)</text><text x="5" y="130">Pulm. artery</text></g></svg><ul><li><b>Structure:</b> the heart is made of <b>cardiac muscle</b>. It has a muscular wall, a <b>septum</b>, <b>right and left atria</b> (upper chambers), <b>right and left ventricles</b> (lower chambers), <b>one-way valves</b> and <b>coronary arteries</b> that supply the heart muscle with oxygen and glucose.</li><li>Blood is pumped <b>away from the heart in arteries</b> and <b>returns in veins</b>. Vessels: <b>vena cava</b> (deoxygenated blood from body to right atrium), <b>pulmonary artery</b> (deoxygenated blood to lungs), <b>pulmonary vein</b> (oxygenated blood from lungs to left atrium), <b>aorta</b> (oxygenated blood from left ventricle to body).</li><li><b>Monitoring the heart:</b> by <b>ECG</b> (electrical activity), <b>pulse rate</b> (felt at the wrist or neck), and listening to the sounds of the <b>valves closing</b> (stethoscope).</li><li><b>Practical:</b> measure pulse at rest, then after exercise of increasing intensity; record recovery time. Pulse rises with exercise then returns slowly to normal; a fitter person has a lower resting rate and quicker recovery.</li></ul><h3>Coronary heart disease (CHD)</h3><ul><li>Fatty deposits (cholesterol) build up in the <b>coronary arteries</b> and narrow or <b>block</b> them. Heart muscle gets less oxygen and glucose, causing chest pain or a heart attack.</li><li><b>Risk factors:</b> poor <b>diet</b> (high in saturated fat and salt), <b>lack of exercise</b>, <b>stress</b>, <b>smoking</b>, <b>genetic predisposition</b>, <b>age</b> (risk rises with age) and <b>sex</b> (males are higher risk, until menopause).</li><li><b>Reducing risk:</b> a diet low in saturated fat and salt with plenty of fruit and vegetables keeps arteries clear and body mass healthy; regular exercise strengthens heart muscle, lowers blood pressure and helps control weight. Not smoking is also important.</li><li><span class="xt">EXT</span><b>Valves:</b> <b>atrioventricular valves</b> (between atria and ventricles) and <b>semilunar valves</b> (in the aorta and pulmonary artery) stop backflow.</li><li><span class="xt">EXT</span><b>Wall thickness:</b> the <b>left ventricle has a thicker muscle wall</b> than the right because it pumps blood at high pressure around the whole body; the right ventricle pumps blood only to the nearby lungs at lower pressure (high pressure would damage lung capillaries). The <b>atria have thinner walls</b> than the ventricles because they only push blood a short distance into the ventricles.</li><li><span class="xt">EXT</span><b>Septum:</b> separates oxygenated blood (left) from deoxygenated blood (right), so the blood going to the tissues is fully oxygenated.</li><li><span class="xt">EXT</span><b>Heartbeat cycle:</b> (1) atria fill and then <b>contract</b>, pushing blood through the atrioventricular valves into the ventricles; (2) ventricles <b>contract</b>, closing the AV valves and forcing blood through the semilunar valves into the arteries; (3) the heart relaxes and the atria refill while semilunar valves close.</li><li><span class="xt">EXT</span><b>Physical activity and heart rate:</b> muscles respire faster and need more oxygen and need carbon dioxide removed; CO₂ concentration rises, detected by the brain, which signals the heart (adrenaline also helps) to beat faster, so more blood reaches the muscles. After exercise the rate returns to normal slowly while the oxygen debt is repaid.</li></ul>
<h3>Following blood through the heart</h3><ul><li>Deoxygenated blood returns from the body → <b>vena cava</b> → <b>right atrium</b> → right ventricle → <b>pulmonary artery</b> → lungs (gets oxygen, loses CO₂) → <b>pulmonary vein</b> → <b>left atrium</b> → left ventricle → <b>aorta</b> → body (including the coronary arteries at the start of the aorta).</li><li>The right side always carries deoxygenated blood and the left oxygenated blood (the pulmonary vessels are the exception for artery and vein labels).</li></ul><h3>Pulse and heart rate</h3><ul><li>Pulse is the stretching and recoil of an artery wall as blood is forced through by each heartbeat. The resting pulse is 60–80 beats per minute; an athlete’s is lower because each beat pumps more blood (larger stroke volume).</li><li><b>Practical (core):</b> count pulse for 15 s and multiply by 4; repeat after 2 min of exercise (e.g. step-ups) and then each minute until back to normal. Repeat to find a mean. Control: same exercise, same person.</li><li>The recovery time is a measure of fitness.</li></ul><h3>Interpreting data</h3><ul><li>A graph shows pulse rising from 70 to 130 bpm during exercise and falling back to 70 in 6 min. Describe: rise of 60 bpm, recovery took 6 min. A fitter person has a lower resting rate and a shorter recovery.</li></ul><h3>Coronary heart disease in more detail</h3><ul><li>Fatty deposits (plaque) containing cholesterol narrow the coronary arteries, and a blood clot can block them. Heart muscle is cut off from oxygen; it cannot respire aerobically so heart muscle dies: a <b>heart attack</b>.</li><li>Treatments (awareness): stents, bypass surgery, drugs; prevention by lifestyle is most effective.</li><li><span class="xt">EXT</span><b>Valves in action:</b> when the ventricles contract, pressure shuts the AV valves, preventing blood flowing back into the atria (the “lub” sound); the semilunar valves open to let blood out. When the ventricles relax, the semilunar valves shut (the “dub” sound) so blood does not flow back from the arteries.</li><li><span class="xt">EXT</span><b>Coronary arteries and double function:</b> they branch from the aorta just above the heart and supply heart muscle with oxygen and glucose for respiration.</li><li><span class="xt">EXT</span><b>Exercise and heart rate in more detail:</b> muscles respire faster, produce more CO₂ and lactic acid. Increased CO₂ in the blood is detected by the brain, which signals the heart (through nerves and via adrenaline) to beat faster and with more force. This delivers oxygen and glucose to the muscles faster and removes CO₂ more quickly.</li></ul><h3>Common exam mistakes</h3><ul><li>Labelling the left side of the heart diagram on the left. The diagram is drawn as if facing the person, so the left side appears on the right.</li><li>Saying the septum stops blood flowing; it keeps oxygenated and deoxygenated blood separate.</li></ul><span class="tag">Topic 9.3</span><h3>Blood vessels</h3>
